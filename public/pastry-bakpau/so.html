<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Stok Opname</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --text: #1f2937;
        --muted: #9ca3af;
        --line: #e5e7eb;
        --line-2: #d9dde3;
        --surface: #f3f4f6;
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --minus: #dc2626;
        --plus: #16a34a;
        --row-h: 40px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #ffffff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text);
        min-height: 100vh;
        max-width: 800px;
        margin: 0 auto;
        padding: 14px 18px 40px;
        padding-top: max(14px, env(safe-area-inset-top));
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .section-label.flush {
        margin: 4px 0 0;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .table-wrap {
        overflow-x: auto;
        overflow-y: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        -webkit-overflow-scrolling: touch;
        background: #fff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .table-wrap::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .laporan {
        min-width: 880px;
      }

      .riwayat {
        min-width: 460px;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f9f9f9;
        color: var(--muted);
        font-size: clamp(10px, 2.6vw, 12px);
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-align: left;
        height: 34px;
        padding: 0 10px;
        border-bottom: 1px solid #e5e7eb;
        white-space: nowrap;
      }

      tbody td {
        height: 44px;
        padding: 0 10px;
        border-bottom: 1px solid #f1f2f4;
        vertical-align: middle;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover td {
        background: #fafafa;
      }

      tfoot td {
        position: sticky;
        bottom: 0;
        background: #f9f9f9;
        font-weight: 800;
        font-size: 13px;
        height: 44px;
        padding: 0 10px;
        border-top: 1px solid #e5e7eb;
        white-space: nowrap;
      }

      tfoot tr.f-plus td {
        background: #f0fdf4;
      }

      tfoot tr.f-minus td {
        background: #fef2f2;
      }

      .c-no {
        width: 34px;
        text-align: center;
        color: var(--muted);
      }

      .c-tgl {
        width: 64px;
        text-align: center;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }

      .c-foto {
        width: 70px;
      }

      .cari {
        width: 100%;
        height: 36px;
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 10px;
      }

      .cari:focus {
        outline: none;
        background: #fff;
        border-color: #888;
      }

      .cari::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }

      .c-kode {
        width: 92px;
      }

      .c-satuan {
        width: 58px;
      }

      .c-num {
        width: 76px;
        text-align: right;
      }

      .hpp {
        width: 100px;
        white-space: nowrap;
      }

      .c-total {
        width: 100px;
        text-align: right;
      }

      .foto {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border: 1px dashed #d1d5db;
        border-radius: 8px;
        background: #f9fafb;
        color: var(--muted);
        font-size: 7px;
        font-weight: 800;
        text-align: center;
        padding: 0 3px;
        line-height: 1.15;
      }

      .foto img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .kode {
        color: var(--primary);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: clamp(12px, 3.2vw, 14px);
        font-weight: 800;
        white-space: nowrap;
      }

      .kode-btn {
        width: 100%;
        padding: 5px 6px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.2px;
        color: #4f46e5;
        text-align: left;
        background: transparent;
        border: 1px dashed transparent;
        border-radius: 6px;
        cursor: pointer;
      }

      .kode-btn:active {
        background: var(--soft);
        border-color: #e0e7ff;
      }

      .lightbox {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 40;
        max-width: calc(100vw - 32px);
        padding: 12px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
      }

      .lightbox[hidden] {
        display: none;
      }

      .lightbox-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .lightbox .qr {
        width: min(56vw, 196px);
        height: min(56vw, 196px);
      }

      .lightbox-text {
        color: var(--text);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.6px;
      }

      .selisih {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .selisih.minus,
      .nominal.minus {
        color: var(--minus);
      }

      .selisih.plus,
      .nominal.plus {
        color: var(--plus);
      }

      .c-nama {
        min-width: 180px;
      }

      .potong {
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .keterangan {
        max-width: 170px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .keterangan.minus {
        color: var(--minus);
      }

      .keterangan.plus {
        color: var(--plus);
      }

      .cell-input {
        height: 30px;
        min-width: 0;
        padding: 0 8px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        line-height: 1;
        border-radius: 7px;
        background: transparent;
        border: 1px solid transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        width: 100%;
        -moz-appearance: textfield;
        appearance: textfield;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .cell-input:hover {
        background: #f9f9f9;
        border-color: #e5e7eb;
      }

      .cell-input:focus {
        outline: none;
        background: #ffffff;
        border-color: var(--primary);
      }

      .cell-input::-webkit-outer-spin-button,
      .cell-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .c-aksi {
        width: 56px;
        position: sticky;
        right: 0;
        background: #ffffff;
        box-shadow: -7px 0 9px -7px rgba(17, 24, 39, 0.22);
      }

      thead th.c-aksi {
        z-index: 2;
        background: #f9f9f9;
      }

      tfoot td.c-aksi,
      tbody tr.simpan td.c-aksi {
        background: #ecfdf5;
      }

      .simpan-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: inherit;
        font-size: 15px;
        font-weight: 800;
        line-height: 1;
        color: #ffffff;
        background: #6366f1;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        flex-shrink: 0;
        outline: none;
        transition: all 0.15s ease;
      }

      .simpan-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      .simpan-btn:disabled {
        background: #d9dde3;
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
      }

      tbody tr.simpan td {
        background: #ecfdf5;
      }

      tbody tr.sinkron td {
        background: #eff6ff;
      }

      .empty {
        padding: 26px 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }

    </style>
  </head>
  <body>
    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox-box">
        <canvas class="qr" id="lightboxQr" width="220" height="220"></canvas>
        <div class="lightbox-text" id="lightboxText"></div>
      </div>
    </div>
    <section class="sec">
      <div class="row">
        <div class="section-label flush" id="judulSo">Stok Opname</div>
      </div>
      <div class="row">
        <input
          class="cari"
          type="search"
          id="cariBarang"
          placeholder="Cari PLU / Nama barang"
          autocomplete="off"
          aria-label="Cari barang"
        />
      </div>

      <div class="table-wrap" id="barangWrap">
        <table class="laporan">
          <thead>
            <tr>
              <th class="c-no">No</th>
              <th class="c-tgl">Tanggal SO</th>
              <th class="c-foto">Foto Produk</th>
              <th class="c-kode">Kode Barang</th>
              <th>Nama Barang</th>
              <th class="c-satuan">Satuan</th>
              <th class="c-num">Onhand</th>
              <th class="c-num">Stok Fisik</th>
              <th class="c-num">Selisih (Qty)</th>
              <th class="c-num">HPP / Satuan</th>
              <th class="c-total">Total Nominal Selisih</th>
              <th>Keterangan</th>
              <th class="c-aksi"></th>
            </tr>
          </thead>
          <tbody id="barangBody"></tbody>
          <tfoot id="barangFoot"></tfoot>
        </table>
      </div>
      <div class="empty" id="barangEmpty" hidden>Belum ada barang. Tambah lewat menu ADMIN.</div>
    </section>

    <section class="sec">
      <div class="row">
        <div class="section-label flush">Riwayat (50 terakhir)</div>
      </div>
      <div class="table-wrap" id="riwayatWrap" hidden>
        <table class="riwayat">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Kode</th>
              <th class="c-num">Stok Sistem</th>
              <th class="c-num">Fisik</th>
              <th class="c-num">Selisih</th>
              <th class="c-total">Nominal</th>
            </tr>
          </thead>
          <tbody id="riwayatBody"></tbody>
        </table>
      </div>
      <div class="empty" id="riwayatEmpty">Belum ada riwayat.</div>
    </section>

    <script type="module">
      import { supabase, SUPABASE_URL, SUPABASE_KEY } from '../../js/supabase.js';

      const ADMIN_KEY = 'stock_opname_admin';
      const DEFAULT_ADMIN = 'Admin Stock Opname';

      const judulSo = document.getElementById('judulSo');
      const barangBody = document.getElementById('barangBody');
      const cariBarang = document.getElementById('cariBarang');
      const barangFoot = document.getElementById('barangFoot');
      const barangEmpty = document.getElementById('barangEmpty');
      const riwayatWrap = document.getElementById('riwayatWrap');
      const riwayatBody = document.getElementById('riwayatBody');
      const riwayatEmpty = document.getElementById('riwayatEmpty');

      let menuId = Number(new URLSearchParams(location.search).get('m')) || 0;

      const up = (value) => String(value ?? '').toUpperCase();
      const num = (value) => {
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
      };
      const formatRupiah = new Intl.NumberFormat('id-ID', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2,
      });
      const rupiah = (value) => 'Rp ' + formatRupiah.format(num(value));
      const getAdmin = () => (localStorage.getItem(ADMIN_KEY) || '').trim() || DEFAULT_ADMIN;
      const formatTanggal = (value) => {
        const d = new Date(value);
        const pad = (n) => String(n).padStart(2, '0');
        return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(-2);
      };

      let tanggalSo = formatTanggal(new Date());


      const cell = (text, cls) => {
        const td = document.createElement('td');
        td.textContent = text;
        if (cls) td.className = cls;
        return td;
      };

      const lightbox = document.getElementById('lightbox');
      const lightboxQr = document.getElementById('lightboxQr');
      const lightboxText = document.getElementById('lightboxText');

      let qrLib = null;
      const muatQr = async () => {
        if (!qrLib) {
          qrLib = await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm');
        }
        return qrLib;
      };

      const tutupQr = () => {
        lightbox.hidden = true;
        lightboxText.textContent = '';
      };

      const lihatQr = async (plu) => {
        const teks = String(plu || '').trim();
        if (!teks) return;
        try {
          const QR = await muatQr();
          await QR.toCanvas(lightboxQr, teks, {
            width: 220,
            margin: 1,
            color: { dark: '#111827', light: '#ffffff' },
          });
          lightboxText.textContent = teks;
          lightbox.hidden = false;
        } catch (err) {
          console.error('Gagal membuat QR:', err);
        }
      };

      document.addEventListener('click', (e) => {
        if (lightbox.hidden) return;
        if (lightbox.contains(e.target)) return;
        tutupQr();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !lightbox.hidden) tutupQr();
      });

      const sinkronTimer = new Map();
      const sinkronTertunda = new Map();

      const tulisFisik = async (id, nilai, tr) => {
        if (!id) return;
        const { error } = await supabase
          .from('stock_products')
          .update({ stok_fisik: Math.round(num(nilai)) })
          .eq('id', Number(id));
        sinkronTertunda.delete(id);
        if (error) {
          console.error('Gagal sinkron stok fisik:', error.message);
          return;
        }
        if (tr) {
          tr.classList.add('sinkron');
          setTimeout(() => tr.classList.remove('sinkron'), 900);
        }
      };

      const flushFisik = () => {
        if (!sinkronTertunda.size) return;
        sinkronTertunda.forEach((nilai, id) => {
          fetch(SUPABASE_URL + '/rest/v1/stock_products?id=eq.' + id, {
            method: 'PATCH',
            keepalive: true,
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: 'Bearer ' + SUPABASE_KEY,
              'Content-Type': 'application/json',
              Prefer: 'return=minimal',
            },
            body: JSON.stringify({ stok_fisik: Math.round(num(nilai)) }),
          }).catch(() => {});
        });
        sinkronTertunda.clear();
      };

      window.addEventListener('pagehide', flushFisik);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flushFisik();
      });

      const sinkronFisik = (id, nilai, tr, langsung) => {
        if (!id) return;
        clearTimeout(sinkronTimer.get(id));
        sinkronTimer.delete(id);
        sinkronTertunda.set(id, nilai);
        if (langsung) {
          tulisFisik(id, nilai, tr);
          return;
        }
        sinkronTimer.set(
          id,
          setTimeout(() => {
            sinkronTimer.delete(id);
            tulisFisik(id, nilai, tr);
          }, 350)
        );
      };

      const cellKode = (kode) => {
        const td = document.createElement('td');
        td.className = 'c-kode';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'kode-btn';
        btn.textContent = kode || '-';
        btn.title = 'Lihat QR ' + (kode || '');
        btn.setAttribute('aria-label', 'Lihat QR ' + (kode || ''));
        btn.addEventListener('click', () => lihatQr(kode));
        td.appendChild(btn);
        return td;
      };

      const keteranganOf = (selisih) => {
        if (selisih === 0) return { text: 'Sesuai', cls: '' };
        if (selisih < 0) return { text: 'Hilang / Rusak / Expired', cls: 'minus' };
        return { text: 'Beda Input / Selisih Terima', cls: 'plus' };
      };

      const hitungBaris = (tr) => {
        const sistem = num(tr.querySelector('.in-sistem').value);
        const fisik = num(tr.querySelector('.in-fisik').value);
        const hpp = num(tr.querySelector('.hpp').dataset.value);
        const selisih = fisik - sistem;
        const nominal = selisih * hpp;
        const ket = keteranganOf(selisih);

        const tdSelisih = tr.querySelector('.selisih');
        tdSelisih.textContent = selisih > 0 ? '+' + selisih : String(selisih);
        tdSelisih.className = 'selisih ' + (selisih === 0 ? '' : selisih < 0 ? 'minus' : 'plus');

        const tdNominal = tr.querySelector('.nominal');
        tdNominal.textContent = rupiah(nominal);
        tdNominal.dataset.value = String(nominal);
        tdNominal.className = 'nominal c-total ' + (nominal === 0 ? '' : nominal < 0 ? 'minus' : 'plus');

        const tdKet = tr.querySelector('.keterangan');
        tdKet.textContent = ket.text;
        tdKet.className = 'keterangan ' + ket.cls;
      };

      const hitungTotal = () => {
        const total = { sistem: 0, fisik: 0, selisih: 0, nominal: 0, beda: 0, jumlah: 0 };
        const plus = { sistem: 0, fisik: 0, selisih: 0, nominal: 0, jumlah: 0 };
        const minus = { sistem: 0, fisik: 0, selisih: 0, nominal: 0, jumlah: 0 };

        barangBody.querySelectorAll('tr').forEach((tr) => {
          const s = num(tr.querySelector('.in-sistem').value);
          const f = num(tr.querySelector('.in-fisik').value);
          const n = num(tr.querySelector('.nominal').dataset.value);
          const d = f - s;
          total.sistem += s;
          total.fisik += f;
          total.selisih += d;
          total.nominal += n;
          total.jumlah += 1;
          if (d !== 0) total.beda += 1;
          const tujuan = d > 0 ? plus : d < 0 ? minus : null;
          if (tujuan) {
            tujuan.sistem += s;
            tujuan.fisik += f;
            tujuan.selisih += d;
            tujuan.nominal += n;
            tujuan.jumlah += 1;
          }
        });

        const warna = (v) => (v === 0 ? '' : v < 0 ? 'minus' : 'plus');
        const angka = (v) => (v > 0 ? '+' + v : String(v));

        const baris = (label, a, cls, ket) => {
          const tr = document.createElement('tr');
          if (cls) tr.className = cls;
          const tdLabel = cell(label);
          tdLabel.colSpan = 6;
          tr.append(
            tdLabel,
            cell(String(a.sistem), 'c-num'),
            cell(String(a.fisik), 'c-num'),
            cell(angka(a.selisih), 'c-num selisih ' + warna(a.selisih)),
            cell('-', 'c-num'),
            cell(rupiah(a.nominal), 'nominal c-total ' + warna(a.nominal)),
            cell(ket, 'keterangan ' + (cls === 'f-plus' ? 'plus' : cls === 'f-minus' ? 'minus' : '')),
            cell('')
          );
          return tr;
        };

        barangFoot.innerHTML = '';
        barangFoot.appendChild(
          baris('TOTAL ' + total.jumlah + ' BARANG', total, '', total.beda ? total.beda + ' BARANG BEDA' : 'SEMUA SESUAI')
        );
        if (plus.jumlah) {
          barangFoot.appendChild(baris('TOTAL PLUS', plus, 'f-plus', plus.jumlah + ' BARANG PLUS'));
        }
        if (minus.jumlah) {
          barangFoot.appendChild(baris('TOTAL MINUS', minus, 'f-minus', minus.jumlah + ' BARANG MINUS'));
        }
      };

      const renderBarang = (barang) => {
        const q = cariBarang.value.trim().toLowerCase();
        const tampil = barang.filter((row) =>
          !q ||
          String(row.kode || '').toLowerCase().includes(q) ||
          String(row.name || '').toLowerCase().includes(q)
        );
        barangBody.innerHTML = '';
        tampil.forEach((row, i) => {
          const sistem = num(row.stok_sistem);
          const tr = document.createElement('tr');
          tr.dataset.id = row.id;
          tr.append(cell(String(i + 1), 'c-no'), cell(tanggalSo, 'c-tgl'));

          const tdFoto = document.createElement('td');
          tdFoto.className = 'c-foto';
          const foto = document.createElement('div');
          foto.className = 'foto';
          if (row.foto_url) {
            const img = document.createElement('img');
            img.src = row.foto_url;
            img.alt = row.name || row.kode || 'foto';
            img.loading = 'lazy';
            img.decoding = 'async';
            foto.appendChild(img);
          } else {
            foto.textContent = '[Sisipkan Foto]';
          }
          tdFoto.appendChild(foto);
          tr.appendChild(tdFoto);

          const tdNama = document.createElement('td');
          tdNama.className = 'c-nama';
          const potong = document.createElement('div');
          potong.className = 'potong';
          potong.textContent = up(row.name);
          potong.title = up(row.name);
          tdNama.appendChild(potong);
          tr.append(cellKode(row.kode), tdNama, cell(row.satuan || 'PCS', 'c-satuan'));

          ['sistem', 'fisik'].forEach((jenis) => {
            const td = document.createElement('td');
            td.className = 'c-num';
            const input = document.createElement('input');
            input.type = 'number';
            input.min = '0';
            input.inputMode = 'numeric';
            input.className = 'cell-input in-' + jenis;
            input.value = String(
              jenis === 'sistem' ? sistem : num(row.stok_fisik)
            );
            input.setAttribute('aria-label', (jenis === 'sistem' ? 'Onhand' : 'Stok Fisik') + ' ' + (row.kode || row.name || i + 1));
            input.addEventListener('input', () => {
              hitungBaris(tr);
              hitungTotal();
              if (jenis === 'fisik') sinkronFisik(row.id, input.value, tr, false);
            });
            input.addEventListener('change', () => {
              if (jenis === 'fisik') sinkronFisik(row.id, input.value, tr, true);
            });
            input.addEventListener('blur', () => {
              if (jenis === 'fisik') sinkronFisik(row.id, input.value, tr, true);
            });
            td.appendChild(input);
            tr.appendChild(td);
          });

          tr.appendChild(cell('0', 'selisih'));

          const hpp = num(row.hpp);
          const tdHpp = cell(rupiah(hpp), 'c-num');
          tdHpp.classList.add('hpp');
          tdHpp.dataset.value = String(hpp);
          tr.appendChild(tdHpp);

          tr.appendChild(cell('Rp 0', 'nominal c-total'));
          tr.appendChild(cell('Sesuai', 'keterangan'));

          const tdAksi = document.createElement('td');
          tdAksi.className = 'c-aksi';
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'simpan-btn';
        btn.textContent = '✓';
          btn.title = 'Simpan ' + (row.kode || row.name);
          btn.setAttribute('aria-label', btn.title);
          btn.addEventListener('click', () => simpanBaris(tr, btn));
          tdAksi.appendChild(btn);
          tr.appendChild(tdAksi);

          hitungBaris(tr);
          barangBody.appendChild(tr);
        });
        barangEmpty.hidden = tampil.length > 0;
        barangEmpty.textContent = q
          ? 'Tidak ada barang yang cocok dengan "' + cariBarang.value.trim() + '".'
          : 'Belum ada barang. Tambah lewat menu ADMIN.';
        document.getElementById('barangWrap').hidden = barang.length === 0;
        hitungTotal();
      };

      cariBarang.addEventListener('input', () => load());


      const pilihMenuOtomatis = async () => {
        const { data, error } = await supabase.from('so_menus').select('id').order('name').limit(1);
        if (error || !data || !data.length) {
          judulSo.textContent = 'Belum ada menu SO. Buat dulu di ADMIN.';
          return;
        }
        menuId = data[0].id;
        history.replaceState(null, '', '?m=' + menuId);
      };

      const load = async () => {
        if (!menuId) await pilihMenuOtomatis();
        if (!menuId) return;
        const { data: menu, error: errMenu } = await supabase
          .from('so_menus')
          .select('id, name')
          .eq('id', menuId)
          .single();
        if (errMenu || !menu) {
          console.warn('Menu tidak ditemukan, pindah ke menu pertama');
          menuId = 0;
          await pilihMenuOtomatis();
          if (!menuId) return;
          return load();
        }
        judulSo.textContent = up(menu.name);
        tanggalSo = formatTanggal(new Date());

        const { data: barang, error: errBarang } = await supabase
          .from('stock_products')
          .select('id, kode, name, satuan, stok_sistem, stok_fisik, hpp, foto_url')
          .eq('menu_id', menuId)
          .order('kode');
        if (errBarang) {
          const ulang = await supabase
            .from('stock_products')
            .select('id, kode, name, satuan, stok_sistem, hpp')
            .eq('menu_id', menuId)
            .order('kode');
          if (ulang.error) {
            console.error('Gagal memuat barang:', ulang.error.message);
            barangBody.innerHTML = '';
            barangEmpty.hidden = false;
            barangEmpty.textContent = 'Gagal memuat barang: ' + ulang.error.message;
            return;
          }
          renderBarang(ulang.data || []);
          loadRiwayat();
          return;
        }

        renderBarang(barang || []);
        loadRiwayat();
      };

      const barisOpname = (tr, sistem, fisik, hpp) => ({
        menu_id: menuId,
        product_id: Number(tr.dataset.id) || null,
        product_plu: tr.querySelector('.kode-btn').textContent,
        quantity: fisik,
        stok_sistem: sistem,
        stok_fisik: fisik,
        hpp,
        selisih: fisik - sistem,
        total_nominal: (fisik - sistem) * hpp,
        keterangan: keteranganOf(fisik - sistem).text,
        admin: getAdmin(),
        opname_date: new Date().toISOString(),
      });

      const simpanBaris = async (tr, btn) => {
        if (!menuId) return;
        const inSistem = tr.querySelector('.in-sistem');
        const inFisik = tr.querySelector('.in-fisik');
        if (!inSistem || !inFisik) return;
        const sistem = num(inSistem.value);
        const fisik = num(inFisik.value);
        const cap = sistem + '|' + fisik;
        if (sistem === 0 && fisik === 0) return;
        if (tr.dataset.terkirim === cap) return;
        if (btn) btn.disabled = true;
        const hpp = num(tr.querySelector('.hpp').dataset.value);
        const { error } = await supabase
          .from('stock_opname')
          .insert([barisOpname(tr, sistem, fisik, hpp)]);
        if (error) {
          if (btn) btn.disabled = false;
          console.error('Gagal menyimpan stok:', error.message);
          return;
        }
        if (tr.dataset.id) {
          const { error: errSistem } = await supabase
            .from('stock_products')
            .update({ stok_sistem: fisik, stok_fisik: 0 })
            .eq('id', Number(tr.dataset.id));
          if (errSistem) {
            console.error('Gagal memperbarui stok sistem:', errSistem.message);
          }
        }
        tr.dataset.terkirim = cap;
        inSistem.value = String(fisik);
        inFisik.value = '0';
        hitungBaris(tr);
        hitungTotal();
        if (btn) btn.disabled = false;
        tr.classList.add('simpan');
        setTimeout(() => tr.classList.remove('simpan'), 1200);
        loadRiwayat();
      };

      const formatWaktu = (value) => {
        if (!value) return '-';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return '-';
        return d.toLocaleString('id-ID', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      };

      const loadRiwayat = async () => {
        if (!menuId) return;
        const { data, error } = await supabase
          .from('stock_opname')
          .select('product_plu, stok_sistem, stok_fisik, selisih, total_nominal, opname_date, created_at')
          .eq('menu_id', menuId)
          .order('id', { ascending: false })
          .limit(50);
        if (error) {
          console.error('Gagal memuat riwayat:', error.message);
          return;
        }
        const rows = data || [];
        riwayatBody.innerHTML = '';
        rows.forEach((row) => {
          const tr = document.createElement('tr');
          tr.append(
            cell(formatWaktu(row.opname_date || row.created_at)),
            cell(row.product_plu || '-', 'kode'),
            cell(String(num(row.stok_sistem)), 'c-num'),
            cell(String(num(row.stok_fisik)), 'c-num'),
            cell(String(num(row.selisih)), 'c-num'),
            cell(rupiah(row.total_nominal), 'c-total')
          );
          riwayatBody.appendChild(tr);
        });
        riwayatEmpty.hidden = rows.length > 0;
        riwayatWrap.hidden = rows.length === 0;
      };
      load();
    </script>
  </body>
</html>
