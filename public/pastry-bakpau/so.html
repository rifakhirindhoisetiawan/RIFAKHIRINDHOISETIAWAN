<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Stok Opname</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --text: #1f2937;
        --muted: #9ca3af;
        --line: #e5e7eb;
        --line-2: #d9dde3;
        --surface: #f3f4f6;
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --minus: #dc2626;
        --plus: #16a34a;
        --row-h: 40px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #ffffff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text);
        min-height: 100vh;
        max-width: 800px;
        margin: 0 auto;
        padding: 14px 18px 40px;
        padding-top: max(14px, env(safe-area-inset-top));
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .section-label.flush {
        margin: 4px 0 0;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .table-wrap {
        overflow-x: auto;
        overflow-y: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        -webkit-overflow-scrolling: touch;
        background: #fff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .table-wrap::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .laporan {
        min-width: 880px;
      }

      .riwayat {
        min-width: 460px;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f9f9f9;
        color: var(--muted);
        font-size: clamp(10px, 2.6vw, 12px);
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-align: left;
        height: 34px;
        padding: 0 10px;
        border-bottom: 1px solid #e5e7eb;
        white-space: nowrap;
      }

      tbody td {
        height: 38px;
        padding: 0 10px;
        border-bottom: 1px solid #f1f2f4;
        vertical-align: middle;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover td {
        background: #fafafa;
      }

      tfoot td {
        position: sticky;
        bottom: 0;
        background: #f9f9f9;
        font-weight: 800;
        font-size: 13px;
        height: 38px;
        padding: 0 10px;
        border-top: 1px solid #e5e7eb;
        white-space: nowrap;
      }

      .c-no {
        width: 34px;
        text-align: center;
        color: var(--muted);
      }

      .c-tgl {
        width: 64px;
        text-align: center;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }

      .c-foto {
        width: 70px;
      }

      .c-kode {
        width: 92px;
      }

      .c-satuan {
        width: 58px;
      }

      .c-num {
        width: 76px;
        text-align: right;
      }

      .hpp {
        width: 100px;
        white-space: nowrap;
      }

      .c-total {
        width: 100px;
        text-align: right;
      }

      .foto {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border: 1px dashed #d1d5db;
        border-radius: 8px;
        background: #f9fafb;
        color: var(--muted);
        font-size: 7px;
        font-weight: 800;
        text-align: center;
        padding: 0 3px;
        line-height: 1.15;
      }

      .foto img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .kode {
        color: var(--primary);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: clamp(12px, 3.2vw, 14px);
        font-weight: 800;
        white-space: nowrap;
      }

      .selisih {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .selisih.minus,
      .nominal.minus {
        color: var(--minus);
      }

      .selisih.plus,
      .nominal.plus {
        color: var(--plus);
      }

      .c-nama {
        min-width: 180px;
      }

      .potong {
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .keterangan {
        max-width: 170px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .keterangan.minus {
        color: var(--minus);
      }

      .keterangan.plus {
        color: var(--plus);
      }

      .cell-input {
        height: 30px;
        min-width: 0;
        padding: 0 8px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        line-height: 1;
        border-radius: 7px;
        background: transparent;
        border: 1px solid transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        width: 100%;
        -moz-appearance: textfield;
        appearance: textfield;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .cell-input:hover {
        background: #f9f9f9;
        border-color: #e5e7eb;
      }

      .cell-input:focus {
        outline: none;
        background: #ffffff;
        border-color: var(--primary);
      }

      .cell-input::-webkit-outer-spin-button,
      .cell-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .c-aksi {
        width: 52px;
      }

      .simpan-btn {
        width: 28px;
        height: 28px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: inherit;
        font-size: 12px;
        font-weight: 800;
        line-height: 1;
        color: #4f46e5;
        background: #eef2ff;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
      }

      .simpan-btn:hover {
        color: #4338ca;
        background: #e0e7ff;
      }

      .simpan-btn:active {
        transform: scale(0.9);
      }

      .simpan-btn:disabled {
        color: #c7d2fe;
        background: #f6f7fb;
        cursor: not-allowed;
      }

      tbody tr.simpan td {
        background: #ecfdf5;
      }

      .empty {
        padding: 26px 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 30;
        max-width: calc(100% - 36px);
        padding: 10px 16px;
        border-radius: 10px;
        background: #111827;
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
        box-shadow: 0 8px 24px rgba(17, 24, 39, 0.28);
      }

      .toast.err {
        background: var(--minus);
      }

      .toast[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="toast" id="toast" role="status" hidden></div>
    <section class="sec">
      <div class="row">
        <div class="section-label flush" id="judulSo">Stok Opname</div>
      </div>

      <div class="table-wrap" id="barangWrap">
        <table class="laporan">
          <thead>
            <tr>
              <th class="c-no">No</th>
              <th class="c-tgl">Tanggal SO</th>
              <th class="c-foto">Foto Produk</th>
              <th class="c-kode">Kode Barang</th>
              <th>Nama Barang</th>
              <th class="c-satuan">Satuan</th>
              <th class="c-num">Stok Sistem</th>
              <th class="c-num">Stok Fisik</th>
              <th class="c-num">Selisih (Qty)</th>
              <th class="c-num">HPP / Satuan</th>
              <th class="c-total">Total Nominal Selisih</th>
              <th>Keterangan</th>
              <th class="c-aksi"></th>
            </tr>
          </thead>
          <tbody id="barangBody"></tbody>
          <tfoot id="barangFoot"></tfoot>
        </table>
      </div>
      <div class="empty" id="barangEmpty" hidden>Belum ada barang. Tambah lewat menu ADMIN.</div>
    </section>

    <section class="sec">
      <div class="row">
        <div class="section-label flush">Riwayat (50 terakhir)</div>
      </div>
      <div class="table-wrap" id="riwayatWrap" hidden>
        <table class="riwayat">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Kode</th>
              <th class="c-num">Stok Sistem</th>
              <th class="c-num">Fisik</th>
              <th class="c-num">Selisih</th>
              <th class="c-total">Nominal</th>
            </tr>
          </thead>
          <tbody id="riwayatBody"></tbody>
        </table>
      </div>
      <div class="empty" id="riwayatEmpty">Belum ada riwayat.</div>
    </section>

    <script type="module">
      import { supabase } from '../../js/supabase.js';

      const ADMIN_KEY = 'stock_opname_admin';
      const DEFAULT_ADMIN = 'Admin Stock Opname';

      const judulSo = document.getElementById('judulSo');
      const barangBody = document.getElementById('barangBody');
      const barangFoot = document.getElementById('barangFoot');
      const barangEmpty = document.getElementById('barangEmpty');
      const riwayatWrap = document.getElementById('riwayatWrap');
      const riwayatBody = document.getElementById('riwayatBody');
      const riwayatEmpty = document.getElementById('riwayatEmpty');
      const toast = document.getElementById('toast');

      const menuId = Number(new URLSearchParams(location.search).get('m')) || 0;

      const up = (value) => String(value ?? '').toUpperCase();
      const num = (value) => {
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
      };
      const rupiah = (value) => 'Rp ' + Math.round(num(value)).toLocaleString('id-ID');
      const getAdmin = () => (localStorage.getItem(ADMIN_KEY) || '').trim() || DEFAULT_ADMIN;
      const formatTanggal = (value) => {
        const d = new Date(value);
        const pad = (n) => String(n).padStart(2, '0');
        return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(-2);
      };

      let tanggalSo = formatTanggal(new Date());

      let toastTimer = null;
      const say = (message, isError) => {
        toast.textContent = message;
        toast.className = 'toast' + (isError ? ' err' : '');
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.hidden = true;
        }, 2800);
      };

      const cell = (text, cls) => {
        const td = document.createElement('td');
        td.textContent = text;
        if (cls) td.className = cls;
        return td;
      };

      const keteranganOf = (selisih) => {
        if (selisih === 0) return { text: 'Sesuai', cls: '' };
        if (selisih < 0) return { text: 'Hilang / Rusak / Expired', cls: 'minus' };
        return { text: 'Beda Input / Selisih Terima', cls: 'plus' };
      };

      const hitungBaris = (tr) => {
        const sistem = num(tr.querySelector('.in-sistem').value);
        const fisik = num(tr.querySelector('.in-fisik').value);
        const hpp = num(tr.querySelector('.hpp').dataset.value);
        const selisih = fisik - sistem;
        const nominal = selisih * hpp;
        const ket = keteranganOf(selisih);

        const tdSelisih = tr.querySelector('.selisih');
        tdSelisih.textContent = selisih > 0 ? '+' + selisih : String(selisih);
        tdSelisih.className = 'selisih ' + (selisih === 0 ? '' : selisih < 0 ? 'minus' : 'plus');

        const tdNominal = tr.querySelector('.nominal');
        tdNominal.textContent = rupiah(nominal);
        tdNominal.dataset.value = String(nominal);
        tdNominal.className = 'nominal c-total ' + (nominal === 0 ? '' : nominal < 0 ? 'minus' : 'plus');

        const tdKet = tr.querySelector('.keterangan');
        tdKet.textContent = ket.text;
        tdKet.className = 'keterangan ' + ket.cls;
      };

      const hitungTotal = () => {
        let selisih = 0;
        let nominal = 0;
        barangBody.querySelectorAll('tr').forEach((tr) => {
          selisih += num(tr.querySelector('.in-fisik').value) - num(tr.querySelector('.in-sistem').value);
          nominal += num(tr.querySelector('.nominal').dataset.value);
        });
        barangFoot.innerHTML = '';
        const tr = document.createElement('tr');
        const tdTotal = cell('TOTAL');
        tdTotal.colSpan = 9;
        const tdSelisih = cell(
          String(selisih),
          'selisih ' + (selisih === 0 ? '' : selisih < 0 ? 'minus' : 'plus')
        );
        const tdNominal = cell(
          rupiah(nominal),
          'nominal c-total ' + (nominal === 0 ? '' : nominal < 0 ? 'minus' : 'plus')
        );
        tdNominal.colSpan = 2;
        const tdSisa = cell('');
        tr.append(tdTotal, tdSelisih, tdNominal, tdSisa);
        barangFoot.appendChild(tr);
      };

      const renderBarang = (barang) => {
        barangBody.innerHTML = '';
        barang.forEach((row, i) => {
          const sistem = num(row.stok_sistem);

          const tr = document.createElement('tr');
          tr.dataset.id = row.id;
          tr.append(cell(String(i + 1), 'c-no'), cell(tanggalSo, 'c-tgl'));

          const tdFoto = document.createElement('td');
          tdFoto.className = 'c-foto';
          const foto = document.createElement('div');
          foto.className = 'foto';
          if (row.foto_url) {
            const img = document.createElement('img');
            img.src = row.foto_url;
            img.alt = row.name || row.kode || 'foto';
            img.loading = 'lazy';
            img.decoding = 'async';
            foto.appendChild(img);
          } else {
            foto.textContent = '[Sisipkan Foto]';
          }
          tdFoto.appendChild(foto);
          tr.appendChild(tdFoto);

          const tdNama = document.createElement('td');
          tdNama.className = 'c-nama';
          const potong = document.createElement('div');
          potong.className = 'potong';
          potong.textContent = up(row.name);
          potong.title = up(row.name);
          tdNama.appendChild(potong);
          tr.append(cell(row.kode || '-', 'kode'), tdNama, cell(row.satuan || 'PCS', 'c-satuan'));

          ['sistem', 'fisik'].forEach((jenis) => {
            const td = document.createElement('td');
            td.className = 'c-num';
            const input = document.createElement('input');
            input.type = 'number';
            input.min = '0';
            input.inputMode = 'numeric';
            input.className = 'cell-input in-' + jenis;
            input.value = String(jenis === 'sistem' ? sistem : 0);
            input.setAttribute('aria-label', (jenis === 'sistem' ? 'Stok Sistem' : 'Stok Fisik') + ' ' + (row.kode || row.name || i + 1));
            input.addEventListener('input', () => {
              hitungBaris(tr);
              hitungTotal();
            });
            td.appendChild(input);
            tr.appendChild(td);
          });

          tr.appendChild(cell('0', 'selisih'));

          const hpp = num(row.hpp);
          const tdHpp = cell(rupiah(hpp), 'c-num');
          tdHpp.classList.add('hpp');
          tdHpp.dataset.value = String(hpp);
          tr.appendChild(tdHpp);

          tr.appendChild(cell('Rp 0', 'nominal c-total'));
          tr.appendChild(cell('Sesuai', 'keterangan'));

          const tdAksi = document.createElement('td');
          tdAksi.className = 'c-aksi';
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'simpan-btn';
          btn.textContent = 'âœ“';
          btn.title = 'Simpan ' + (row.kode || row.name);
          btn.setAttribute('aria-label', btn.title);
          btn.addEventListener('click', () => simpanBaris(tr, btn));
          tdAksi.appendChild(btn);
          tr.appendChild(tdAksi);

          hitungBaris(tr);
          barangBody.appendChild(tr);
        });
        barangEmpty.hidden = barang.length > 0;
        document.getElementById('barangWrap').hidden = barang.length === 0;
        hitungTotal();
      };

      const load = async () => {
        if (!menuId) {
          judulSo.textContent = 'Pilih menu SO dulu';
          return;
        }
        const { data: menu, error: errMenu } = await supabase
          .from('so_menus')
          .select('id, name')
          .eq('id', menuId)
          .single();
        if (errMenu || !menu) {
          judulSo.textContent = 'Menu tidak ditemukan';
          console.error('Gagal memuat menu:', errMenu && errMenu.message);
          return;
        }
        judulSo.textContent = up(menu.name);
        tanggalSo = formatTanggal(new Date());

        const { data: barang, error: errBarang } = await supabase
          .from('stock_products')
          .select('id, kode, name, satuan, stok_sistem, hpp, foto_url')
          .eq('menu_id', menuId)
          .order('kode');
        if (errBarang) {
          const ulang = await supabase
            .from('stock_products')
            .select('id, kode, name, satuan, stok_sistem, hpp')
            .eq('menu_id', menuId)
            .order('kode');
          if (ulang.error) {
            console.error('Gagal memuat barang:', ulang.error.message);
            say('Gagal memuat barang: ' + ulang.error.message, true);
            return;
          }
          renderBarang(ulang.data || []);
          loadRiwayat();
          return;
        }

        renderBarang(barang || []);
        loadRiwayat();
      };

      const barisOpname = (tr, sistem, fisik, hpp) => ({
        menu_id: menuId,
        product_id: Number(tr.dataset.id) || null,
        product_plu: tr.querySelector('.kode').textContent,
        quantity: fisik,
        stok_sistem: sistem,
        stok_fisik: fisik,
        hpp,
        selisih: fisik - sistem,
        total_nominal: (fisik - sistem) * hpp,
        keterangan: keteranganOf(fisik - sistem).text,
        admin: getAdmin(),
        opname_date: new Date().toISOString(),
      });

      const simpanBaris = async (tr, btn) => {
        if (!menuId || btn.disabled) return;
        const sistem = num(tr.querySelector('.in-sistem').value);
        const fisik = num(tr.querySelector('.in-fisik').value);
        if (sistem === 0 && fisik === 0) {
          say('Isi Stok Sistem atau Stok Fisik dulu', true);
          return;
        }
        const hpp = num(tr.querySelector('.hpp').dataset.value);
        btn.disabled = true;
        const { error } = await supabase
          .from('stock_opname')
          .insert([barisOpname(tr, sistem, fisik, hpp)]);
        if (error) {
          btn.disabled = false;
          console.error('Gagal menyimpan stok:', error.message);
          say('Gagal menyimpan stok: ' + error.message, true);
          return;
        }
        if (tr.dataset.id) {
          const { error: errSistem } = await supabase
            .from('stock_products')
            .update({ stok_sistem: fisik })
            .eq('id', Number(tr.dataset.id));
          if (errSistem) {
            console.error('Gagal memperbarui stok sistem:', errSistem.message);
            say('Tersimpan, tapi stok sistem gagal diperbarui: ' + errSistem.message, true);
          }
        }
        tr.classList.add('simpan');
        setTimeout(() => tr.classList.remove('simpan'), 900);
        loadRiwayat();
      };

      const formatWaktu = (value) => {
        if (!value) return '-';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return '-';
        return d.toLocaleString('id-ID', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      };

      const loadRiwayat = async () => {
        if (!menuId) return;
        const { data, error } = await supabase
          .from('stock_opname')
          .select('product_plu, stok_sistem, stok_fisik, selisih, total_nominal, opname_date, created_at')
          .eq('menu_id', menuId)
          .order('id', { ascending: false })
          .limit(50);
        if (error) {
          console.error('Gagal memuat riwayat:', error.message);
          return;
        }
        const rows = data || [];
        riwayatBody.innerHTML = '';
        rows.forEach((row) => {
          const tr = document.createElement('tr');
          tr.append(
            cell(formatWaktu(row.opname_date || row.created_at)),
            cell(row.product_plu || '-', 'kode'),
            cell(String(num(row.stok_sistem)), 'c-num'),
            cell(String(num(row.stok_fisik)), 'c-num'),
            cell(String(num(row.selisih)), 'c-num'),
            cell(rupiah(row.total_nominal), 'c-total')
          );
          riwayatBody.appendChild(tr);
        });
        riwayatEmpty.hidden = rows.length > 0;
        riwayatWrap.hidden = rows.length === 0;
      };
      load();
    </script>
  </body>
</html>
