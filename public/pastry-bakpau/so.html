<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Stok Opname</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --text: #1f2937;
        --muted: #9ca3af;
        --line: #e5e7eb;
        --line-2: #d9dde3;
        --surface: #f3f4f6;
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --minus: #dc2626;
        --plus: #16a34a;
        --row-h: 40px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #ffffff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text);
        min-height: 100vh;
        max-width: 800px;
        margin: 0 auto;
        padding: 14px 18px 40px;
        padding-top: max(14px, env(safe-area-inset-top));
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .section-label.flush {
        margin: 4px 0 0;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .table-wrap {
        overflow-x: auto;
        overflow-y: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        -webkit-overflow-scrolling: touch;
        background: #fff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .table-wrap::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .laporan {
        min-width: 810px;
      }

      .riwayat {
        min-width: 460px;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f9f9f9;
        color: var(--muted);
        font-size: clamp(10px, 2.6vw, 12px);
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-align: left;
        height: 34px;
        padding: 0 10px;
        border-bottom: 1px solid #e5e7eb;
        white-space: nowrap;
      }

      tbody td {
        height: 44px;
        padding: 0 10px;
        border-bottom: 1px solid #f1f2f4;
        vertical-align: middle;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover td {
        background: #fafafa;
      }

      tfoot td {
        position: sticky;
        bottom: 0;
        background: #f9f9f9;
        font-weight: 800;
        font-size: 13px;
        height: 44px;
        padding: 0 10px;
        border-top: 1px solid #e5e7eb;
        white-space: nowrap;
      }

      /* tr.f-plus / tr.f-minus dihapus: tfoot sekarang satu baris total. */

      .c-no {
        width: 34px;
        text-align: center;
        color: var(--muted);
      }

      .c-tgl {
        width: 64px;
        text-align: center;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }

      .cari {
        width: 100%;
        height: 36px;
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 10px;
      }

      .cari:focus {
        outline: none;
        background: #fff;
        border-color: #888;
      }

      .cari::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }

      .c-kode {
        width: 92px;
      }

      .c-satuan {
        width: 58px;
      }

      .c-num {
        width: 76px;
        text-align: right;
      }

      .hpp {
        width: 100px;
        white-space: nowrap;
      }

      .c-total {
        width: 100px;
        text-align: right;
      }

      .kode {
        color: var(--primary);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: clamp(12px, 3.2vw, 14px);
        font-weight: 800;
        white-space: nowrap;
      }

      .kode-btn {
        width: 100%;
        padding: 5px 6px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.2px;
        color: #4f46e5;
        text-align: left;
        background: transparent;
        border: 1px dashed transparent;
        border-radius: 6px;
        cursor: pointer;
      }

      .kode-btn:active {
        background: var(--soft);
        border-color: #e0e7ff;
      }

      .lightbox {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 40;
        max-width: calc(100vw - 32px);
        padding: 12px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
      }

      .lightbox[hidden] {
        display: none;
      }

      .lightbox-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .lightbox .qr {
        width: min(56vw, 196px);
        height: min(56vw, 196px);
      }

      .lightbox-text {
        color: var(--text);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.6px;
      }

      .selisih {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .selisih.minus,
      .nominal.minus {
        color: var(--minus);
      }

      .selisih.plus,
      .nominal.plus {
        color: var(--plus);
      }

      .c-nama {
        min-width: 180px;
      }

      .potong {
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .keterangan {
        max-width: 170px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .keterangan.minus {
        color: var(--minus);
      }

      .keterangan.plus {
        color: var(--plus);
      }

      .cell-input {
        height: 30px;
        min-width: 0;
        padding: 0 8px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        line-height: 1;
        border-radius: 7px;
        background: transparent;
        border: 1px solid transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        width: 100%;
        -moz-appearance: textfield;
        appearance: textfield;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .cell-input:hover {
        background: #f9f9f9;
        border-color: #e5e7eb;
      }

      .cell-input:focus {
        outline: none;
        background: #ffffff;
        border-color: var(--primary);
      }

      .cell-input::-webkit-outer-spin-button,
      .cell-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Kolom baca-only (mis. Onhand): data master, hanya berubah di ADMIN.
         Tampil sebagai nilai, bukan input yang bisa diklik. */
      .cell-input.baca {
        background: #f1eee4;
        border: 1px dashed #d8d2c2;
        border-radius: 0;
        color: #6e6a64;
        cursor: not-allowed;
        font-weight: 700;
      }
      .cell-input.baca:hover {
        background: #f1eee4;
        border-color: #d8d2c2;
      }
      .cell-input.baca:focus {
        outline: none;
        background: #f1eee4;
        border-color: #d8d2c2;
      }

      /* .c-aksi dihapus: kolom aksinya sudah tidak ada (tidak ada tombol
         simpan), dan kolom kosong yang sticky justru menutupi judul
         kolom di sebelahnya saat tabel digeser. */

      /* .simpan-btn / tr.simpan / tr.sinkron dihapus: tombol simpan dan
         sinkronisasi sudah tidak ada (halaman ini read-only). */

      .empty {
        padding: 26px 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }

      /* ============================================================
         TEMA MORI — override di atas, logika JS tidak disentuh.
         Palet dari public/mori/css/variables.css:
         bg #fffbf2 · surface #f7f3e9 · primary #1a1917 · text-secondary #6e6a64
         Gaya: sharp (radius 0), border hitam solid, shadow offset.
         Variabel asli (--text, --line, --primary, ...) di-override di sini
         supaya aturan yang sudah ada ikut berubah warna tanpa disentuh.
         ============================================================ */
      :root {
        --text: #1a1917;
        --muted: #6e6a64;
        --line: rgba(26, 25, 23, 0.14);
        --line-2: rgba(26, 25, 23, 0.14);
        --surface: #f7f3e9;
        --primary: #1a1917;
        --primary-dark: #1a1917;
        --soft: #f7f3e9;
        --minus: #b91c1c;
        --plus: #3f6212;
        --mori-bg: #fffbf2;
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      html,
      body {
        background: var(--mori-bg);
      }

      body {
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .section-label {
        font-family: var(--mori-mono);
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 1.4px;
      }

      /* ===== SEARCH ===== */
      .cari {
        background: var(--surface);
        border: 1px solid var(--text);
        border-radius: 0;
        transition: box-shadow 0.2s ease;
      }
      .cari:focus {
        background: #fffdf7;
        border-color: var(--text);
        box-shadow: 4px 4px 0 var(--text);
      }

      /* ===== TABEL ===== */
      .table-wrap {
        border: 1px solid var(--text);
        border-radius: 0;
        background: var(--mori-bg);
      }
      thead th {
        background: var(--surface);
        color: var(--text);
        font-family: var(--mori-mono);
        font-weight: 700;
        border-bottom: 1px solid var(--text);
      }
      tbody td {
        border-bottom: 1px solid var(--line);
      }
      tbody tr:hover td {
        background: #faf6ea;
      }
      tfoot td {
        background: var(--surface);
        border-top: 1px solid var(--text);
        font-family: var(--mori-mono);
        font-weight: 700;
      }
      /* tr.f-plus / tr.f-minus dihapus: tfoot sekarang satu baris total. */
      tbody tr.sinkron td {
        background: #f0f3f8;
      }

      .c-no,
      .c-tgl {
        color: var(--muted);
        font-family: var(--mori-mono);
      }

      /* ===== RIWAYAT: ringkas, disembunyikan sampai ditekan ===== */
      .riwayat-head {
        margin-bottom: 0;
      }
      .riwayat-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 10px 12px;
        background: var(--surface);
        border: 1px solid var(--text);
        border-radius: 0;
        color: var(--text);
        font-family: var(--mori-mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: box-shadow 0.2s ease, transform 0.2s ease;
      }
      .riwayat-toggle:active {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      .riwayat-toggle:hover {
        box-shadow: 4px 4px 0 var(--text);
      }
      .riwayat-caret {
        font-size: 14px;
        line-height: 1;
      }
      .riwayat-count {
        color: var(--muted);
        letter-spacing: 0.5px;
      }
      .riwayat {
        min-width: 320px;
      }
      /* Riwayat harus muat: waktu ringkas + nominal satu baris,
         tidak boleh turun ke baris kedua. */
      .riwayat td {
        white-space: nowrap;
      }
      .riwayat .c-total {
        width: auto;
        min-width: 92px;
      }
      .riwayat .kode {
        max-width: 130px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .empty {
        padding: 18px 12px;
      }

      /* ===== KODE (QR) ===== */
      .kode,
      .kode-btn {
        color: var(--text);
        font-family: var(--mori-mono);
      }
      .kode-btn {
        border-radius: 0;
        border: 1px dashed var(--line);
      }
      .kode-btn:active {
        background: var(--surface);
        border-color: var(--text);
      }

      /* ===== LIGHTBOX QR ===== */
      .lightbox {
        background: var(--mori-bg);
        border: 1px solid var(--text);
        border-radius: 0;
        box-shadow: 6px 6px 0 rgba(26, 25, 23, 0.2);
      }
      .lightbox-text {
        font-family: var(--mori-mono);
        letter-spacing: 0.8px;
      }

      /* ===== KOLOM BACA-ONLY (Onhand / Stok Fisik) ===== */
      .cell-input.baca {
        background: var(--surface);
        border: 1px dashed var(--text);
        border-radius: 0;
        color: var(--muted);
      }

      .empty {
        font-family: var(--mori-mono);
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox-box">
        <canvas class="qr" id="lightboxQr" width="220" height="220"></canvas>
        <div class="lightbox-text" id="lightboxText"></div>
      </div>
    </div>
    <section class="sec">
      <!-- Tulisan nama menu dihapus: kotak pencarian langsung di paling atas.
           Nama menu代替 judul, pindah ke placeholder input. -->
      <div class="row menu-cari-row">
        <input
          class="cari"
          type="search"
          id="cariBarang"
          placeholder="Cari PLU / Nama barang"
          autocomplete="off"
          aria-label="Cari barang"
        />
      </div>

      <div class="table-wrap" id="barangWrap">
        <table class="laporan">
          <thead>
            <tr>
              <th class="c-no">No</th>
              <th class="c-tgl">Tanggal SO</th>
              <th class="c-kode">Kode Barang</th>
              <th>Nama Barang</th>
              <th class="c-satuan">Satuan</th>
              <th class="c-num">Onhand</th>
              <th class="c-num">Stok Fisik</th>
              <th class="c-num">Selisih (Qty)</th>
              <th class="c-num">HPP / Satuan</th>
              <th class="c-total">Total Nominal Selisih</th>
              <th>Keterangan</th>
            </tr>
          </thead>
          <tbody id="barangBody"></tbody>
          <tfoot id="barangFoot"></tfoot>
        </table>
      </div>
      <div class="empty" id="barangEmpty" hidden>Belum ada barang. Tambah lewat menu ADMIN.</div>
    </section>

    <section class="sec">
      <!-- Riwayat dibuat simple: 4 kolom (Waktu, Kode, Selisih, Nominal),
           disembunyikan sampai menekan tombol, maksimal 20 baris. -->
      <div class="row riwayat-head">
        <button
          class="riwayat-toggle"
          id="riwayatToggle"
          type="button"
          aria-expanded="false"
          aria-controls="riwayatWrap"
        >
          <span class="riwayat-caret" id="riwayatCaret">+</span>
          <span>Riwayat</span>
          <span class="riwayat-count" id="riwayatCount"></span>
        </button>
      </div>
      <div class="table-wrap" id="riwayatWrap" hidden>
        <table class="riwayat">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Kode</th>
              <th class="c-num">Selisih</th>
              <th class="c-total">Nominal</th>
            </tr>
          </thead>
          <tbody id="riwayatBody"></tbody>
        </table>
      </div>
      <div class="empty" id="riwayatEmpty" hidden>Belum ada riwayat.</div>
    </section>

    <script type="module">
      import { supabase } from '../../js/supabase.js';

      const cariBarang = document.getElementById('cariBarang');
      const barangBody = document.getElementById('barangBody');
      const barangFoot = document.getElementById('barangFoot');
      const barangEmpty = document.getElementById('barangEmpty');
      const riwayatWrap = document.getElementById('riwayatWrap');
      const riwayatBody = document.getElementById('riwayatBody');
      const riwayatEmpty = document.getElementById('riwayatEmpty');
      const riwayatToggle = document.getElementById('riwayatToggle');
      const riwayatCaret = document.getElementById('riwayatCaret');
      const riwayatCount = document.getElementById('riwayatCount');
      let riwayatTerbuka = false;

      riwayatToggle.addEventListener('click', () => {
        riwayatTerbuka = !riwayatTerbuka;
        riwayatToggle.setAttribute('aria-expanded', String(riwayatTerbuka));
        riwayatCaret.textContent = riwayatTerbuka ? '−' : '+';
        riwayatWrap.hidden = !riwayatTerbuka || riwayatBody.children.length === 0;
        riwayatEmpty.hidden = riwayatTerbuka || riwayatBody.children.length > 0;
      });

      let menuId = Number(new URLSearchParams(location.search).get('m')) || 0;

      const up = (value) => String(value ?? '').toUpperCase();
      const num = (value) => {
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
      };
      const formatRupiah = new Intl.NumberFormat('id-ID', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2,
      });
      const rupiah = (value) => 'Rp ' + formatRupiah.format(num(value));
      const formatTanggal = (value) => {
        const d = new Date(value);
        const pad = (n) => String(n).padStart(2, '0');
        return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(-2);
      };

      let tanggalSo = formatTanggal(new Date());


      const cell = (text, cls) => {
        const td = document.createElement('td');
        td.textContent = text;
        if (cls) td.className = cls;
        return td;
      };

      const lightbox = document.getElementById('lightbox');
      const lightboxQr = document.getElementById('lightboxQr');
      const lightboxText = document.getElementById('lightboxText');

      let qrLib = null;
      const muatQr = async () => {
        if (!qrLib) {
          qrLib = await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm');
        }
        return qrLib;
      };

      const tutupQr = () => {
        lightbox.hidden = true;
        lightboxText.textContent = '';
      };

      const lihatQr = async (plu) => {
        const teks = String(plu || '').trim();
        if (!teks) return;
        try {
          const QR = await muatQr();
          await QR.toCanvas(lightboxQr, teks, {
            width: 220,
            margin: 1,
            color: { dark: '#111827', light: '#ffffff' },
          });
          lightboxText.textContent = teks;
          lightbox.hidden = false;
        } catch (err) {
          console.error('Gagal membuat QR:', err);
        }
      };

      document.addEventListener('click', (e) => {
        if (lightbox.hidden) return;
        if (lightbox.contains(e.target)) return;
        tutupQr();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !lightbox.hidden) tutupQr();
      });

      // ---------------------------------------------
// Semua penulisan dari halaman SO dihapus.
// Onhand & Stok Fisik read-only, jadi tidak ada sinkronisasi otomatis
// maupun tombol simpan: data hanya berubah dari halaman ADMIN.
// Fungsi tulisFisik/flushFisik/sinkronFisik/simpanBaris tidak lagi dipakai.
// ---------------------------------------------

      const cellKode = (kode) => {
        const td = document.createElement('td');
        td.className = 'c-kode';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'kode-btn';
        btn.textContent = kode || '-';
        btn.title = 'Lihat QR ' + (kode || '');
        btn.setAttribute('aria-label', 'Lihat QR ' + (kode || ''));
        btn.addEventListener('click', () => lihatQr(kode));
        td.appendChild(btn);
        return td;
      };

      const keteranganOf = (selisih) => {
        if (selisih === 0) return { text: 'Sesuai', cls: '' };
        if (selisih < 0) return { text: 'Hilang', cls: 'minus' };
        return { text: 'Beda Input', cls: 'plus' };
      };

      const hitungBaris = (tr) => {
        const sistem = num(tr.querySelector('.in-sistem').value);
        const fisik = num(tr.querySelector('.in-fisik').value);
        const hpp = num(tr.querySelector('.hpp').dataset.value);
        const selisih = fisik - sistem;
        const nominal = selisih * hpp;
        const ket = keteranganOf(selisih);

        const tdSelisih = tr.querySelector('.selisih');
        tdSelisih.textContent = selisih > 0 ? '+' + selisih : String(selisih);
        tdSelisih.className = 'selisih ' + (selisih === 0 ? '' : selisih < 0 ? 'minus' : 'plus');

        const tdNominal = tr.querySelector('.nominal');
        tdNominal.textContent = rupiah(nominal);
        tdNominal.dataset.value = String(nominal);
        tdNominal.className = 'nominal c-total ' + (nominal === 0 ? '' : nominal < 0 ? 'minus' : 'plus');

        const tdKet = tr.querySelector('.keterangan');
        tdKet.textContent = ket.text;
        tdKet.className = 'keterangan ' + ket.cls;
      };

      const hitungTotal = () => {
        const total = { sistem: 0, fisik: 0, selisih: 0, nominal: 0, beda: 0, jumlah: 0 };
        const plus = { sistem: 0, fisik: 0, selisih: 0, nominal: 0, jumlah: 0 };
        const minus = { sistem: 0, fisik: 0, selisih: 0, nominal: 0, jumlah: 0 };

        barangBody.querySelectorAll('tr').forEach((tr) => {
          const s = num(tr.querySelector('.in-sistem').value);
          const f = num(tr.querySelector('.in-fisik').value);
          const n = num(tr.querySelector('.nominal').dataset.value);
          const d = f - s;
          total.sistem += s;
          total.fisik += f;
          total.selisih += d;
          total.nominal += n;
          total.jumlah += 1;
          if (d !== 0) total.beda += 1;
          const tujuan = d > 0 ? plus : d < 0 ? minus : null;
          if (tujuan) {
            tujuan.sistem += s;
            tujuan.fisik += f;
            tujuan.selisih += d;
            tujuan.nominal += n;
            tujuan.jumlah += 1;
          }
        });

        const warna = (v) => (v === 0 ? '' : v < 0 ? 'minus' : 'plus');
        const angka = (v) => (v > 0 ? '+' + v : String(v));

        // Tfoot jadi SATU baris: total barang + rincian plus/minus digabung
        // di kolom Keterangan (tidak lagi 2-3 baris terpisah).
        const baris = (label, a, ket, ketCls) => {
          const tr = document.createElement('tr');
          const tdLabel = cell(label);
          tdLabel.colSpan = 5;
          tr.append(
            tdLabel,
            cell(String(a.sistem), 'c-num'),
            cell(String(a.fisik), 'c-num'),
            cell(angka(a.selisih), 'c-num selisih ' + warna(a.selisih)),
            cell('-', 'c-num'),
            cell(rupiah(a.nominal), 'nominal c-total ' + warna(a.nominal)),
            cell(ket, 'keterangan ' + (ketCls || ''))
          );
          return tr;
        };

        const rincian = [];
        if (plus.jumlah) rincian.push(plus.jumlah + ' PLUS');
        if (minus.jumlah) rincian.push(minus.jumlah + ' MINUS (' + rupiah(Math.abs(minus.nominal)) + ')');

        barangFoot.innerHTML = '';
        barangFoot.appendChild(
          baris(
            'TOTAL ' + total.jumlah + ' BARANG',
            total,
            rincian.length ? rincian.join(' · ') : total.beda ? total.beda + ' BARANG BEDA' : 'SEMUA SESUAI',
            minus.jumlah && !plus.jumlah ? 'minus' : plus.jumlah && !minus.jumlah ? 'plus' : ''
          )
        );
      };

      const renderBarang = (barang) => {
        const q = cariBarang.value.trim().toLowerCase();
        const tampil = barang.filter((row) =>
          !q ||
          String(row.kode || '').toLowerCase().includes(q) ||
          String(row.name || '').toLowerCase().includes(q)
        );
        barangBody.innerHTML = '';
        tampil.forEach((row, i) => {
          const sistem = num(row.stok_sistem);
          const tr = document.createElement('tr');
          tr.dataset.id = row.id;
          tr.append(cell(String(i + 1), 'c-no'), cell(tanggalSo, 'c-tgl'));

          // Kolom foto produk dihapus (data foto tetap diambil dari DB,
          // tidak dipakai untuk render di halaman ini).

          const tdNama = document.createElement('td');
          tdNama.className = 'c-nama';
          const potong = document.createElement('div');
          potong.className = 'potong';
          potong.textContent = up(row.name);
          potong.title = up(row.name);
          tdNama.appendChild(potong);
          tr.append(cellKode(row.kode), tdNama, cell(row.satuan || 'PCS', 'c-satuan'));

          ['sistem', 'fisik'].forEach((jenis) => {
            const td = document.createElement('td');
            td.className = 'c-num';
            const input = document.createElement('input');
            input.type = 'number';
            input.min = '0';
            input.inputMode = 'numeric';
            input.className = 'cell-input in-' + jenis;
            input.value = String(
              jenis === 'sistem' ? sistem : num(row.stok_fisik)
            );
            input.setAttribute('aria-label', (jenis === 'sistem' ? 'Onhand' : 'Stok Fisik') + ' ' + (row.kode || row.name || i + 1));
            // Onhand & Stok Fisik = data, hanya boleh diubah dari ADMIN.
            // Di halaman SO keduanya read-only supaya tidak ada input yang
            // bisa menulis ke database; hitungan selisih tetap jalan.
            input.readOnly = true;
            input.tabIndex = -1;
            input.classList.add('baca');
            input.title = (jenis === 'sistem' ? 'Onhand' : 'Stok Fisik') + ' hanya bisa diubah di menu ADMIN';
            input.addEventListener('input', () => {
              hitungBaris(tr);
              hitungTotal();
            });
            td.appendChild(input);
            tr.appendChild(td);
          });

          tr.appendChild(cell('0', 'selisih'));

          const hpp = num(row.hpp);
          const tdHpp = cell(rupiah(hpp), 'c-num');
          tdHpp.classList.add('hpp');
          tdHpp.dataset.value = String(hpp);
          tr.appendChild(tdHpp);

          tr.appendChild(cell('Rp 0', 'nominal c-total'));
          tr.appendChild(cell('Sesuai', 'keterangan'));

          hitungBaris(tr);
          barangBody.appendChild(tr);
        });
        barangEmpty.hidden = tampil.length > 0;
        barangEmpty.textContent = q
          ? 'Tidak ada barang yang cocok dengan "' + cariBarang.value.trim() + '".'
          : 'Belum ada barang. Tambah lewat menu ADMIN.';
        document.getElementById('barangWrap').hidden = barang.length === 0;
        hitungTotal();
      };

      cariBarang.addEventListener('input', () => load());


      const pilihMenuOtomatis = async () => {
        const { data, error } = await supabase.from('so_menus').select('id').order('name').limit(1);
        if (error || !data || !data.length) {
          barangWrap.hidden = true;
          barangEmpty.hidden = false;
          barangEmpty.textContent = 'Belum ada menu SO. Buat dulu di menu ADMIN.';
          return;
        }
        menuId = data[0].id;
        history.replaceState(null, '', '?m=' + menuId);
      };

      const load = async () => {
        if (!menuId) await pilihMenuOtomatis();
        if (!menuId) return;
        const { data: menu, error: errMenu } = await supabase
          .from('so_menus')
          .select('id, name')
          .eq('id', menuId)
          .single();
        if (errMenu || !menu) {
          console.warn('Menu tidak ditemukan, pindah ke menu pertama');
          menuId = 0;
          await pilihMenuOtomatis();
          if (!menuId) return;
          return load();
        }
        // Nama menu tidak lagi jadi judul di atas (kotak search sudah di paling
        // atas). Sekarang cuma jadi petunjuk di placeholder kotak search.
        cariBarang.placeholder = 'Cari di ' + up(menu.name) + ' — PLU / Nama barang';
        tanggalSo = formatTanggal(new Date());

        const { data: barang, error: errBarang } = await supabase
          .from('stock_products')
          .select('id, kode, name, satuan, stok_sistem, stok_fisik, hpp')
          .eq('menu_id', menuId)
          .order('kode');
        if (errBarang) {
          const ulang = await supabase
            .from('stock_products')
            .select('id, kode, name, satuan, stok_sistem, hpp')
            .eq('menu_id', menuId)
            .order('kode');
          if (ulang.error) {
            console.error('Gagal memuat barang:', ulang.error.message);
            barangBody.innerHTML = '';
            barangEmpty.hidden = false;
            barangEmpty.textContent = 'Gagal memuat barang: ' + ulang.error.message;
            return;
          }
          renderBarang(ulang.data || []);
          loadRiwayat();
          return;
        }

        renderBarang(barang || []);
        loadRiwayat();
      };

      // Fungsi simpanBaris + barisOpname dihapus: tidak ada lagi input yang
      // bisa diedit di halaman SO, jadi tidak ada yang perlu di-commit ke
      // stock_opname maupun stock_products dari sini.

      // Waktu ringkas satu baris: "24/10 14:30" (tanpa tahun, tanpa detik).
      const formatWaktu = (value) => {
        if (!value) return '-';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return '-';
        const pad = (n) => String(n).padStart(2, '0');
        return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      };

      const loadRiwayat = async () => {
        if (!menuId) return;
        const { data, error } = await supabase
          .from('stock_opname')
          .select('product_plu, selisih, total_nominal, opname_date, created_at')
          .eq('menu_id', menuId)
          .order('id', { ascending: false })
          .limit(20);
        if (error) {
          console.error('Gagal memuat riwayat:', error.message);
          return;
        }
        const rows = data || [];
        riwayatBody.innerHTML = '';
        rows.forEach((row) => {
          const tr = document.createElement('tr');
          const selisih = num(row.selisih);
          tr.append(
            cell(formatWaktu(row.opname_date || row.created_at)),
            cell(row.product_plu || '-', 'kode'),
            cell(selisih > 0 ? '+' + selisih : String(selisih), 'c-num selisih ' + (selisih === 0 ? '' : selisih < 0 ? 'minus' : 'plus')),
            cell(rupiah(row.total_nominal), 'c-total ' + (num(row.total_nominal) === 0 ? '' : num(row.total_nominal) < 0 ? 'minus' : 'plus'))
          );
          riwayatBody.appendChild(tr);
        });
        riwayatCount.textContent = rows.length ? '(' + rows.length + ')' : '';
        riwayatWrap.hidden = !riwayatTerbuka || rows.length === 0;
        riwayatEmpty.hidden = riwayatTerbuka || rows.length > 0;
      };
      load();
    </script>
  </body>
</html>
