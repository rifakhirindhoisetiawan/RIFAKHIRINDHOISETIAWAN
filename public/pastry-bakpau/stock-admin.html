<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Admin - Stok Opname</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --text: #1f2937;
        --muted: #9ca3af;
        --line: #e5e7eb;
        --line-2: #d9dde3;
        --surface: #f3f4f6;
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --soft: #eef2ff;
        --soft-2: #c7d2fe;
        --danger: #ef4444;
        --row-h: 36px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #ffffff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text);
        min-height: 100vh;
        max-width: 960px;
        margin: 0 auto;
        padding: 14px 18px 40px;
        padding-top: max(14px, env(safe-area-inset-top));
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .sec + .sec {
        margin-top: 26px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .count {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
      }

      input {
        width: 100%;
        min-width: 0;
        height: var(--row-h);
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 10px;
        text-transform: uppercase;
      }

      input[type="number"] {
        text-transform: none;
      }

      input::placeholder {
        color: #c3c8d1;
      }

      input:focus {
        outline: none;
        background: #fff;
        border-color: #888;
      }

      .grow {
        flex: 1;
        min-width: 0;
      }

      .btn,
      .ico {
        width: 32px;
        height: 32px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        line-height: 1;
        color: #ffffff;
        background: #6366f1;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        flex-shrink: 0;
        outline: none;
        transition: all 0.15s ease;
      }

      .btn {
        font-size: 17px;
      }

      .menu-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
      }

      .menu-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .menu-item .nama {
        flex: 1;
        min-width: 0;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .menu-item.on .nama {
        color: var(--primary-dark);
        font-weight: 800;
        background: var(--surface);
        border-color: var(--line-2);
      }

      .table-wrap {
        overflow-x: auto;
        overflow-y: hidden;
        border: 1px solid #ddd;
        border-radius: 10px;
        -webkit-overflow-scrolling: touch;
        background: #fff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .table-wrap::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      .daftar-wrap {
        overflow: hidden;
        border-color: #e5e7eb;
      }

      .menu-tulis {
        flex-wrap: nowrap;
        margin-bottom: 0;
      }

      .menu-tulis .table-wrap {
        flex: 1;
        min-width: 0;
      }

      table.daftar {
        font-size: 12px;
      }

      table.daftar td {
        height: auto;
        padding: 8px 12px;
        font-weight: 700;
        color: var(--text);
      }

      table.daftar tr + tr td {
        border-top: 1px solid #eeeeee;
        border-bottom: 0;
      }

      table.daftar .tulis-in {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      table.daftar input {
        flex: 1;
        min-width: 0;
        height: 24px;
        padding: 0;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        background: transparent;
        border: none;
        border-radius: 0;
        text-transform: uppercase;
      }

      table.daftar input::placeholder {
        color: #c3c8d1;
      }

      table.daftar input:focus {
        outline: none;
        background: transparent;
        border-color: transparent;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .daftar {
        min-width: 180px;
      }

      .barang {
        min-width: 620px;
      }

      .c-nama {
        max-width: 340px;
      }

      .potong {
        max-width: 340px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f9f9f9;
        color: var(--muted);
        font-size: clamp(10px, 2.6vw, 12px);
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-align: left;
        height: 34px;
        padding: 0 12px;
        border-bottom: 1px solid #e5e7eb;
        white-space: nowrap;
      }

      tbody td {
        height: 44px;
        padding: 0 10px;
        border-bottom: 1px solid #f1f2f4;
        vertical-align: middle;
        transition: background 0.5s ease;
      }

      tbody td.ok {
        background: #ecfdf5;
      }

      .tambah td {
        background: #fafbfc;
      }

      .tambah:hover td {
        background: #fafbfc;
      }

      .tambah .auto {
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.3px;
      }

      .tambah .btn {
        margin: 0 auto;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover td {
        background: #fafafa;
      }

      .kode-seri {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .qr-btn {
        width: 26px;
        height: 26px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: inherit;
        font-size: 12px;
        color: #ffffff;
        background: #6366f1;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        flex-shrink: 0;
        transition: all 0.15s ease;
      }

      .qr-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      .c-kode {
        width: 128px;
      }

      .c-no {
        width: 34px;
        text-align: center;
        color: var(--muted);
      }

      .c-satuan {
        width: 58px;
      }

      .c-hpp {
        width: 112px;
        text-align: right;
        white-space: nowrap;
      }

      .c-aksi {
        width: 96px;
        position: sticky;
        right: 0;
        background: #ffffff;
        box-shadow: -7px 0 9px -7px rgba(17, 24, 39, 0.22);
      }

      thead th.c-aksi {
        z-index: 2;
        background: #f9f9f9;
      }

      tbody tr.ok td.c-aksi {
        background: #ecfdf5;
      }

      tbody tr.sinkron td {
        background: #eff6ff;
      }

      tfoot td {
        position: sticky;
        bottom: 0;
        z-index: 1;
        background: #f9f9f9;
        border-top: 1px solid #e5e7eb;
        font-weight: 800;
        font-size: 13px;
        height: 44px;
        padding: 0 10px;
        white-space: nowrap;
      }

      tfoot tr.f-plus td {
        background: #f0fdf4;
      }

      tfoot tr.f-minus td {
        background: #fef2f2;
      }

      tfoot tr.f-plus td:first-child,
      tfoot tr.f-minus td:first-child {
        position: sticky;
        left: 0;
      }

      .kode {
        color: var(--primary);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: clamp(12px, 3.2vw, 14px);
        font-weight: 800;
        white-space: nowrap;
      }

      .empty {
        padding: 26px 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }

      .acts {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }

      .selisih {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .selisih.minus {
        color: #dc2626;
      }

      .selisih.plus {
        color: #16a34a;
      }

      .c-ket {
        max-width: 170px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ket.minus {
        color: #dc2626;
      }

      .ket.plus {
        color: #16a34a;
      }

      .cari {
        width: 100%;
        text-transform: none;
      }

      .cari::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }

      .c-num {
        width: 84px;
        text-align: right;
      }

      .cell-input {
        width: 100%;
        min-width: 0;
        height: 30px;
        padding: 0 8px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 7px;
        cursor: text;
        -moz-appearance: textfield;
        appearance: textfield;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .cell-input:hover {
        background: #f9f9f9;
        border-color: #e5e7eb;
      }

      .cell-input:focus {
        outline: none;
        background: #ffffff;
        border-color: var(--primary);
      }

      .cell-input.teks {
        text-align: left;
        font-size: 13px;
      }

      .cell-input::-webkit-outer-spin-button,
      .cell-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .cell-input.mono {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        font-weight: 700;
        color: #4f46e5;
        letter-spacing: -0.2px;
      }

      .kode-btn {
        width: 100%;
        padding: 5px 6px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.2px;
        color: #4f46e5;
        text-align: left;
        background: transparent;
        border: 1px dashed transparent;
        border-radius: 6px;
        cursor: pointer;
      }

      .kode-btn:active {
        background: var(--soft);
        border-color: var(--soft-2);
      }

      .c-foto {
        width: 56px;
      }

      .lightbox {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 40;
        max-width: calc(100vw - 32px);
        padding: 12px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
      }

      .lightbox[hidden] {
        display: none;
      }

      .lightbox-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .lightbox img {
        max-width: min(76vw, 300px);
        max-height: 46vh;
        border-radius: 8px;
        object-fit: contain;
      }

      .lightbox .qr {
        width: min(56vw, 196px);
        height: min(56vw, 196px);
      }

      .lightbox-text {
        color: var(--text);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.6px;
      }

      .mode {
        color: var(--primary-dark);
        font-size: 10px;
        font-weight: 800;
        white-space: nowrap;
      }

    </style>
  </head>
  <body>
    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox-box">
        <canvas class="qr" id="lightboxQr" width="220" height="220" hidden></canvas>
        <img id="lightboxImg" alt="preview foto" hidden />
        <div class="lightbox-text" id="lightboxText"></div>
      </div>
    </div>
    <section class="sec">
      <div class="row menu-tulis">
        <div class="table-wrap daftar-wrap grow">
          <table class="daftar">
            <tbody>
              <tr>
                <td class="tulis">
                  <div class="tulis-in">
                    <input
                      type="text"
                      id="mName"
                      placeholder="SO ROTI"
                      autocomplete="off"
                      aria-label="Nama menu SO"
                    />
                    <span class="mode" id="mMode"></span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <button class="btn" type="button" id="mAdd" title="Tambah menu" aria-label="Tambah menu">+</button>
      </div>
      <div class="menu-list" id="menuList"></div>
      <div class="empty" id="menuEmpty" hidden>Belum ada menu SO.</div>
    </section>

    <section class="sec" id="barangSec" hidden>
      <div class="row">
        <input
          class="cari"
          type="search"
          id="cariBarang"
          placeholder="Cari PLU / Nama barang"
          autocomplete="off"
          aria-label="Cari barang"
        />
      </div>
      <div class="table-wrap" id="barangWrap">
        <table class="barang">
          <thead>
            <tr>
              <th class="c-no">No</th>
              <th class="c-kode">PLU</th>
              <th>Nama Barang</th>
              <th class="c-satuan">Satuan</th>
              <th class="c-num">Onhand</th>
              <th class="c-num">Fisik</th>
              <th class="c-hpp">HPP</th>
              <th class="c-num">Selisih</th>
              <th>Keterangan</th>
              <th class="c-foto">Foto</th>
              <th class="c-aksi"></th>
            </tr>
          </thead>
          <tbody class="tambah">
            <tr>
              <td class="c-no"></td>
              <td class="c-kode"><span class="auto">otomatis</span></td>
              <td class="c-nama">
                <input class="cell-input teks" type="text" id="bName" size="1" placeholder="Nama Barang" autocomplete="off" />
              </td>
              <td class="c-satuan">
                <input class="cell-input teks" type="text" id="bSatuan" size="1" placeholder="Satuan" value="PCS" autocomplete="off" />
              </td>
              <td class="c-num">
                <input class="cell-input" type="number" id="bOnhand" min="0" value="0" inputmode="numeric" />
              </td>
              <td class="c-num">
                <input class="cell-input" type="number" id="bFisik" min="0" value="0" inputmode="numeric" />
              </td>
              <td class="c-hpp">
                <input class="cell-input" type="number" id="bHpp" min="0" value="0" inputmode="decimal" />
              </td>
              <td class="c-num selisih" id="bSelisih">0</td>
              <td class="c-ket" id="bKet">Sesuai</td>
              <td class="c-foto"></td>
              <td class="c-aksi">
                <button class="btn" type="button" id="bAdd" title="Tambah barang" aria-label="Tambah barang">+</button>
              </td>
            </tr>
          </tbody>
          <tbody id="barangBody"></tbody>
          <tfoot id="barangFoot"></tfoot>
        </table>
      </div>
      <div class="empty" id="barangEmpty" hidden>Belum ada barang di menu ini.</div>
      <input accept="image/*" id="fotoInput" type="file" hidden />
    </section>

    <script type="module">
      import { supabase } from '../../js/supabase.js';

      const MENU_KEY = 'so_active_menu';

      const mName = document.getElementById('mName');
      const mAdd = document.getElementById('mAdd');
      const menuList = document.getElementById('menuList');
      const menuEmpty = document.getElementById('menuEmpty');
      const barangSec = document.getElementById('barangSec');
      const bName = document.getElementById('bName');
      const bSatuan = document.getElementById('bSatuan');
      const bOnhand = document.getElementById('bOnhand');
      const bFisik = document.getElementById('bFisik');
      const bHpp = document.getElementById('bHpp');
      const bSelisih = document.getElementById('bSelisih');
      const bKet = document.getElementById('bKet');
      const mMode = document.getElementById('mMode');
      const barangBody = document.getElementById('barangBody');
      const barangEmpty = document.getElementById('barangEmpty');
      const barangWrap = document.getElementById('barangWrap');
      const barangFoot = document.getElementById('barangFoot');
      const bAdd = document.getElementById('bAdd');
      const cariBarang = document.getElementById('cariBarang');
      const fotoInput = document.getElementById('fotoInput');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxQr = document.getElementById('lightboxQr');
      const lightboxText = document.getElementById('lightboxText');

      const BUCKET = 'stock-foto';
      let fotoTarget = null;
      let fotoData = [];

      const dariUrl = Number(new URLSearchParams(location.search).get('m')) || null;
      let menuAktif = dariUrl || Number(localStorage.getItem(MENU_KEY)) || null;
      let menuTerpilih = null;
      let editMenuId = null;
      let editBarangId = null;

      const up = (value) => String(value ?? '').toUpperCase();
      const num = (value) => {
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
      };
      const formatRupiah = new Intl.NumberFormat('id-ID', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2,
      });
      const rupiah = (value) => 'Rp ' + formatRupiah.format(num(value));

      const cell = (text, cls) => {
        const td = document.createElement('td');
        td.textContent = text;
        if (cls) td.className = cls;
        return td;
      };

      const cellPotong = (text, cls) => {
        const td = document.createElement('td');
        if (cls) td.className = cls;
        const div = document.createElement('div');
        div.className = 'potong';
        div.textContent = text;
        td.appendChild(div);
        return td;
      };


      const setMode = () => {
        mMode.textContent = editMenuId ? 'mode edit' : '';
        mAdd.textContent = editMenuId ? '✓' : '+';
        mAdd.title = editMenuId ? 'Simpan perubahan' : 'Tambah menu';
        mAdd.setAttribute('aria-label', mAdd.title);
      };

      const stopEdit = (clearMenu) => {
        editMenuId = null;
        if (clearMenu) mName.value = '';
        bName.value = '';
        bSatuan.value = 'PCS';
        bOnhand.value = '0';
        bFisik.value = '0';
        bHpp.value = '0';
        bSelisih.textContent = '0';
        bSelisih.className = 'c-num selisih';
        bKet.textContent = 'Sesuai';
        bKet.className = 'c-ket ket';
        setMode();
      };

      const renderMenu = (menus) => {
        menuList.innerHTML = '';
        menus.forEach((menu) => {
          const item = document.createElement('div');
          item.className = 'menu-item' + (menu.id === menuAktif ? ' on' : '');

          const nama = document.createElement('div');
          nama.className = 'nama';
          nama.textContent = up(menu.name);
          item.appendChild(nama);

          const edit = document.createElement('button');
          edit.type = 'button';
          edit.className = 'ico';
        edit.textContent = '✎';
          edit.title = 'Edit';
          edit.setAttribute('aria-label', 'Edit ' + menu.name);
          edit.addEventListener('click', (e) => {
            e.stopPropagation();
            editMenuId = menu.id;
            mName.value = up(menu.name);
            mName.focus();
            setMode();
          });

          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'ico';
        del.textContent = '✕';
          del.title = 'Hapus';
          del.setAttribute('aria-label', 'Hapus ' + menu.name);
          del.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (!confirm('Hapus menu ' + menu.name + '?\nSemua barang di menu ini ikut terhapus.')) return;
            const { error } = await supabase.from('so_menus').delete().eq('id', menu.id);
            if (error) {
              console.error('Hapus menu gagal:', error.message);
              return;
            }
            if (menuAktif === menu.id) {
              menuAktif = null;
              localStorage.removeItem(MENU_KEY);
              stopEdit(true);
            }
            loadMenus();
          });

          item.append(edit, del);
          item.addEventListener('click', () => pilihMenu(menu.id));
          menuList.appendChild(item);
        });
        menuEmpty.hidden = menus.length > 0;
      };

      const buatKode = (namaMenu, kodeTerpakai) => {
        const prefix = (up(namaMenu).match(/[A-Z]/g) || ['PRD']).slice(0, 3).join('') || 'PRD';
        let no = 1;
        let kode = prefix + '-' + String(no).padStart(3, '0');
        while (kodeTerpakai.has(kode)) {
          no++;
          kode = prefix + '-' + String(no).padStart(3, '0');
        }
        return kode;
      };

      const simpanSel = (row, kolom, judul, nilai) =>
        supabase
          .from('stock_products')
          .update({ [kolom]: nilai })
          .eq('id', row.id);

      const tandaiOke = (td, tr) => {
        td.classList.add('ok');
        setTimeout(() => td.classList.remove('ok'), 1200);
        if (!tr) return;
        tr.classList.add('ok');
        setTimeout(() => tr.classList.remove('ok'), 1200);
      };

      const inputAngka = (row, kolom, judul, sesudah) => {
        const td = document.createElement('td');
        td.className = kolom === 'hpp' ? 'c-hpp' : 'c-num';
        const input = document.createElement('input');
        input.type = 'number';
        input.size = 1;
        input.min = '0';
        input.step = kolom === 'hpp' ? 'any' : '1';
        input.inputMode = kolom === 'hpp' ? 'decimal' : 'numeric';
        input.className = 'cell-input';
        input.value = String(num(row[kolom]));
        input.title = judul + ' ' + (row.kode || row.name);
        input.setAttribute('aria-label', input.title);

        const simpan = async () => {
          const mentah = num(input.value);
          const nilai = kolom === 'hpp' ? mentah : Math.round(mentah);
          if (nilai === num(row[kolom])) return;
          const { error } = await simpanSel(row, kolom, judul, nilai);
          if (error) {
            console.error('Gagal update ' + judul + ':', error.message);
            input.value = String(num(row[kolom]));
            return;
          }
          row[kolom] = nilai;
          input.value = String(nilai);
          tandaiOke(td, tr);
          if (sesudah) sesudah(nilai);
        };

        input.addEventListener('change', simpan);
        input.addEventListener('blur', simpan);
        input.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          input.blur();
        });

        td.appendChild(input);
        return td;
      };

      const sinkronTimer = new Map();

      const tulisFisik = async (row, nilai, tr) => {
        const { error } = await supabase
          .from('stock_products')
          .update({ stok_fisik: Math.round(num(nilai)) })
          .eq('id', row.id);
        if (error) {
          console.error('Gagal sinkron stok fisik:', error.message);
          return false;
        }
        row.stok_fisik = Math.round(num(nilai));
        if (tr) {
          tr.classList.add('sinkron');
          setTimeout(() => tr.classList.remove('sinkron'), 900);
        }
        return true;
      };

      const sinkronFisik = (row, nilai, tr, langsung) => {
        if (!row.id) return;
        clearTimeout(sinkronTimer.get(row.id));
        if (langsung) {
          tulisFisik(row, nilai, tr);
          return;
        }
        sinkronTimer.set(
          row.id,
          setTimeout(() => tulisFisik(row, nilai, tr), 500)
        );
      };

      const keteranganOf = (selisih) => {
        if (selisih === 0) return { text: 'Sesuai', cls: '' };
        if (selisih < 0) return { text: 'Hilang / Rusak / Expired', cls: 'minus' };
        return { text: 'Beda Input / Selisih Terima', cls: 'plus' };
      };

      const hitungSelisih = (tr) => {
        const td = tr.querySelector('.selisih');
        if (!td) return;
        const inFisik = tr.querySelector('.in-fisik');
        const fisik = inFisik ? num(inFisik.value) : 0;
        const sistem = num(tr.dataset.onhand);
        const selisih = fisik - sistem;
        td.textContent = selisih > 0 ? '+' + selisih : String(selisih);
        td.className = 'c-num selisih ' + (selisih === 0 ? '' : selisih < 0 ? 'minus' : 'plus');
        const tdKet = tr.querySelector('.ket');
        if (tdKet) {
          const ket = keteranganOf(selisih);
          tdKet.textContent = ket.text;
          tdKet.className = 'c-ket ket ' + ket.cls;
        }
      };

      const inputFisik = (row, tr) => {
        const td = document.createElement('td');
        td.className = 'c-num';
        const input = document.createElement('input');
        input.type = 'number';
        input.size = 1;
        input.min = '0';
        input.step = '1';
        input.inputMode = 'numeric';
        input.className = 'cell-input in-fisik';
        input.value = String(num(row.stok_fisik));
        input.title = 'Stok fisik ' + (row.kode || row.name);
        input.setAttribute('aria-label', input.title);
        input.addEventListener('input', () => {
          hitungSelisih(tr);
          sinkronFisik(row, input.value, tr, false);
        });
        input.addEventListener('change', () => sinkronFisik(row, input.value, tr, true));
        input.addEventListener('blur', () => sinkronFisik(row, input.value, tr, true));
        td.appendChild(input);
        return td;
      };

      const inputTeks = (row, kolom, judul, cls, mono) => {
        const td = document.createElement('td');
        if (cls) td.className = cls;
        const input = document.createElement('input');
        input.type = 'text';
        input.size = 1;
        input.className = 'cell-input teks' + (mono ? ' mono' : '');
        input.value = up(row[kolom] || '');
        input.title = judul + ' ' + (row.kode || row.name);
        input.setAttribute('aria-label', input.title);

        const simpan = async () => {
          const nilai = up(input.value.trim());
          if (!nilai) {
            input.value = up(row[kolom] || '');
            return;
          }
          if (nilai === up(row[kolom] || '')) return;
          const { error } = await simpanSel(row, kolom, judul, nilai);
          if (error) {
            console.error('Gagal update ' + judul + ':', error.message);
            input.value = up(row[kolom] || '');
            return;
          }
          row[kolom] = nilai;
          input.value = nilai;
          tandaiOke(td, td.closest('tr'));
        };

        input.addEventListener('change', simpan);
        input.addEventListener('blur', simpan);
        input.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          input.blur();
        });

        td.appendChild(input);
        return td;
      };

      const kodeTeks = (row) => {
        const td = document.createElement('td');
        td.className = 'c-kode';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'kode-btn';
        btn.textContent = row.kode || '-';
        btn.title = 'Lihat QR ' + (row.kode || '');
        btn.setAttribute('aria-label', btn.title);
        btn.addEventListener('click', () => lihatQr(row.kode));
        td.appendChild(btn);
        return td;
      };

      const kodeEdit = (row) => {
        const td = document.createElement('td');
        td.className = 'c-kode kode-seri';
        td.appendChild(inputTeks(row, 'kode', 'PLU', 'dalem', true).firstChild);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'qr-btn';
        btn.textContent = '▦';
        btn.title = 'Lihat QR ' + (row.kode || '');
        btn.setAttribute('aria-label', btn.title);
        btn.addEventListener('click', () => lihatQr(row.kode));
        td.appendChild(btn);
        return td;
      };

      const cocokCari = (row, q) => {
        if (!q) return true;
        return (
          String(row.kode || '').toLowerCase().includes(q) ||
          String(row.name || '').toLowerCase().includes(q)
        );
      };

      const renderBarang = (barang) => {
        fotoData = barang;
        const q = cariBarang.value.trim().toLowerCase();
        const tampil = barang.filter((row) => cocokCari(row, q));
        barangBody.innerHTML = '';
        tampil.forEach((row, i) => {
          const tr = document.createElement('tr');
          const modeEdit = editBarangId === row.id;
          tr.dataset.id = row.id;
          tr.dataset.onhand = String(num(row.stok_sistem));

          tr.append(cell(String(i + 1), 'c-no'));

          if (modeEdit) {
            tr.append(
              kodeEdit(row),
              inputTeks(row, 'name', 'Nama barang', 'c-nama'),
              inputTeks(row, 'satuan', 'Satuan', 'c-satuan'),
              inputAngka(row, 'stok_sistem', 'Onhand', (nilai) => {
                tr.dataset.onhand = String(nilai);
                hitungSelisih(tr);
              }),
              inputFisik(row, tr),
              inputAngka(row, 'hpp', 'HPP')
            );
          } else {
            tr.append(
              kodeTeks(row),
              cellPotong(up(row.name), 'c-nama'),
              cell(row.satuan || 'PCS', 'c-satuan'),
              cell(String(num(row.stok_sistem)), 'c-num'),
              inputFisik(row, tr),
              cell(rupiah(row.hpp), 'c-hpp')
            );
          }

          const tdSelisih = document.createElement('td');
          tdSelisih.className = 'c-num selisih';
          const tdKet = document.createElement('td');
          tdKet.className = 'c-ket ket';
          tr.append(tdSelisih, tdKet);
          hitungSelisih(tr);

          const edit = document.createElement('button');
          edit.type = 'button';
          edit.className = 'ico';
          edit.textContent = modeEdit ? '✓' : '✎';
          edit.title = modeEdit ? 'Selesai edit' : 'Edit';
          edit.setAttribute('aria-label', edit.title + ' ' + (row.kode || row.name));
          edit.addEventListener('click', () => {
            const aktif = document.activeElement;
            if (aktif && aktif.classList && aktif.classList.contains('cell-input')) aktif.blur();
            editBarangId = modeEdit ? null : row.id;
            renderBarang(fotoData);
          });

          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'ico';
        del.textContent = '✕';
          del.title = 'Hapus barang';
          del.setAttribute('aria-label', 'Hapus ' + (row.kode || row.name));
          del.addEventListener('click', async () => {
            if (!confirm('Hapus barang ' + (row.kode || row.name) + '?')) return;
            const { error } = await supabase.from('stock_products').delete().eq('id', row.id);
            if (error) {
              console.error('Hapus barang gagal:', error.message);
              return;
            }
            if (editBarangId === row.id) editBarangId = null;
            loadBarang();
          });

          const tdFoto = document.createElement('td');
          tdFoto.className = 'c-foto';
          tdFoto.appendChild(buatFoto(row, modeEdit));
          const tdAct = document.createElement('td');
          tdAct.className = 'c-aksi';
          const wrap = document.createElement('div');
          wrap.className = 'acts';
          wrap.append(edit, del);
          tdAct.appendChild(wrap);
          tr.append(tdFoto, tdAct);
          barangBody.appendChild(tr);
        });
        renderTotal(tampil);
        barangEmpty.hidden = tampil.length > 0;
        barangEmpty.textContent = q
          ? 'Tidak ada barang yang cocok dengan "' + cariBarang.value.trim() + '".'
          : 'Belum ada barang di menu ini.';
        barangWrap.hidden = barang.length === 0;
      };

      const renderTotal = (tampil) => {
        const total = { onhand: 0, fisik: 0, selisih: 0, jumlah: 0, beda: 0 };
        const plus = { onhand: 0, fisik: 0, selisih: 0, jumlah: 0 };
        const minus = { onhand: 0, fisik: 0, selisih: 0, jumlah: 0 };

        tampil.forEach((row) => {
          const o = num(row.stok_sistem);
          const f = num(row.stok_fisik);
          const d = f - o;
          total.onhand += o;
          total.fisik += f;
          total.selisih += d;
          total.jumlah += 1;
          if (d !== 0) total.beda += 1;
          const tujuan = d > 0 ? plus : d < 0 ? minus : null;
          if (tujuan) {
            tujuan.onhand += o;
            tujuan.fisik += f;
            tujuan.selisih += d;
            tujuan.jumlah += 1;
          }
        });

        const warna = (v) => (v === 0 ? '' : v < 0 ? 'minus' : 'plus');
        const angka = (v) => (v > 0 ? '+' + v : String(v));

        const baris = (label, a, cls, ket) => {
          const tr = document.createElement('tr');
          if (cls) tr.className = cls;
          const tdLabel = cell(label);
          tdLabel.colSpan = 4;
          tr.append(
            tdLabel,
            cell(String(a.onhand), 'c-num'),
            cell(String(a.fisik), 'c-num'),
            cell('-', 'c-hpp'),
            cell(angka(a.selisih), 'c-num selisih ' + warna(a.selisih)),
            cell(ket, 'c-ket ket ' + (cls === 'f-plus' ? 'plus' : cls === 'f-minus' ? 'minus' : '')),
            cell(''),
            cell('')
          );
          return tr;
        };

        barangFoot.innerHTML = '';
        barangFoot.appendChild(
          baris('TOTAL ' + total.jumlah + ' BARANG', total, '', total.beda ? total.beda + ' BARANG BEDA' : 'SEMUA SESUAI')
        );
        if (plus.jumlah) {
          barangFoot.appendChild(baris('TOTAL PLUS', plus, 'f-plus', plus.jumlah + ' BARANG PLUS'));
        }
        if (minus.jumlah) {
          barangFoot.appendChild(baris('TOTAL MINUS', minus, 'f-minus', minus.jumlah + ' BARANG MINUS'));
        }
      };

      cariBarang.addEventListener('input', () => {
        if (fotoData.length) renderBarang(fotoData);
      });

      const pilihFoto = (id) => {
        fotoTarget = id;
        fotoInput.value = '';
        fotoInput.click();
      };

      let qrLib = null;
      const muatQr = async () => {
        if (!qrLib) {
          qrLib = await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm');
        }
        return qrLib;
      };

      const lihatQr = async (plu) => {
        const teks = String(plu || '').trim();
        if (!teks) return;
        try {
          const QR = await muatQr();
          lightboxImg.hidden = true;
          lightboxImg.removeAttribute('src');
          lightboxQr.hidden = false;
          await QR.toCanvas(lightboxQr, teks, {
            width: 220,
            margin: 1,
            color: { dark: '#111827', light: '#ffffff' },
          });
          lightboxText.textContent = teks;
          lightbox.hidden = false;
        } catch (err) {
          console.error('Gagal membuat QR:', err);
        }
      };

      const lihatFoto = (row) => {
        if (!row.foto_url) {
          return;
        }
        lightboxQr.hidden = true;
        lightboxImg.hidden = false;
        lightboxImg.src = row.foto_url;
        lightboxImg.alt = row.name || row.kode || 'foto';
        lightboxText.textContent = row.kode || row.name || '';
        lightbox.hidden = false;
      };

      const tutupFoto = () => {
        lightbox.hidden = true;
        lightboxImg.removeAttribute('src');
        lightboxText.textContent = '';
      };

      document.addEventListener('click', (e) => {
        if (lightbox.hidden) return;
        if (lightbox.contains(e.target)) return;
        tutupFoto();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !lightbox.hidden) tutupFoto();
      });

      const buatFoto = (row, modeEdit) => {
        const label = row.kode || row.name || '';
        const td = document.createElement('td');
        td.className = 'c-foto';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ico';
        if (modeEdit) {
          btn.textContent = '↑';
          btn.title = row.foto_url ? 'Ganti foto ' + label : 'Upload foto ' + label;
          btn.addEventListener('click', () => pilihFoto(row.id));
        } else {
          btn.textContent = '⊙';
          btn.title = row.foto_url ? 'Lihat foto ' + label : 'Belum ada foto ' + label;
          btn.addEventListener('click', () => lihatFoto(row));
        }
        btn.setAttribute('aria-label', btn.title);
        td.appendChild(btn);
        return td;
      };

      fotoInput.addEventListener('change', async () => {
        const file = fotoInput.files && fotoInput.files[0];
        const id = fotoTarget;
        fotoTarget = null;
        if (!file || !id) return;
        const row = fotoData.find((r) => r.id === id);
        if (!row) return;

        const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase()).replace(/[^a-z0-9]/g, '') || 'jpg';
        const path = (row.menu_id || menuAktif || 'lain') + '/' + (row.kode || row.id) + '-' + Date.now() + '.' + ext;

        const { error: errUpload } = await supabase.storage.from(BUCKET).upload(path, file, {
          upsert: true,
          contentType: file.type || 'image/jpeg',
        });
        if (errUpload) {
          console.error('Upload foto gagal:', errUpload.message);
          return;
        }

        const { data: publik } = supabase.storage.from(BUCKET).getPublicUrl(path);
        const { error: errSimpan } = await supabase
          .from('stock_products')
          .update({ foto_url: publik.publicUrl })
          .eq('id', id);
        if (errSimpan) {
          console.error('Simpan foto gagal:', errSimpan.message);
          return;
        }
        loadBarang();
      });

      const pilihMenu = async (id) => {
        stopEdit(true);
        editBarangId = null;
        menuAktif = id;
        localStorage.setItem(MENU_KEY, String(id));
        await loadMenus();
      };

      const loadMenus = async () => {
        const { data, error } = await supabase
          .from('so_menus')
          .select('id, name')
          .order('name');
        if (error) {
          console.error('Gagal memuat menu:', error.message);
          return;
        }
        const menus = data || [];
        if (menuAktif && !menus.some((m) => m.id === menuAktif)) menuAktif = null;
        renderMenu(menus);

        menuTerpilih = menus.find((m) => m.id === menuAktif) || null;
        barangSec.hidden = !menuTerpilih;
        if (!menuTerpilih) {
          localStorage.removeItem(MENU_KEY);
          stopEdit(true);
          return;
        }
        barangSec.dataset.menu = menuTerpilih.name;
        await loadBarang();
      };

      const loadBarang = async () => {
        if (!menuAktif) return;
        const { data, error } = await supabase
          .from('stock_products')
          .select('id, menu_id, kode, name, satuan, stok_sistem, stok_fisik, hpp, foto_url')
          .eq('menu_id', menuAktif)
          .order('kode');
        if (error) {
          const ulang = await supabase
            .from('stock_products')
            .select('id, menu_id, kode, name, satuan, stok_sistem, hpp')
            .eq('menu_id', menuAktif)
            .order('kode');
          if (ulang.error) {
            console.error('Gagal memuat barang:', ulang.error.message);
            barangBody.innerHTML = '';
            barangEmpty.hidden = false;
            barangEmpty.textContent = 'Gagal memuat barang: ' + ulang.error.message;
            return;
          }
          renderBarang(ulang.data || []);
          return;
        }
        renderBarang(data || []);
      };

      const simpanMenu = async () => {
        const name = mName.value.trim().toUpperCase();
        if (!name) return;
        mName.value = name;

        if (editMenuId) {
          const { error } = await supabase.from('so_menus').update({ name }).eq('id', editMenuId);
          if (error) {
            console.error('Gagal update menu:', error.message);
            return;
          }
          stopEdit(true);
          loadMenus();
          return;
        }

        const { data, error } = await supabase
          .from('so_menus')
          .upsert({ name }, { onConflict: 'name' })
          .select('id')
          .single();
        if (error) {
          console.error('Gagal menambah menu:', error.message);
          return;
        }
        stopEdit(true);
        menuAktif = data.id;
        localStorage.setItem(MENU_KEY, String(menuAktif));
        loadMenus();
      };

      mName.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        simpanMenu();
      });
      mAdd.addEventListener('click', simpanMenu);

      const simpanBarang = async () => {
        if (!menuAktif) return;
        const name = bName.value.trim().toUpperCase();
        if (!name) {
          bName.focus();
          return;
        }
        const satuan = bSatuan.value.trim().toUpperCase() || 'PCS';
        const stokSistem = num(bOnhand.value);
        const hpp = num(bHpp.value);

        const { data: dipakai, error: errBaca } = await supabase
          .from('stock_products')
          .select('kode')
          .eq('menu_id', menuAktif);
        if (errBaca) {
          console.error('Gagal membuat PLU:', errBaca.message);
          return;
        }
        const kode = buatKode(menuTerpilih.name, new Set((dipakai || []).map((r) => r.kode)));
        const { error } = await supabase.from('stock_products').insert({
          menu_id: menuAktif,
          kode,
          name,
          satuan,
          stok_sistem: stokSistem,
          hpp,
        });
        if (error) {
          console.error('Gagal menambah barang:', error.message);
          return;
        }
        stopEdit(false);
        loadBarang();
        bName.focus();
      };

      bAdd.addEventListener('click', simpanBarang);
      [bName, bSatuan, bOnhand, bFisik, bHpp].forEach((input) => {
        input.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          simpanBarang();
        });
      });
      const hitungBarisTambah = () => {
        const selisih = Math.round(num(bFisik.value)) - Math.round(num(bOnhand.value));
        bSelisih.textContent = selisih > 0 ? '+' + selisih : String(selisih);
        bSelisih.className = 'c-num selisih ' + (selisih === 0 ? '' : selisih < 0 ? 'minus' : 'plus');
        const ket = keteranganOf(selisih);
        bKet.textContent = ket.text;
        bKet.className = 'c-ket ket ' + ket.cls;
      };
      bOnhand.addEventListener('input', hitungBarisTambah);
      bFisik.addEventListener('input', hitungBarisTambah);

      setMode();
      loadMenus();
    </script>
  </body>
</html>
