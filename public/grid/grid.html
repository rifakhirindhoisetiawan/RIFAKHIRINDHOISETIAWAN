<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <title>GRID — Photo Grid</title>
    <link rel="manifest" href="../../manifest.json" />
    <meta name="theme-color" content="#fffbf2" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        position: fixed;
        inset: 0;
        width: 100%;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        display: block;
        padding: 0;
        margin: 0;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      .app {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      @media (max-height: 520px) {
        .stepper-row {
          padding: 4px 10px 2px;
        }
        .stepper {
          padding: 4px 8px;
        }
        .layout-cycle {
          width: 28px;
          height: 28px;
          font-size: 9px;
        }
        .canvas-wrap {
          padding: 0 8px 4px;
        }
      }

      @media (min-width: 768px) {
        html,
        body {
          height: auto;
          min-height: 100%;
          overflow: auto;
          position: static;
          inset: auto;
          width: auto;
        }
        body {
          display: flex;
          flex-direction: column;
        }
        .app {
          max-width: 800px;
          margin: 0 auto;
          height: auto;
          min-height: auto;
          position: relative;
          top: auto;
          left: auto;
          right: auto;
          bottom: auto;
          padding: 24px 0;
          padding-bottom: 24px;
        }
        .stepper-row {
          padding: 22px 20px 18px;
        }
        .stepper {
          padding: 10px 14px;
          border-radius: 16px;
        }
        .canvas-wrap {
          padding: 0 20px 16px;
        }
      }

      .stepper-row {
        padding: max(12px, env(safe-area-inset-top)) 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        flex: 0 0 auto;
        flex-shrink: 0;
      }
      .stepper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: none;
        border-radius: 0;
        padding: 5px 0;
        background: transparent;
        gap: 10px;
      }
      .left-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .stepper .value {
        font-size: 15px;
        font-weight: 800;
        color: #1f2937;
        min-width: 26px;
        text-align: center;
      }
      .stepper .btns {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
      }
      .step-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .step-btn:disabled {
        background: #d9dde3;
        box-shadow: none;
        cursor: not-allowed;
      }

      .trash-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .trash-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      .add-photo-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .add-photo-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      .aspect-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        letter-spacing: -0.3px;
      }
      .aspect-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      .layout-cycle {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        line-height: 1;
        overflow: hidden;
      }
      .layout-cycle:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      .dl-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .dl-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }
      .dl-btn:disabled {
        background: #d9dde3;
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
        opacity: 1;
      }

      /* ===== TOMBOL ACAK TATA LETAK =====
         Tombol kecil di sebelah tombol tata letak. Hanya muncul untuk
         3/4/5 foto (hanya jumlah itu yang punya tata letak). */
      .layout-shuffle-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .layout-shuffle-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      /* ===== CARA POTONG FOTO =====
         "cover" (default): foto memenuhi sel, sisanya dipotong.
         "contain": seluruh foto terlihat, sisa ruang diisi putih.
         Preview (object-fit) dan export (canvas) memakai aturan yang sama,
         jadi dua-duanya selalu sama. */
      .fit-contain .slot img {
        object-fit: contain;
        background: #ffffff;
      }
      .dl-btn-fit .fit-contain {
        display: none;
      }
      .dl-btn-fit.contain .fit-cover {
        display: none;
      }
      .dl-btn-fit.contain .fit-contain {
        display: block;
      }
      /* mode "foto utuh" dibalik biar kelihatan aktif */
      .dl-btn-fit.contain {
        background: var(--mori-bg);
        color: var(--mori-accent);
      }

      .canvas-wrap {
        padding: 0 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .grid-frame {
        width: 100%;
        max-width: 100%;
        max-height: 100%;
        height: auto;
        border-radius: 14px;
        overflow: hidden;
        background: #ffffff;
        display: grid;
        gap: 2px;
        padding: 8px;
        border: 2px solid #c7d2fe;
        box-shadow: none;
        transition: aspect-ratio 0.2s ease;
        position: relative;
        min-width: 0;
        min-height: 0;
        box-sizing: border-box;
        touch-action: none;
      }
      /* ✅ .slot border-radius disamakan dengan .grid-frame (14px),
         bukan 0px yang bikin sudut tidak konsisten */
      .slot {
        position: relative;
        background: #f3f4f6;
        border-radius: 0px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          border 0.1s ease;
        min-width: 0;
        min-height: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .slot img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        cursor: grab;
        transform-origin: center center;
        -webkit-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
        touch-action: none;
        max-width: none;
        max-height: none;
        pointer-events: auto;
      }
      .slot img:active {
        cursor: grabbing;
      }
      .slot.dragging {
        opacity: 0.4;
      }
      .slot.drag-over {
        border: 2px dashed #6366f1;
        background: #eef2ff;
      }
      #dragGhost {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        border-radius: 8px;
        overflow: hidden;
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1.05);
        display: none;
      }
      #dragGhost img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .slot .placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: #b0b5bf;
        font-size: 11px;
        font-weight: 700;
        z-index: 2;
        pointer-events: none;
      }
      .slot .placeholder svg {
        color: #6366f1;
      }

      input[type="file"] {
        display: none;
      }

      /* Panel unduh/share sekarang MENEMPEL di tombol Unduh (downloadBtn)
         di baris tombol atas -- dulu ada tombol awan terpisah yang
         mengambang, dan itu dihapus.

         Container tidak lagi punya top/left tetap: keduanya diisi JS
         dari posisi tombol Unduh (lihat posisikanPanel()), supaya panel
         selalu muncul tepat di bawah tombolnya, bukan di sudut layar.
         Aman saat layar diputar karena posisi dihitung ulang tiap kali
         panel dibuka. */
      .download-bubble-container{position:fixed;z-index:1050;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none}
      .download-bubble-container.visible{pointer-events:auto}
      /* Panelnya ikut mengalir di dalam container (bukan absolute),
         karena container-nya sendiri yang diposisikan ke tombol Unduh.
         Arah animasi: turun sedikit dari arah tombol saat dibuka. */
      .download-bubble-dropup{width:min(186px,calc(100vw - 32px));background:var(--mori-surface);border:1.5px solid var(--mori-line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(-10px) scale(.96);pointer-events:none;transition:opacity .2s ease,transform .2s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:1}
      .download-bubble-dropup.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
      /* PANAH PANEL UNDUH: segitiga kecil di tepi atas panel yang menunjuk
         ke tombol Unduh — panel terasa keluar dari tombolnya, bukan muncul
         entah dari mana. Posisi x diatur JS lewat --arrow-x. */
      .download-bubble-container::before{
        content:"";position:absolute;top:0;left:var(--arrow-x,26px);
        width:12px;height:12px;margin-left:-6px;box-sizing:border-box;
        background:#eeeae1;
        background:color-mix(in srgb, var(--mori-text) 4%, var(--mori-surface));
        border-left:1.5px solid var(--mori-line);
        border-top:1.5px solid var(--mori-line);
        border-top-left-radius:1px;
        transform:translateY(-50%) rotate(45deg);
        pointer-events:none;opacity:0;transition:opacity .2s ease;
      }
      .download-bubble-container.visible::before{opacity:1}
      /* Potong garis tepi panel tepat selebar panah, supaya panahnya
         MENYAMBUNG dengan tepi panel (bukan segitiga yang menumpang di
         atas garis). Batang ini menimpa border 1.5px di titik panah. */
      .download-bubble-container::after{
        content:"";position:absolute;top:0;left:calc(var(--arrow-x,26px) - 9px);
        width:18px;height:1.7px;
        background:#eeeae1;
        background:color-mix(in srgb, var(--mori-text) 4%, var(--mori-surface));
        z-index:2;pointer-events:none;opacity:0;transition:opacity .2s ease;
      }
      .download-bubble-container.visible::after{opacity:1}
      /* Kalau panel terpaksa muncul di ATAS tombol, panah pindah ke bawah. */
      .download-bubble-container.above::before{
        top:auto;bottom:0;transform:translateY(50%) rotate(225deg);
      }
      .download-bubble-container.above::after{top:auto;bottom:0}
      .dbd-header{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-bottom:1px solid var(--mori-line);background:rgba(26,25,23,.04)}
      .dbd-count-badge{font-family:var(--mori-mono);font-size:9.5px;font-weight:700;padding:2px 0;border-radius:4px;background:transparent;color:var(--mori-accent);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .dbd-close-btn{background:transparent;border:none;font-weight:700;color:var(--mori-text-2);cursor:pointer;padding:2px 4px;border-radius:4px;flex-shrink:0}
      .dbd-body{padding:8px}
      .dbd-item{background:rgba(26,25,23,.03);border:1px solid var(--mori-line);border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:8px}
      .dl-preview{width:76px;height:76px;flex:0 0 76px;border-radius:0;overflow:hidden;background:var(--mori-bg);border:1px solid var(--mori-line);flex-shrink:0}
      .dl-preview img{width:100%;height:100%;display:block;object-fit:cover}
      .dl-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
      .dl-actions{display:grid;grid-template-columns:repeat(2,32px);gap:3px;justify-content:start;justify-items:start}
      .dl-btn-save,
      .dl-btn-wa,
      .dl-btn-tg,
      .dl-btn-fit {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        border-radius: 0;
        border: 1px solid var(--mori-line);
        background: var(--mori-accent);
        color: var(--mori-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      /* ============================================================
         TEMA MORI — override di atas, logika JS tidak disentuh.
         Palet dari public/mori/css/variables.css:
         bg #fffbf2 · surface #f7f3e9 · primary #1a1917 · text-secondary #6e6a64
         Gaya: sharp (radius 0), border hitam solid, shadow offset 4px.
         CATATAN: canvas export tetap putih (lihat ctx.fillStyle di JS)
         supaya hasil download tidak ikut krem.
         ============================================================ */
      :root {
        --mori-bg: #fffbf2;
        --mori-surface: #f7f3e9;
        --mori-text: #1a1917;
        --mori-text-2: #6e6a64;
        --mori-line: rgba(26, 25, 23, 0.14);
        --mori-accent: #1a1917;
        --mori-danger: #b91c1c;
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
        /* sudut tombol baris atas + kotak besar (naik = makin bulat) */
        --mori-radius: 5px;
        /* sudut panel unduhan yang paling besar (dropup kiri bawah) */
        --mori-radius-lg: 8px;
        /* sudut kotak kecil di dalamnya (slot, preview, ghost, badge) */
        --mori-radius-sm: 3px;
      }

      html,
      body {
        background: var(--mori-bg);
        overscroll-behavior: none;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--mori-text);
        -webkit-font-smoothing: antialiased;
      }

      .app {
        background: var(--mori-bg);
      }

      /* ===== HEADER: baris tombol =====
         Garis pemisah di bawah baris tombol dihapus, sebelumnya
         border-bottom 1px. Jarak ke area grid dijaga lewat padding
         supaya tombol tidak terasa nempel ke foto. */
      .stepper-row {
        border-bottom: none;
        padding-bottom: 14px;
        align-items: center;
      }

      .stepper {
        justify-content: space-between;
        gap: 10px;
      }

      /* buttons stay in one row on HP — never wrap */
      .left-controls {
        gap: 8px;
        flex-wrap: nowrap;
        min-width: 0;
        flex: 1 1 auto;
      }

      /* ===== TOMBOL: hitam solid, square, shadow offset ===== */
      .step-btn,
      .trash-btn,
      .add-photo-btn,
      .aspect-btn,
      .layout-cycle,
      .layout-shuffle-btn,
      .dl-btn,
      .dl-btn-save,
      .dl-btn-wa,
      .dl-btn-tg,
      .dl-btn-fit {
        border-radius: 0;
        border: 1px solid var(--mori-line);
        background: var(--mori-accent);
        color: var(--mori-bg);
        transition: box-shadow 0.2s ease, transform 0.2s ease, background 0.2s ease;
      }

      .step-btn:hover:not(:disabled),
      .trash-btn:hover:not(:disabled),
      .add-photo-btn:hover:not(:disabled),
      .aspect-btn:hover:not(:disabled),
      .layout-cycle:hover:not(:disabled),
      .layout-shuffle-btn:hover:not(:disabled),
      .dl-btn:hover:not(:disabled),
      .dl-btn-save:hover:not(:disabled),
      .dl-btn-wa:hover:not(:disabled),
      .dl-btn-tg:hover:not(:disabled),
      .dl-btn-fit:hover:not(:disabled) {
        /* bayangan abu-abu (--mori-text-2) dihapus; efek hover tetap
           teras dari border dan warna latar saja */
      }

      .step-btn:active:not(:disabled),
      .trash-btn:active:not(:disabled),
      .add-photo-btn:active:not(:disabled),
      .aspect-btn:active:not(:disabled),
      .layout-cycle:active:not(:disabled),
      .layout-shuffle-btn:active:not(:disabled),
      .dl-btn:active:not(:disabled),
      .dl-btn-save:active:not(:disabled),
      .dl-btn-wa:active:not(:disabled),
      .dl-btn-tg:active:not(:disabled),
      .dl-btn-fit:active:not(:disabled) {
        /* bayangan abu-abu (--mori-text-2) dihapus; tetap pakai border
           dan warna latar, tanpa box-shadow tebal */
        transform: translate(2px, 2px);
        opacity: 1;
        background: #33312f;
      }

      /* ===== TOMBOL & KOTAK: sudut dibulatkan =====
         Override sharp di atas (radius 0) dikembalikan melengkung di
         sini. Nilai diubah lewat --mori-radius / --mori-radius-sm
         (lihat :root), jadi semua kotak ikut berubah dari satu tempat. */
      .stepper-row .step-btn,
      .stepper-row .trash-btn,
      .stepper-row .add-photo-btn,
      .stepper-row .aspect-btn,
      .stepper-row .layout-cycle,
      .stepper-row .layout-shuffle-btn,
      .stepper-row .dl-btn,
      .dl-btn-save,
      .dl-btn-wa,
      .dl-btn-tg,
      .dl-btn-fit {
        border-radius: var(--mori-radius, 5px);
      }

      .dl-preview {
        border-radius: var(--mori-radius-sm, 3px);
      }

      /* ===== PANEL UNDUH (kiri bawah) ikut melengkung =====
         Nilai aslinya masih campuran: tombol bulat 50%, dropup 12px,
         kartu 8px, badge 4px. Disamakan semua ke variabel di :root
         supaya nyambung dengan tombol baris atas & bingkai grid. */
      .download-bubble-dropup {
        border-radius: var(--mori-radius-lg, 8px);
      }
      .dbd-item {
        border-radius: var(--mori-radius, 5px);
      }
      .dbd-count-badge,
      .dbd-close-btn {
        border-radius: var(--mori-radius-sm, 3px);
      }
      /* Catatan: tombol awan terpisah (.download-bubble-btn) dan
         lencana angkanya (.db-badge) sudah dihapus. Panel unduh/share
         sekarang menempel di tombol Unduh (downloadBtn) di baris atas. */

      /* tombol aktif (aspect terpilih) = kebalik */
      .aspect-btn.active {
        background: var(--mori-bg);
        color: var(--mori-accent);
      }

      .step-btn:disabled,
      .dl-btn:disabled {
        background: #e5e0d2;
        border-color: var(--mori-line);
        color: var(--mori-text-2);
        cursor: not-allowed;
      }

      /* tombol bahaya tetap merah */
      .trash-btn {
        background: var(--mori-danger);
        border-color: var(--mori-danger);
        color: #fff;
      }
      .trash-btn:hover:not(:disabled) {
        /* bayangan hitam dihapus: efek hover ditandai dengan warna saja */
      }

      /* ===== COUNTER ===== */
      .stepper .value {
        font-family: var(--mori-mono);
        font-size: 15px;
        font-weight: 700;
        color: var(--mori-text);
        min-width: 30px;
      }

      /* ===== HP: rapatkan baris tombol atas =====
         5 tombol kiri (aspect/layout/download/tambah/hapus)
         + 3 elemen kanan (kurang/nilai/tambah) = 8 kolom.
         Satu baris, tidak wrap, ukuran & gap dikecilkan bertahap. */
      @media (max-width: 420px) {
        .stepper-row {
          padding-left: 12px;
          padding-right: 12px;
          padding-bottom: 10px;
        }
        .stepper {

        .stepper .value {

          min-width: 18px;
        }
      }

      /* ===== CANVAS / GRID FRAME ===== */
      .canvas-wrap {
        padding: 14px 18px 16px;
      }

      .grid-frame {
        background: var(--mori-bg);
        border: 1px solid var(--mori-line);
        border-radius: var(--mori-radius, 5px);
        padding: 6px;
        gap: 3px;
        box-shadow: none;
      }

      .slot {
        background: var(--mori-surface);
        border: 1px solid var(--mori-line);
        border-radius: var(--mori-radius-sm, 3px);
      }

      .slot.drag-over {
        border: 2px dashed var(--mori-accent);
        background: #fff8e6;
      }

      .slot .placeholder {
        color: var(--mori-text-2);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .slot .placeholder svg {
        color: var(--mori-text-2);
      }

      #dragGhost {
        border: 1px solid var(--mori-line);
        border-radius: var(--mori-radius-sm, 3px);
      }

      @media (min-width: 768px) {
        .canvas-wrap {
          padding: 14px 20px 18px;
        }
      }

      /* ===== TOAST (pola Mori app-mori/public/css/components.css:15) =====
         Ganti alert()/confirm() native browser. Bentuk, animasi, dan
         durasi mengikuti .custom-toast Mori, hanya gaya Sharp + palet
         krem agar nyambung dengan tema GRID di atas. */
      .custom-toast {
        position: fixed;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%) translateY(24px) scale(0.94);
        background: var(--mori-surface);
        border: 1px solid var(--mori-line);
        color: var(--mori-text);
        padding: 12px 20px;
        border-radius: var(--mori-radius, 5px);
        font-family: var(--mori-mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        z-index: 9999;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: auto;
        max-width: min(88vw, 420px);
        text-align: center;
        line-height: 1.35;
        white-space: pre-wrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.3s ease;
      }

      .custom-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
        pointer-events: auto;
      }

      .custom-toast.err {
        background: #fdf1f1;
        border-color: var(--mori-danger, #b91c1c);

      }

      @media (max-width: 360px) {
        .custom-toast {
          font-size: 10px;
          padding: 10px 14px;
        }
      }
    </style>

    <script>
      /* ==================================================================
         GRID — Photo Grid
         ---------------------------------------------------------------
         Modul mandiri: seluruh CSS + JS ada di satu file, tanpa build step.

         Susunan file:
           1. Konstanta & definisi tata letak
           2. State aplikasi
           3. Referensi elemen DOM
           4. Gestur (drag reorder + zoom roda mouse)
           5. Render grid
           6. Aksi tombol (jumlah foto, aspect, layout, trash, tambah foto)
           7. Panel unduhan (bubble, simpan, bagikan)
           8. Export ke canvas
         ================================================================== */

      /* ---------- 1. Konstanta ---------- */

      const MIN_COUNT = 1;
      const MAX_COUNT = 25;
      const DRAG_THRESHOLD = 8; // px sebelum tahan-tahan dianggap drag

      /** Rasio frame + ukuran canvas hasil export (lebar x tinggi). */
      const ASPECTS = [
        { ratio: "1/1", w: 1200, h: 1200 },
        { ratio: "4/5", w: 1200, h: 1500 },
        { ratio: "3/4", w: 1200, h: 1600 },
        { ratio: "16/9", w: 1920, h: 1080 },
      ];

      /** Urutan tombol "tata letak" (dipakai tombol cycle). */
      const LAYOUT_NAMES = ["left-big", "right-big", "top-big", "bottom-big"];

      /** Tata letak bawaan (dipakai tombol reset). */
      const LAYOUT_DEFAULT = "left-big";

      /** Nama tata letak untuk judul tooltip. */
      const LAYOUT_LABELS = {
        "left-big": "Kiri Besar",
        "right-big": "Kanan Besar",
        "top-big": "Atas Besar",
        "bottom-big": "Bawah Besar",
      };

      /* Definisi tata letak — SATU-SATUNYA sumber kebenaran.
         "areas" berisi grid-area CSS tiap slot: "baris / kolom", penomoran
         1-based, batas bawah eksklusif (format CSS Grid).
         Preview (CSS grid) dan hasil export (canvas) dihitung dari definisi
         yang sama, jadi tampilan di layar dan file unduhan tidak mungkin
         berbeda. */
      const LAYOUTS = {
        3: {
          "left-big": {
            cols: 2,
            rows: 2,
            areas: ["1 / 1 / 3 / 2", "1 / 2 / 2 / 3", "2 / 2 / 3 / 3"],
          },
          "right-big": {
            cols: 2,
            rows: 2,
            areas: ["1 / 1 / 2 / 2", "2 / 1 / 3 / 2", "1 / 2 / 3 / 3"],
          },
          "top-big": {
            cols: 2,
            rows: 2,
            areas: ["1 / 1 / 2 / 3", "2 / 1 / 3 / 2", "2 / 2 / 3 / 3"],
          },
          "bottom-big": {
            cols: 2,
            rows: 2,
            areas: ["1 / 1 / 2 / 2", "1 / 2 / 2 / 3", "2 / 1 / 3 / 3"],
          },
        },
        4: {
          "left-big": {
            cols: 2,
            rows: 3,
            areas: ["1 / 1 / 4 / 2", "1 / 2 / 2 / 3", "2 / 2 / 3 / 3", "3 / 2 / 4 / 3"],
          },
          "right-big": {
            cols: 2,
            rows: 3,
            areas: ["1 / 1 / 2 / 2", "2 / 1 / 3 / 2", "3 / 1 / 4 / 2", "1 / 2 / 4 / 3"],
          },
          "top-big": {
            cols: 3,
            rows: 2,
            areas: ["1 / 1 / 2 / 4", "2 / 1 / 3 / 2", "2 / 2 / 3 / 3", "2 / 3 / 3 / 4"],
          },
          "bottom-big": {
            cols: 3,
            rows: 2,
            areas: ["1 / 1 / 2 / 2", "1 / 2 / 2 / 3", "1 / 3 / 2 / 4", "2 / 1 / 3 / 4"],
          },
        },
        5: {
          "left-big": {
            cols: 3,
            rows: 2,
            areas: [
              "1 / 1 / 3 / 2",
              "1 / 2 / 2 / 3",
              "2 / 2 / 3 / 3",
              "1 / 3 / 2 / 4",
              "2 / 3 / 3 / 4",
            ],
          },
          "right-big": {
            cols: 3,
            rows: 2,
            areas: [
              "1 / 1 / 2 / 2",
              "1 / 2 / 2 / 3",
              "2 / 1 / 3 / 2",
              "2 / 2 / 3 / 3",
              "1 / 3 / 3 / 4",
            ],
          },
          "top-big": {
            cols: 4,
            rows: 2,
            areas: [
              "1 / 1 / 2 / 5",
              "2 / 1 / 3 / 2",
              "2 / 2 / 3 / 3",
              "2 / 3 / 3 / 4",
              "2 / 4 / 3 / 5",
            ],
          },
          "bottom-big": {
            cols: 4,
            rows: 2,
            areas: [
              "1 / 1 / 2 / 2",
              "1 / 2 / 2 / 3",
              "1 / 3 / 2 / 4",
              "1 / 4 / 2 / 5",
              "2 / 1 / 3 / 5",
            ],
          },
        },
      };

      /** Placeholder slot kosong (ikon foto). */
      const PLACEHOLDER_SVG =
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
        '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/>' +
        '<path d="M21 15l-5-5L5 21"/></svg>';

      /* ---------- 2. State ---------- */

      const state = {
        count: 3, // jumlah slot aktif
        images: {}, // idx slot -> dataURL foto
        tx: {}, // idx slot -> { scale, fx, fy } untuk zoom
        aspectIndex: 0, // index ASPECTS
        fit: "cover", // "cover" = foto penuh sel (dipotong), "contain" = foto utuh
        layouts: {
          // layout terpilih, disimpan per jumlah foto
          3: LAYOUT_DEFAULT,
          4: LAYOUT_DEFAULT,
          5: LAYOUT_DEFAULT,
        },
      };

      /** Status gesture yang sedang berjalan (drag / zoom). */
      const gesture = {
        idx: null, // slot yang sedang disentuh
        mode: null, // "reorder" saat mode geser aktif
        startX: 0,
        startY: 0,
        started: false, // masih diam, belum lewat ambang drag
        pointerId: null,
        suppressClick: false,
      };

      /** Slot yang dipilih untuk diisi foto (klik slot kosong). */
      let activeSlot = null;

      /** Hasil export terakhir (isi panel unduhan). */
      const dl = { dataUrl: "", blob: null, fileName: "1.png" };

      /* ---------- 3. Referensi elemen DOM ---------- */

      const el = {
        gridFrame: document.getElementById("gridFrame"),
        fileInput: document.getElementById("fileInput"),
        multiFileInput: document.getElementById("multiFileInput"),
        downloadBtn: document.getElementById("downloadBtn"),
        countValue: document.getElementById("countValue"),
        minusBtn: document.getElementById("minusBtn"),
        plusBtn: document.getElementById("plusBtn"),
        trashBtn: document.getElementById("trashBtn"),
        addPhotoBtn: document.getElementById("addPhotoBtn"),
        aspectBtn: document.getElementById("aspectBtn"),
        layoutCycleBtn: document.getElementById("layoutCycleBtn"),
        layoutShuffleBtn: document.getElementById("layoutShuffleBtn"),
        dragGhost: document.getElementById("dragGhost"),
        canvas: document.getElementById("hiddenCanvas"),
        bubble: document.getElementById("downloadBubbleContainer"),
        dropup: document.getElementById("downloadBubbleDropup"),
        closeBubbleBtn: document.getElementById("dbdCloseBtn"),
        badge: document.getElementById("dbdCountBadge"),
        previewImg: document.getElementById("dlPreviewImg"),
        saveBtn: document.getElementById("dlSaveBtn"),
        shareWaBtn: document.getElementById("dlShareWaBtn"),
        shareTgBtn: document.getElementById("dlShareTgBtn"),
        fitBtn: document.getElementById("dlFitBtn"),
      };

      const $slot = (idx) =>
        el.gridFrame.querySelector('.slot[data-slot="' + idx + '"]');
      const $slotImg = (idx) =>
        el.gridFrame.querySelector('.slot[data-slot="' + idx + '"] .slot-img');

      /* ---------- 4. Gestur ---------- */

      /** Transform (zoom/geser) sebuah slot; dibuat otomatis kalau belum ada. */
      function getTx(idx) {
        return state.tx[idx] || (state.tx[idx] = { scale: 1, fx: 0, fy: 0 });
      }

      function applyTx(img, idx) {
        const t = getTx(idx);
        const r = img.getBoundingClientRect();
        img.style.transform =
          "translate(" +
          t.fx * r.width +
          "px," +
          t.fy * r.height +
          "px) scale(" +
          t.scale +
          ")";
      }

      /** Batasi pergeseran foto supaya tidak keluar dari slotnya. */
      function clampTx(idx) {
        const t = getTx(idx);
        const m = Math.max(0, (t.scale - 1) / 2);
        t.fx = Math.min(m, Math.max(-m, t.fx));
        t.fy = Math.min(m, Math.max(-m, t.fy));
        return t;
      }

      /** Posisi titik (x, y) relatif terhadap tengah sebuah elemen. */
      function anchorFromPoint(node, x, y) {
        if (!node) return { ax: 0, ay: 0 };
        const r = node.getBoundingClientRect();
        return {
          ax: (x - r.left) / r.width - 0.5,
          ay: (y - r.top) / r.height - 0.5,
        };
      }

      /** Zoom ke dalam/keluar dengan titik jangkar (tikus/roda mouse). */
      function zoomAt(idx, newScale, ax, ay) {
        const t = getTx(idx);
        const s0 = t.scale || 1;
        const s1 = Math.min(4, Math.max(1, newScale));
        if (s1 === s0) return;
        const ratio = s1 / s0;
        t.fx = ax - (ax - t.fx) * ratio;
        t.fy = ay - (ay - t.fy) * ratio;
        t.scale = s1;
        clampTx(idx);
        const img = $slotImg(idx);
        if (img) applyTx(img, idx);
      }

      /** Slot yang pusatnya paling dekat dengan titik (x, y). */
      function nearestSlot(x, y) {
        let best = null;
        let bestDist = Infinity;
        el.gridFrame.querySelectorAll(".slot").forEach((slot) => {
          const r = slot.getBoundingClientRect();
          const d = Math.hypot(
            x - (r.left + r.width / 2),
            y - (r.top + r.height / 2),
          );
          if (d < bestDist) {
            bestDist = d;
            best = parseInt(slot.dataset.slot, 10);
          }
        });
        return best;
      }

      /** Tukar isi dua slot (foto + zoom ikut tertukar). */
      function swapSlots(fromIdx, toIdx) {
        if (fromIdx === null || fromIdx === toIdx) return;
        const temp = state.images[fromIdx];
        state.images[fromIdx] = state.images[toIdx];
        state.images[toIdx] = temp;
        const tTemp = state.tx[fromIdx];
        state.tx[fromIdx] = state.tx[toIdx];
        state.tx[toIdx] = tTemp;
        // slot kosong dibuang supaya tidak ikut terhitung
        if (!state.images[fromIdx]) delete state.images[fromIdx];
        if (!state.images[toIdx]) delete state.images[toIdx];
        renderGrid();
        checkReady();
      }

      /* Bayangan foto yang sedang di-drag. */
      function hideGhost() {
        el.dragGhost.style.display = "none";
        el.dragGhost.innerHTML = "";
      }

      function showGhost(src, size, x, y) {
        const gImg = document.createElement("img");
        gImg.src = src;
        el.dragGhost.innerHTML = "";
        el.dragGhost.appendChild(gImg);
        el.dragGhost.style.width = size + "px";
        el.dragGhost.style.height = size + "px";
        el.dragGhost.style.left = x + "px";
        el.dragGhost.style.top = y + "px";
        el.dragGhost.style.display = "block";
      }

      function clearDragHighlights() {
        el.gridFrame
          .querySelectorAll(".slot.drag-over, .slot.dragging")
          .forEach((slot) => {
            slot.classList.remove("drag-over", "dragging");
          });
      }

      function endGesture() {
        gesture.idx = null;
        gesture.mode = null;
        gesture.started = false;
        gesture.pointerId = null;
        hideGhost();
        clearDragHighlights();
      }

      el.gridFrame.addEventListener("pointerdown", (e) => {
        if (e.button && e.button !== 0) return;
        const slot = e.target.closest(".slot");
        if (!slot) return;
        if (gesture.suppressClick) return;

        const idx = parseInt(slot.dataset.slot, 10);

        // slot kosong -> langsung buka pemilih file
        if (!state.images[idx]) {
          activeSlot = idx;
          el.fileInput.click();
          return;
        }

        e.preventDefault();
        gesture.idx = idx;
        gesture.mode = null;
        gesture.startX = e.clientX;
        gesture.startY = e.clientY;
        gesture.started = true;
        gesture.pointerId = e.pointerId;
        try {
          slot.setPointerCapture(e.pointerId);
        } catch (err) {
          /* sebagian browser lama tidak mendukung pointer capture */
        }
      });

      document.addEventListener("pointermove", (e) => {
        if (gesture.idx === null) return;
        if (gesture.pointerId !== null && e.pointerId !== gesture.pointerId) return;

        // belum lewat ambang -> belum dianggap drag
        if (gesture.started && !gesture.mode) {
          const dx = Math.abs(e.clientX - gesture.startX);
          const dy = Math.abs(e.clientY - gesture.startY);
          if (dx + dy > DRAG_THRESHOLD) {
            gesture.started = false;
            gesture.suppressClick = true;
            gesture.mode = "reorder";
            const srcSlot = $slot(gesture.idx);
            if (srcSlot) {
              srcSlot.classList.add("dragging");
              const rect = srcSlot.getBoundingClientRect();
              showGhost(
                state.images[gesture.idx],
                Math.min(rect.width, rect.height) * 0.55,
                e.clientX,
                e.clientY,
              );
            }
          }
          return;
        }

        if (gesture.mode === "reorder") {
          e.preventDefault();
          el.dragGhost.style.left = e.clientX + "px";
          el.dragGhost.style.top = e.clientY + "px";
          clearDragHighlights();
          const srcSlot = $slot(gesture.idx);
          if (srcSlot) srcSlot.classList.add("dragging");
          const targetIdx = nearestSlot(e.clientX, e.clientY);
          if (targetIdx !== null && targetIdx !== gesture.idx) {
            const target = $slot(targetIdx);
            if (target) target.classList.add("drag-over");
          }
        }
      });

      document.addEventListener("pointerup", (e) => {
        if (gesture.idx === null) return;
        if (gesture.pointerId !== null && e.pointerId !== gesture.pointerId) return;

        const wasReorder = gesture.mode === "reorder";
        if (wasReorder) {
          el.dragGhost.style.display = "none";
          const targetIdx = nearestSlot(e.clientX, e.clientY);
          if (targetIdx !== null && targetIdx !== gesture.idx) {
            swapSlots(gesture.idx, targetIdx);
          }
        }
        gesture.suppressClick = wasReorder;
        endGesture();
        if (gesture.suppressClick) {
          setTimeout(() => {
            gesture.suppressClick = false;
          }, 300);
        }
      });

      document.addEventListener("pointercancel", endGesture);

      el.gridFrame.addEventListener(
        "wheel",
        (e) => {
          const slot = e.target.closest(".slot");
          if (!slot) return;
          const idx = parseInt(slot.dataset.slot, 10);
          if (!state.images[idx]) return;
          e.preventDefault();
          const a = anchorFromPoint(
            slot.querySelector(".slot-img"),
            e.clientX,
            e.clientY,
          );
          zoomAt(
            idx,
            getTx(idx).scale + (e.deltaY < 0 ? 0.12 : -0.12),
            a.ax,
            a.ay,
          );
        },
        { passive: false },
      );

      document.addEventListener(
        "contextmenu",
        (e) => {
          if (e.target.closest && e.target.closest(".slot img")) {
            e.preventDefault();
          }
        },
        { passive: false },
      );

      /* ---------- 5. Render grid ---------- */

      /** Definisi tata letak aktif (jumlah kolom/baris + area tiap slot). */
      function getLayoutDef() {
        const set = LAYOUTS[state.count];
        if (set) return set[state.layouts[state.count]];

        // jumlah foto di luar 3/4/5 -> grid sama rata
        const cols = Math.ceil(Math.sqrt(state.count));
        const rows = Math.ceil(state.count / cols);
        const areas = [];
        for (let i = 0; i < state.count; i++) {
          const col = (i % cols) + 1;
          const row = Math.floor(i / cols) + 1;
          areas.push(row + " / " + col + " / " + (row + 1) + " / " + (col + 1));
        }
        return { cols, rows, areas };
      }

      /** Ubah grid-area CSS ("baris1 / kolom1 / baris2 / kolom2") jadi kotak piksel. */
      function areaToRect(area, cols, rows, w, h) {
        const [r1, c1, r2, c2] = area
          .split("/")
          .map((v) => parseInt(v.trim(), 10));
        const cw = w / cols;
        const ch = h / rows;
        return {
          x: (c1 - 1) * cw,
          y: (r1 - 1) * ch,
          w: (c2 - c1) * cw,
          h: (r2 - r1) * ch,
        };
      }

      /** Sudut slot yang menempel pinggiran bingkai dibulatkan lebih besar
          supaya menyatu dengan bingkai (warisan tema sebelum Mori). */
      function applySlotRadius() {
        const frameR = el.gridFrame.getBoundingClientRect();
        const tolerance = 2;
        el.gridFrame.querySelectorAll(".slot").forEach((slot) => {
          const r = slot.getBoundingClientRect();
          const onTop = Math.abs(r.top - frameR.top) < tolerance;
          const onBottom = Math.abs(r.bottom - frameR.bottom) < tolerance;
          const onLeft = Math.abs(r.left - frameR.left) < tolerance;
          const onRight = Math.abs(r.right - frameR.right) < tolerance;

          if (!onTop && !onBottom && !onLeft && !onRight) return;

          const isCorner = (onTop || onBottom) && (onLeft || onRight);
          const radius = isCorner ? "12px" : "6px";

          if (onTop && onLeft) slot.style.borderTopLeftRadius = radius;
          if (onTop && onRight) slot.style.borderTopRightRadius = radius;
          if (onBottom && onLeft) slot.style.borderBottomLeftRadius = radius;
          if (onBottom && onRight) slot.style.borderBottomRightRadius = radius;
        });
      }

      /** Terapkan cara potong foto: preview (object-fit) + tombol panel. */
      function applyFitMode() {
        const contain = state.fit === "contain";
        el.gridFrame.classList.toggle("fit-contain", contain);
        el.fitBtn.classList.toggle("contain", contain);
        el.fitBtn.title = contain
          ? "Foto utuh (tidak dipotong) — ketuk untuk isi penuh sel"
          : "Potong foto (penuh sel) — ketuk untuk tampil utuh";
      }

      function renderGrid() {
        const def = getLayoutDef();
        const aspect = ASPECTS[state.aspectIndex];

        el.gridFrame.style.aspectRatio = aspect.ratio;
        el.gridFrame.style.gridTemplateColumns = "repeat(" + def.cols + ", 1fr)";
        el.gridFrame.style.gridTemplateRows = "repeat(" + def.rows + ", 1fr)";
        el.gridFrame.innerHTML = "";

        // tombol tata letak hanya relevan untuk 3/4/5 foto
        const showLayout = !!LAYOUTS[state.count];
        el.layoutCycleBtn.style.display = showLayout ? "" : "none";
        el.layoutShuffleBtn.style.display = showLayout ? "" : "none";

        for (let idx = 0; idx < state.count; idx++) {
          const slot = document.createElement("div");
          slot.className = "slot";
          slot.dataset.slot = idx;
          slot.style.gridArea = def.areas[idx];

          if (state.images[idx]) {
            const img = document.createElement("img");
            img.className = "slot-img";
            img.src = state.images[idx];
            img.draggable = false;
            slot.appendChild(img);
          } else {
            const ph = document.createElement("div");
            ph.className = "placeholder";
            ph.innerHTML = PLACEHOLDER_SVG;
            slot.appendChild(ph);
          }

          el.gridFrame.appendChild(slot);
        }

        // zoom per slot dipasang ulang setelah DOM dibangun
        el.gridFrame.querySelectorAll(".slot").forEach((slot) => {
          const img = slot.querySelector(".slot-img");
          if (img) applyTx(img, parseInt(slot.dataset.slot, 10));
        });

        el.countValue.textContent = state.count;
        applyFitMode();
        applySlotRadius();
      }

      /** Tombol unduh aktif kalau ada minimal satu foto terisi. */
      function checkReady() {
        const filled = Object.keys(state.images).filter(
          (k) => Number(k) < state.count,
        ).length;
        el.downloadBtn.disabled = filled === 0;
      }

      /* ---------- 6. Aksi tombol ---------- */

      function syncCountButtons() {
        el.minusBtn.disabled = state.count <= MIN_COUNT;
        el.plusBtn.disabled = state.count >= MAX_COUNT;
      }

      function updateCount(delta) {
        const next = state.count + delta;
        if (next < MIN_COUNT || next > MAX_COUNT) return;
        state.count = next;
        // foto pada slot yang dihapus ikut dibuang (beserta zoom-nya)
        Object.keys(state.images).forEach((k) => {
          if (Number(k) >= state.count) {
            delete state.images[k];
            delete state.tx[k];
          }
        });
        syncCountButtons();
        renderGrid();
        checkReady();
      }

      el.minusBtn.addEventListener("click", () => updateCount(-1));
      el.plusBtn.addEventListener("click", () => updateCount(1));

      el.trashBtn.addEventListener("click", () => {
        state.images = {};
        state.tx = {};
        renderGrid();
        checkReady();
      });

      el.addPhotoBtn.addEventListener("click", () => el.multiFileInput.click());

      /* --- Aspect (rasio bingkai) --- */

      function currentAspect() {
        return ASPECTS[state.aspectIndex];
      }

      function updateAspectButton() {
        const ratio = currentAspect().ratio;
        el.aspectBtn.title = "Ukuran: " + ratio;
        el.aspectBtn.setAttribute("aria-label", "Ukuran bingkai " + ratio);
      }

      el.aspectBtn.addEventListener("click", () => {
        state.aspectIndex = (state.aspectIndex + 1) % ASPECTS.length;
        updateAspectButton();
        renderGrid();
      });

      /* --- Tata letak --- */

      function currentLayout() {
        return state.layouts[state.count] || LAYOUT_NAMES[0];
      }

      function updateLayoutButton() {
        const label = LAYOUT_LABELS[currentLayout()];
        el.layoutCycleBtn.title = "Tata letak: " + label;
        el.layoutCycleBtn.setAttribute("aria-label", "Tata letak " + label);
      }

      el.layoutCycleBtn.addEventListener("click", () => {
        // tata letak khusus hanya untuk 3/4/5 foto (tombol disembunyikan
        // untuk jumlah lain, jadi guard ini hanya untuk pemanggilan programatik)
        if (!LAYOUTS[state.count]) return;
        const idx = LAYOUT_NAMES.indexOf(currentLayout());
        state.layouts[state.count] = LAYOUT_NAMES[(idx + 1) % LAYOUT_NAMES.length];
        updateLayoutButton();
        renderGrid();
      });

      /* Acak: pilih tata letak lain secara acak, tidak sama dengan sekarang. */
      el.layoutShuffleBtn.addEventListener("click", () => {
        if (!LAYOUTS[state.count]) return;
        const nama = Object.keys(LAYOUTS[state.count]);
        let acak = nama[Math.floor(Math.random() * nama.length)];
        if (nama.length > 1 && acak === state.layouts[state.count]) {
          acak = nama[(nama.indexOf(acak) + 1) % nama.length];
        }
        state.layouts[state.count] = acak;
        updateLayoutButton();
        renderGrid();
      });

      /* --- Pilih foto --- */

      el.fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        const slotIdx = activeSlot;
        el.fileInput.value = "";
        if (!file || slotIdx === null) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          state.images[slotIdx] = ev.target.result;
          renderGrid();
          checkReady();
        };
        reader.readAsDataURL(file);
      });

      el.multiFileInput.addEventListener("change", (e) => {
        const files = Array.from(e.target.files);
        el.multiFileInput.value = "";
        if (files.length === 0) return;

        // tambah slot kalau foto yang ditambahkan tidak cukup tempat
        const filled = Object.keys(state.images).length;
        const target = Math.min(
          MAX_COUNT,
          Math.max(state.count, filled + files.length),
        );
        if (target !== state.count) {
          state.count = target;
          syncCountButtons();
          renderGrid();
        }

        // foto baru mengisi slot kosong pertama
        let fileIdx = 0;
        for (let i = 0; i < state.count && fileIdx < files.length; i++) {
          if (state.images[i]) continue;
          const slotIdx = i;
          const file = files[fileIdx++];
          const reader = new FileReader();
          reader.onload = (ev) => {
            state.images[slotIdx] = ev.target.result;
            renderGrid();
            checkReady();
          };
          reader.readAsDataURL(file);
        }
      });

      /* ---------- 7. Panel unduhan ---------- */

      /* Posisikan panel tepat di bawah tombol Unduh, bukan di sudut layar.
         Dihitung ulang tiap kali panel dibuka supaya ikut kalau layar
         diputar atau tombol pindah tempat. */
      function posisikanPanel() {
        const r = el.downloadBtn.getBoundingClientRect();
        const w = el.dropup.offsetWidth || 320;
        const cx = r.left + r.width / 2;
        let left = r.left;
        /* Titik panah minimal 20px dari tepi kiri/kanan panel supaya tidak
           masuk sudut melengkung panel. */
        if (left > cx - 20) left = cx - 20;
        if (left + w < cx + 20) left = cx + 20 - w;
        /* Jangan keluar kanan layar. */
        if (left + w > window.innerWidth - 12) left = window.innerWidth - w - 12;
        if (left < 12) left = 12;
        el.bubble.style.left = left + "px";
        el.bubble.style.top = r.bottom + 8 + "px";
        /* Panah panel menunjuk ke tengah tombol Unduh; titik itu juga
           dipakai sebagai transform-origin supaya animasi buka terlihat
           keluar dari tombolnya. */
        let arrowX = cx - left;
        arrowX = Math.max(20, Math.min(w - 20, arrowX));
        el.bubble.style.setProperty("--arrow-x", arrowX + "px");
        el.dropup.style.transformOrigin = arrowX + "px 0";
        el.bubble.classList.remove("above");
      }

      /* Naik ke atas tombol kalau ruang di bawah tidak cukup (HP kecil
         dalam mode landscape). */
      function posisiAman() {
        const bawah = el.bubble.offsetTop + (el.dropup.offsetHeight || 0);
        if (bawah <= window.innerHeight - 12) return;
        const r = el.downloadBtn.getBoundingClientRect();
        el.bubble.style.top =
          Math.max(12, r.top - (el.dropup.offsetHeight || 0) - 8) + "px";
        el.bubble.classList.add("above");
      }

      function hideBubble() {
        el.dropup.classList.remove("open");
        el.bubble.classList.remove("visible");
        el.bubble.classList.remove("above");
      }

      function showBubble() {
        posisikanPanel();
        el.bubble.classList.add("visible");
        el.dropup.classList.add("open");
        posisiAman();
      }

      /* Tombol ✕ di kepala panel. e.stopPropagation() penting supaya kliknya
         tidak ikut ditangkap handler "klik di luar panel" di bawah, yang juga
         akan menutupnya -- hasilnya sama, tapi ini menjadikan maksudnya jelas. */
      el.closeBubbleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        hideBubble();
      });

      document.addEventListener("click", (e) => {
        if (!el.dropup.classList.contains("open")) return;
        if (el.bubble.contains(e.target) || el.downloadBtn.contains(e.target))
          return;
        hideBubble();
      });

      window.addEventListener("resize", () => {
        if (el.dropup.classList.contains("open")) posisikanPanel();
      });

      /* ===== Toast custom (pola Mori showToast) =====
         Dipakai untuk menggantikan alert() native browser, yang di WebView
         / PWA sering tampil kotak kosong atau tidak muncul sama sekali.
         Toast lama dibuang dulu supaya tidak menumpuk, lalu durasi mengikuti
         localStorage (default 3 detik) seperti Mori. */
      function showToast(pesan, tipe) {
        if (!pesan) return;
        console.log("[TOAST]", pesan);
        document.querySelectorAll(".custom-toast").forEach((t) => t.remove());

        const node = document.createElement("div");
        node.className = "custom-toast" + (tipe === "err" ? " err" : "");
        node.textContent = pesan;
        node.setAttribute("role", "status");
        document.body.appendChild(node);

        requestAnimationFrame(() => node.classList.add("show"));

        const durSec =
          parseInt(localStorage.getItem("grid_toast_dur") || "3", 10) || 3;
        setTimeout(() => {
          node.classList.remove("show");
          setTimeout(() => node.remove(), 300);
        }, durSec * 1000);
      }

      const isAndroid = /android/i.test(navigator.userAgent);

      function mimeDariName(nama) {
        const ext = (String(nama).split(".").pop() || "png").toLowerCase();
        return {
          ext,
          mime: ext === "jpg" || ext === "jpeg" ? "image/jpeg" : "image/png",
        };
      }

      // Menyimpan tanpa memicu notifikasi Download Manager browser.
      // 1. Desktop Chrome/Edge: File System Access API, user pilih lokasi sendiri.
      // 2. Android: API itu tidak ada, jadi lewat share sheet (Galeri/Files).
      // 3. Sisanya: a[download] — notifikasi browser muncul, tidak ada pilihan lain.
      async function simpanBlob(blob) {
        if (window.showSaveFilePicker) {
          const { ext, mime } = mimeDariName(dl.fileName);
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: dl.fileName,
              types: [{ description: "Gambar", accept: { [mime]: ["." + ext] } }],
            });
            const w = await handle.createWritable();
            await w.write(blob);
            await w.close();
            return true;
          } catch (err) {
            // User menekan batal = tidak ada yang perlu disimpan, jadi
            // jangan fallback ke a[download] yang memunculkan notifikasi.
            if (err && err.name === "AbortError") return false;
          }
        }

        if (isAndroid && navigator.share) {
          const { mime } = mimeDariName(dl.fileName);
          const file = new File([blob], dl.fileName, { type: mime });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title: dl.fileName });
              return true;
            } catch (err) {
              if (err && err.name === "AbortError") return false;
            }
          }
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.download = dl.fileName;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        return true;
      }

      async function ambilBlob() {
        if (dl.blob) return dl.blob;
        const res = await fetch(dl.dataUrl);
        return res.blob();
      }

      el.saveBtn.addEventListener("click", async () => {
        if (!dl.dataUrl && !dl.blob) return;
        // Notifikasi "Tersimpan <nama>.png" dihapus (permintaan).
        // Notifikasi GALAT tetap ditampilkan -- kalau gagal diam-diam,
        // user mengira file sudah tersimpan padahal tidak.
        try {
          await simpanBlob(await ambilBlob());
        } catch (err) {
          showToast("Gagal menyimpan: " + err.message, "err");
        }
        hideBubble();
        dl.dataUrl = "";
        dl.blob = null;
        el.previewImg.src = "";
      });

      /* ===== Cara potong foto (tombol di panel unduhan) =====
         "Isi"  (cover)  : foto memenuhi sel, sisanya dipotong.
         "Utuh" (contain) : seluruh foto terlihat, sisanya ruang kosong.
         Tombol ini yang menjawab complaint "foto kepotong": di tata letak
         3/5 foto, sel besar punya bentuk jauh berbeda dari foto (mis.
         1:2 sementara fotonya 4:3), jadi foto jadi terpotong parah.
         Mode "Utuh" menampilkan seluruh foto tanpa dipotong. */
      el.fitBtn.addEventListener("click", async () => {
        state.fit = state.fit === "cover" ? "contain" : "cover";
        applyFitMode();
        // preview + hasil export dihitung ulang supaya ikut berubah,
        // nama file tetap (tidak menambah counter)
        if (dl.dataUrl || dl.blob) {
          await tampilkanExport({ namaBaru: false }).catch((err) =>
            showToast("Gagal membuat gambar: " + err.message, "err"),
          );
        }
      });

      /* ===== Bagikan (WhatsApp / Telegram) =====
         Cara yang sama untuk keduanya: navigator.share({ files }) membuka
         share sheet Android, dan WA maupun Telegram ada di dalamnya. Kalau
         Telegram yang dipilih, filenya benar-benar ikut terkirim.

         Kenapa tidak ada deep-link langsung ke Telegram dengan file?
         Protokol tg:// hanya menerima teks/link (mis. tg://msg?text=...),
         tidak bisa melampirkan file. Jadi share sheet satu-satunya cara
         dari halaman web yang benar-benar mengirim file ke Telegram.

         Fallback kalau share sheet tidak didukung (mis. sebagian browser
         desktop): simpan dulu sebagai pengganti. */
      async function bagikanFile(label) {
        if (!dl.dataUrl && !dl.blob) return;
        try {
          const blob = await ambilBlob();
          const file = new File([blob], dl.fileName, { type: "image/png" });
          if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
          ) {
            // Tanpa `text` supaya aplikasi tujuan hanya menerima file,
            // tidak ikut menempelkan caption apa pun.
            await navigator.share({ files: [file], title: dl.fileName });
            hideBubble();
            return;
          }
          // Fallback (browser tanpa share sheet): unduh dulu. Notifikasi
          // "File diunduh..." dihapus sesuai permintaan; kalau benar-benar
          // gagal, pesan error tetap muncul di bawah.
          try {
            await simpanBlob(blob);
            hideBubble();
          } catch (err) {
            showToast("Gagal berbagi: " + err.message, "err");
          }
        } catch (err) {
          if (err.name !== "AbortError") {
            showToast("Gagal berbagi ke " + label + ": " + err.message, "err");
          }
        }
      }

      el.shareWaBtn.addEventListener("click", () => bagikanFile("WA"));
      el.shareTgBtn.addEventListener("click", () => bagikanFile("Telegram"));

      /* ---------- 8. Export ke canvas ---------- */

      /** Nomor file berikutnya: 1.png, 2.png, ... (urutan via localStorage). */
      function getNextFileName() {
        const n =
          parseInt(localStorage.getItem("gridDlCounter") || "0", 10) + 1;
        localStorage.setItem("gridDlCounter", String(n));
        return n + ".png";
      }

      /** Muat gambar dari dataURL; resolve(null) kalau foto tidak bisa dimuat. */
      function loadImage(src) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => {
            console.warn("Gambar gagal dimuat:", src);
            resolve(null);
          };
          img.src = src;
        });
      }

      /** Hitung kotak gambar di dalam sel sesuai cara potong.
          "cover"   : foto memenuhi sel, sisanya dipotong.
          "contain" : seluruh foto terlihat, sisa ruang diisi warna sel. */
      function fitRect(img, x, y, w, h) {
        if (state.fit === "contain") {
          const skala = Math.min(w / img.width, h / img.height);
          const dw = img.width * skala;
          const dh = img.height * skala;
          return { x: x + (w - dw) / 2, y: y + (h - dh) / 2, w: dw, h: dh };
        }
        const imgRatio = img.width / img.height;
        const cellRatio = w / h;
        if (imgRatio > cellRatio) {
          const dh = h;
          const dw = h * imgRatio;
          return { x: x + (w - dw) / 2, y: y, w: dw, h: dh };
        }
        const dw = w;
        const dh = w / imgRatio;
        return { x: x, y: y + (h - dh) / 2, w: dw, h: dh };
      }

      /** Gambar foto ke kotak (x, y, w, h) sesuai cara potong yang aktif. */
      function drawFit(ctx, img, x, y, w, h, idx) {
        // loadImage() resolve(null) kalau foto gagal dimuat. Tanpa guard ini
        // `img.width` di bawah melempar TypeError dan satu export ikut gagal
        // semua, jadi slot yang fotonya rusak cukup dilewati (sel kosong).
        if (!img) return;
        if (w <= 0 || h <= 0) return;
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();

        const box = fitRect(img, x, y, w, h);
        const t = state.tx[idx] || { scale: 1, fx: 0, fy: 0 };
        const cx = x + w / 2;
        const cy = y + h / 2;
        ctx.translate(cx + t.fx * w, cy + t.fy * h);
        ctx.scale(t.scale, t.scale);
        ctx.drawImage(img, box.x - cx, box.y - cy, box.w, box.h);
        ctx.restore();
      }

      /** Bangun PNG hasil grid (belum menyentuh nama file). */
      async function buildExport() {
        const aspect = currentAspect();
        const canvas = el.canvas;
        canvas.width = aspect.w;
        canvas.height = aspect.h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const def = getLayoutDef();
        // Direset tiap export. Kalau naik, ada foto yang gagal dimuat dan
        // dilewati (bukan crash), lalu dilaporkan lewat toast di bawah.
        let gagalMuat = 0;

        for (let idx = 0; idx < state.count; idx++) {
          const src = state.images[idx];
          if (!src) continue;
          const img = await loadImage(src);
          if (!img) {
            gagalMuat++;
            continue;
          }
          const rect = areaToRect(
            def.areas[idx],
            def.cols,
            def.rows,
            canvas.width,
            canvas.height,
          );
          drawFit(ctx, img, rect.x, rect.y, rect.w, rect.h, idx);
        }

        const dataUrl = canvas.toDataURL("image/png");
        const blob = await new Promise((resolve) =>
          canvas.toBlob(resolve, "image/png"),
        );
        return { dataUrl, blob, gagalMuat };
      }

      /** Tampilkan hasil export di panel unduhan. */
      async function tampilkanExport({ namaBaru = true } = {}) {
        const { dataUrl, blob, gagalMuat } = await buildExport();
        dl.dataUrl = dataUrl;
        dl.blob = blob;
        if (namaBaru) dl.fileName = getNextFileName();
        el.previewImg.src = dl.dataUrl;

        const sizeKB = Math.round((dl.dataUrl.length * 3) / 4 / 1024);
        const sizeText =
          sizeKB > 1024
            ? (sizeKB / 1024).toFixed(1) + " MB"
            : sizeKB + " KB";
        el.badge.textContent = dl.fileName + " · " + sizeText;
        showBubble();

        // Notifikasi ini hanya untuk KEGAGALAN (foto rusak), bukan untuk
        // keberhasilan -- jadi tetap ditampilkan. Kalau sampai dihapus juga,
        // foto yang gagal dimuat akan terlihat seperti slot kosong biasa
        // dan user tidak pernah tahu ada yang salah.
        if (gagalMuat > 0) {
          showToast(
            gagalMuat + " foto gagal dimuat, dilewati. Coba pilih ulang fotonya.",
            "err",
          );
        }
      }

      el.downloadBtn.addEventListener("click", () =>
        tampilkanExport().catch((err) =>
          showToast("Gagal membuat gambar: " + err.message, "err"),
        ),
      );

      /* ---------- Init ---------- */

      syncCountButtons();
      updateAspectButton();
      updateLayoutButton();
      applyFitMode();
      renderGrid();
      checkReady();
    </script>
  </body>
</html>
