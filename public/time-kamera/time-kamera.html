<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TIME KAMERA</title>
  <link rel="manifest" href="../../manifest.json" />
  <meta content="#fffbf2" name="theme-color" />
  <link rel="stylesheet" href="../mori-style.css" />
  <style>
    /* Frame galeri ala menu kopi/index: bingkai 1.5px + radius 10px,
       padding dalam 14px. */
    .menu-frame{
      width:100%;
      background:var(--mori-bg);
      border:1.5px solid rgba(26,25,23,0.3);
      border-radius:10px;
      overflow:hidden
    }
    .menu-frame .grid{padding:14px}

    .menu-frame.card{padding:14px}
    .menu-frame.card h2{
      font-size:9px;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      color:var(--mori-text-2);
      margin-bottom:10px
    }

    .shot-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:16px 10px;
      width:100%;
      align-content:start
    }
    @media(min-width:768px){.shot-grid{gap:22px 14px}}
    @media(max-width:360px){.shot-grid{grid-template-columns:repeat(2,1fr);gap:12px 8px}}

    .shot{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      min-width:0;
      width:100%;
      background:var(--mori-bg);
      border:1.5px solid rgba(26,25,23,0.3);
      border-radius:10px;
      padding:14px;
      overflow:hidden
    }
    .shot-img-wrap{
      width:100%;
      max-width:100px;
      aspect-ratio:9/16;
      border-radius:8px;
      background:var(--mori-surface);
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:10px;
      border:none;
      box-shadow:none;
      overflow:hidden
    }
    .shot-img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block
    }
    .shot-img-fallback{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block
    }
    .shot-time{
      font-family:var(--mori-mono);
      font-size:9px;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      color:var(--mori-text);
      margin-top:6px;
      line-height:1.3
    }
    .shot-lokasi{
      font-size:9px;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
      color:var(--mori-text-2);
      margin-top:4px;
      line-height:1.3;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical
    }
    .shot-actions{
      display:flex;
      gap:6px;
      margin-top:8px;
      width:100%
    }
    .shot-actions .btn{
      flex:1;
      padding:8px 6px;
      font-size:9px
    }
    .field-sm{
      font-size:12px;
      padding:9px 10px
    }
    /* Kamera: card krem senada menu kopi */
    .cam-card{padding:0;background:var(--mori-bg);border-color:rgba(26,25,23,0.3);border-radius:10px}
    .cam-stage{position:relative;border-radius:9px 9px 0 0;overflow:hidden;background:var(--mori-surface);touch-action:none}

    /* Info overlay di atas gambar: jam, koordinat, alamat */
    .cam-info{
      position:absolute;
      left:12px;
      right:12px;
      bottom:36px;
      z-index:3;
      padding:0;
      background:transparent;
      color:#fff;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      pointer-events:none
    }
    .cam-info>div{
      width:100%;
      max-width:100%;
      text-align:left;
      text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.7)
    }
    .cam-time{
      position:static!important;
      background:transparent!important;
      padding:0!important;
      font-family:var(--mori-mono);
      font-size:13px!important;
      font-weight:700!important;
      letter-spacing:.3px;
      line-height:1.5!important;
      color:#fff!important
    }
    .cam-koordinat{
      font-family:var(--mori-mono);
      font-size:11px;
      line-height:1.5;
      color:rgba(255,255,255,.8);
      word-break:break-all;
      margin-top:3px
    }
    .cam-lokasi{
      font-family:var(--mori-mono);
      font-size:11px;
      line-height:1.5;
      color:rgba(255,255,255,.92);
      margin-top:3px;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden
    }

    /* Bar kontrol ala kamera HP: galeri kiri, shutter tengah, ganti kamera kanan */
    .cam-controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 22px 18px;background:var(--mori-bg);border-top:1px solid rgba(26,25,23,.1)}
    .cam-controls-side{display:flex;align-items:center;min-width:0}
    .cam-controls-side:first-child{justify-content:flex-start}
    .cam-controls-side:last-child{justify-content:flex-end}
    .cam-controls-side[hidden]{visibility:hidden}
    .gallery-thumb{
      position:relative;
      width:46px;
      height:46px;
      border-radius:12px;
      border:1.5px solid rgba(26,25,23,.3);
      background-size:cover;
      background-position:center;
      background-color:var(--mori-surface);
      cursor:pointer;
      padding:0;
      transition:transform .15s ease,border-color .15s ease
    }
    .gallery-thumb:active{transform:scale(.94);border-color:var(--mori-text)}
    .gallery-thumb::after{
      content:attr(data-count);
      position:absolute;
      top:-7px;
      right:-7px;
      min-width:17px;
      height:17px;
      padding:0 4px;
      border-radius:99px;
      background:#ff5436;
      border:1.5px solid var(--mori-bg);
      color:#fff;
      font-family:var(--mori-mono);
      font-size:9px;
      font-weight:700;
      line-height:14px;
      text-align:center
    }
    .gallery-thumb[data-count="0"]::after,.gallery-thumb:not([data-count])::after{display:none}

    /* Tombol ikon kamera (senter, grid, ganti kamera) */
    .cam-icon-btn{
      width:40px;
      height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,251,242,.9);
      border:1px solid rgba(26,25,23,.18);
      border-radius:50%;
      color:var(--mori-text);
      cursor:pointer;
      padding:0;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      transition:background .15s ease,color .15s ease,transform .1s ease
    }
    .cam-icon-btn:active{transform:scale(.92)}
    .cam-icon-btn.on{background:#ff5436;color:#fff;border-color:#ff5436}
    .cam-icon-btn:disabled{opacity:.4;cursor:not-allowed}
    .cam-icon-btn[hidden]{display:none}

    /* Bar atas dalam video: senter + grid */
    .cam-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:flex-end;gap:8px;z-index:3}

    /* Grid 3x3 */
    .cam-grid{position:absolute;inset:0;z-index:2;pointer-events:none}
    .cam-grid[hidden]{display:none}
    .cam-grid i{position:absolute;background:rgba(255,255,255,.32)}
    .cam-grid .gv{top:0;bottom:0;width:1px}
    .cam-grid .gh{left:0;right:0;height:1px}

    /* Ring fokus saat tap layar */
    .focus-ring{
      position:absolute;
      width:62px;
      height:62px;
      margin:-31px 0 0 -31px;
      border:1.5px solid #ffd60a;
      border-radius:8px;
      pointer-events:none;
      opacity:0;
      z-index:3
    }
    .focus-ring.show{animation:focusPop .8s ease forwards}
    @keyframes focusPop{
      0%{opacity:1;transform:scale(1.3)}
      25%{opacity:1;transform:scale(1)}
      75%{opacity:1;transform:scale(1)}
      100%{opacity:0;transform:scale(.9)}
    }

    /* Pill zoom */
    .zoom-pill{
      position:absolute;
      left:50%;
      bottom:12px;
      transform:translateX(-50%);
      padding:4px 11px;
      border-radius:99px;
      background:rgba(255,251,242,.92);
      border:1px solid rgba(26,25,23,.2);
      color:var(--mori-text);
      font-family:var(--mori-mono);
      font-size:11px;
      font-weight:700;
      letter-spacing:.5px;
      line-height:1;
      pointer-events:none;
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      z-index:3
    }
    .zoom-pill[hidden]{display:none}

    /* Kilat shutter */
    .cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
    .cam-flash.on{animation:shotFlash .26s ease-out}
    @keyframes shotFlash{0%{opacity:.85}100%{opacity:0}}

    /* Kamera depan dibalik seperti cermin */
    .cam-stage.mirror .cam-video{transform:scaleX(-1)}

    /* Shutter dengan cincin luar */
    .shutter{
      width:74px;
      height:74px;
      border-radius:50%;
      background:transparent;
      border:3px solid var(--mori-text);
      box-shadow:0 0 0 3px rgba(26,25,23,.12),0 2px 10px rgba(26,25,23,.18);
      cursor:pointer;
      padding:0;
      position:relative;
      transition:transform .12s ease
    }
    .shutter::after{
      content:'';
      position:absolute;
      inset:4px;
      border-radius:50%;
      background:#ff5436;
      transition:transform .12s ease
    }
    .shutter:active{transform:scale(.95)}
    .shutter:active::after{transform:scale(.9)}
    .shutter:disabled{opacity:.4;cursor:not-allowed}
    /* Rasio layar HP 9:16, video mengisi penuh */
    .cam-video{width:100%;height:auto;aspect-ratio:9/16;object-fit:cover;max-height:none}

    /* Preview hasil jepretan (full-screen ala kamera HP) */
    .preview{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
    .preview[hidden]{display:none}
    .preview-top{display:flex;justify-content:flex-start;padding:10px 14px;flex-shrink:0}
    .preview-close{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#fff;font-size:30px;line-height:1;cursor:pointer;padding:0}
    .preview-body{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center}
    .preview-img{width:100%;max-width:560px;max-height:100%;object-fit:contain;display:block;background:#000}
    .preview-info{width:100%;max-width:560px;padding:14px 18px 6px;font-family:var(--mori-mono);font-size:12px;line-height:1.5;color:#fff;word-break:break-word;flex-shrink:0}
    .preview-info .pi-waktu{font-weight:700;letter-spacing:.3px}
    .preview-info .pi-sub{color:rgba(255,255,255,.7);margin-top:3px}
    .preview-actions{display:flex;gap:10px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:#000;flex-shrink:0}
    .preview-actions .btn{flex:1;min-width:0;background:transparent;color:#fff;border-color:transparent;font-weight:600}
    .preview-actions .btn.primary{flex:0 0 auto;background:#ff5436;color:#fff;border-color:#ff5436;padding:12px 28px}
  </style>
</head>
<body>
  <div class="app">
    <div class="menu-frame card cam-card">
      <div class="cam-stage" id="camStage">
        <video id="video" class="cam-video" playsinline muted autoplay></video>
        <div class="cam-grid" id="camGrid" hidden><i class="gv" style="left:33.33%"></i><i class="gv" style="left:66.66%"></i><i class="gh" style="top:33.33%"></i><i class="gh" style="top:66.66%"></i></div>
        <div class="cam-top">
          <button id="btnTorch" class="cam-icon-btn" type="button" title="Senter" aria-label="Senter" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z"/></svg>
          </button>
          <button id="btnGrid" class="cam-icon-btn" type="button" title="Grid" aria-label="Grid">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
          </button>
        </div>
        <div class="focus-ring" id="focusRing"></div>
        <div class="cam-info">
          <div class="cam-time" id="ovTime">--:--:--</div>
          <div class="cam-koordinat" id="ovKoordinat">-</div>
          <div class="cam-lokasi" id="ovLokasi">Mencari lokasi...</div>
        </div>
        <div class="zoom-pill" id="zoomPill" hidden>1×</div>
        <div class="cam-flash" id="camFlash"></div>
      </div>
      <div class="cam-controls">
        <div class="cam-controls-side">
          <button id="btnGallery" class="gallery-thumb" type="button" aria-label="Lihat riwayat" title="Lihat riwayat" hidden></button>
        </div>
        <button id="btnSnap" class="shutter" type="button" aria-label="Jepret" disabled></button>
        <div class="cam-controls-side">
          <button id="btnSwitch" class="cam-icon-btn" type="button" title="Ganti Kamera" aria-label="Ganti Kamera" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-4"/><path d="M4 5v4h4"/><path d="M4 13a8 8 0 0 0 14.9 4"/><path d="M20 19v-4h-4"/></svg>
          </button>
        </div>
      </div>
    </div>

    <input id="inLokasi" type="hidden" />
    <input id="inBaris" type="hidden" />
    <input id="inCatatan" type="hidden" />

    <div class="menu-frame card" id="galeriCard" hidden>
      <div class="shot-grid" id="shots"></div>
    </div>
  </div>

  <div id="preview" class="preview" hidden>
    <div class="preview-top">
      <button id="btnClosePreview" class="preview-close" type="button" aria-label="Tutup">×</button>
    </div>
    <div class="preview-info" id="previewInfo"></div>
    <div class="preview-body">
      <img id="previewImg" class="preview-img" src="" alt="Hasil jepretan" />
    </div>
    <div class="preview-actions">
      <button id="btnRetake" class="btn" type="button">Ambil ulang</button>
      <button id="btnLanjut" class="btn primary" type="button">Lanjut</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    const KEY = "mylove_timekamera_v1";
    const video = document.getElementById("video");
    const ovTime = document.getElementById("ovTime");
    const ovKoordinat = document.getElementById("ovKoordinat");
    const ovLokasi = document.getElementById("ovLokasi");
    const btnSwitch = document.getElementById("btnSwitch");
    const btnSnap = document.getElementById("btnSnap");
    const btnGallery = document.getElementById("btnGallery");
    const galleryRow = btnGallery.parentElement;
    const camStage = document.getElementById("camStage");
    const camGrid = document.getElementById("camGrid");
    const camFlash = document.getElementById("camFlash");
    const focusRing = document.getElementById("focusRing");
    const zoomPill = document.getElementById("zoomPill");
    const btnTorch = document.getElementById("btnTorch");
    const btnGrid = document.getElementById("btnGrid");
    const preview = document.getElementById("preview");
    const previewImg = document.getElementById("previewImg");
    const previewInfo = document.getElementById("previewInfo");
    const btnRetake = document.getElementById("btnRetake");
    const btnLanjut = document.getElementById("btnLanjut");
    const btnClosePreview = document.getElementById("btnClosePreview");
    const inLokasi = document.getElementById("inLokasi");
    const inBaris = document.getElementById("inBaris");
    const inCatatan = document.getElementById("inCatatan");
    const shotsEl = document.getElementById("shots");
    const galeriCard = document.getElementById("galeriCard");

    const toastEl = document.getElementById("toast");

    let shots = load();
    let stream = null;
    let facing = "environment";
    let filter = "all";
    let lokasiKoordinat = "";
    let pendingShot = null;
    let zoomCaps = null;
    let zoomVal = 1;
    let torchOn = false;
    let snapping = false;
    let lastTap = 0;
    let pinchStartDist = 0;
    let pinchStartZoom = 1;
    let wakeLock = null;
    let starting = false;

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        console.warn("gagal baca time kamera", e);
        return [];
      }
    }

    // localStorage biasanya 5MB -> foto disimpan sebagai dataURL kecil (JPEG q0.7, max 720px)
    function persist() {
      try {
        localStorage.setItem(KEY, JSON.stringify(shots));
      } catch (e) {
        console.warn("penyimpanan penuh, hapus foto terlama", e);
        if (shots.length > 1) {
          shots = shots.slice(0, Math.max(1, Math.floor(shots.length / 2)));
          try {
            localStorage.setItem(KEY, JSON.stringify(shots));
          } catch (e2) {}
          toast("Penyimpanan penuh — foto lama dihapus");
        } else {
          toast("Penyimpanan penuh");
        }
      }
    }

    let toastTimer = null;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2200);
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function fmtClock(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "-";
      return (
        pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds())
      );
    }

    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "-";
      return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "2-digit" });
    }

    function inFilter(iso) {
      if (filter === "all") return true;
      const d = new Date(iso);
      if (isNaN(d.getTime())) return false;
      const t = new Date();
      t.setHours(0, 0, 0, 0);
      const age = Math.floor((t - d) / 86400000);
      if (filter === "today") return age === 0;
      if (filter === "7d") return age >= 0 && age <= 6;
      return true;
    }

    // Pecah teks jadi beberapa baris sesuai lebar canvas
    function wrapCanvasText(ctx, text, maxWidth) {
      const words = String(text || "").split(/\s+/).filter(Boolean);
      const lines = [];
      let line = "";
      for (const w of words) {
        const test = line ? line + " " + w : w;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = w;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    // Tulis jam/koordinat/alamat langsung ke foto (ala time camera)
    function drawStamp(ctx, cw, ch, info) {
      const padX = Math.max(10, Math.round(cw * 0.03));
      const padBottom = Math.max(24, Math.round(ch * 0.05));
      const fs = Math.max(12, Math.round(cw * 0.032));
      const sub = Math.max(10, Math.round(fs * 0.85));
      ctx.save();
      ctx.textBaseline = "bottom";
      ctx.lineJoin = "round";
      ctx.font = "400 " + sub + "px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";
      const rows = [];
      if (info.waktu) rows.push({ t: info.waktu, f: fs, bold: true });
      if (info.koordinat) rows.push({ t: info.koordinat, f: sub, bold: false });
      if (info.lokasi) {
        wrapCanvasText(ctx, info.lokasi, cw - padX * 2).slice(0, 3).forEach((line) => {
          rows.push({ t: line, f: sub, bold: false });
        });
      }
      let y = ch - padBottom;
      for (let i = rows.length - 1; i >= 0; i--) {
        const r = rows[i];
        ctx.font = (r.bold ? "700 " : "400 ") + r.f + "px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";
        ctx.strokeStyle = "rgba(0,0,0,.85)";
        ctx.lineWidth = Math.max(2, Math.round(r.f * 0.3));
        ctx.strokeText(r.t, padX, y);
        ctx.fillStyle = r.bold ? "#fff" : "rgba(255,255,255,.94)";
        ctx.fillText(r.t, padX, y);
        y -= Math.round(r.f * 1.5);
      }
      ctx.restore();
    }

    // Ambil frame persis seperti tampilan (crop tengah 9:16) lalu resize max 720px
    function shrink(source, maxSide, info) {
      const vw = source.videoWidth || source.width;
      const vh = source.videoHeight || source.height;
      if (!vw || !vh) return null;
      const targetRatio = 9 / 16;
      let sw = vw;
      let sh = vh;
      let sx = 0;
      let sy = 0;
      if (vw / vh > targetRatio) {
        sw = vh * targetRatio;
        sx = (vw - sw) / 2;
      } else {
        sh = vw / targetRatio;
        sy = (vh - sh) / 2;
      }
      const scale = Math.min(1, maxSide / Math.max(sw, sh));
      const cw = Math.max(1, Math.round(sw * scale));
      const ch = Math.max(1, Math.round(sh * scale));
      const c = document.createElement("canvas");
      c.width = cw;
      c.height = ch;
      const ctx = c.getContext("2d");
      if (facing === "user") {
        ctx.translate(cw, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(source, sx, sy, sw, sh, 0, 0, cw, ch);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawStamp(ctx, cw, ch, info || {});
      return c.toDataURL("image/jpeg", 0.7);
    }

    function shotHtml(s) {
      const meta = [];
      if (s.lokasi) meta.push(esc(s.lokasi));
      if (s.baris) meta.push(esc(s.baris));
      return (
        '<div class="shot">' +
        '<div class="shot-img-wrap">' +
        '<img class="shot-img" src="' + s.img + '" alt="Hasil jepretan" />' +
        '</div>' +
        '<div class="shot-time">' + fmtDate(s.at) + " · " + fmtClock(s.at) + "</div>" +
        (meta.length
          ? '<div class="shot-lokasi">' + meta.join(" · ") + "</div>"
          : '<div class="shot-lokasi" style="opacity:.6">Tanpa keterangan</div>') +
        (s.catatan ? '<div class="shot-lokasi">' + esc(s.catatan) + "</div>" : "") +
        '<div class="shot-actions">' +
        '<button type="button" class="btn sm" data-dl="' + s.id + '">Simpan</button>' +
        '<button type="button" class="btn sm danger" data-del="' + s.id + '">Hapus</button>' +
        "</div>" +
        "</div>"
      );
    }

    function render() {
      const visible = shots.filter((s) => inFilter(s.at));
      if (!visible.length) {
        shotsEl.innerHTML = "";
        galeriCard.hidden = true;
        galleryRow.hidden = true;
        btnGallery.hidden = true;
        return;
      }
      galleryRow.hidden = false;
      btnGallery.hidden = false;
      btnGallery.dataset.count = String(visible.length);
      btnGallery.style.backgroundImage = 'url("' + visible[0].img + '")';
      shotsEl.innerHTML = visible.map(shotHtml).join("");
      shotsEl.querySelectorAll("[data-dl]").forEach((b) => {
        b.addEventListener("click", () => download(parseInt(b.dataset.dl)));
      });
      shotsEl.querySelectorAll("[data-del]").forEach((b) => {
        b.addEventListener("click", () => {
          shots = shots.filter((s) => s.id !== parseInt(b.dataset.del));
          persist();
          render();
          toast("Dihapus");
        });
      });
    }

    function download(id) {
      const s = shots.find((x) => x.id === id);
      if (!s) return;
      const name =
        "timekamera_" +
        new Date(s.at).toISOString().replace(/[:.]/g, "-") +
        ".jpg";
      const a = document.createElement("a");
      a.href = s.img;
      a.download = name;
      a.click();
      toast("Tersimpan");
    }

    function currentTrack() {
      return stream ? stream.getVideoTracks()[0] : null;
    }

    function fmtZoom(v) {
      return String(Math.round(v * 10) / 10).replace(".", ",") + "×";
    }

    function updateZoomPill() {
      zoomPill.textContent = fmtZoom(zoomVal);
    }

    async function applyZoom(v) {
      const t = currentTrack();
      if (!t || !zoomCaps) return;
      const val = Math.min(zoomCaps.max, Math.max(zoomCaps.min, v));
      try {
        await t.applyConstraints({ advanced: [{ zoom: val }] });
        zoomVal = val;
        updateZoomPill();
      } catch (e) {}
    }

    function setupTrackFeatures() {
      const t = currentTrack();
      if (!t) return;
      const caps = t.getCapabilities ? t.getCapabilities() : {};
      if (caps.zoom && caps.zoom.max > caps.zoom.min) {
        zoomCaps = caps.zoom;
        zoomVal = Math.max(caps.zoom.min, 1);
        zoomPill.hidden = false;
        updateZoomPill();
        applyZoom(zoomVal);
      } else {
        zoomCaps = null;
        zoomPill.hidden = true;
      }
      btnTorch.hidden = !caps.torch;
      torchOn = false;
      btnTorch.classList.remove("on");
      camStage.classList.toggle("mirror", facing === "user");
    }

    async function start() {
      if (stream || starting) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        toast("Kamera tidak didukung");
        return;
      }
      starting = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play().catch(() => {});
        btnSnap.disabled = false;
        btnSwitch.disabled = false;
        setupTrackFeatures();
      } catch (e) {
        const msg = (e && e.name) === "NotAllowedError" ? "Izin kamera ditolak" : "Gagal: " + (e && e.name);
        toast(msg);
        console.warn("getUserMedia", e);
      } finally {
        starting = false;
      }
    }

    function stop() {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      video.srcObject = null;
      btnSnap.disabled = true;
      btnSwitch.disabled = true;
      zoomCaps = null;
      zoomVal = 1;
      zoomPill.hidden = true;
      torchOn = false;
      btnTorch.hidden = true;
      btnTorch.classList.remove("on");
      camStage.classList.remove("mirror");
    }

    btnSwitch.addEventListener("click", async () => {
      facing = facing === "environment" ? "user" : "environment";
      toast(facing === "user" ? "Kamera depan" : "Kamera belakang");
      stop();
      await start();
    });

    // Senter (torch)
    btnTorch.addEventListener("click", async () => {
      const t = currentTrack();
      if (!t) return;
      try {
        await t.applyConstraints({ advanced: [{ torch: !torchOn }] });
        torchOn = !torchOn;
        btnTorch.classList.toggle("on", torchOn);
      } catch (e) {
        toast("Senter tidak didukung");
      }
    });

    // Grid 3x3
    btnGrid.addEventListener("click", () => {
      camGrid.hidden = !camGrid.hidden;
      btnGrid.classList.toggle("on", !camGrid.hidden);
    });

    function jarak(a, b) {
      return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    }

    // Pinch untuk zoom (kalau kamera mendukung)
    camStage.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        pinchStartDist = jarak(e.touches[0], e.touches[1]);
        pinchStartZoom = zoomVal;
      }
    }, { passive: true });

    camStage.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && pinchStartDist && zoomCaps) {
        e.preventDefault();
        applyZoom(pinchStartZoom * (jarak(e.touches[0], e.touches[1]) / pinchStartDist));
      }
    }, { passive: false });

    camStage.addEventListener("touchend", () => { pinchStartDist = 0; });

    // Tap untuk fokus, double tap untuk zoom 1x/2x
    camStage.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      const rect = camStage.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      focusRing.style.left = x + "px";
      focusRing.style.top = y + "px";
      focusRing.classList.remove("show");
      void focusRing.offsetWidth;
      focusRing.classList.add("show");

      const t = currentTrack();
      if (t && t.applyConstraints) {
        const px = Math.min(1, Math.max(0, x / rect.width));
        const py = Math.min(1, Math.max(0, y / rect.height));
        t.applyConstraints({ advanced: [{ pointsOfInterest: [{ x: px, y: py }] }] }).catch(() => {});
      }

      const now = Date.now();
      if (now - lastTap < 320 && zoomCaps) {
        const target = zoomVal > zoomCaps.min + 0.01 ? zoomCaps.min : Math.min(2, zoomCaps.max);
        applyZoom(target);
      }
      lastTap = now;
    });
    function fmtWaktuLengkap(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "-";
      const hari = d.toLocaleDateString("id-ID", { day: "2-digit", timeZone: "Asia/Jakarta" });
      const bulan = d.toLocaleDateString("id-ID", { month: "long", timeZone: "Asia/Jakarta" });
      const tahun = d.toLocaleDateString("id-ID", { year: "numeric", timeZone: "Asia/Jakarta" });
      const jam = d.toLocaleTimeString("id-ID", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: "Asia/Jakarta",
      });
      return hari + "-" + bulan + "-" + tahun + " " + jam + " WIB";
    }

    function bukaPreview(shot) {
      pendingShot = shot;
      previewImg.src = shot.img;
      const lokasi = shot.lokasi || "-";
      previewInfo.innerHTML =
        '<div class="pi-waktu">' + fmtWaktuLengkap(shot.at) + '</div>' +
        '<div class="pi-sub">' + (lokasiKoordinat || "-") + '</div>' +
        '<div class="pi-sub">' + lokasi.toUpperCase() + '</div>' +
        '<div class="pi-sub">Nomor Pesanan: ' + shot.id + '</div>';
      preview.hidden = false;
    }

    function tutupPreview() {
      preview.hidden = true;
      previewImg.src = "";
      pendingShot = null;
    }

    btnSnap.addEventListener("click", () => {
      if (!stream || snapping) return;
      snapping = true;
      setTimeout(() => { snapping = false; }, 450);

      // Efek kamera: kilat + getar
      camFlash.classList.remove("on");
      void camFlash.offsetWidth;
      camFlash.classList.add("on");
      if (navigator.vibrate) navigator.vibrate(12);

      const waktuFoto = fmtWaktuLengkap(new Date().toISOString());
      const alamat = inLokasi.value.trim();
      const img = shrink(video, 720, {
        waktu: waktuFoto,
        koordinat: lokasiKoordinat,
        lokasi: alamat && alamat !== lokasiKoordinat ? alamat : "",
      });
      if (!img) {
        toast("Gagal ambil frame");
        return;
      }
      bukaPreview({
        id: Date.now(),
        img,
        lokasi: inLokasi.value.trim(),
        baris: inBaris.value.trim(),
        catatan: inCatatan.value.trim(),
        at: new Date().toISOString(),
      });
    });

    btnRetake.addEventListener("click", tutupPreview);
    btnClosePreview.addEventListener("click", tutupPreview);
    btnLanjut.addEventListener("click", () => {
      if (!pendingShot) return;
      shots.unshift(pendingShot);
      persist();
      render();
      tutupPreview();
    });

    // Isi lokasi otomatis sesuai nama tempat dari koordinat GPS (reverse geocoding)
    async function isiLokasiOtomatis() {
      if (!navigator.geolocation) {
        ovLokasi.textContent = "GPS tidak didukung";
        return;
      }
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude } = pos.coords;
          const koordinat = latitude.toFixed(5) + ", " + longitude.toFixed(5);
          lokasiKoordinat = koordinat;
          inLokasi.value = koordinat;
          ovKoordinat.textContent = koordinat;
          try {
            // Nominatim (OpenStreetMap) — reverse geocoding gratis tanpa API key
            const res = await fetch(
              "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
                latitude + "&lon=" + longitude + "&zoom=18&addressdetails=1",
              { headers: { "Accept-Language": "id" } },
            );
            if (!res.ok) return;
            const data = await res.json();
            const a = data.address || {};
            const bagian = [
              a.road || a.pedestrian || a.footway,
              a.suburb || a.neighbourhood || a.village,
              a.city || a.town || a.regency || a.county,
            ].filter(Boolean);
            const nama = (bagian.length ? bagian.join(", ") : data.display_name || "").trim();
            if (nama) {
              inLokasi.value = nama;
              ovLokasi.textContent = nama;
            }
          } catch (e) {
            // biarkan koordinat kalau gagal ambil nama tempat
          }
        },
        () => { ovLokasi.textContent = "Lokasi tidak tersedia"; },
        { enableHighAccuracy: true, timeout: 8000 },
      );
    }
    isiLokasiOtomatis();

    btnGallery.addEventListener("click", () => {
      galeriCard.hidden = !galeriCard.hidden;
      if (!galeriCard.hidden) galeriCard.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    // Layar tetap nyala selama kamera terbuka
    async function keepAwake() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (e) {}
    }
    keepAwake();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        keepAwake();
        start().catch(() => {});
      } else {
        stop();
      }
    });

    // Spasi untuk jepret, Esc untuk tutup preview (desktop)
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        if (!preview.hidden) return;
        e.preventDefault();
        btnSnap.click();
      }
      if (e.key === "Escape" && !preview.hidden) tutupPreview();
    });

    // jam overlay (tanggal + bulan + waktu)
    ovTime.textContent = fmtWaktuLengkap(new Date().toISOString());
    setInterval(() => {
      ovTime.textContent = fmtWaktuLengkap(new Date().toISOString());
    }, 1000);

    window.addEventListener("beforeunload", stop);

    render();
    // Selalu nyalakan kamera otomatis saat menu dibuka
    start().catch(() => {});
  </script>
</body>
</html>
