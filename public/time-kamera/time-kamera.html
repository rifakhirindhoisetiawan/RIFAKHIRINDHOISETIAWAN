<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TIME KAMERA</title>
  <link rel="manifest" href="../../manifest.json" />
  <meta content="#fffbf2" name="theme-color" />
  <link rel="stylesheet" href="../mori-style.css" />
  <style>
    .shot-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .shot {
      border: 1px solid var(--mori-accent);
      background: var(--mori-surface);
      padding: 10px;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .shot-img {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      border: 1px solid var(--mori-accent);
      background: #0d0d0f;
      display: block;
    }
    .shot-time {
      font-family: var(--mori-mono);
      font-size: 11px;
      font-weight: 700;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }
    .shot-lokasi {
      font-size: 10px;
      font-weight: 500;
      color: var(--mori-text-2);
      margin-top: 4px;
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .shot-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .shot-actions .btn {
      flex: 1;
      padding: 8px 6px;
      font-size: 9px;
    }
    .field-sm {
      font-size: 12px;
      padding: 9px 10px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .filters .btn {
      padding: 8px 12px;
      font-size: 10px;
      min-width: 0;
    }
    .filters .btn.on {
      background: var(--mori-accent);
      color: var(--mori-bg);
    }
    @media (max-width: 380px) {
      .shot-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="head">
      <a class="back" href="../../index.html" title="Kembali" aria-label="Kembali">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <div>
        <div class="head-title">Time Kamera</div>
        <div class="head-sub">Foto + keterangan lokasi &amp; baris</div>
      </div>
    </div>

    <div class="card">
      <h2>Kamera</h2>
      <div class="cam-stage">
        <video id="video" class="cam-video" playsinline muted autoplay></video>
        <div class="cam-overlay">
          <div class="cam-badge" id="ovDevice">MENUNGGU</div>
          <div class="cam-time" id="ovTime">--:--:--</div>
        </div>
      </div>
      <div class="btn-row">
        <button id="btnStart" class="btn primary" type="button">Nyalakan</button>
        <button id="btnSwitch" class="btn" type="button">Ganti Kamera</button>
        <button id="btnStop" class="btn danger" type="button">Matikan</button>
      </div>
      <p class="hint">Butuh izin kamera. Kalau tidak muncul, gunakan <b>HTTPS</b> atau <b>localhost</b>.</p>
    </div>

    <div class="card">
      <h2>Ambil Foto</h2>
      <div class="stack">
        <div>
          <label class="head-sub" for="inLokasi" style="display:block;margin-bottom:6px">Lokasi</label>
          <input id="inLokasi" class="field field-sm" placeholder="cth: Depan Rak A" autocomplete="off" />
        </div>
        <div>
          <label class="head-sub" for="inBaris" style="display:block;margin-bottom:6px">Baris / Line</label>
          <input id="inBaris" class="field field-sm" placeholder="cth: Baris 3, Kolom 2" autocomplete="off" />
        </div>
        <div>
          <label class="head-sub" for="inCatatan" style="display:block;margin-bottom:6px">Catatan</label>
          <input id="inCatatan" class="field field-sm" placeholder="opsional" autocomplete="off" />
        </div>
      </div>
      <div class="btn-row">
        <button id="btnSnap" class="btn primary" type="button" disabled>Jepret</button>
        <button id="btnGeo" class="btn" type="button">Isi Lokasi Otomatis</button>
      </div>
      <p class="hint">Lokasi &amp; baris otomatis tersimpan bersama foto. Waktu diambil dari jam device.</p>
    </div>

    <div class="card">
      <h2>Galeri â€” <span id="count">0</span></h2>
      <div class="filters">
        <button class="btn on" type="button" data-filter="all">Semua</button>
        <button class="btn" type="button" data-filter="today">Hari Ini</button>
        <button class="btn" type="button" data-filter="7d">7 Hari</button>
      </div>
      <div id="shots" class="shot-grid"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    const KEY = "mylove_timekamera_v1";
    const video = document.getElementById("video");
    const ovDevice = document.getElementById("ovDevice");
    const ovTime = document.getElementById("ovTime");
    const btnStart = document.getElementById("btnStart");
    const btnSwitch = document.getElementById("btnSwitch");
    const btnStop = document.getElementById("btnStop");
    const btnSnap = document.getElementById("btnSnap");
    const btnGeo = document.getElementById("btnGeo");
    const inLokasi = document.getElementById("inLokasi");
    const inBaris = document.getElementById("inBaris");
    const inCatatan = document.getElementById("inCatatan");
    const shotsEl = document.getElementById("shots");
    const countEl = document.getElementById("count");
    const toastEl = document.getElementById("toast");

    let shots = load();
    let stream = null;
    let facing = "environment";
    let filter = "all";

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (e) {
        console.warn("gagal baca time kamera", e);
        return [];
      }
    }

    // localStorage biasanya 5MB -> foto disimpan sebagai dataURL kecil (JPEG q0.7, max 720px)
    function persist() {
      try {
        localStorage.setItem(KEY, JSON.stringify(shots));
      } catch (e) {
        console.warn("penyimpanan penuh, hapus foto terlama", e);
        if (shots.length > 1) {
          shots = shots.slice(0, Math.max(1, Math.floor(shots.length / 2)));
          try {
            localStorage.setItem(KEY, JSON.stringify(shots));
          } catch (e2) {}
          toast("Penyimpanan penuh â€” foto lama dihapus");
        } else {
          toast("Penyimpanan penuh");
        }
      }
    }

    let toastTimer = null;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2200);
    }

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function fmtClock(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "-";
      return (
        pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds())
      );
    }

    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "-";
      return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "2-digit" });
    }

    function inFilter(iso) {
      if (filter === "all") return true;
      const d = new Date(iso);
      if (isNaN(d.getTime())) return false;
      const t = new Date();
      t.setHours(0, 0, 0, 0);
      const age = Math.floor((t - d) / 86400000);
      if (filter === "today") return age === 0;
      if (filter === "7d") return age >= 0 && age <= 6;
      return true;
    }

    // Resize ke max 720px supaya muat localStorage
    function shrink(source, maxSide) {
      const w = source.videoWidth || source.width;
      const h = source.videoHeight || source.height;
      if (!w || !h) return null;
      const scale = Math.min(1, maxSide / Math.max(w, h));
      const cw = Math.max(1, Math.round(w * scale));
      const ch = Math.max(1, Math.round(h * scale));
      const c = document.createElement("canvas");
      c.width = cw;
      c.height = ch;
      const ctx = c.getContext("2d");
      ctx.drawImage(source, 0, 0, cw, ch);
      return c.toDataURL("image/jpeg", 0.7);
    }

    function shotHtml(s) {
      const meta = [];
      if (s.lokasi) meta.push(esc(s.lokasi));
      if (s.baris) meta.push(esc(s.baris));
      return (
        '<div class="shot">' +
        '<img class="shot-img" src="' + s.img + '" alt="" />' +
        '<div class="shot-time">' + fmtDate(s.at) + " Â· " + fmtClock(s.at) + "</div>" +
        (meta.length
          ? '<div class="shot-lokasi">' + meta.join(" Â· ") + "</div>"
          : '<div class="shot-lokasi" style="opacity:.6">Tanpa keterangan</div>') +
        (s.catatan ? '<div class="shot-lokasi">' + esc(s.catatan) + "</div>" : "") +
        '<div class="shot-actions">' +
        '<button type="button" class="btn sm" data-dl="' + s.id + '">Simpan</button>' +
        '<button type="button" class="btn sm danger" data-del="' + s.id + '">Hapus</button>' +
        "</div>" +
        "</div>"
      );
    }

    function render() {
      const visible = shots.filter((s) => inFilter(s.at));
      countEl.textContent = visible.length;
      if (!visible.length) {
        shotsEl.innerHTML = '<div class="empty" style="grid-column:1/-1">' + (shots.length ? "Tidak ada di rentang ini" : "Belum ada foto") + "</div>";
        return;
      }
      shotsEl.innerHTML = visible.map(shotHtml).join("");
      shotsEl.querySelectorAll("[data-dl]").forEach((b) => {
        b.addEventListener("click", () => download(parseInt(b.dataset.dl)));
      });
      shotsEl.querySelectorAll("[data-del]").forEach((b) => {
        b.addEventListener("click", () => {
          shots = shots.filter((s) => s.id !== parseInt(b.dataset.del));
          persist();
          render();
          toast("Dihapus");
        });
      });
    }

    function download(id) {
      const s = shots.find((x) => x.id === id);
      if (!s) return;
      const name =
        "timekamera_" +
        new Date(s.at).toISOString().replace(/[:.]/g, "-") +
        ".jpg";
      const a = document.createElement("a");
      a.href = s.img;
      a.download = name;
      a.click();
      toast("Tersimpan");
    }

    async function start() {
      if (stream) return;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        toast("Kamera tidak didukung");
        return;
      }
      btnStart.disabled = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play().catch(() => {});
        btnSnap.disabled = false;
        ovDevice.textContent = facing === "user" ? "DEPAN" : "BELAKANG";
        toast("Kamera aktif");
      } catch (e) {
        btnStart.disabled = false;
        const msg = (e && e.name) === "NotAllowedError" ? "Izin ditolak" : "Gagal: " + (e && e.name);
        toast(msg);
        console.warn("getUserMedia", e);
      }
    }

    function stop() {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      video.srcObject = null;
      btnStart.disabled = false;
      btnSnap.disabled = true;
      ovDevice.textContent = "MATI";
    }

    btnStart.addEventListener("click", start);
    btnStop.addEventListener("click", () => {
      stop();
      toast("Dimatikan");
    });
    btnSwitch.addEventListener("click", async () => {
      if (!stream) {
        toast("Nyalakan kamera dulu");
        return;
      }
      facing = facing === "environment" ? "user" : "environment";
      stop();
      await start();
    });
    btnSnap.addEventListener("click", () => {
      if (!stream) return;
      const img = shrink(video, 720);
      if (!img) {
        toast("Gagal ambil frame");
        return;
      }
      shots.unshift({
        id: Date.now(),
        img,
        lokasi: inLokasi.value.trim(),
        baris: inBaris.value.trim(),
        catatan: inCatatan.value.trim(),
        at: new Date().toISOString(),
      });
      persist();
      render();
      toast("Terekam " + fmtClock(new Date().toISOString()));
    });

    btnGeo.addEventListener("click", () => {
      if (!navigator.geolocation) {
        toast("GPS tidak didukung");
        return;
      }
      toast("Mencari lokasi...");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          inLokasi.value =
            latitude.toFixed(5) + ", " + longitude.toFixed(5) +
            " (Â±" + Math.round(accuracy) + "m)";
          toast("Lokasi diisi");
        },
        () => toast("Gagal ambil lokasi"),
        { enableHighAccuracy: true, timeout: 8000 },
      );
    });

    document.querySelectorAll(".filters .btn").forEach((b) => {
      b.addEventListener("click", () => {
        filter = b.dataset.filter;
        document
          .querySelectorAll(".filters .btn")
          .forEach((x) => x.classList.toggle("on", x === b));
        render();
      });
    });

    // jam overlay
    setInterval(() => {
      if (stream) ovTime.textContent = fmtClock(new Date().toISOString());
    }, 1000);

    window.addEventListener("beforeunload", stop);

    render();
  </script>
</body>
</html>
