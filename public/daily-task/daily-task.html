<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>DAILY TASK</title>
    <link rel="manifest" href="../../manifest.json" />
    <meta name="theme-color" content="#fffbf2" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        position: relative;
      }

      @media (min-width: 800px) {
        .phone {
          max-width: 800px;
          margin: 0 auto;
        }
      }

      /* ===== SEARCH ROW ===== */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }
      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px 14px;
        color: #222;
        font-size: 14px;
        background: #f9f9f9;
      }
      .search-box:focus-within {
        border-color: #888;
        background: #fff;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: #222;
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }
      .search-box input::placeholder {
        color: #c3c8d1;
      }
      /* .admin-btn (tombol ⚙ di header) sudah dihapus: menu ADMIN kini
         jadi tile sendiri di dalam grid. */
      .search-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
        width: 18px;
        height: 18px;
      }

      /* ===== MENU GRID ===== */
      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 4px 18px 24px 22px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px 10px;
      }

      @media (min-width: 768px) {
        .grid {
          gap: 22px 14px;
        }
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: default;
        background: none;
        border: none;
      }

      .icon-tile {
        width: 100%;
        max-width: 160px;
        aspect-ratio: 4 / 3;
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 8px;
        position: relative;
        background: #f3f4f6;
      }

      @media (max-width: 480px) {
        .icon-tile {
          max-width: 140px;
        }
      }
      @media (max-width: 360px) {
        .icon-tile {
          max-width: 120px;
          aspect-ratio: 1 / 1;
          border-radius: 14px;
        }
      }

      .item.active-modul {
        cursor: pointer;
        text-decoration: none;
      }
      .item.active-modul span {
        color: #1f2937;
        font-weight: 800;
      }

      .item span {
        font-size: 11px;
        font-weight: 700;
        color: #b6bac2;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      @media (min-width: 768px) {
        .item span {
          font-size: 12px;
        }
      }

      /* ===== PALET GRADIENT ===== */
      .g-a {
        background: linear-gradient(135deg, #a5b4fc, #818cf8);
      }
      .g-b {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      }
      .g-c {
        background: linear-gradient(135deg, #93c5fd, #60a5fa);
      }
      .g-d {
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
      }
      .g-e {
        background: linear-gradient(135deg, #6ee7b7, #34d399);
      }
      .g-f {
        background: linear-gradient(135deg, #fcd34d, #fbbf24);
      }
      .g-g {
        background: linear-gradient(135deg, #fca5a5, #f87171);
      }
      .g-h {
        background: linear-gradient(135deg, #f0abfc, #e879f9);
      }

      .empty-msg {
        grid-column: 1 / -1;
        text-align: center;
        color: #9aa0ab;
        font-size: 13px;
        padding: 40px 0;
        font-weight: 600;
      }

      /* ============================================================
         TEMA MORI — override di atas, logika JS tidak disentuh.
         Palet dari public/mori/css/variables.css:
         bg #fffbf2 · surface #f7f3e9 · primary #1a1917 · text-secondary #6e6a64
         Gaya: sharp (radius 0), border hitam solid, shadow offset 4px.
         CATATAN: tile memakai inline style="background:gradient" dari JS,
         jadi gradien di bawah HARUS pakai !important.
         ============================================================ */
      :root {
        --mori-bg: #fffbf2;
        --mori-surface: #f7f3e9;
        --mori-text: #1a1917;
        --mori-text-2: #6e6a64;
        --mori-line: rgba(26, 25, 23, 0.14);
        --mori-accent: #1a1917;
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      html,
      body {
        background: var(--mori-bg);
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--mori-text);
        -webkit-font-smoothing: antialiased;
      }

      .phone {
        background: var(--mori-bg);
      }

      /* ===== SEARCH ===== */
      .search-box {
        border: 1px solid var(--mori-accent);
        border-radius: 0;
        background: var(--mori-surface);
        color: var(--mori-text);
        transition: box-shadow 0.2s ease;
      }
      .search-box:focus-within {
        background: #fffdf7;
        box-shadow: 4px 4px 0 var(--mori-accent);
      }
      .search-box input {
        color: var(--mori-text);
      }
      .search-box input::placeholder,
      .search-box svg {
        color: var(--mori-text-2);
      }

      /* ===== MENU ADMIN =====
         Tombol ⚙ di header sudah dihapus, sekarang jadi tile di grid. */
      .admin-btn {
        display: none;
      }

      /* ===== TILE PERIODE ===== */
      .section-label {
        font-family: var(--mori-mono);
        font-size: 10px;
        font-weight: 700;
        color: var(--mori-text);
        letter-spacing: 1.4px;
      }

      /* Aturan .icon-tile (gradien) yang di atas sudah tidak dipakai: tile menu
         sekarang memakai .icon-tile-foto + foto, atau shimmer krem kalau
         fotonya belum ada. */

      /* ===== TILE ADMIN =====
         Kotak hitam solid + ikon kunci (diisi lewat JS), foto tidak
         dipakai supaya tidak bergantung file gambar. */
      .icon-tile-foto.tile-admin {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--mori-accent);
        box-shadow: 4px 4px 0 rgba(26, 25, 23, 0.28);
      }
      .icon-tile-foto.tile-admin svg {
        width: 42%;
        height: 42%;
        max-width: 56px;
        max-height: 56px;
        color: var(--mori-bg);
      }
      .item.active-modul:hover .icon-tile-foto.tile-admin {
        box-shadow: 4px 4px 0 var(--mori-text-2);
      }
      .item.active-modul:active .icon-tile-foto.tile-admin {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--mori-text-2);
      }

      /* ===== TILE MENU (konsep sama dengan menu Stok Opname) =====
         Foto diambil dari image-daily-task/<slug>/1.jpg; kalau tidak ada,
         kotak krem + garis putus-putus (bukan gradien warna). */
      .icon-tile-foto {
        width: 100%;
        max-width: 160px;
        aspect-ratio: 9 / 16;
        border: 1px solid var(--mori-accent);
        border-radius: 0;
        overflow: hidden;
        margin-bottom: 8px;
        background: var(--mori-surface);
        box-shadow: 4px 4px 0 rgba(26, 25, 23, 0.12);
        transition: box-shadow 0.2s ease, transform 0.2s ease;
      }
      @media (max-width: 480px) {
        .icon-tile-foto {
          max-width: 120px;
        }
      }
      @media (max-width: 360px) {
        .icon-tile-foto {
          max-width: 104px;
        }
      }
      .icon-tile-foto img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .icon-tile-foto img.loaded {
        opacity: 1;
      }
      .icon-tile-foto.tanpa-foto {
        background: var(--mori-surface);
        background-image: linear-gradient(90deg, #f2eee2 25%, #e8e2d2 50%, #f2eee2 75%);
        background-size: 200% 100%;
        animation: dt-shimmer 1.4s infinite;
      }
      @keyframes dt-shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .item.active-modul:hover .icon-tile-foto {
        box-shadow: 4px 4px 0 var(--mori-accent);
      }
      .item.active-modul:active .icon-tile-foto {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--mori-accent);
      }

      .item span {
        font-family: var(--mori-mono);
        color: var(--mori-text-2);
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .item.active-modul span {
        color: var(--mori-text);
      }

      .empty-msg {
        font-family: var(--mori-mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--mori-text-2);
      }

      /* #status dihapus: baris "live dari Supabase" tidak lagi tampil,
         informasi jumlah menu / error cukup di console. */
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="Cari menu..."
            oninput="renderGrid()"
          />
        </div>
      </div>

      <div class="menu-wrap">
        <div class="grid" id="homeGrid"></div>
      </div>
    </div>

    
    <script type="module">
      import { supabase } from '../kopi/supabase.js';

      // Konsep sama seperti menu STOK OPNAME: daftar menu datang dari
      // Supabase (tabel daily_tasks), foto diambil dari folder
      // image-daily-task/<slug>/1.jpg, dan tile ADMIN ada di depan.
      // Menu HARI / MINGGU / BULAN yang dulu hardcoded sudah dihapus.
      const ADMIN_SLUG = 'admin';
      const adminMenu = {
        name: 'ADMIN',
        cls: 'g-h',
        href: 'daily-task-admin.html',
        slug: ADMIN_SLUG
      };

      const homeGrid = document.getElementById('homeGrid');
      const searchInput = document.getElementById('searchInput');
      let periods = [];

      const slugify = (s) =>
        String(s || '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');

      // Foto menu: coba beberapa ekstensi, kalau tidak ada tampilkan kotak
      // shimmer krem (tanpa file thumbnail cadangan).
      const FOTO_EXT = ['.jpg', '.jpeg', '.png', '.webp', '.svg'];

      // Foto tidak dimuat untuk tile ADMIN (bukan record daily_tasks).
      const tileFoto = (slug) => {
        const folder = 'image-daily-task/' + slug + '/';
        return `<div class="icon-tile-foto"><img
            src="${folder}1.jpg"
            alt=""
            loading="lazy"
            decoding="async"
            onerror="probeFoto(this)"
            data-folder="${folder}"
          /></div>`;
      };

      // Tile ADMIN: kotak hitam solid + ikon kunci (bukan foto), supaya jelas
      // bedanya dari tile menu dan tidak bergantung file gambar.
      const tileAdmin = () =>
        `<div class="icon-tile-foto tile-admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>`;

      // Probe 1.jpg -> 1.jpeg -> 1.png -> 1.webp -> 1.svg -> fallback.
      window.probeFoto = (img) => {
        const folder = img.dataset.folder;
        let i = 1;
        const next = () => {
          if (i >= FOTO_EXT.length) {
            img.removeAttribute('src');
            img.closest('.icon-tile-foto').classList.add('tanpa-foto');
            return;
          }
          const ext = FOTO_EXT[i++];
          const url = folder + '1' + ext;
          const t = new Image();
          t.onload = () => {
            img.src = url;
          };
          t.onerror = next;
          t.src = url;
        };
        img.onerror = null;
        next();
      };

      function renderGrid() {
        const q = searchInput.value.trim().toLowerCase();
        // ADMIN selalu jadi tile pertama; ikut difilter saat mengetik.
        const adminMatch = !q || adminMenu.name.toLowerCase().includes(q);
        const daftar = adminMatch ? [adminMenu] : [];
        daftar.push(
          ...periods.filter((p) => {
            const name = (p.name || p.title || '').toLowerCase();
            return name.includes(q);
          })
        );

        if (daftar.length === 0) {
          homeGrid.innerHTML = `<div class="empty-msg">${
            q ? 'Tidak ditemukan' : 'Belum ada menu. Buat dulu di menu ADMIN.'
          }</div>`;
          return;
        }

        homeGrid.innerHTML = daftar
          .map((p) => {
            const name = p.name || p.title || 'Tanpa nama';
            const slug = p.slug || '';
            const cls = p.cls || '';
            const href = p.href || (slug ? `../utility/${slug}.html` : '#');
            const isAdmin = slug === ADMIN_SLUG || p.isAdmin;
            return `<a class="item active-modul" href="${href}">
              ${isAdmin ? tileAdmin() : tileFoto(slug)}
              <span>${name}</span>
            </a>`;
          })
          .join('');
      }

      async function loadFromSupabase() {
        try {
          const { data, error } = await supabase.from('daily_tasks').select('*').order('id');
          if (error) throw error;
          periods = (data || []).map((r) => ({
            name: r.title || r.name || '',
            cls: r.cls || '',
            // link: pakai kolom href/description, fallback ke utility/<slug>.html
            href: r.href || r.description || '',
            slug: r.slug || r.period || slugify(r.title || r.name)
          }));
          if (periods.length) console.info('daily_tasks: ' + periods.length + ' menu dari Supabase');
          else console.warn('daily_tasks kosong - belum ada menu');
        } catch (e) {
          console.warn('Supabase daily_tasks gagal:', e.message);
          periods = [];
        }
        renderGrid();
      }

      searchInput.addEventListener('input', renderGrid);
      renderGrid();
      loadFromSupabase();

      // Realtime di-debounce: banyak event beruntun cukup fetch sekali.
      let rtTimer = null;
      try {
        supabase
          .channel('daily_tasks_changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'daily_tasks' }, () => {
            clearTimeout(rtTimer);
            rtTimer = setTimeout(() => loadFromSupabase(), 400);
          })
          .subscribe();
      } catch (e) {
        console.warn('Realtime daily_task tidak aktif', e.message);
      }
      window.renderGrid = renderGrid;
    </script>
  </body>
</html>
