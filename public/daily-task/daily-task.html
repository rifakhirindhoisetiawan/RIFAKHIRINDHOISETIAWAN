<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>DAILY TASK</title>
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        position: relative;
      }

      @media (min-width: 800px) {
        .phone {
          max-width: 800px;
          margin: 0 auto;
        }
      }

      /* ===== SEARCH ROW ===== */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }
      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px 14px;
        color: #222;
        font-size: 14px;
        background: #f9f9f9;
      }
      .search-box:focus-within {
        border-color: #888;
        background: #fff;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: #222;
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }
      .search-box input::placeholder {
        color: #c3c8d1;
      }
      .admin-btn {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
        color: #4f46e5;
        width: 38px;
        height: 38px;
        text-decoration: none;
      }
      .admin-btn:active {
        background: #eef2ff;
      }
      .search-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
        width: 18px;
        height: 18px;
      }

      /* ===== MENU GRID ===== */
      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 4px 18px 24px 22px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px 10px;
      }

      @media (min-width: 768px) {
        .grid {
          gap: 22px 14px;
        }
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: default;
        background: none;
        border: none;
      }

      .icon-tile {
        width: 100%;
        max-width: 160px;
        aspect-ratio: 4 / 3;
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 8px;
        position: relative;
        background: #f3f4f6;
      }

      @media (max-width: 480px) {
        .icon-tile {
          max-width: 140px;
        }
      }
      @media (max-width: 360px) {
        .icon-tile {
          max-width: 120px;
          aspect-ratio: 1 / 1;
          border-radius: 14px;
        }
      }

      .item.active-modul {
        cursor: pointer;
        text-decoration: none;
      }
      .item.active-modul span {
        color: #1f2937;
        font-weight: 800;
      }

      .item span {
        font-size: 11px;
        font-weight: 700;
        color: #b6bac2;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      @media (min-width: 768px) {
        .item span {
          font-size: 12px;
        }
      }

      /* ===== PALET GRADIENT ===== */
      .g-a {
        background: linear-gradient(135deg, #a5b4fc, #818cf8);
      }
      .g-b {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      }
      .g-c {
        background: linear-gradient(135deg, #93c5fd, #60a5fa);
      }
      .g-d {
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
      }
      .g-e {
        background: linear-gradient(135deg, #6ee7b7, #34d399);
      }
      .g-f {
        background: linear-gradient(135deg, #fcd34d, #fbbf24);
      }
      .g-g {
        background: linear-gradient(135deg, #fca5a5, #f87171);
      }
      .g-h {
        background: linear-gradient(135deg, #f0abfc, #e879f9);
      }

      .empty-msg {
        grid-column: 1 / -1;
        text-align: center;
        color: #9aa0ab;
        font-size: 13px;
        padding: 40px 0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="Cari periode..."
            oninput="renderGrid()"
          />
        </div>
        <a class="admin-btn" href="daily-task-admin.html" title="Kelola menu" aria-label="Kelola menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
      </div>

      <div class="menu-wrap">
        <div class="grid" id="homeGrid"></div>
      </div>
    </div>

    
    <script type="module">
      import { supabase } from '../kopi/supabase.js';
      const fallbackPeriods = [
        { name: "HARI", cls: "g-a", href: "../utility/hari.html", slug: "hari" },
        { name: "MINGGU", cls: "g-b", href: "../utility/minggu.html", slug: "minggu" },
        { name: "BULAN", cls: "g-c", href: "../utility/bulan.html", slug: "bulan" }
      ];
      let periods = [...fallbackPeriods];
      const homeGrid = document.getElementById("homeGrid");
      const searchInput = document.getElementById("searchInput");

      function renderGrid() {
        const q = searchInput.value.trim().toLowerCase();
        // normalize periods: support both {name,title} and {period,slug}
        const filtered = periods.filter((p) => {
          const name = (p.name || p.title || '').toLowerCase();
          return name.includes(q);
        });
        if (filtered.length === 0) {
          homeGrid.innerHTML = '<div class="empty-msg">Tidak ditemukan</div>';
          return;
        }
        homeGrid.innerHTML = filtered
          .map(
            (p) => {
              const name = p.name || p.title || '';
              const cls = p.cls || 'g-a';
              const href = p.href || p.description || '#';
              const slug = p.slug || p.period || name.toLowerCase();
              return `<a class="item active-modul" href="${href}">
                <div class="icon-tile" style="background:${clsGradient(cls)}"></div>
                <span>${name}</span>
              </a>`;
            }
          )
          .join("");
      }

      function clsGradient(cls) {
        const map = { 'g-a':'linear-gradient(135deg,#a5b4fc,#818cf8)','g-b':'linear-gradient(135deg,#c4b5fd,#a78bfa)','g-c':'linear-gradient(135deg,#93c5fd,#60a5fa)','g-d':'linear-gradient(135deg,#67e8f9,#22d3ee)','g-e':'linear-gradient(135deg,#6ee7b7,#34d399)','g-f':'linear-gradient(135deg,#fcd34d,#fbbf24)','g-g':'linear-gradient(135deg,#fca5a5,#f87171)','g-h':'linear-gradient(135deg,#f0abfc,#e879f9)' };
        return map[cls] || 'linear-gradient(135deg,#a5b4fc,#818cf8)';
      }

      async function loadFromSupabase() {
        try {
          const { data, error } = await supabase.from('daily_tasks').select('*').order('id');
          if (error) throw error;
          if (data && data.length) {
            // map Supabase rows to periods format
            periods = data.map(r => ({
              name: r.title || r.name,
              cls: r.cls || fallbackPeriods.find(f=>f.slug===r.period)?.cls || 'g-a',
              href: r.href || r.description || '#',
              slug: r.slug || r.period
            }));
            console.log('daily_tasks from Supabase:', periods.length);
          }
        } catch(e) {
          console.warn('Supabase daily_tasks fallback', e.message);
        }
        renderGrid();
      }
      searchInput.addEventListener('input', renderGrid);
      // First paint: render data lokal DULU, lalu refresh dari Supabase saat sampai.
      renderGrid();
      loadFromSupabase();
      // realtime di-debounce: banyak event beruntun cukup fetch sekali
      let rtTimer = null;
      try {
        supabase.channel('daily_tasks_changes').on('postgres_changes',{event:'*',schema:'public',table:'daily_tasks'},()=>{
          clearTimeout(rtTimer);
          rtTimer = setTimeout(()=>loadFromSupabase(),400);
        }).subscribe();
      } catch(e){}
      window.renderGrid = renderGrid;
    </script>
  </body>
</html>
