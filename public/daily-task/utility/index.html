<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Daily Task</title>
    <link rel="manifest" href="../../../manifest.json" />
    <meta name="theme-color" content="#fffbf2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="task-mori.css?v=3" />
  </head>
  <body>
    <div class="wrap">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input id="cari" type="text" placeholder="Cari kegiatan..." autocomplete="off" />
        </div>
      </div>

      <div class="table-wrap">
        <table class="tabel">
          <thead>
            <tr>
              <th colspan="3" style="padding:0;background:transparent;border:0">
                <div style="display:flex;align-items:center;height:34px;background:var(--mori-surface);border-bottom:1px solid var(--mori-line);padding:0 8px;font-family:var(--mori-mono);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mori-text)">
                  <span style="width:34px;text-align:center">No</span>
                  <span style="flex:1;padding-left:8px">Kegiatan</span>
                  <span style="width:60px"></span>
                </div>
              </th>
            </tr>
          </thead>
          <tbody id="kegiatanBody"></tbody>
        </table>
      </div>

      <div class="hint" id="hint" hidden></div>
    </div>

    <script type="module" src="task-mori.js?v=2"></script>
  </body>
</html>
