<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Daily Task</title>
    <link rel="manifest" href="../../../manifest.json" />
    <meta name="theme-color" content="#fffbf2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="task-mori.css?v=4" />
  </head>
  <body>
    <div class="wrap">
      <div class="table-wrap">
        <table class="tabel">
          <!-- Form tambah kegiatan hanya muncul di menu ADMIN; di sini
               disembunyikan supaya halaman tetap read-only untuk user. -->
          <thead style="display:none">
            <tr>
              <th colspan="3" style="padding:0;background:transparent;border:0">
                <form class="form-tambah" id="formTambah" onsubmit="return false" style="display:flex;align-items:center;height:38px;background:var(--mori-surface);border-bottom:1px solid var(--mori-line);padding:0 8px;gap:8px;margin:0">
                  <span style="width:34px;text-align:center;font-family:var(--mori-mono);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mori-text)">No</span>
                  <input id="inputBaru" type="text" placeholder="Tulis kegiatan penting..." autocomplete="off" style="flex:1;height:28px;padding:0 8px;font-size:12px;font-family:var(--mori-mono);color:var(--mori-text);background:var(--mori-bg);border:1px solid var(--mori-line);border-radius:6px;outline:none;" />
                  <button type="submit" class="btn-add" id="btnAdd" title="Tambah kegiatan" style="width:28px;height:28px;flex:0 0 28px;display:flex;align-items:center;justify-content:center;font-family:var(--mori-mono);font-size:16px;font-weight:700;color:var(--mori-bg);background:var(--mori-accent);border:1px solid var(--mori-line);border-radius:6px;cursor:pointer;">+</button>
                </form>
              </th>
            </tr>
          </thead>
          <tbody id="kegiatanBody"></tbody>
        </table>
      </div>

      <div class="hint" id="hint" hidden></div>
    </div>

    <script type="module" src="task-mori.js?v=3"></script>
  </body>
</html>
