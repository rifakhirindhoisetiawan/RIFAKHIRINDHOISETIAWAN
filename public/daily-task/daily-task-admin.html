<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Template Admin - Stok Opname</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --text: #1f2937;
        --muted: #9ca3af;
        --line: #e5e7eb;
        --line-2: #d9dde3;
        --surface: #f3f4f6;
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --soft: #eef2ff;
        --soft-2: #c7d2fe;
        --danger: #ef4444;
        --row-h: 36px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #ffffff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text);
        min-height: 100vh;
        max-width: 960px;
        margin: 0 auto;
        padding: 14px 18px 40px;
        padding-top: max(14px, env(safe-area-inset-top));
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .sec + .sec {
        margin-top: 26px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .count {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
      }

      input {
        width: 100%;
        min-width: 0;
        height: var(--row-h);
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: #f9f9f9;
        border: none;
        border-radius: 10px;
        text-transform: uppercase;
      }

      input[type="number"] {
        text-transform: none;
      }

      input::placeholder {
        color: #c3c8d1;
      }

      input:focus {
        outline: none;
        background: #fff;
        border-color: #888;
      }

      button {
        font-family: inherit;
        cursor: pointer;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: var(--row-h);
        padding: 0 14px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        transition:
          background 0.2s ease,
          border-color 0.2s ease;
      }

      .btn:hover {
        background: var(--line);
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .btn-primary:hover {
        background: var(--primary-dark);
      }

      .table-wrap {
        overflow-x: auto;
        overflow-y: hidden;
        border: none;
        border-radius: 10px;
        -webkit-overflow-scrolling: touch;
        background: #fff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f9f9f9;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-align: left;
        height: 34px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      tbody td {
        height: 44px;
        padding: 0 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="section-label">Template Admin Panel</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:50px">No</th>
            <th>Nama Item</th>
            <th style="width:100px">Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="color:var(--muted);font-family:var(--mori-mono,monospace)">1</td>
            <td style="font-weight:700">Contoh Item Template</td>
            <td>
              <button class="btn btn-primary" type="button">Edit</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
