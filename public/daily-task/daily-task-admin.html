<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Daily Task Supabase</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{max-width:100%;overflow-x:hidden}
    html,body{width:100%;height:100%;background:#ffffff}
    body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:#ffffff;color:#1a1a1a;min-height:100vh;overflow-x:hidden}
    ::-webkit-scrollbar{width:0;height:0}
    *{scrollbar-width:none;-ms-overflow-style:none}
    .wrap{width:100%;max-width:800px;min-height:100vh;margin:0 auto;background:#ffffff;padding:12px 18px 40px;min-width:0}
    .grid{display:grid;grid-template-columns:1fr;gap:20px;max-width:100%}
    .card{background:transparent;border:none;padding:0;max-width:100%;min-width:0}
    .section-label{font-size:11px;font-weight:800;color:#9aa0ab;letter-spacing:0.6px;text-transform:uppercase;margin:4px 0 14px}
    .search-wrapper{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:14px}
    .search-box{flex:1;display:flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:10px;padding:10px 14px;color:#222;font-size:14px;background:#f9f9f9;min-width:0}
    .search-box:focus-within{border-color:#888;background:#fff}
    .search-box svg{flex-shrink:0;color:#c3c8d1;width:18px;height:18px}
    .search-box input{border:none;background:transparent;outline:none;width:100%;font-size:14px;color:#222;font-family:inherit;min-width:0;-webkit-appearance:none;appearance:none;border-radius:0}
    .search-box input::placeholder{color:#c3c8d1}
    .back-btn{flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:10px;background:#fff;color:#4f46e5;width:38px;height:38px;cursor:pointer;text-decoration:none}
    .form{display:grid;gap:8px;max-width:100%}
    .form label{font-size:10px;font-weight:700;color:#374151;display:block;min-width:0;max-width:100%;line-height:1.2}
    .form input,.form select{display:block;width:100%;max-width:100%;min-width:0;margin-top:3px;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;color:#111827;background:#fff;outline:none;font-family:inherit}
    .form input:focus,.form select:focus{border-color:#6366f1;box-shadow:0 0 0 1px #6366f1}
    .form input::placeholder{color:#9ca3af;font-size:12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:100%}
    .row>*{min-width:0}
    .btn-save-icon{width:100%;height:44px;border-radius:10px;border:none;background:#6366f1;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;transition:all .15s ease;font-size:14px;font-weight:700;padding:0 16px;font-family:inherit}
    .btn-save-icon:active{opacity:.85;transform:scale(.93)}
    .btn-save-icon:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px;max-width:100%;align-items:start}
    .item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0;padding:0;background:transparent;border:none;cursor:default;width:100%}
    .thumb{width:100%;aspect-ratio:9/16;border-radius:16px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:22px;color:#fff;margin-bottom:8px;align-self:center}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:clamp(20px,5vw,32px);line-height:1}
    .item-name{font-size:9px;font-weight:700;color:#1f2937;line-height:1.25;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center;width:100%;min-height:2.25em}
    .item-period{font-size:8px;font-weight:700;color:#9aa0ab;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;margin-top:1px}
    .item-actions{display:flex;gap:6px;flex-shrink:0;justify-content:center;margin-top:5px}
    .btn{padding:10px 16px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
    .btn-ghost{background:#eef2ff;color:#4f46e5;border:1px solid #c7d2fe}
    .btn-danger{background:#fef2f2;color:#ef4444;border:1px solid #fecaca}
    .btn-small{padding:0;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
    .form-table{width:100%;border:1px solid #c7d2fe;border-radius:10px;overflow:hidden;background:#fff}
    .form-table .tr{display:flex;align-items:stretch;border-bottom:1px solid #e5e7eb;min-height:34px}
    .form-table .tr:last-child{border-bottom:none}
    .form-table .th{min-width:70px;display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:9px;font-weight:800;color:#4f46e5;background:#eef2ff;border-right:1px solid #e5e7eb;text-align:left;letter-spacing:0.4px;text-transform:uppercase}
    .form-table .td{flex:1;display:flex;align-items:center;padding:4px 8px}
    .form-table .td input{width:100%;margin:0 !important;padding:8px 10px;border:1px solid transparent;border-radius:6px;font-size:12px;font-weight:600;color:#111827;background:transparent;outline:none;font-family:inherit;line-height:1.2}
    .form-table .td input:focus{border-color:#6366f1;background:#fff;box-shadow:0 0 0 1px #6366f1}
    .empty{text-align:center;color:#9aa0ab;font-size:13px;font-weight:600;padding:40px 0}
    .g-a{background:linear-gradient(135deg,#a5b4fc,#818cf8)}
    .g-b{background:linear-gradient(135deg,#c4b5fd,#a78bfa)}
    .g-c{background:linear-gradient(135deg,#93c5fd,#60a5fa)}
    .g-d{background:linear-gradient(135deg,#67e8f9,#22d3ee)}
    .g-e{background:linear-gradient(135deg,#6ee7b7,#34d399)}
    .g-f{background:linear-gradient(135deg,#fcd34d,#fbbf24)}
    .g-g{background:linear-gradient(135deg,#fca5a5,#f87171)}
    .g-h{background:linear-gradient(135deg,#f0abfc,#e879f9)}
    .hint{font-size:11px;color:#9aa0ab}
  </style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="card" style="order:2">
      <div class="section-label">Daftar Menu — <span id="count">0</span></div>
      <div class="search-wrapper">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
          <input id="search" type="text" placeholder="Cari periode..." autocomplete="off" />
        </div>
        <a class="back-btn" href="daily-task.html" title="Kembali" aria-label="Kembali">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
      </div>
      <div id="list" class="list"><div class="empty">Memuat...</div></div>
    </div>

    <div class="card" style="order:1">
      <div class="section-label" id="formLabel">Tambah Menu</div>
      <form id="form" class="form" onsubmit="return false">
        <input type="hidden" id="editId" />
        <div class="form-table">
          <div class="tr">
            <div class="th">Judul</div>
            <div class="td"><input id="f_title" placeholder="cth: HARI" required /></div>
          </div>
          <div class="tr">
            <div class="th">Slug</div>
            <div class="td"><input id="f_slug" placeholder="cth: hari (nama folder foto)" /></div>
          </div>
          <div class="tr">
            <div class="th">Periode</div>
            <div class="td"><input id="f_period" placeholder="hari / minggu / bulan" /></div>
          </div>
          <div class="tr">
            <div class="th">Link</div>
            <div class="td"><input id="f_link" placeholder="../utility/hari.html" /></div>
          </div>
          <div class="tr">
            <div class="th">Emoji</div>
            <div class="td"><input id="f_icon" placeholder="☀️" /></div>
          </div>
        </div>
        <label style="margin-top:12px">Isi Menu (1 baris = 1 kegiatan)</label>
        <textarea id="f_items" class="items-area" rows="8" style="display:block;width:100%;max-width:100%;min-width:0;margin-top:3px;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:12px;color:#111827;background:#fff;outline:none;font-family:inherit;resize:vertical;line-height:1.5" placeholder="Kiwi&#10;WhatsApp Business&#10;YouTube&#10;..."></textarea>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button id="btnReset" type="button" class="btn-save-icon" style="background:#eef2ff;color:#4f46e5;flex:1">Batal</button>
          <button id="btnSave" type="button" class="btn-save-icon" style="flex:2">Simpan</button>
        </div>
        <p class="hint" style="margin-top:8px">Slug dipakai untuk foto folder: image-daily-task/<b>[slug]</b>/1.jpg (kalau ada). Kosongkan link biar pakai <i>../utility/[slug].html</i>.</p>
      </form>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from '../kopi/supabase.js';

  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const searchEl = document.getElementById('search');
  const form = document.getElementById('form');
  const formLabel = document.getElementById('formLabel');
  const editId = document.getElementById('editId');
  const f_title = document.getElementById('f_title');
  const f_slug = document.getElementById('f_slug');
  const f_period = document.getElementById('f_period');
  const f_link = document.getElementById('f_link');
  const f_icon = document.getElementById('f_icon');
  const f_items = document.getElementById('f_items');
  const btnSave = document.getElementById('btnSave');
  const btnReset = document.getElementById('btnReset');

  let all = [];
  const CURRENT_TABLE = 'daily_tasks';
  const ITEMS_TABLE = 'daily_task_items';

  function slugify(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }

  function itemHtml(m) {
    const title = m.title || m.name || 'Tanpa judul';
    const period = m.period || '';
    const slug = m.slug || m.period || slugify(title);
    const icon = m.icon || '📅';
    const cls = m.cls || '';
    const photoFolder = '../image-daily-task/' + slug + '/1.jpg';
    return `
      <div class="item">
        <div class="thumb ${cls}">
          <img src="${photoFolder}" alt="" data-slug="${slug}" loading="lazy" onerror="sqProbe(this)" />
          <span style="display:none">${icon}</span>
        </div>
        <div class="item-name">${title}</div>
        <div class="item-period">${period || '—'}</div>
        <div class="item-actions">
          <button type="button" class="btn btn-ghost btn-small" data-edit="${m.id}" title="Edit" aria-label="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button type="button" class="btn btn-danger btn-small" data-del="${m.id}" title="Hapus" aria-label="Hapus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
        </div>
      </div>`;
  }

  function sqProbe(img) {
    const slug = img.dataset.slug;
    const folder = '../image-daily-task/' + slug + '/';
    const exts = ['.jpg', '.jpeg', '.png', '.webp', '.svg'];
    let i = 0;
    function next() {
      if (i >= exts.length) { img.style.display = 'none'; img.nextElementSibling.style.display = 'flex'; return; }
      const url = folder + '1' + exts[i++];
      const t = new Image();
      t.onload = () => { img.src = url; };
      t.onerror = next;
      t.src = url;
    }
    next();
  }
  window.sqProbe = sqProbe;

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = all.filter(m => {
      if (!q) return true;
      return (m.title||'').toLowerCase().includes(q) || (m.period||'').toLowerCase().includes(q) || (m.description||'').toLowerCase().includes(q);
    });
    countEl.textContent = filtered.length;
    if (!filtered.length) { listEl.innerHTML = '<div class="empty">Tidak ada data</div>'; return; }
    listEl.innerHTML = filtered.map(itemHtml).join('');
    listEl.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => editRow(parseInt(btn.dataset.edit)));
    });
    listEl.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => delRow(parseInt(btn.dataset.del)));
    });
    // hilangkan emoji fallback kalau foto ketemu
    listEl.querySelectorAll('.thumb img:not([src$="1.jpg"])').forEach(() => {});
  }

  async function load() {
    try {
      const { data, error } = await supabase.from(CURRENT_TABLE).select('*').order('id');
      if (error) { listEl.innerHTML = '<div class="empty">Error: ' + error.message + '</div>'; return; }
      all = data || [];
      render();
    } catch (e) {
      listEl.innerHTML = '<div class="empty">Gagal memuat: ' + e.message + '</div>';
    }
  }

  function resetForm() {
    editId.value = '';
    form.reset();
    f_items.value = '';
    formLabel.textContent = 'Tambah Menu';
    btnSave.textContent = 'Simpan';
  }

  async function editRow(id) {
    const m = all.find(x => x.id === id);
    if (!m) return;
    editId.value = m.id;
    f_title.value = m.title || '';
    f_slug.value = m.slug || '';
    f_period.value = m.period || '';
    f_link.value = m.description || m.href || '';
    f_icon.value = m.icon || '';
    f_items.value = '';
    formLabel.textContent = 'Edit Menu — ' + (m.title || '#') + m.id;
    btnSave.textContent = 'Update';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    try {
      const period = m.period || m.slug || slugify(m.title || '');
      const { data, error } = await supabase.from(ITEMS_TABLE).select('text').eq('period', period).order('sort_order');
      if (error) throw error;
      if (data && data.length) f_items.value = data.map(d => d.text).join('\n');
    } catch (e) {
      console.error('Gagal memuat isi menu:', e);
    }
  }

  async function delRow(id) {
    if (!confirm('Hapus menu #' + id + '?')) return;
    const { error } = await supabase.from(CURRENT_TABLE).delete().eq('id', id);
    if (error) alert('Gagal hapus: ' + error.message);
    else await load();
  }

  btnSave.addEventListener('click', async () => {
    if (!f_title.value.trim()) { alert('Judul wajib'); return; }
    const autoLink = '../utility/' + (f_slug.value.trim() || slugify(f_title.value.trim()) || f_period.value.trim()) + '.html';
    const payload = {
      title: f_title.value.trim(),
      slug: f_slug.value.trim() || null,
      period: f_period.value.trim() || null,
      description: f_link.value.trim() || autoLink,
      icon: f_icon.value.trim() || null
    };
    let res;
    if (editId.value) {
      res = await supabase.from(CURRENT_TABLE).update(payload).eq('id', parseInt(editId.value));
    } else {
      res = await supabase.from(CURRENT_TABLE).insert([payload]);
    }
    if (res.error && /PGRST204|Could not find/i.test(res.error.message || '')) {
      const slim = { title: payload.title, period: payload.period, description: payload.description };
      res = editId.value
        ? await supabase.from(CURRENT_TABLE).update(slim).eq('id', parseInt(editId.value))
        : await supabase.from(CURRENT_TABLE).insert([slim]);
    }
    if (res.error) {
      alert('Gagal simpan: ' + (res.error.message || 'error'));
      return;
    }

    const period = f_slug.value.trim() || f_period.value.trim() || slugify(f_title.value.trim());
    const rawItems = f_items.value.split('\n');
    const items = rawItems.map(s => s.replace(/\r$/, '').trim()).filter(Boolean);
    if (period) {
      try {
        const delRes = await supabase.from(ITEMS_TABLE).delete().eq('period', period);
        if (delRes.error) throw delRes.error;
        if (items.length) {
          const insRes = await supabase.from(ITEMS_TABLE).insert(items.map((t, i) => ({ period, text: t, sort_order: i + 1 })));
          if (insRes.error) throw insRes.error;
        }
      } catch (e) {
        alert('Menu tersimpan, tapi isi gagal disimpan: ' + (e.message || 'error'));
      }
    }

    resetForm();
    await load();
  });

  btnReset.addEventListener('click', resetForm);
  searchEl.addEventListener('input', render);

  let rtTimer = null;
  try {
    supabase.channel('admin_daily_tasks_' + Math.random().toString(36).slice(2))
      .on('postgres_changes', { event: '*', schema: 'public', table: CURRENT_TABLE }, () => {
        clearTimeout(rtTimer);
        rtTimer = setTimeout(() => load(), 300);
      })
      .subscribe();
  } catch(e) {}

  load();
</script>
</body>
</html>
