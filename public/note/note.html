<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>NOTE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://xsacwgxxoptdrgbbzzib.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://xsacwgxxoptdrgbbzzib.supabase.co" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
    </noscript>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --mori-bg: #fffbf2;
        --mori-surface: #f7f3e9;
        --mori-text: #1a1917;
        --mori-text-2: #6e6a64;
        --mori-line: rgba(26, 25, 23, 0.14);
        --mori-accent: #1a1917;
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--mori-bg);
        overflow: hidden;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--mori-text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: var(--mori-bg);
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        position: relative;
      }

      @media (min-width: 800px) {
        .phone {
          max-width: 800px;
          margin: 0 auto;
        }
      }

      /* ===== SEARCH ROW ===== */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0 14px;
      }
      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 46px;
        box-sizing: border-box;
        border: 1px solid var(--mori-line);
        border-radius: var(--mori-radius, 8px);
        padding: 0 14px;
        color: var(--mori-text, #1a1917);
        font-size: 13px;
        background: var(--mori-surface, #f7f3e9);
        transition: background 0.2s ease;
      }
      .search-box:focus-within {
        background: #fffdf7;
        border-color: var(--mori-line, #e5e7eb);
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: var(--mori-text);
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }
      .search-box input::placeholder {
        color: var(--mori-text-2);
      }
      .search-box svg {
        flex-shrink: 0;
        color: var(--mori-text-2);
        width: 18px;
        height: 18px;
      }

      /* ===== MENU GRID ===== */
      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px 40px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px 8px;
        width: 100%;
        align-content: start;
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        text-align: center;
        cursor: pointer;
        text-decoration: none;
        background: none;
        border: none;
        color: var(--mori-text);
        min-width: 0;
        width: 100%;
      }

      .icon-tile-foto {
        position: relative;
        width: 100%;
        aspect-ratio: 9 / 16;
        border: none;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 10px;
        background: var(--mori-surface);
        box-shadow: none;
        transition: transform 0.2s ease;
      }
      .item:active .icon-tile-foto {
        transform: translate(2px, 2px);
      }
      .icon-tile-foto img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: saturate(0.55) contrast(1.02);
      }

      /* Tile Admin */
      .icon-tile-foto.tile-admin {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--mori-accent);
        box-shadow: none;
      }
      .icon-tile-foto.tile-admin svg {
        width: 36%;
        height: 36%;
        color: var(--mori-bg);
      }

      /* Tile tanpa foto */
      .icon-tile-foto.tanpa-foto {
        background-color: var(--mori-surface);
        background-image: repeating-linear-gradient(
          45deg,
          #f2eee2 0 6px,
          #ece6d6 6px 12px
        );
        border: 1px dashed var(--mori-text-2);
      }
      .icon-tile-foto .tanpa-ikon {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--mori-text-2);
      }
      .icon-tile-foto .tanpa-ikon svg {
        width: 26%;
        height: auto;
        max-width: 34px;
        max-height: 34px;
        min-width: 18px;
        min-height: 18px;
      }

      .item:hover .icon-tile-foto {
        box-shadow: none;
      }
      .item:active .icon-tile-foto {
        transform: translate(2px, 2px);
        box-shadow: none;
      }

      .item span {
        font-family: var(--mori-mono);
        font-size: 10px;
        font-weight: 700;
        line-height: 1.2;
        color: var(--mori-text);
        letter-spacing: 0.3px;
        text-transform: uppercase;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        width: 100%;
        word-break: break-word;
      }
      @media (min-width: 768px) {
        .item span {
          font-size: 12px;
        }
      }

      .empty-msg {
        grid-column: 1 / -1;
        text-align: center;
        font-family: var(--mori-mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--mori-text-2);
        padding: 40px 0;
      }
      .header-pin-btn {
        flex: 0 0 auto;
        width: 46px;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--mori-surface, #f7f3e9);
        border: 1px solid var(--mori-line, #e5e7eb);
        border-radius: var(--mori-radius, 8px);
        color: var(--mori-text-2, #6e6a64);
        cursor: pointer;
        padding: 0;
        transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
      }
      .header-pin-btn:active {
        transform: translate(2px, 2px);
      }
      .header-pin-btn[aria-pressed="true"] {
        background: var(--mori-text, #1a1917);
        color: var(--mori-bg, #fffbf2);
        border-color: var(--mori-text, #1a1917);
      }
      .header-pin-btn svg {
        width: 18px;
        height: 18px;
      }
      body.pin-mode .icon-tile-foto {
        border: 1px dashed var(--mori-text-2) !important;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="CARI MENU..."
            autocomplete="off"
          />
        </div>
        <button class="header-pin-btn" id="filterBtn" type="button" aria-label="Filter Kategori" title="Filter Kategori">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </button>
        <button class="header-pin-btn" id="headerPinBtn" type="button" aria-label="Kelola Sematan Menu" title="Kelola Sematan Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7l2-3.2z"/></svg>
        </button>
      </div>

      <div class="menu-wrap">
        <div class="grid" id="homeGrid"></div>
      </div>
    </div>

    <script type="module">
      import { SUPABASE_URL, SUPABASE_KEY } from '../../src/js/supabase-config.js';

      let supabasePromise = null;
      function getSupabase() {
        if (!supabasePromise) supabasePromise = import('../kopi/supabase.js').then((m) => m.supabase);
        return supabasePromise;
      }

      const homeGrid = document.getElementById('homeGrid');
      const searchInput = document.getElementById('searchInput');

      const MENUS_CACHE_KEY = 'note_menus_cache_v1';
      const CAT_CACHE_KEY = 'note_active_cat_v1';

      let menus = [];
      let selectedCategory = '';
      try {
        const cachedMenus = JSON.parse(localStorage.getItem(MENUS_CACHE_KEY) || 'null');
        if (Array.isArray(cachedMenus)) menus = cachedMenus;
        selectedCategory = localStorage.getItem(CAT_CACHE_KEY) || '';
      } catch {}

      const adminTile = {
        id: 'admin',
        title: 'ADMIN',
        isAdmin: true,
        href: 'note-admin.html'
      };

      const PIN_KEY = 'note_pinned_v1';
      let pinned = [];
      try {
        pinned = JSON.parse(localStorage.getItem(PIN_KEY)) || [];
      } catch {
        pinned = [];
      }

      const isPinned = (title) => pinned.includes(title);
      let modeSemat = false;
      const headerPinBtn = document.getElementById('headerPinBtn');

      if (headerPinBtn) {
        headerPinBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          modeSemat = !modeSemat;
          headerPinBtn.setAttribute('aria-pressed', modeSemat ? 'true' : 'false');
          document.body.classList.toggle('pin-mode', modeSemat);
        });
      }

      function renderGrid() {
        const q = searchInput.value.trim().toLowerCase();
        const adminMatch = !q || 'admin'.includes(q);
        const list = adminMatch ? [adminTile] : [];

        const filteredMenus = menus.filter((m) => {
          const matchQ = (m.title || '').toLowerCase().includes(q);
          const cat = m.category || 'UMUM';
          const matchCat = !selectedCategory || cat === selectedCategory;
          return matchQ && matchCat;
        });
        const rank = (item) => {
          const i = pinned.indexOf(item.title);
          return i === -1 ? Number.MAX_SAFE_INTEGER : i;
        };
        filteredMenus.sort((a, b) => rank(a) - rank(b));

        list.push(...filteredMenus);

        if (list.length === 0) {
          homeGrid.innerHTML = '<div class="empty-msg">Tidak ditemukan</div>';
          return;
        }

        homeGrid.innerHTML = list
          .map((m) => {
            if (m.isAdmin) {
              return `<a class="item" href="${m.href}">
                <div class="icon-tile-foto tile-admin">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 15v2" /><path d="M8 9h8" /><rect x="4" y="4" width="16" height="16" rx="1" />
                  </svg>
                </div>
                <span>${m.title}</span>
              </a>`;
            }

            const href = `note-view.html?id=${m.id}`;
            const isKopi = (m.category || '').toUpperCase() === 'KOPI' || (m.title || '').toUpperCase().includes('KOPI') || (m.title || '').toUpperCase().includes('KOPI & RESEP');
            const defaultFoto = isKopi ? '../kopi/image-index.jpg' : '';
            const fotoUrl = m.foto_url || defaultFoto;
            const tileContent = fotoUrl
              ? `<img src="${fotoUrl}" alt="" loading="lazy" decoding="async" />`
              : `<div class="tanpa-ikon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                  </svg>
                </div>`;

            const pinnedClass = isPinned(m.title) ? ' pinned' : '';

            return `<a class="item${pinnedClass}" href="${href}" data-title="${encodeURIComponent(m.title)}">
              <div class="icon-tile-foto ${fotoUrl ? '' : 'tanpa-foto'}">
                ${tileContent}
              </div>
              <span>${m.title}</span>
            </a>`;
          })
          .join('');

        homeGrid.querySelectorAll('.item:not([href*="note-admin"])').forEach(el => {
          el.addEventListener('click', (e) => {
            if (modeSemat) {
              e.preventDefault();
              e.stopPropagation();
              const title = decodeURIComponent(el.dataset.title || '');
              if (!title) return;
              if (isPinned(title)) {
                pinned = pinned.filter(t => t !== title);
              } else {
                pinned.push(title);
              }
              try {
                localStorage.setItem(PIN_KEY, JSON.stringify(pinned));
              } catch {}
              renderGrid();
            }
          });
        });
      }

      async function loadMenus() {
        try {
          const res = await fetch(SUPABASE_URL + '/rest/v1/note_menus?select=*&order=sort_order', {
            headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (Array.isArray(data)) {
            menus = data;
            try { localStorage.setItem(MENUS_CACHE_KEY, JSON.stringify(data)); } catch {}
          }
        } catch (e) {
          console.warn('Gagal memuat menu note:', e);
        }
        renderGrid();
      }

      const SETTING_TABLE = 'note_settings';

      async function syncCategoryFilter() {
        try {
          const res = await fetch(SUPABASE_URL + '/rest/v1/note_settings?select=value&key=eq.active_category', {
            headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const value = Array.isArray(data) && data[0] ? (data[0].value || '') : '';
          selectedCategory = value;
          try { localStorage.setItem(CAT_CACHE_KEY, selectedCategory); } catch {}
          renderGrid();
        } catch {}
      }

      async function setCategoryFilter(cat) {
        selectedCategory = cat;
        try { localStorage.setItem(CAT_CACHE_KEY, cat); } catch {}
        renderGrid();
        try {
          const supabase = await getSupabase();
          await supabase.from(SETTING_TABLE).upsert({ key: 'active_category', value: cat }, { onConflict: 'key' });
        } catch {}
      }
      
      // Filter popup / modal
      const filterModal = document.createElement('div');
      filterModal.id = 'filterModal';
      filterModal.style.cssText = 'display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:1000; align-items:center; justify-content:center; padding:16px;';
      filterModal.innerHTML = '<div style="background:#fffbf2; border-radius:8px; padding:18px 20px; max-width:320px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.25); border:1px solid rgba(26,25,23,0.14);">' +
        '<div style="font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:#1a1917; font-family:var(--mori-mono); margin-bottom:12px;">Filter Kategori</div>' +
        '<div id="filterList" style="display:flex; flex-direction:column; gap:6px; max-height:200px; overflow-y:auto; margin-bottom:14px;"></div>' +
        '<button id="filterClose" type="button" style="width:100%; padding:8px; background:#1a1917; color:#fffbf2; border:none; border-radius:4px; font-weight:600; font-size:12px; cursor:pointer; font-family:var(--mori-mono);">Tutup</button>' +
      '</div>';
      document.body.appendChild(filterModal);

      const filterBtn = document.getElementById('filterBtn');
      if (filterBtn) {
        filterBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          updateFilterList();
          filterModal.style.display = 'flex';
        });
      }
      document.getElementById('filterClose').addEventListener('click', () => { filterModal.style.display = 'none'; });
      filterModal.addEventListener('click', (e) => { if (e.target === filterModal) filterModal.style.display = 'none'; });

      function updateFilterList() {
        const cats = [...new Set(menus.map(m => m.category || 'UMUM'))];
        cats.sort();
        const listEl = document.getElementById('filterList');
        let html = '<button type="button" class="cat-btn" data-cat="" style="padding:8px 10px; background:' + (selectedCategory === '' ? '#1a1917' : '#f7f3e9') + '; color:' + (selectedCategory === '' ? '#fffbf2' : '#1a1917') + '; border:1px solid rgba(26,25,23,0.14); border-radius:4px; font-weight:700; font-size:11px; text-align:left; cursor:pointer; font-family:var(--mori-mono); text-transform:uppercase;">SEMUA KATEGORI</button>';
        cats.forEach(c => {
          const active = selectedCategory === c;
          html += '<button type="button" class="cat-btn" data-cat="' + c + '" style="padding:8px 10px; background:' + (active ? '#1a1917' : '#f7f3e9') + '; color:' + (active ? '#fffbf2' : '#1a1917') + '; border:1px solid rgba(26,25,23,0.14); border-radius:4px; font-weight:700; font-size:11px; text-align:left; cursor:pointer; font-family:var(--mori-mono); text-transform:uppercase;">' + c + '</button>';
        });
        listEl.innerHTML = html;
        listEl.querySelectorAll('.cat-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            setCategoryFilter(btn.dataset.cat);
            filterModal.style.display = 'none';
          });
        });
      }

      searchInput.addEventListener('input', renderGrid);
      renderGrid();
      loadMenus();
      syncCategoryFilter();

      // Realtime (opsional) dimuat setelah halaman tampil, bukan di jalur kritis.
      let rtTimer = null;
      function initRealtime() {
        getSupabase().then((supabase) => {
          try {
            supabase
              .channel('note_settings_changes')
              .on(
                'postgres_changes',
                { event: '*', schema: 'public', table: SETTING_TABLE },
                (payload) => {
                  if (payload.new && payload.new.key === 'active_category') {
                    selectedCategory = payload.new.value || '';
                    try { localStorage.setItem(CAT_CACHE_KEY, selectedCategory); } catch {}
                    renderGrid();
                  }
                }
              )
              .subscribe();
          } catch {}

          try {
            supabase
              .channel('note_menus_changes')
              .on(
                'postgres_changes',
                { event: '*', schema: 'public', table: 'note_menus' },
                () => {
                  clearTimeout(rtTimer);
                  rtTimer = setTimeout(() => loadMenus(), 300);
                }
              )
              .subscribe();
          } catch (e) {}
        }).catch(() => {});
      }
      if ('requestIdleCallback' in window) requestIdleCallback(initRealtime, { timeout: 2500 });
      else setTimeout(initRealtime, 1500);
    </script>
  </body>
</html>
