<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Catatan — NOTE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://xsacwgxxoptdrgbbzzib.supabase.co" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://xsacwgxxoptdrgbbzzib.supabase.co" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" /></noscript>
    <!-- Render rumus (pecahan bertumpuk dgn garis bagi) untuk catatan berawalan "Rumus ..." -->
    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" /></noscript>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" onload="window.dispatchEvent(new Event('katex-siap'))"></script>
    <style>
      :root {
        --mori-bg: #fffbf2;
        --mori-surface: #f7f3e9;
        --mori-text: #1a1917;
        --mori-text-2: #6e6a64;
        --mori-line: rgba(26, 25, 23, 0.14);
        --mori-accent: #1a1917;
        --mori-danger: #b91c1c;
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; background: var(--mori-bg); }
      body {
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--mori-text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .wrap {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: max(14px, env(safe-area-inset-top)) 18px 40px;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 100vh;
      }

      /* ============================================================
         TABEL CATATAN — pola sama dengan admin NOTE
         (public/note/note-admin.html) dan Admin KOPI:
         - garis tepi 1.5px warna gelap + radius 10px
         - header krem, teks mono kecil
         - baris 45px, hover krem
         - tombol aksi krem (bukan hitam), hapus tetap merah
         - aksi per baris diringkas jadi satu tombol tiga titik (⋮)
         ============================================================ */
      .table-wrap {
        border: 1.5px solid rgba(26, 25, 23, 0.3); border-radius: 10px;
        background: var(--mori-bg); overflow-x: auto; overflow-y: hidden;
        -webkit-overflow-scrolling: touch; scrollbar-width: none;
      }
      .table-wrap::-webkit-scrollbar { display: none; width: 0; height: 0; }
      .tabel { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
      .tabel thead th {
        position: sticky; top: 0; z-index: 1;
        background: var(--mori-surface); color: var(--mori-text-2);
        font-family: var(--mori-mono); font-size: 11px; font-weight: 800;
        letter-spacing: .6px; text-transform: uppercase; text-align: left;
        height: 36px; padding: 0 12px;
        border-bottom: 1px solid var(--mori-line); white-space: nowrap;
      }
      .tabel tbody td {
        height: 45px; padding: 0 8px;
        border-bottom: 1px solid var(--mori-line);
        background: var(--mori-bg); vertical-align: middle;
        transition: background .5s ease;
      }
      .tabel tbody tr:last-child td { border-bottom: 0; }
      .tabel tbody tr:hover td { background: var(--mori-surface); }
      .c-no {
        width: 38px; text-align: center;
        font-family: var(--mori-mono); font-size: 11px; color: var(--mori-text-2);
      }
      .tabel th.c-no, .tabel td.c-no { text-align: center; }
      .c-teks { min-width: 0; overflow: hidden; }
      .tabel .c-teks .isi {
        font-family: var(--mori-mono); font-size: 12px; font-weight: 700;
        letter-spacing: .4px; text-transform: uppercase;
        /* Catatan panjang (hasil ketikan berparagraf) turun baris supaya
           kebaca utuh — catatan pendek tetap tampil satu baris seperti sebelumnya. */
        white-space: normal; overflow-wrap: break-word;
        line-height: 1.5; padding: 7px 0;
      }
      /* Catatan yang diawali "Rumus ..." tampil seperti lembar rumus:
         label kecil di atas + badan rumus dalam kotak (tidak kapital penuh). */
      .tabel .c-teks .isi.rumus { text-transform: none; }
      .tabel .c-teks .isi .rumus-label {
        display: block; font-size: 10px; font-weight: 700; letter-spacing: .8px;
        text-transform: uppercase; color: var(--mori-text-2);
      }
      .tabel .c-teks .isi .rumus-badan {
        display: block; margin-top: 5px; padding: 7px 9px;
        background: var(--mori-surface); border: 1px solid var(--mori-line);
        font-size: 12.5px; line-height: 1.6; letter-spacing: .2px;
      }
      /* Rumus LaTeX ($$...$$) dirender KaTeX: pecahan bertumpuk + garis bagi.
         Rumus ditaruh di baris kedua selebar tabel (colspan) supaya utuh. */
      .tabel tbody tr.tr-rumus-head td { border-bottom: 0; }
      .tabel tbody tr.tr-math td { height: auto; padding: 0 8px 12px; vertical-align: top; }
      .tabel .rumus-math {
        display: block; padding: 7px 7px;
        background: var(--mori-surface); border: 1px solid var(--mori-line);
        font-size: 12px; overflow-x: auto; overflow-y: hidden;
      }
      .tabel .rumus-math .katex { font-size: .9em; }
      .tabel .rumus-math .katex-display { margin: 0; }
      @media (max-width: 400px) {
        /* layar sempit: kecilkan sedikit supaya rumus panjang tetap utuh */
        .tabel .rumus-math .katex { font-size: .76em; }
      }
      .tabel .rumus-nota {
        display: block; margin-top: 6px; font-size: 10.5px; line-height: 1.55;
        color: var(--mori-text-2);
      }
      .c-aksi {
        width: 48px; text-align: right;
        position: sticky; right: 0; background: var(--mori-bg);
      }
      .tabel thead th.c-aksi { background: var(--mori-surface); z-index: 2; }
      .tabel tbody tr:hover td.c-aksi { background: var(--mori-surface); }
      .acts { display: flex; gap: 6px; justify-content: flex-end; }
      /* Tombol aksi krem (sama dengan header tabel), hapus tetap merah */
      .ico {
        width: 32px; height: 32px; flex: 0 0 32px;
        display: flex; align-items: center; justify-content: center;
        font-family: inherit; font-size: 14px; font-weight: 800; line-height: 1;
        color: var(--mori-text); background: var(--mori-surface);
        border: 1px solid var(--mori-line); border-radius: 8px;
        box-shadow: none; cursor: pointer;
        transition: box-shadow .2s ease, transform .2s ease, background .2s ease;
      }
      .ico:active { transform: translate(2px,2px); box-shadow: none; }
      .ico-danger { background: var(--mori-danger); border-color: var(--mori-danger); color: #fff; }

      /* ============================================================
         BARIS TULIS DI DALAM TABEL
       Baris paling atas tabel (setelah header) dipakai untuk menulis
       catatan baru. Input-nya transparan tanpa garis supaya menyatu
       dengan tabel, bukan terlihat seperti komponen yang ditempel.
       ============================================================ */
      /* Garis pemisah antara baris tulis dan daftar.
         `tbody tr:last-child td{border-bottom:0}` di atas ikut mengenai
         baris tulis (karena baris itu anak terakhir tbody-nya), jadi
         di sini dipaksakan kembali pakai !important supaya pemisah
         tetap terlihat. */
      .tabel tbody.tulis-body td { border-bottom: 1px solid var(--mori-line) !important; }
      .tabel tbody.tulis-body td.tulis { padding: 0 12px; }
      .tabel tbody.tulis-body input {
        width: 100%; min-width: 0; height: 44px; padding: 0;
        font: inherit; font-size: 13px; font-weight: 700;
        color: var(--mori-text); background: transparent; border: none;
        border-radius: 0;
      }
      .tabel tbody.tulis-body input::placeholder { color: var(--mori-text-2); }
      .tabel tbody.tulis-body input:focus {
        background: transparent !important; border: none !important;
        box-shadow: none; outline: none;
      }

      /* ============================================================
         MENU AKSI (⋮)
       Aksi per baris (edit / hapus) diringkas jadi satu tombol tiga
       titik. Saat ditekan, tombol aslinya muncul menimpanya di baris
       yang sama. Popup di luar tabel (position:fixed) karena
       .table-wrap memakai overflow:hidden.
       ============================================================ */
      .menu-pop {
        position: fixed; z-index: 150;
        display: flex; align-items: center; gap: 6px;
        pointer-events: none;
      }
      .menu-pop .ico {
        pointer-events: auto; -webkit-tap-highlight-color: transparent;
      }
      .menu-pop[hidden] { display: none; }

      .empty {
        font-family: var(--mori-mono); font-size: 11px; font-weight: 700;
        letter-spacing: 1px; text-transform: uppercase; color: var(--mori-text-2);
      }
      .hint {
        margin-top: 10px; font-family: var(--mori-mono); font-size: 10px; font-weight: 700;
        letter-spacing: .6px; text-transform: uppercase; color: var(--mori-danger);
        border-left: 3px solid var(--mori-danger); padding: 6px 8px; background: #fdf1f1;
      }
      .hint[hidden] { display: none; }

      /* modal password */
      .pw-bg { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(26,25,23,.45); align-items: center; justify-content: center; padding: 16px; }
      .pw-bg.open { display: flex; }
      .pw-card { width: 100%; max-width: 360px; background: var(--mori-bg); border: 1px solid var(--mori-line); border-radius: 12px; padding: 18px; box-shadow: none; }
      .pw-title { font-family: var(--mori-mono); font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 8px; }
      .pw-msg { font-size: 12px; color: var(--mori-text-2); line-height: 1.5; margin-bottom: 12px; white-space: pre-line; }
      .pw-input { width: 100%; padding: 11px 12px; font-family: var(--mori-mono); font-size: 15px; background: var(--mori-surface); border: 1px solid var(--mori-line); border-radius: 8px; outline: none; }
      .pw-input:focus { background: #fffdf7; box-shadow: none; }
      .pw-error { margin-top: 8px; font-family: var(--mori-mono); font-size: 10px; font-weight: 700; color: var(--mori-danger); }
      .pw-error[hidden] { display: none; }
      .pw-actions { display: flex; gap: 8px; margin-top: 16px; }
      .pw-btn { flex: 1; padding: 12px; border: 1px solid var(--mori-line); border-radius: 8px; background: var(--mori-surface); color: var(--mori-text); font-family: var(--mori-mono); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
      .pw-btn:active { transform: translate(2px,2px); }
      .pw-btn-danger { background: var(--mori-danger); border-color: var(--mori-danger); color: #fff; }

      /* modal edit */
      .edit-bg { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(26,25,23,.45); align-items: center; justify-content: center; padding: 16px; }
      .edit-bg.open { display: flex; }
      .edit-card { width: 100%; max-width: 480px; background: var(--mori-bg); border: 1px solid var(--mori-line); border-radius: 12px; padding: 18px; box-shadow: none; }
      .edit-card textarea {
        width: 100%; min-height: 120px; padding: 12px; font-family: inherit; font-size: 13px;
        border: 1px solid var(--mori-line); background: var(--mori-surface); outline: none; resize: vertical;
      }
      .edit-card textarea:focus { background: #fffdf7; box-shadow: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!--
        Satu tabel untuk dua keperluan: baris paling atas dipakai untuk
        menulis catatan baru, baris di bawahnya adalah daftar catatan.
        Jadi tidak ada form terpisah di atas tabel.

        Baris tulis harus punya <tbody> sendiri: render() mengosongkan
        tbody dengan innerHTML = '', dan baris tulis tidak boleh ikut
        terhapus.
      -->
      <div class="table-wrap">
        <table class="tabel">
          <thead>
            <tr>
              <th class="c-no">No</th>
              <th>Catatan</th>
              <th class="c-aksi"></th>
            </tr>
          </thead>
          <tbody class="tulis-body">
            <tr>
              <td class="c-no"></td>
              <td class="c-teks tulis">
                <input id="f_catatan" type="text" placeholder="Tulis catatan penting..." autocomplete="off" aria-label="Tulis catatan" />
              </td>
              <td class="c-aksi">
                <div class="acts">
                  <button class="ico" type="button" id="btnAdd" title="Tambah catatan" aria-label="Tambah catatan">+</button>
                </div>
              </td>
            </tr>
          </tbody>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="hint" id="hint" hidden></div>
    </div>

    <!-- Popup aksi (edit / hapus). Harus di luar tabel. -->
    <div class="menu-pop" id="menuPop" hidden role="group" aria-label="Aksi catatan"></div>

    <div class="pw-bg" id="pwBg">
      <div class="pw-card">
        <div class="pw-title">Konfirmasi Hapus</div>
        <div class="pw-msg" id="pwMsg"></div>
        <input class="pw-input" id="pwInput" type="password" autocomplete="current-password" placeholder="Password" />
        <div class="pw-error" id="pwError" hidden>Gagal masuk.</div>
        <div class="pw-actions">
          <button class="pw-btn" id="pwCancel" type="button">Batal</button>
          <button class="pw-btn pw-btn-danger" id="pwOk" type="button">Hapus</button>
        </div>
      </div>
    </div>

    <div class="edit-bg" id="editBg">
      <div class="edit-card">
        <div class="pw-title">Edit Catatan</div>
        <textarea id="editInput"></textarea>
        <div class="pw-actions">
          <button class="pw-btn" id="editCancel" type="button">Batal</button>
          <button class="pw-btn pw-btn-danger" id="editOk" type="button" style="background:var(--mori-accent);border-color:var(--mori-line);color:var(--mori-bg)">Simpan</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { SUPABASE_URL, SUPABASE_KEY } from '../../src/js/supabase-config.js';

      let supabasePromise = null;
      function getSupabase() {
        if (!supabasePromise) supabasePromise = import('../kopi/supabase.js').then((m) => m.supabase);
        return supabasePromise;
      }

      const params = new URLSearchParams(location.search);
      const menuId = parseInt(params.get('id'), 10);

      const tbody = document.getElementById('tbody');
      const hintEl = document.getElementById('hint');
      const f_catatan = document.getElementById('f_catatan');
      const btnAdd = document.getElementById('btnAdd');

      function setHint(msg) {
        if (!msg) { hintEl.hidden = true; hintEl.textContent = ''; return; }
        hintEl.hidden = false; hintEl.textContent = msg;
      }

      if (!menuId) {
        setHint('ID menu tidak valid — buka dari halaman NOTE.');
      }

      let entries = [];
      let editingId = null;
      let judul = '';

      const CACHE_KEY = 'note_view_cache_v1_' + menuId;
      const restHeaders = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY };

      function simpanCache() {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ title: judul, entries })); } catch {}
      }

      function bacaCache() {
        try {
          const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
          if (!c) return;
          if (c.title) { judul = c.title; document.title = judul + ' — NOTE'; }
          if (Array.isArray(c.entries)) { entries = c.entries; render(); }
        } catch {}
      }

      async function loadJudul() {
        try {
          const res = await fetch(SUPABASE_URL + '/rest/v1/note_menus?id=eq.' + menuId + '&select=title', { headers: restHeaders });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (Array.isArray(data) && data[0] && data[0].title) {
            judul = data[0].title;
            document.title = judul + ' — NOTE';
            simpanCache();
          }
        } catch (e) {}
      }

      async function loadEntries() {
        try {
          const res = await fetch(SUPABASE_URL + '/rest/v1/note_entries?menu_id=eq.' + menuId + '&select=*&order=created_at', { headers: restHeaders });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          entries = Array.isArray(data) ? data : [];
          setHint('');
          render();
          simpanCache();
        } catch (e) {
          if (!entries.length) setHint('Gagal muat: ' + e.message);
        }
      }

      const escHtml = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const escAttr = (s) => escHtml(s).replace(/"/g, '&quot;');

      // Format rumus: "Rumus <label>: $$<latex>$$ <catatan kecil opsional>".
      // Dipisah jadi { label, tex, nota } supaya render() bisa menaruh rumus
      // di barisnya sendiri selebar tabel (colspan) dan dirender KaTeX.
      function bagiRumus(e) {
        const asli = String(e.content || '');
        const m = asli.match(/^rumus\s+([\s\S]+)$/i);
        if (!m) return null;
        const pisah = m[1].indexOf(':');
        if (pisah < 0) return null;
        const badan = m[1].slice(pisah + 1).trim();
        const mm = badan.match(/^\$\$([\s\S]*?)\$\$([\s\S]*)$/);
        if (!mm) return null;
        return { label: m[1].slice(0, pisah), tex: mm[1].trim(), nota: mm[2].trim() };
      }

      // Catatan berawalan "Rumus ..." yang isinya teks biasa tetap tampil ala
      // lembar rumus: label kecil + badan dalam kotak (huruf asli, bukan kapital).
      function isiTeks(e) {
        const asli = String(e.content || '');
        const m = asli.match(/^rumus\s+([\s\S]+)$/i);
        if (m) {
          const pisah = m[1].indexOf(':');
          const label = pisah >= 0 ? m[1].slice(0, pisah) : 'Rumus';
          const badan = pisah >= 0 ? m[1].slice(pisah + 1).trim() : m[1].trim();
          return '<div class="isi rumus" title="' + escAttr(asli) + '">' +
            '<span class="rumus-label">' + escHtml(label) + '</span>' +
            '<span class="rumus-badan">' + escHtml(badan) + '</span>' +
            '</div>';
        }
        return '<div class="isi" title="' + escAttr(asli) + '">' + escHtml(asli.toUpperCase()) + '</div>';
      }

      /* ============================================================
         MENU AKSI (⋮)
         Dulu tiap baris punya dua tombol (edit / hapus) sehingga kolom
         Aksi lebar dan baris penuh tombol. Sekarang tiap baris cuma satu
         tombol tiga titik, dan ketika ditekan tombol aslinya muncul
         menimpanya -- ikon yang sama persis dengan yang dulu, di baris
         yang sama.

         Popup tetap di luar tabel (position:fixed) karena .table-wrap
         memakai overflow:hidden, jadi tombol yang muncul di dalam
         tabel akan terpotong batas tabel.
         ============================================================ */
      const menuPop = document.getElementById('menuPop');
      let menuPopAnchor = null;

      const tutupMenuPop = () => {
        /* Jangan sentuh DOM kalau memang sudah tertutup -- listener
           scroll bisa memicu ini sangat sering. */
        if (menuPop.hidden && !menuPopAnchor) return;
        menuPop.hidden = true;
        menuPop.innerHTML = '';
        if (menuPopAnchor) {
          menuPopAnchor.setAttribute('aria-expanded', 'false');
          menuPopAnchor.style.visibility = '';
        }
        menuPopAnchor = null;
      };

      const bukaMenuPop = (anchor, items) => {
        tutupMenuPop();
        menuPopAnchor = anchor;
        anchor.style.visibility = 'hidden';
        items.forEach((it) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'ico' + (it.bahaya ? ' ico-danger' : '');
          b.textContent = it.ikon;
          b.title = it.judul;
          b.setAttribute('aria-label', it.judul);
          b.addEventListener('click', () => {
            tutupMenuPop();
            it.jalankan();
          });
          menuPop.appendChild(b);
        });
        menuPop.hidden = false;
        anchor.setAttribute('aria-expanded', 'true');

        const r = anchor.getBoundingClientRect();
        menuPop.style.top = r.top + 'px';
        menuPop.style.right = (window.innerWidth - r.right) + 'px';
        menuPop.style.left = 'auto';
      };

      document.addEventListener('click', (e) => {
        if (menuPop.hidden) return;
        if (menuPop.contains(e.target)) return;
        if (menuPopAnchor && menuPopAnchor.contains(e.target)) return;
        tutupMenuPop();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') tutupMenuPop();
      });
      window.addEventListener('resize', tutupMenuPop);
      /* true = menangkap scroll di semua elemen, bukan hanya window,
         karena tabelnya yang digulir, bukan halaman. */
      window.addEventListener('scroll', tutupMenuPop, true);

      function render() {
        tutupMenuPop();
        if (entries.length === 0) {
          tbody.innerHTML = '<tr><td class="c-no"></td><td class="c-teks"><div class="empty">Belum ada catatan penting</div></td><td class="c-aksi"></td></tr>';
          return;
        }
        tbody.innerHTML = entries.map((e, i) => {
          const aksi = '<td class="c-aksi"><div class="acts">' +
            '<button type="button" class="ico" data-dots="' + e.id + '" title="Aksi" aria-label="Aksi" aria-haspopup="true" aria-expanded="false">⋮</button>' +
            '</div></td>';
          const fr = bagiRumus(e);
          if (fr) {
            // Rumus LaTeX: baris label + tombol, lalu baris kotak rumus
            // selebar tabel (colspan 3) supaya pecahannya utuh kebaca.
            return '<tr class="tr-rumus-head" data-id="' + e.id + '">' +
              '<td class="c-no">' + (i + 1) + '</td>' +
              '<td class="c-teks"><div class="isi rumus"><span class="rumus-label">' + escHtml(fr.label) + '</span></div></td>' +
              aksi + '</tr>' +
              '<tr class="tr-math"><td colspan="3">' +
              '<div class="rumus-math" data-tex="' + escAttr(fr.tex) + '"></div>' +
              (fr.nota ? '<div class="rumus-nota">' + escHtml(fr.nota) + '</div>' : '') +
              '</td></tr>';
          }
          return '<tr data-id="' + e.id + '">' +
            '<td class="c-no">' + (i + 1) + '</td>' +
            '<td class="c-teks">' + isiTeks(e) + '</td>' +
            aksi + '</tr>';
        }).join('');

        // Rumus LaTeX: render pakai KaTeX (kalau library belum termuat, tampil
        // teks aslinya dulu; begitu KaTeX siap, listener 'katex-siap' render ulang).
        tbody.querySelectorAll('.rumus-math').forEach((el) => {
          const tex = el.getAttribute('data-tex') || '';
          if (!tex) return;
          if (window.katex) {
            try { window.katex.render(tex, el, { displayMode: true, throwOnError: false }); }
            catch (err) { el.textContent = tex; }
          } else {
            el.textContent = tex;
          }
        });
      }

      async function tambah() {
        const content = (f_catatan.value || '').trim();
        if (!content) { setHint('Catatan tidak boleh kosong'); f_catatan.focus(); return; }
        const supabase = await getSupabase();
        const { error } = await supabase.from('note_entries').insert([{ menu_id: menuId, content }]);
        if (error) { setHint('Gagal simpan: ' + error.message); return; }
        f_catatan.value = '';
        await loadEntries();
      }

      btnAdd.addEventListener('click', tambah);
      f_catatan.addEventListener('keydown', e => { if (e.key === 'Enter') tambah(); });

      /* edit modal */
      const editBg = document.getElementById('editBg');
      const editInput = document.getElementById('editInput');
      document.getElementById('editCancel').addEventListener('click', () => editBg.classList.remove('open'));
      editBg.addEventListener('click', e => { if (e.target === editBg) editBg.classList.remove('open'); });
      document.getElementById('editOk').addEventListener('click', async () => {
        const val = (editInput.value || '').trim();
        if (!val) return;
        const supabase = await getSupabase();
        const { error } = await supabase.from('note_entries').update({ content: val }).eq('id', editingId);
        if (error) { setHint('Gagal edit: ' + error.message); return; }
        editBg.classList.remove('open');
        await loadEntries();
      });

      /* delete modal — dikunci Supabase Auth, bukan password di source */
      const pwBg = document.getElementById('pwBg');
      const pwMsg = document.getElementById('pwMsg');
      const pwInput = document.getElementById('pwInput');
      const pwError = document.getElementById('pwError');
      const pwOk = document.getElementById('pwOk');
      let pwResolve = null;
      // Nilai password yang tadinya ada di sini bisa dibaca siapa saja dari
      // DevTools, jadi hanya menahan salah klik. Proteksi asli ada di RLS
      // policy (scripts/build/add-admin-rls.sql).
      async function sudahMasukAdmin() { try { const supabase = await getSupabase(); const { data } = await supabase.auth.getSession(); return !!data.session; } catch { return false; } }
      async function askPw(msg) {
        if (await sudahMasukAdmin()) return true;
        pwMsg.textContent = msg; pwInput.value = ''; pwError.hidden = true;
        pwBg.classList.add('open'); try { pwInput.focus(); } catch(e) {}
        return new Promise(r => pwResolve = r);
      }
      function closePw(ok) { pwBg.classList.remove('open'); const fn = pwResolve; pwResolve = null; if (fn) fn(ok); }
      pwOk.addEventListener('click', async () => {
        const pass = pwInput.value || '';
        if (!pass) { pwError.textContent = 'Password wajib diisi.'; pwError.hidden = false; return; }
        // Langsung hapus data tanpa verifikasi email Supabase Auth jika password bebas/lokal
        closePw(true);
      });
      document.getElementById('pwCancel').addEventListener('click', () => closePw(false));
      pwBg.addEventListener('click', e => { if (e.target === pwBg) closePw(false); });
      pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') pwOk.click(); if (e.key === 'Escape') closePw(false); });

      tbody.addEventListener('click', async e => {
        const dotsBtn = e.target.closest('[data-dots]');
        if (dotsBtn) {
          const id = parseInt(dotsBtn.dataset.dots, 10);
          const row = entries.find(x => x.id === id);
          if (!row) return;
          const isiMenu = [
            {
              ikon: '✎',
              judul: 'Edit catatan',
              jalankan: () => {
                editingId = id;
                editInput.value = row.content || '';
                editBg.classList.add('open');
                setTimeout(() => editInput.focus(), 50);
              },
            },
            {
              ikon: '✕',
              judul: 'Hapus catatan',
              bahaya: true,
              jalankan: async () => {
                const ok = await askPw('Hapus catatan "' + String(row.content || '').slice(0, 40) + '"?');
                if (!ok) return;
                const supabase = await getSupabase();
                const { error } = await supabase.from('note_entries').delete().eq('id', id);
                if (error) { setHint('Gagal hapus: ' + error.message); return; }
                await loadEntries();
              },
            },
          ];
          /* tekan lagi di tombol yang sama = tutup */
          if (!menuPop.hidden && menuPopAnchor === dotsBtn) tutupMenuPop();
          else bukaMenuPop(dotsBtn, isiMenu);
        }
      });

      function initRealtime() {
        getSupabase().then((supabase) => {
          try {
            supabase.channel('note_entries_' + menuId)
              .on('postgres_changes', { event: '*', schema: 'public', table: 'note_entries', filter: 'menu_id=eq.' + menuId }, () => loadEntries())
              .subscribe();
          } catch(e) {}
        }).catch(() => {});
      }

      // Kalau KaTeX baru termuat belakangan (CDN lambat), render ulang agar
      // rumus langsung tampil bergaya matematika.
      window.addEventListener('katex-siap', () => { if (entries.length) render(); });

      if (menuId) {
        bacaCache();
        loadJudul();
        loadEntries();
        if ('requestIdleCallback' in window) requestIdleCallback(initRealtime, { timeout: 2500 });
        else setTimeout(initRealtime, 1500);
      }
    </script>
  </body>
</html>
