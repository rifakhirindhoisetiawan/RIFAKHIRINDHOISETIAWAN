<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Stok Opname</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100vh;
        min-height: 100dvh;
        background: #ffffff;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        overflow-x: hidden;
      }

      .container {
        width: 100%;
        max-width: 800px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0 auto;
        padding: 12px 18px 40px;
        padding-top: max(12px, env(safe-area-inset-top));
      }

      .search-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-bottom: 14px;
      }

      .date-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 10px 14px;
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 10px;
      }

      .date-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
        width: 18px;
        height: 18px;
      }

      .date-text {
        font-size: clamp(11px, 2.8vw, 13px);
        font-weight: 700;
        color: #1f2937;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }

      .clock-text {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: clamp(12px, 3.2vw, 14px);
        font-weight: 700;
        color: #3b82f6;
        white-space: nowrap;
        flex-shrink: 0;
        margin-left: auto;
      }

      .menu-list {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px 10px;
        width: 100%;
        align-content: start;
      }

      .menu-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: #1a1a1a;
        cursor: pointer;
      }

      .menu-item .icon-box {
        width: 100%;
        max-width: 110px;
        aspect-ratio: 9 / 16;
        background: #f1f2f4;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        overflow: hidden;
        position: relative;
      }

      .menu-item .icon-box::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #f1f2f4 25%, #e3e5e9 50%, #f1f2f4 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
      }

      .menu-item .icon-box.siap::after {
        display: none;
      }

      .menu-item .icon-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        position: relative;
        z-index: 1;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      .menu-item .icon-box img.loaded {
        opacity: 1;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .menu-item .label {
        font-size: 9px;
        font-weight: 700;
        text-align: center;
        line-height: 1.2;
        color: #1f2937;
        max-width: 100%;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      @media (max-width: 360px) {
        .menu-item .icon-box {
          max-width: 95px;
          border-radius: 14px;
        }
        .menu-item .label {
          font-size: 10px;
        }
      }

      /* ============================================================
         TEMA MORI
         Palet dari public/mori/css/variables.css:
         bg #fffbf2 · surface #f7f3e9 · primary #1a1917 · text-secondary #6e6a64
         Gaya: sharp (radius 0), border hitam solid, shadow offset 4px.
         ============================================================ */
      :root {
        --mori-bg: #fffbf2;
        --mori-surface: #f7f3e9;
        --mori-text: #1a1917;
        --mori-text-2: #6e6a64;
        --mori-line: rgba(26, 25, 23, 0.14);
        --mori-accent: #1a1917;
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      html,
      body {
        background: var(--mori-bg);
      }

      body {
        color: var(--mori-text);
        -webkit-font-smoothing: antialiased;
      }

      .container {
        background: var(--mori-bg);
      }

      /* ===== BARIS TANGGAL + JAM ===== */
      .date-box {
        background: var(--mori-surface);
        border: 1px solid var(--mori-accent);
        border-radius: 0;
        box-shadow: 4px 4px 0 rgba(26, 25, 23, 0.12);
      }

      .date-box svg {
        color: var(--mori-text-2);
      }

      .date-text {
        color: var(--mori-text);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .clock-text {
        font-family: var(--mori-mono);
        color: var(--mori-accent);
        letter-spacing: 0.5px;
      }

      /* ===== TILE MENU ===== */
      .menu-item .icon-box {
        background: var(--mori-surface);
        border: 1px solid var(--mori-accent);
        border-radius: 0;
        box-shadow: 4px 4px 0 rgba(26, 25, 23, 0.12);
        transition: box-shadow 0.2s ease, transform 0.2s ease;
      }

      .menu-item .icon-box::after {
        background: linear-gradient(90deg, #f2eee2 25%, #e8e2d2 50%, #f2eee2 75%);
      }

      .menu-item:hover .icon-box {
        box-shadow: 4px 4px 0 var(--mori-accent);
      }

      .menu-item:active .icon-box {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--mori-accent);
      }

      .menu-item .label {
        font-family: var(--mori-mono);
        color: var(--mori-text);
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="search-wrapper">
        <div class="date-box">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          <span class="date-text" id="dateText"></span>
          <span class="clock-text" id="clockText"></span>
        </div>
      </div>
      <div class="menu-list" id="menuList"></div>
    </div>
    <script type="module">
      import { supabase } from '../../js/supabase.js';

      const THUMB = '../../assets/images/time-kamera/1.png';
      const BUCKET = 'stock-foto';
      const menuList = document.getElementById('menuList');

      const dateText = document.getElementById('dateText');
      const clockText = document.getElementById('clockText');
      const tick = () => {
        const now = new Date();
        dateText.textContent = now.toLocaleDateString('id-ID', {
          weekday: 'short',
          day: '2-digit',
          month: 'short',
          year: 'numeric',
        });
        clockText.textContent = now.toLocaleTimeString('id-ID', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false,
        });
      };
      tick();
      setInterval(tick, 1000);

      // Foto menu di-upload dengan nama file yang sama, jadi URL publiknya tidak
      // berubah. Tanpa param cache-bust, tile masih menampilkan foto lama.
      let fotoVersi = Date.now();
      const fotoBaru = (url) => {
        if (!url) return url;
        return url + (url.includes('?') ? '&' : '?') + 'v=' + fotoVersi;
      };

      const addTile = (label, href, thumb = THUMB) => {
        const a = document.createElement('a');
        a.className = 'menu-item';
        a.href = href;
        a.innerHTML = `
          <div class="icon-box">
            <img
              alt="${label}"
              src="${fotoBaru(thumb)}"
              loading="lazy"
              decoding="async"
              onload="this.classList.add('loaded');this.parentElement.classList.add('siap')"
              onerror="this.onerror=null;this.src='${THUMB}';this.parentElement.classList.add('siap')"
            />
          </div>
          <span class="label">${label}</span>
        `;
        menuList.appendChild(a);
      };

      const fotoStorage = (id) =>
        supabase.storage.from(BUCKET).getPublicUrl('menu/' + id + '.jpg').data.publicUrl;

      const adaFoto = async (url) => {
        try {
          const r = await fetch(url, { method: 'HEAD' });
          return r.ok;
        } catch {
          return false;
        }
      };

      addTile('ADMIN STOCK OPNAME', 'stock-admin.html', (await adaFoto(fotoStorage('admin')))
        ? fotoStorage('admin')
        : THUMB);

      let hasil = await supabase.from('so_menus').select('id, name, foto_url').order('name');
      if (hasil.error) {
        hasil = await supabase.from('so_menus').select('id, name').order('name');
        if (hasil.error) {
          console.error('Gagal memuat menu SO:', hasil.error.message);
        }
      }
      for (const menu of hasil.data || []) {
        let thumb = THUMB;
        if (menu.foto_url) {
          thumb = menu.foto_url;
        } else {
          const cek = fotoStorage(menu.id);
          if (await adaFoto(cek)) thumb = cek;
        }
        addTile(menu.name, 'so.html?m=' + menu.id, thumb);
      }
    </script>
  </body>
</html>
