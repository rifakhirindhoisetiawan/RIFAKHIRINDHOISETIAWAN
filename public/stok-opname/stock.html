<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Stok Opname</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100vh;
        min-height: 100dvh;
        background: #ffffff;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        overflow-x: hidden;
      }

      .container {
        width: 100%;
        max-width: 800px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0 auto;
        padding: 12px 18px 40px;
        padding-top: max(12px, env(safe-area-inset-top));
      }

      .search-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-bottom: 14px;
      }

      .date-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 10px 14px;
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 10px;
      }

      .date-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
        width: 18px;
        height: 18px;
      }

      .date-text {
        font-size: clamp(11px, 2.8vw, 13px);
        font-weight: 700;
        color: #1f2937;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }

      .clock-text {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: clamp(12px, 3.2vw, 14px);
        font-weight: 700;
        color: #3b82f6;
        white-space: nowrap;
        flex-shrink: 0;
        margin-left: auto;
      }

      .menu-list {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px 10px;
        width: 100%;
        align-content: start;
      }

      .menu-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: #1a1a1a;
        cursor: pointer;
      }

      .menu-item .icon-box {
        width: 100%;
        max-width: 110px;
        aspect-ratio: 9 / 16;
        background: #f1f2f4;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        overflow: hidden;
        position: relative;
      }

      .menu-item .icon-box::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #f1f2f4 25%, #e3e5e9 50%, #f1f2f4 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
      }

      .menu-item .icon-box.siap::after {
        display: none;
      }

      .menu-item .icon-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        position: relative;
        z-index: 1;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      .menu-item .icon-box img.loaded {
        opacity: 1;
      }

      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      .menu-item .label {
        font-size: 9px;
        font-weight: 700;
        text-align: center;
        line-height: 1.2;
        color: #1f2937;
        max-width: 100%;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      @media (max-width: 360px) {
        .menu-item .icon-box {
          max-width: 95px;
          border-radius: 14px;
        }
        .menu-item .label {
          font-size: 10px;
        }
      }

      /* ============================================================
         TEMA MORI
         Palet dari public/mori/css/variables.css:
         bg #fffbf2 · surface #f7f3e9 · primary #1a1917 · text-secondary #6e6a64
         Gaya: sharp (radius 0), border hitam solid, shadow offset 4px.
         ============================================================ */
      :root {
        --mori-bg: #fffbf2;
        --mori-surface: #f7f3e9;
        --mori-text: #1a1917;
        --mori-text-2: #6e6a64;
        --mori-line: rgba(26, 25, 23, 0.14);
        --mori-accent: #1a1917;
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      html,
      body {
        background: var(--mori-bg);
      }

      body {
        color: var(--mori-text);
        -webkit-font-smoothing: antialiased;
      }

      .container {
        background: var(--mori-bg);
      }

      /* ===== BARIS TANGGAL + JAM =====
         Sama seperti index.html: garis tepi lembut (bukan hitam penuh). */
      .date-box {
        background: var(--mori-surface);
        border: 1px solid var(--mori-line);
        border-radius: 0;
        box-shadow: none;
      }

      .date-box svg {
        color: var(--mori-text-2);
      }

      .date-text {
        color: var(--mori-text);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .clock-text {
        font-family: var(--mori-mono);
        color: var(--mori-accent);
        letter-spacing: 0.5px;
      }

      /* ===== TILE MENU ===== */
      .menu-item .icon-box {
        background: var(--mori-surface);
        /* tanpa garis hitam (permintaan) */
        border: none;
        border-radius: 0;
        box-shadow: none;
        transition: box-shadow 0.2s ease, transform 0.2s ease;
      }

      .menu-item .icon-box::after {
        display: none; /* shimmer pindah ke background kotak (sama index) */
      }

      .menu-item:hover .icon-box {
        box-shadow: none;
      }

      .menu-item:active .icon-box {
        transform: translate(2px, 2px);
        box-shadow: none;
      }

      .menu-item .label {
        font-family: var(--mori-mono);
        color: var(--mori-text);
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }

      /* ============================================================
         SAMAKAN DENGAN index.html
         Override sharp di atas memakai radius 0, sementara menu utama
         (index.html) sudah bulat 8px. Nilai di bawah disalin persis dari
         index.html supaya dua halaman ini terlihat sama.
         ============================================================ */
      .date-box {
        border-radius: 8px;
        /* index.html: kotak pencarian tidak punya bayangan diam-diam,
           bayangan hanya muncul saat fokus */
        box-shadow: none;
      }

      .menu-item .icon-box {
        width: 100%;
        max-width: 100px; /* index.html: 100px, bukan 110px */
        aspect-ratio: 9 / 16;
        border-radius: 8px;
        /* sama seperti index.html: tile menu tanpa garis hitam */
        border: none;
        margin-bottom: 10px; /* index.html: 10px, bukan 8px */
        box-shadow: none;
        /* index.html shimmer di background kotak, bukan ::after */
        background: linear-gradient(90deg, #f2eee2 25%, #e8e2d2 50%, #f2eee2 75%);
        background-size: 200% 100%;
        animation: shimmer 1.2s infinite;
      }
      /* begitu foto siap, shimmer disembunyikan (kelas .siap dari JS) */
      .menu-item .icon-box.siap {
        animation: none;
        background: var(--mori-surface);
      }
      .menu-item:hover .icon-box {
        box-shadow: none;
      }
      .menu-item:active .icon-box {
        transform: translate(2px, 2px);
        box-shadow: none;
      }

      .menu-item .label {
        font-size: 9px; /* index.html: 9px */
        font-weight: 700;
        line-height: 1.3; /* index.html: 1.3 */
        letter-spacing: 1px; /* index.html: 1px */
        color: var(--mori-text);
        font-family: var(--mori-mono);
        text-transform: uppercase;
      }

      @media (max-width: 360px) {
        .menu-item .icon-box {
          max-width: 85px; /* index.html: 85px */
          border-radius: 8px;
        }
        .menu-item .label {
          font-size: 8px; /* index.html: 8px */
          letter-spacing: 0.6px;
        }
      }

      .pin-mode-btn {
        flex: 0 0 auto;
        width: 46px;
        height: 46px;
        border-radius: 8px;
        border: 1px solid var(--mori-line);
        background: var(--mori-surface);
        color: var(--mori-text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      .pin-mode-btn:active {
        transform: translate(2px, 2px);
      }
      .pin-mode-btn[aria-pressed="true"] {
        background: var(--mori-text);
        color: var(--mori-bg);
        border-color: var(--mori-text);
      }
      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--mori-line);
        border-radius: 8px;
        padding: 11px 14px;
        color: var(--mori-text, #1a1917);
        font-size: 13px;
        background: var(--mori-surface, #f7f3e9);
        transition: background 0.2s ease;
      }
      .search-box:focus-within {
        background: #fffdf7;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: var(--mori-text);
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }
      .search-box input::placeholder {
        color: var(--mori-text-2);
      }
      .search-box svg {
        flex-shrink: 0;
        color: var(--mori-text-2);
        width: 18px;
        height: 18px;
      }
      body.pin-mode .menu-item:not([data-admin="true"]) {
        position: relative;
        cursor: pointer;
      }
      body.pin-mode .menu-item:not([data-admin="true"])::after {
        content: '';
        position: absolute;
        top: 4px;
        right: 4px;
        width: 14px;
        height: 14px;
        background: var(--mori-text);
        border-radius: 50%;
        box-shadow: 0 0 0 2px var(--mori-bg);
      }
      body.pin-mode .menu-item:not([data-admin="true"]).pinned::after {
        background: #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="search-wrapper">
        <div class="search-box">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="Cari menu..."
            oninput="renderMenu()"
          />
        </div>
        <button
          class="pin-mode-btn"
          id="pinModeBtn"
          type="button"
          aria-pressed="false"
          title="Mode Semat"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 17v5"></path>
            <path d="M9 10.8V4h6v6.8l2 3.2H7l2-3.2z"></path>
          </svg>
        </button>
      </div>
      <div class="menu-list" id="menuList"></div>
    </div>
    <script type="module">
      import { supabase } from '../../js/supabase.js';

      const THUMB = '../../assets/images/time-kamera/1.jpg';
      const BUCKET = 'stock-foto';
      const menuList = document.getElementById('menuList');
      const searchInput = document.getElementById('searchInput');

      // Foto menu di-upload dengan nama file yang sama, jadi URL publiknya tidak
      // berubah. Tanpa param cache-bust, tile masih menampilkan foto lama.
      let fotoVersi = Date.now();
      const fotoBaru = (url) => {
        if (!url) return url;
        return url + (url.includes('?') ? '&' : '?') + 'v=' + fotoVersi;
      };

      const fotoStorage = (id) =>
        supabase.storage.from(BUCKET).getPublicUrl('menu/' + id + '.jpg').data.publicUrl;

      const adaFoto = async (url) => {
        try {
          const r = await fetch(url, { method: 'HEAD' });
          return r.ok;
        } catch {
          return false;
        }
      };

      const PIN_KEY = 'so_pinned_v1';
      let pinned = [];
      try {
        pinned = JSON.parse(localStorage.getItem(PIN_KEY)) || [];
      } catch {
        pinned = [];
      }
      const isPinned = (label) => pinned.includes(label);
      let modeSemat = false;
      const pinModeBtn = document.getElementById('pinModeBtn');
      if (pinModeBtn) {
        pinModeBtn.addEventListener('click', () => {
          modeSemat = !modeSemat;
          pinModeBtn.setAttribute('aria-pressed', modeSemat ? 'true' : 'false');
          document.body.classList.toggle('pin-mode', modeSemat);
        });
      }

      let allItems = [];

      const soLazy = new IntersectionObserver((entries, obs) => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          const img = e.target.querySelector('img[data-src]');
          if (img) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
          obs.unobserve(e.target);
        });
      }, { rootMargin: '200px' });

      const renderMenu = () => {
        menuList.innerHTML = '';
        const q = searchInput ? searchInput.value.toLowerCase().trim() : '';
        const rank = (item) => {
          if (item.isAdmin) return -1;
          const i = pinned.indexOf(item.label);
          return i === -1 ? Number.MAX_SAFE_INTEGER : i;
        };
        const filtered = allItems.filter(item => !q || item.label.toLowerCase().includes(q));
        const sorted = [...filtered].sort((a, b) => rank(a) - rank(b));

        sorted.forEach(item => {
          const a = document.createElement('a');
          a.className = 'menu-item' + (isPinned(item.label) ? ' pinned' : '');
          a.href = item.href;
          if (item.isAdmin) a.setAttribute('data-admin', 'true');
          a.innerHTML = `
            <div class="icon-box">
              <img
                alt="${item.label}"
                data-src="${fotoBaru(item.thumb)}"
                loading="lazy"
                decoding="async"
                onload="this.classList.add('loaded');this.parentElement.classList.add('siap')"
                onerror="this.onerror=null;this.src='${THUMB}';this.parentElement.classList.add('siap')"
              />
            </div>
            <span class="label">${item.label}</span>
          `;
          a.addEventListener('click', (e) => {
            if (modeSemat && !item.isAdmin) {
              e.preventDefault();
              e.stopPropagation();
              if (isPinned(item.label)) {
                pinned = pinned.filter(l => l !== item.label);
              } else {
                pinned.push(item.label);
              }
              try {
                localStorage.setItem(PIN_KEY, JSON.stringify(pinned));
              } catch {}
              renderMenu();
            }
          });
          menuList.appendChild(a);
        });

        document.querySelectorAll('.menu-item').forEach(el => soLazy.observe(el));
      };

      /* Nama tile ADMIN disimpan di tabel so_admin (lihat
         scripts/build/add-so-admin-nama.sql) supaya bisa diubah dari
         stock-admin.html. Kalau tabelnya belum ada (PGRST205), pakai
         nama bawaan -- halaman tetap jalan. */
      const NAMA_ADMIN_AWAL = 'ADMIN STOCK OPNAME';
      let namaAdmin = NAMA_ADMIN_AWAL;
      try {
        const { data, error } = await supabase
          .from('so_admin')
          .select('name')
          .eq('id', 'admin')
          .maybeSingle();
        const v = !error && data && data.name ? String(data.name).trim() : '';
        if (v) namaAdmin = v;
      } catch {
        /* pakai nama bawaan */
      }

      allItems.push({
        label: namaAdmin,
        href: 'stock-admin.html',
        thumb: (await adaFoto(fotoStorage('admin'))) ? fotoStorage('admin') : THUMB,
        isAdmin: true
      });

      let hasil = await supabase.from('so_menus').select('id, name, foto_url').order('name');
      if (hasil.error) {
        hasil = await supabase.from('so_menus').select('id, name').order('name');
      }
      for (const menu of hasil.data || []) {
        let thumb = THUMB;
        if (menu.foto_url) {
          thumb = menu.foto_url;
        } else {
          const cek = fotoStorage(menu.id);
          if (await adaFoto(cek)) thumb = cek;
        }
        allItems.push({
          label: menu.name,
          href: 'so.html?m=' + menu.id,
          thumb: thumb,
          isAdmin: false
        });
      }

      renderMenu();
    </script>
  </body>
</html>
