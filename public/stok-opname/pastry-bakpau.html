<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>PASTRY BAKPAU</title>
    <meta name="theme-color" content="#fffbf2" />
    <style>
      /* ============================================================
         TEMA MORI — palet sama dengan seluruh aplikasi:
         bg #fffbf2 · surface #f7f3e9 · teks #1a1917 · redup #6e6a64
         Garis #1a1917 30% (bukan abu-abu), radius 10px, mono JetBrains.
         ============================================================ */
      :root {
        --mori-bg: #fffbf2;
        --mori-surface: #f7f3e9;
        --mori-text: #1a1917;
        --mori-text-2: #6e6a64;
        --mori-line: rgba(26, 25, 23, 0.14);
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
        --mori-radius: 10px;

        /* alias supaya aturan di bawah tidak perlu diubah semua */
        --background: var(--mori-bg);
        --surface: var(--mori-surface);
        --text: var(--mori-text);
        --muted: var(--mori-text-2);
        --border: var(--mori-line);
        --primary: var(--mori-text);
        --badge-bg: var(--mori-surface);
        --badge-text: var(--mori-text);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: var(--mori-bg);
      }

      body {
        color: var(--mori-text);
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: 100%;
        max-width: 800px;
        min-height: 100dvh;
        margin: 0 auto;
        padding: max(14px, env(safe-area-inset-top)) 18px 40px;
        background: var(--mori-bg);
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 18px;
      }

      .back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        border: 1px solid var(--mori-line);
        border-radius: var(--mori-radius);
        color: var(--mori-text);
        background: var(--mori-surface);
        text-decoration: none;
        font-size: 22px;
        line-height: 1;
      }

      .back:active {
        transform: translate(2px, 2px);
      }

      .heading {
        flex: 1;
        min-width: 0;
      }

      .eyebrow {
        color: var(--mori-text-2);
        font-family: var(--mori-mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }

      h1 {
        color: var(--mori-text);
        font-family: var(--mori-mono);
        font-size: clamp(17px, 5vw, 22px);
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        line-height: 1.2;
      }

      .count {
        flex: 0 0 auto;
        color: var(--mori-text-2);
        font-family: var(--mori-mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .toolbar {
        padding-bottom: 14px;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-width: 0;
        height: 46px;
        box-sizing: border-box;
        padding: 0 14px;
        border: 1px solid var(--mori-line);
        border-radius: var(--mori-radius);
        background: var(--mori-surface);
        color: var(--mori-text-2);
        transition: background 0.2s ease;
      }

      .search-box:focus-within {
        background: #fffdf7;
      }

      .search-box svg {
        width: 18px;
        height: 18px;
        flex: 0 0 18px;
      }

      .search-box input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--mori-text);
        font-family: inherit;
        font-size: 14px;
      }

      .search-box input::placeholder {
        color: var(--mori-text-2);
      }

      /* Garis tepi 1.5px warna gelap + radius 10px, sama seperti
         Admin KOPI / Admin NOTE / Admin Stok Opname. */
      .table-wrap {
        overflow-x: auto;
        border: 1.5px solid rgba(26, 25, 23, 0.3) !important;
        border-radius: var(--mori-radius);
        background: var(--mori-bg) !important;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .table-wrap::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      table {
        width: 100%;
        min-width: 500px;
        border-collapse: collapse;
        background: var(--mori-bg);
        font-size: 13px;
      }

      thead {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--mori-surface);
      }

      th,
      td {
        padding: 0 12px;
        height: 36px;
        border-bottom: 1px solid var(--mori-line) !important;
        border-right: none;
        text-align: left;
        vertical-align: middle;
      }
      th:last-child,
      td:last-child {
        border-right: none;
      }

      th {
        background: var(--mori-surface);
        color: var(--mori-text-2);
        font-family: var(--mori-mono);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      tbody td {
        background: var(--mori-bg);
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover td {
        background: var(--mori-surface);
      }

      .plu {
        color: var(--mori-text);
        font-family: var(--mori-mono);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 9px;
        border: 1px solid var(--mori-line);
        border-radius: 6px;
        background: var(--mori-surface);
        color: var(--mori-text);
        font-family: var(--mori-mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.6px;
      }

      .empty {
        padding: 28px 16px;
        color: var(--mori-text-2);
        font-family: var(--mori-mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-align: center;
      }

      @media (min-width: 768px) {
        .page {
          padding-right: 18px;
          padding-left: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="back" href="../../index.html" aria-label="Kembali ke index">←</a>
        <div class="heading">
          <div class="eyebrow">DAFTAR PRODUK</div>
          <h1>PASTRY BAKPAU</h1>
        </div>
        <div class="count" id="count" aria-live="polite"></div>
      </header>

      <section class="toolbar">
        <label class="search-box" for="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="search" type="search" placeholder="Cari PLU atau nama..." autocomplete="off" />
        </label>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>PLU</th>
              <th>Deskripsi</th>
              <th>Kategori</th>
            </tr>
          </thead>
          <tbody id="items"></tbody>
        </table>
        <p class="empty" id="empty" hidden>Produk tidak ditemukan.</p>
      </section>
    </main>

    <script>
      const items = [
        ["446417", "JD MINI STEAM CHEESE FILLING35G"],
        ["446418", "JD MINI STEAM CAKE MATCHA35G"],
        ["446419", "JD MINI STEAM CAKE CHOCO35G"],
        ["446420", "JD MINI BLUDER CHOCO35G"],
        ["446421", "JD MINI BLUDER CHEESE35G"],
        ["446422", "JD MINI CREAM MESSES50G"],
        ["446688", "JD BAPAO KACANG HIJAU BYI"],
        ["446689", "JD BAPAO COKLAT BYI"],
        ["446690", "JD BAPAO STRAWBERRY BYI"],
        ["446691", "JD BAPAO AYAM BYI"],
        ["446692", "JD CHIFFON DONUT KEJU BYI"],
        ["446693", "JD CHIFFON DONUT PANDAN BYI"],
        ["446694", "JD CHIFFON DONUT COKLAT BYI"],
        ["446695", "JD BOMBOLONI CHOCO PEANUT BYI"],
        ["446696", "JD BOMBOLONI STRAWBERRY BYI"],
        ["446697", "JD BOMBOLONI DOUBLE CHOCOLATE B"],
        ["446698", "JD LONG JOHN KEJU BYI"],
        ["446699", "JD LONG JOHN MESES BYI"],
        ["446700", "JD ROTI DAGING AYAM BYI"],
        ["446701", "JD PIZZA BYI"],
        ["446702", "JD ABON GULUNG AYAM BYI"],
        ["446704", "JD ROTI PISANG COKLAT KEJU BYI"],
        ["446705", "JD ROTI PISANG COKLAT BYI"],
        ["446706", "JD DIMSUM AYAM WORTEL BYI"],
        ["446707", "JD DIMSUM AYAM UDANG BYI"],
        ["446708", "JD DIMSUM AYAM JAMUR BYI"],
        ["446709", "JD DIMSUM AYAM TELUR BYI"],
        ["446710", "JD DIMSUM AYAM CUMI BYI"],
        ["446711", "JD RISOLES BYI"],
        ["446712", "JD SOSIS SOLO BYI"],
        ["446713", "JD PLAIN CROISSANT BYI"],
        ["446714", "JD ALMOND CROISSANT BYI"],
        ["446715", "JD CHEESE CROISSANT BYI"],
        ["446716", "JD CINNAMON ROLL CROISSANT BYI"],
        ["446717", "JD DANISH RAISIN CROISSANT BYI"],
        ["446718", "JD PAIN AU CHOCO CROISSANT BYI"],
        ["446719", "JD MARTABAK CROISSANT BYI"],
        ["446720", "JD PAIN SUISSE CROISSANT BYI"],
        ["446721", "JD CROFFLE BYI"],
        ["446722", "JD BEEF SAUSAGE CROISSANT BYI"],
        ["446723", "JD SMOKE BEEF CROISSANT BYI"],
        ["446724", "JD TUNA PUFF BYI"],
        ["446725", "JD SAUSAGE PUFF BYI"],
        ["446726", "JD CHICKEN CURRY PUFF BYI"],
        ["894858", "PLU K 5DAYS MINI CROISSANT (PC)"],
      ];

      const search = document.getElementById("search");
      const tbody = document.getElementById("items");
      const count = document.getElementById("count");
      const empty = document.getElementById("empty");

      function renderItems() {
        const query = search.value.trim().toLowerCase();
        tbody.replaceChildren();
        let visible = 0;

        items.forEach(([plu, name]) => {
          if (query && !`${plu} ${name}`.toLowerCase().includes(query)) return;

          const row = document.createElement("tr");
          const pluCell = document.createElement("td");
          const nameCell = document.createElement("td");
          const categoryCell = document.createElement("td");
          const badge = document.createElement("span");

          pluCell.className = "plu";
          pluCell.textContent = plu;
          nameCell.textContent = name;
          badge.className = "badge";
          badge.textContent = "RTE";
          categoryCell.appendChild(badge);
          row.append(pluCell, nameCell, categoryCell);
          tbody.appendChild(row);
          visible += 1;
        });

        count.textContent = `${visible} item`;
        empty.hidden = visible !== 0;
      }

      search.addEventListener("input", renderItems);
      renderItems();
    </script>
  </body>
</html>
