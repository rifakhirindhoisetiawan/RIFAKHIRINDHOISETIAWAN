<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>Admin - Stok Opname</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --text: #1f2937;
        --muted: #9ca3af;
        --line: #e5e7eb;
        --line-2: #d9dde3;
        --surface: #f3f4f6;
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --soft: #eef2ff;
        --soft-2: #c7d2fe;
        --danger: #ef4444;
        --row-h: 36px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #ffffff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--text);
        min-height: 100vh;
        max-width: 960px;
        margin: 0 auto;
        padding: 14px 18px 40px;
        padding-top: max(14px, env(safe-area-inset-top));
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .sec + .sec {
        margin-top: 26px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .count {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
      }

      input {
        width: 100%;
        min-width: 0;
        height: var(--row-h);
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 10px;
        text-transform: uppercase;
      }

      input[type="number"] {
        text-transform: none;
      }

      input::placeholder {
        color: #c3c8d1;
      }

      input:focus {
        outline: none;
        background: #fff;
        border-color: #888;
      }

      .grow {
        flex: 1;
        min-width: 0;
      }

      .btn,
      .ico {
        width: 32px;
        height: 32px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        line-height: 1;
        color: #ffffff;
        background: #6366f1;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        flex-shrink: 0;
        outline: none;
        transition: all 0.15s ease;
      }

      .btn {
        font-size: 17px;
      }

      .menu-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
      }

      .menu-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .menu-item .nama {
        flex: 1;
        min-width: 0;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .menu-item.on .nama {
        color: var(--primary-dark);
        font-weight: 800;
        background: var(--surface);
        border-color: var(--line-2);
      }

      .table-wrap {
        overflow-x: auto;
        overflow-y: hidden;
        border: 1px solid #ddd;
        border-radius: 10px;
        -webkit-overflow-scrolling: touch;
        background: #fff;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .table-wrap::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      .daftar-wrap {
        overflow: hidden;
        border-color: #e5e7eb;
      }

      .menu-tulis {
        flex-wrap: nowrap;
        margin-bottom: 0;
      }

      .menu-tulis .table-wrap {
        flex: 1;
        min-width: 0;
      }

      table.daftar {
        font-size: 12px;
      }

      table.daftar td {
        height: auto;
        padding: 8px 12px;
        font-weight: 700;
        color: var(--text);
      }

      table.daftar tr + tr td {
        border-top: 1px solid #eeeeee;
        border-bottom: 0;
      }

      table.daftar .tulis-in {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      table.daftar input {
        flex: 1;
        min-width: 0;
        height: 24px;
        padding: 0;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
        background: transparent;
        border: none;
        border-radius: 0;
        text-transform: uppercase;
      }

      table.daftar input::placeholder {
        color: #c3c8d1;
      }

      table.daftar input:focus {
        outline: none;
        background: transparent;
        border-color: transparent;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .daftar {
        min-width: 180px;
      }

      .barang {
        min-width: 620px;
      }

      .c-nama {
        max-width: 340px;
      }

      .potong {
        max-width: 340px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f9f9f9;
        color: var(--muted);
        font-size: clamp(10px, 2.6vw, 12px);
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-align: left;
        height: 34px;
        padding: 0 12px;
        border-bottom: 1px solid #e5e7eb;
        white-space: nowrap;
      }

      tbody td {
        height: 44px;
        padding: 0 10px;
        border-bottom: 1px solid #f1f2f4;
        vertical-align: middle;
        transition: background 0.5s ease;
      }

      tbody td.ok {
        background: #ecfdf5;
      }

      .tambah td {
        background: #fafbfc;
      }

      .tambah:hover td {
        background: #fafbfc;
      }

      .tambah .auto {
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.3px;
      }

      .tambah .btn {
        margin: 0 auto;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover td {
        background: #fafafa;
      }

      .kode-seri {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .qr-btn {
        width: 26px;
        height: 26px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: inherit;
        font-size: 12px;
        color: #ffffff;
        background: #6366f1;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        flex-shrink: 0;
        transition: all 0.15s ease;
      }

      .qr-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      .c-kode {
        width: 128px;
      }

      .c-no {
        width: 34px;
        text-align: center;
        color: var(--muted);
      }

      .c-satuan {
        width: 58px;
      }

      .c-hpp {
        width: 112px;
        text-align: right;
        white-space: nowrap;
      }

      .c-aksi {
        width: 96px;
        position: sticky;
        right: 0;
        background: #ffffff;
        box-shadow: -7px 0 9px -7px rgba(17, 24, 39, 0.22);
      }

      thead th.c-aksi {
        z-index: 2;
        background: #f9f9f9;
      }

      tbody tr.ok td.c-aksi {
        background: #ecfdf5;
      }

      tbody tr.sinkron td {
        background: #eff6ff;
      }

      tfoot td {
        position: sticky;
        bottom: 0;
        z-index: 1;
        background: #f9f9f9;
        border-top: 1px solid #e5e7eb;
        font-weight: 800;
        font-size: 13px;
        height: 44px;
        padding: 0 10px;
        white-space: nowrap;
      }

      /* tr.f-plus / tr.f-minus dihapus: tfoot sekarang satu baris total,
         rincian plus/minus wiget berada di kolom Keterangan. */

      .kode {
        color: var(--primary);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: clamp(12px, 3.2vw, 14px);
        font-weight: 800;
        white-space: nowrap;
      }

      .empty {
        padding: 26px 12px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }

      .acts {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }

      .selisih {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .selisih.minus {
        color: #dc2626;
      }

      .selisih.plus {
        color: #16a34a;
      }

      .c-ket {
        max-width: 170px;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ket.minus {
        color: #dc2626;
      }

      .ket.plus {
        color: #16a34a;
      }

      .cari {
        width: 100%;
        text-transform: none;
      }

      .cari::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }

      .c-num {
        width: 84px;
        text-align: right;
      }

      .cell-input {
        width: 100%;
        min-width: 0;
        height: 30px;
        padding: 0 8px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 7px;
        cursor: text;
        -moz-appearance: textfield;
        appearance: textfield;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .cell-input:hover {
        background: #f9f9f9;
        border-color: #e5e7eb;
      }

      .cell-input:focus {
        outline: none;
        background: #ffffff;
        border-color: var(--primary);
      }

      .cell-input.teks {
        text-align: left;
        font-size: 13px;
      }

      .cell-input::-webkit-outer-spin-button,
      .cell-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .cell-input.mono {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        font-weight: 700;
        color: #4f46e5;
        letter-spacing: -0.2px;
      }

      .kode-btn {
        width: 100%;
        padding: 5px 6px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.2px;
        color: #4f46e5;
        text-align: left;
        background: transparent;
        border: 1px dashed transparent;
        border-radius: 6px;
        cursor: pointer;
      }

      .kode-btn:active {
        background: var(--soft);
        border-color: var(--soft-2);
      }

      .c-foto {
        width: 84px;
      }

      /* Kolom Foto dan Aksi ikut isinya saja, tidak melar.
         .c-aksi tetap 148px (lihat aturan MORI di bawah) karena isinya
         tombol 32px. */
      .c-foto {
        white-space: nowrap;
      }

      .foto-box {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: center;
      }

      .c-foto .thumb {
        width: 38px;
        height: 38px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        object-fit: cover;
        display: block;
        cursor: pointer;
        background: #f9fafb;
      }

      .c-foto .kosong {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
      }

      .lightbox {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 40;
        max-width: calc(100vw - 32px);
        padding: 12px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
      }

      .lightbox[hidden] {
        display: none;
      }

      .lightbox-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .lightbox img {
        max-width: min(76vw, 300px);
        max-height: 46vh;
        border-radius: 8px;
        object-fit: contain;
      }

      .lightbox .qr {
        width: min(56vw, 196px);
        height: min(56vw, 196px);
      }

      .lightbox-text {
        color: var(--text);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.6px;
      }

      .mode {
        color: var(--primary-dark);
        font-size: 10px;
        font-weight: 800;
        white-space: nowrap;
      }

      /* ============================================================
         TEMA MORI — override di atas, logika JS tidak disentuh.
         Palet dari public/mori/css/variables.css:
         bg #fffbf2 · surface #f7f3e9 · primary #1a1917 · text-secondary #6e6a64
         Gaya: sharp (radius 0), border hitam solid, shadow offset.
         Variabel asli (--text, --line, --primary, ...) di-override di sini
         supaya aturan yang sudah ada ikut berubah warna tanpa disentuh.
         ============================================================ */
      :root {
        --text: #1a1917;
        --muted: #6e6a64;
        --line: rgba(26, 25, 23, 0.14);
        --line-2: rgba(26, 25, 23, 0.14);
        --surface: #f7f3e9;
        --primary: #1a1917;
        --primary-dark: #1a1917;
        --soft: #f7f3e9;
        --soft-2: rgba(26, 25, 23, 0.14);
        --danger: #b91c1c;
        --mori-bg: #fffbf2;
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      html,
      body {
        background: var(--mori-bg);
      }

      body {
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .section-label {
        font-family: var(--mori-mono);
        font-size: 10px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 1.4px;
      }

      .count,
      .c-ket,
      .empty {
        font-family: var(--mori-mono);
        color: var(--muted);
      }

      /* ===== INPUT ===== */
      input {
        background: var(--surface);
        border: 1px solid var(--text);
        border-radius: 0;
        transition: box-shadow 0.2s ease;
      }
      input::placeholder {
        color: var(--muted);
      }
      input:focus {
        background: #fffdf7;
        border-color: var(--text);
        box-shadow: 4px 4px 0 var(--text);
      }

      /* ===== TOMBOL ===== */
      .btn,
      .ico,
      .qr-btn {
        border-radius: 0;
        border: 1px solid var(--primary);
        background: var(--primary);
        color: var(--mori-bg);
        box-shadow: 3px 3px 0 rgba(26, 25, 23, 0.18);
        transition: box-shadow 0.2s ease, transform 0.2s ease, background 0.2s ease;
      }
      .btn:active,
      .ico:active,
      .qr-btn:active {
        opacity: 1;
        transform: translate(2px, 2px);
        box-shadow: none;
      }

      /* Daftar menu di atas sudah dihapus (pilih/edit/hapus lewat tabel
         Foto Menu SO). Aturan .menu-item/.menu-list di bawah ini sisa
         gaya lama dan tidak lagi dipakai. */
      .mode {
        font-family: var(--mori-mono);
        color: var(--muted);
      }

      /* ===== TABEL ===== */
      .table-wrap {
        border: 1px solid var(--text);
        border-radius: 0;
        background: var(--mori-bg);
      }
      .daftar-wrap {
        border-color: var(--text);
      }
      thead th {
        background: var(--surface);
        color: var(--text);
        font-family: var(--mori-mono);
        font-weight: 700;
        border-bottom: 1px solid var(--text);
      }
      thead th.c-aksi {
        background: var(--surface);
      }
      tbody td {
        border-bottom: 1px solid var(--line);
      }
      tbody td.ok {
        background: #f2f7f0;
      }
      tbody tr.sinkron td {
        background: #f0f3f8;
      }
      .tambah td {
        background: var(--surface);
      }
      .tambah:hover td {
        background: #f2eee2;
      }
      tbody tr:hover td {
        background: #faf6ea;
      }
      .tambah .auto {
        font-family: var(--mori-mono);
        color: var(--muted);
      }
      table.daftar tr + tr td {
        border-top: 1px solid var(--line);
      }
      table.daftar input::placeholder {
        color: var(--muted);
      }
      .c-no {
        color: var(--muted);
      }
      .c-aksi {
        background: var(--mori-bg);
        box-shadow: -7px 0 9px -7px rgba(26, 25, 23, 0.3);
      }
      tbody tr.ok td.c-aksi {
        background: #f2f7f0;
      }
      tfoot td {
        background: var(--surface);
        border-top: 1px solid var(--text);
        font-family: var(--mori-mono);
        font-weight: 700;
      }

      /* ===== RINGKASAN SELISIH (mobile-friendly, di bawah tabel) ===== */
      .ringkas {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
        gap: 6px;
        margin-top: 10px;
      }
      .ringkas[hidden] {
        display: none;
      }
      .ringkas-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 4px;
        background: var(--surface);
        border: 1px solid var(--text);
        border-radius: 0;
        min-width: 0;
      }
      .ringkas-label {
        font-family: var(--mori-mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }
      .ringkas-nilai {
        font-family: var(--mori-mono);
        font-size: clamp(13px, 3.6vw, 16px);
        font-weight: 700;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ringkas-nilai.plus {
        color: #3f6212;
      }
      .ringkas-nilai.minus {
        color: var(--danger);
      }
      @media (max-width: 340px) {
        .ringkas {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /* ===== SELISIH / KETERANGAN ===== */
      .kode,
      .cell-input.mono,
      .kode-btn {
        color: var(--text);
        font-family: var(--mori-mono);
      }
      .selisih.minus,
      .ket.minus {
        color: #b91c1c;
      }
      .selisih.plus,
      .ket.plus {
        color: #3f6212;
      }

      /* ===== INPUT DI DALAM SEL ===== */
      .cell-input {
        border-radius: 0;
        transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .cell-input:hover {
        background: var(--surface);
        border-color: var(--line);
      }
      .cell-input:focus {
        background: #fffdf7;
        border-color: var(--text);
        box-shadow: 3px 3px 0 rgba(26, 25, 23, 0.15);
      }
      .kode-btn {
        border-radius: 0;
        border: 1px dashed var(--line);
      }
      .kode-btn:active {
        background: var(--surface);
        border-color: var(--text);
      }

      /* ===== FOTO + LIGHTBOX ===== */
      .c-foto .thumb {
        border: 1px solid var(--text);
        border-radius: 0;
        background: var(--surface);
      }
      .c-foto .kosong {
        font-family: var(--mori-mono);
        color: var(--muted);
      }
      .lightbox {
        background: var(--mori-bg);
        border: 1px solid var(--text);
        border-radius: 0;
        box-shadow: 6px 6px 0 rgba(26, 25, 23, 0.2);
      }
      .lightbox img {
        border-radius: 0;
      }
      .lightbox-text {
        font-family: var(--mori-mono);
        letter-spacing: 0.8px;
      }

      /* tombol hapus tetap merah, tombol edit/pilih tetap hitam */
      .ico-danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
        box-shadow: 3px 3px 0 rgba(26, 25, 23, 0.18);
      }
      .ico-danger:active {
        box-shadow: none;
      }

      /* kolom aksi melebar karena ada 3 tombol (upload/edit/hapus) */
      .c-aksi {
        width: 116px;
      }

      /* Baris tabel Foto Menu SO = pemilih menu (pengganti daftar menu atas) */
      #menuFotoBody tr.pilih {
        cursor: pointer;
      }
      #menuFotoBody tr.pilih:active td {
        background: #efe9da;
      }
      #menuFotoBody tr.on td {
        background: #f2eee2;
        font-weight: 700;
      }

      /* ===== JARAK ANTAR TABEL DI ATAS =====
         Baris input (+tombol) lalu tabel Foto Menu SO, lalu section
         barang. Jeda dibuat seragam supaya tidak ada rongga di bawah. */
      .menu-tulis {
        margin-bottom: 10px;
      }
      .menu-foto-wrap {
        margin-top: 0;
        margin-bottom: 12px;
      }
      #barangSec .row {
        margin-bottom: 10px;
      }
      #barangWrap {
        margin-bottom: 12px;
      }
      /* Dua blok pesan di bawah tabel Foto Menu SO tidak menambah jarak ganda */
      #menuFotoEmpty,
      #menuFotoHint {
        margin-top: 0;
      }

      /* Tabel Foto Menu SO: kolomnya lebih sedikit dari tabel barang, jadi
         min-width dan lebar nama dikecilkan supaya tidak ada ruang kosong
         menganga di kanan pada layar HP. */
      .menu-foto-wrap .barang {
        min-width: 0;
        width: 100%;
      }
      /* Kolom Nama mengisi sisa lebar tabel. Max-width 0 supaya melar penuh;
         teks panjang tetap dipotong ellipsis oleh .potong. */
      .menu-foto-wrap .c-nama {
        width: 100%;
        max-width: none;
      }
      .menu-foto-wrap .potong {
        max-width: 100%;
      }
      /* Baris tabel Foto Menu SO sedikit lebih rapat */
      .menu-foto-wrap tbody td {
        padding: 0 8px;
      }

      /* ===== MODAL PASSWORD HAPUS (sama seperti admin KOPI) =====
         Pakai modal sendiri, bukan confirm/prompt bawaan: di WebView/PWA
         window.prompt sering dinonaktifkan sehingga popup tak muncul. */
      .pw-bg {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 200;
        background: rgba(26, 25, 23, 0.45);
        align-items: center;
        justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        overscroll-behavior: contain;
      }
      .pw-bg.open {
        display: flex;
      }
      html.pw-open {
        overflow: hidden;
        overscroll-behavior: none;
      }
      .pw-card {
        width: 100%;
        max-width: 360px;
        margin: auto;
        max-height: 100%;
        overflow-y: auto;
        background: var(--mori-bg);
        border: 1px solid var(--text);
        border-radius: 0;
        padding: 18px;
        box-shadow: 6px 6px 0 rgba(26, 25, 23, 0.2);
        overscroll-behavior: contain;
      }
      .pw-title {
        font-family: var(--mori-mono);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--text);
        margin-bottom: 8px;
      }
      .pw-msg {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 12px;
      }
      .pw-input {
        width: 100%;
        height: auto;
        padding: 11px 12px;
        font-family: var(--mori-mono);
        font-size: 15px;
        letter-spacing: 2px;
        text-transform: none;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--text);
        border-radius: 0;
        outline: none;
      }
      .pw-input:focus {
        background: #fffdf7;
        box-shadow: 4px 4px 0 var(--text);
      }
      .pw-error {
        margin-top: 8px;
        font-family: var(--mori-mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--danger);
      }
      .pw-error[hidden] {
        display: none;
      }
      .pw-actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .pw-btn {
        flex: 1;
        padding: 12px;
        border: 1px solid var(--text);
        border-radius: 0;
        background: var(--surface);
        color: var(--text);
        font-family: var(--mori-mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;

      .pw-btn:active {

      }
      .pw-btn-danger {
        background: var(--danger);
        border-color: var(--danger);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox-box">
        <canvas class="qr" id="lightboxQr" width="220" height="220" hidden></canvas>
        <img id="lightboxImg" alt="preview foto" hidden />
        <div class="lightbox-text" id="lightboxText"></div>
      </div>
    </div>
    <section class="sec">
      <div class="row menu-tulis">
        <div class="table-wrap daftar-wrap grow">
          <table class="daftar">
            <tbody>
              <tr>
                <td class="tulis">
                  <div class="tulis-in">
                    <input
                      type="text"
                      id="mName"
                      placeholder="SO ROTI"
                      autocomplete="off"
                      aria-label="Nama menu SO"
                    />
                    <span class="mode" id="mMode"></span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <button class="btn" type="button" id="mAdd" title="Tambah menu" aria-label="Tambah menu">+</button>
      </div>
      <!-- Judul "Foto Menu SO" dihapus: tabelnya langsung menempel di bawah
           baris input, tanpa section/jeda baru. -->
      <div class="table-wrap menu-foto-wrap" id="menuFotoWrap" hidden>
        <table class="barang">
          <thead>
            <tr>
              <th class="c-no">No</th>
              <th>Nama Menu</th>
              <th class="c-foto">Foto</th>
              <th class="c-aksi"></th>
            </tr>
          </thead>
          <tbody id="menuFotoBody"></tbody>
        </table>
      </div>
      <div class="empty" id="menuFotoEmpty" hidden>Belum ada menu SO.</div>
      <div class="empty" id="menuFotoHint" hidden></div>
    </section>

    <section class="sec" id="barangSec" hidden>
      <div class="row">
        <input
          class="cari"
          type="search"
          id="cariBarang"
          placeholder="Cari PLU / Nama barang"
          autocomplete="off"
          aria-label="Cari barang"
        />
      </div>
      <div class="table-wrap" id="barangWrap">
        <table class="barang">
          <thead>
            <tr>
              <th class="c-no">No</th>
              <th class="c-kode">PLU</th>
              <th>Nama Barang</th>
              <th class="c-satuan">Satuan</th>
              <th class="c-num">Onhand</th>
              <th class="c-num">Fisik</th>
              <th class="c-hpp">HPP</th>
              <th class="c-num">Selisih</th>
              <th>Keterangan</th>
              <th class="c-foto">Foto</th>
              <th class="c-aksi"></th>
            </tr>
          </thead>
          <tbody class="tambah">
            <tr>
              <td class="c-no"></td>
              <td class="c-kode"><span class="auto">otomatis</span></td>
              <td class="c-nama">
                <input class="cell-input teks" type="text" id="bName" size="1" placeholder="Nama Barang" autocomplete="off" />
              </td>
              <td class="c-satuan">
                <input class="cell-input teks" type="text" id="bSatuan" size="1" placeholder="Satuan" value="PCS" autocomplete="off" />
              </td>
              <td class="c-num">
                <input class="cell-input" type="number" id="bOnhand" min="0" value="0" inputmode="numeric" />
              </td>
              <td class="c-num">
                <input class="cell-input" type="number" id="bFisik" min="0" value="0" inputmode="numeric" />
              </td>
              <td class="c-hpp">
                <input class="cell-input" type="number" id="bHpp" min="0" value="0" inputmode="decimal" />
              </td>
              <td class="c-num selisih" id="bSelisih">0</td>
              <td class="c-ket" id="bKet">Sesuai</td>
              <td class="c-foto"></td>

                <button class="btn" type="button" id="bAdd" title="Tambah barang" aria-label="Tambah barang">+</button>
              </td>

          <tbody id="barangBody"></tbody>
          <tfoot id="barangFoot"></tfoot>
        </table>
      </div>
      <div class="empty" id="barangEmpty" hidden>Belum ada barang di menu ini.</div>
      <!-- Ringkasan selisih semua barang: diluar tabel (tidak ikut geser
           horizontal) supaya easy dibaca di layar HP. -->
      <div class="ringkas" id="ringkasBarang" hidden>
        <div class="ringkas-item">
          <span class="ringkas-label">Selisih</span>
          <span class="ringkas-nilai" id="rkSelisih">0</span>
        </div>
        <div class="ringkas-item">
          <span class="ringkas-label">Rupiah</span>
          <span class="ringkas-nilai" id="rkNominal">Rp 0</span>
        </div>
        <div class="ringkas-item">
          <span class="ringkas-label">Beda</span>
          <span class="ringkas-nilai" id="rkBeda">0</span>
        </div>
        <div class="ringkas-item">
          <span class="ringkas-label">Plus</span>
          <span class="ringkas-nilai plus" id="rkPlus">0</span>
        </div>
        <div class="ringkas-item">
          <span class="ringkas-label">Minus</span>
          <span class="ringkas-nilai minus" id="rkMinus">0</span>
        </div>
      </div>
      <input accept="image/*" id="fotoInput" type="file" hidden />
    </section>

    <div class="pw-bg" id="pwBg">
      <div class="pw-card" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
        <div class="pw-title" id="pwTitle">Hapus Menu</div>
        <div class="pw-msg" id="pwMsg"></div>
        <input class="pw-input" id="pwEmail" type="email" autocomplete="username" placeholder="Email admin" />
        <input
          class="pw-input"
          id="pwInput"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
        />
        <div class="pw-error" id="pwError" hidden>Gagal masuk.</div>
        <div class="pw-actions">
          <button class="pw-btn" id="pwCancel" type="button">Batal</button>
          <button class="pw-btn pw-btn-danger" id="pwOk" type="button">Hapus</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { supabase, SUPABASE_URL, SUPABASE_KEY } from '../../js/supabase.js';

      const MENU_KEY = 'so_active_menu';

      const mName = document.getElementById('mName');
      const mAdd = document.getElementById('mAdd');
      const barangSec = document.getElementById('barangSec');
      const bName = document.getElementById('bName');
      const bSatuan = document.getElementById('bSatuan');
      const bOnhand = document.getElementById('bOnhand');
      const bFisik = document.getElementById('bFisik');
      const bHpp = document.getElementById('bHpp');
      const bSelisih = document.getElementById('bSelisih');
      const bKet = document.getElementById('bKet');
      const mMode = document.getElementById('mMode');
      const barangBody = document.getElementById('barangBody');
      const menuFotoBody = document.getElementById('menuFotoBody');
      const menuFotoWrap = document.getElementById('menuFotoWrap');
      const menuFotoEmpty = document.getElementById('menuFotoEmpty');
      const menuFotoHint = document.getElementById('menuFotoHint');
      const barangEmpty = document.getElementById('barangEmpty');
      const barangWrap = document.getElementById('barangWrap');
      const barangFoot = document.getElementById('barangFoot');
      const ringkasBarang = document.getElementById('ringkasBarang');
      const rkSelisih = document.getElementById('rkSelisih');
      const rkNominal = document.getElementById('rkNominal');
      const rkBeda = document.getElementById('rkBeda');
      const rkPlus = document.getElementById('rkPlus');
      const rkMinus = document.getElementById('rkMinus');
      const bAdd = document.getElementById('bAdd');
      const cariBarang = document.getElementById('cariBarang');
      const fotoInput = document.getElementById('fotoInput');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxQr = document.getElementById('lightboxQr');
      const lightboxText = document.getElementById('lightboxText');

      const BUCKET = 'stock-foto';
      let fotoData = [];
      let fotoMenuTarget = null;
      let menuFotoData = [];

      const dariUrl = Number(new URLSearchParams(location.search).get('m')) || null;
      let menuAktif = dariUrl || Number(localStorage.getItem(MENU_KEY)) || null;
      let menuTerpilih = null;
      let editMenuId = null;
      let editBarangId = null;

      const up = (value) => String(value ?? '').toUpperCase();
      const num = (value) => {
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
      };
      const formatRupiah = new Intl.NumberFormat('id-ID', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2,
      });
      const rupiah = (value) => 'Rp ' + formatRupiah.format(num(value));

      const cell = (text, cls) => {
        const td = document.createElement('td');
        td.textContent = text;
        if (cls) td.className = cls;
        return td;
      };

      const cellPotong = (text, cls) => {
        const td = document.createElement('td');
        if (cls) td.className = cls;
        const div = document.createElement('div');
        div.className = 'potong';
        div.textContent = text;
        td.appendChild(div);
        return td;
      };


      const setMode = () => {
        mMode.textContent = editMenuId ? 'mode edit' : '';
        mAdd.textContent = editMenuId ? '✓' : '+';
        mAdd.title = editMenuId ? 'Simpan perubahan' : 'Tambah menu';
        mAdd.setAttribute('aria-label', mAdd.title);
      };

      const stopEdit = (clearMenu) => {
        editMenuId = null;
        if (clearMenu) mName.value = '';
        bName.value = '';
        bSatuan.value = 'PCS';
        bOnhand.value = '0';
        bFisik.value = '0';
        bHpp.value = '0';
        bSelisih.textContent = '0';
        bSelisih.className = 'c-num selisih';
        bKet.textContent = 'Sesuai';
        bKet.className = 'c-ket ket';
        setMode();
      };

      // Aksi menu SO dipakai dua tempat: daftar menu di atas dan tabel
      // "Foto Menu SO". Dipisah jadi fungsi supaya perilakunya sama.
      const editMenu = (menu) => {
        editMenuId = menu.id;
        mName.value = up(menu.name);
        mName.focus();
        setMode();
      };

      // Hapus menu dikunci Supabase Auth. Password tidak lagi ditulis di
      // source: nilai yang tadinya ada di sini bisa dibaca siapa saja dari
      // DevTools, jadi hanya menahan salah klik. Proteksi sungguhan ada di
      // RLS policy (scripts/build/add-admin-rls.sql).

      const pwBg = document.getElementById('pwBg');
      const pwMsg = document.getElementById('pwMsg');
      const pwEmail = document.getElementById('pwEmail');
      const pwInput = document.getElementById('pwInput');
      const pwError = document.getElementById('pwError');
      const pwOk = document.getElementById('pwOk');
      const pwCancel = document.getElementById('pwCancel');
      let pwResolve = null;
      let pwScrollY = 0;

      async function sudahMasukAdmin() {
        try {
          const { data } = await supabase.auth.getSession();
          return !!data.session;
        } catch {
          return false;
        }
      }

      // Bekukan scroll halaman: keyboard HP suka membuat halaman melompat.
      function lockScrollPw() {
        pwScrollY = window.scrollY || window.pageYOffset || 0;
        document.documentElement.classList.add('pw-open');
        document.body.style.position = 'fixed';
        document.body.style.top = -pwScrollY + 'px';
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
      }
      function unlockScrollPw() {
        document.documentElement.classList.remove('pw-open');
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        window.scrollTo(0, pwScrollY);
      }

      // Ikuti tinggi viewport yang terlihat supaya kartu tetap di tengah
      // walau keyboard HP sudah naik.
      function syncPwViewport() {
        const vv = window.visualViewport;
        if (!vv || !pwBg.classList.contains('open')) return;
        pwBg.style.height = vv.height + 'px';
        pwBg.style.top = vv.offsetTop + 'px';
        pwBg.style.bottom = 'auto';
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncPwViewport);
        window.visualViewport.addEventListener('scroll', syncPwViewport);
      }

      async function askDelPassword(msg) {
        // Sudah punya sesi: lewati modal, langsung lanjut.
        if (await sudahMasukAdmin()) return true;
        if (pwResolve) closePw(false);
        pwMsg.textContent = msg || '';
        pwEmail.value = '';
        pwInput.value = '';
        pwError.hidden = true;
        lockScrollPw();
        pwBg.classList.add('open');
        syncPwViewport();
        try {
          pwEmail.focus({ preventScroll: true });
        } catch (e) {
          pwEmail.focus();
        }
        requestAnimationFrame(syncPwViewport);
        return new Promise((res) => {
          pwResolve = res;
        });
      }
      function closePw(ok) {
        pwBg.classList.remove('open');
        pwBg.style.height = '';
        pwBg.style.top = '';
        pwBg.style.bottom = '';
        unlockScrollPw();
        const fn = pwResolve;
        pwResolve = null;
        if (fn) fn(ok);
      }
      pwOk.addEventListener('click', async () => {
        const email = (pwEmail.value || '').trim();
        const pass = pwInput.value || '';
        if (!email || !pass) {
          pwError.textContent = 'Email dan password wajib diisi.';
          pwError.hidden = false;
          return;
        }
        const { error } = await supabase.auth.signInWithPassword({
          email,
          password: pass,
        });
        if (error) {
          pwError.textContent = 'Gagal masuk: ' + error.message;
          pwError.hidden = false;
          pwInput.value = '';
          try {
            pwInput.focus({ preventScroll: true });
          } catch (e) {}
          return;
        }
        closePw(true);
      });
      pwCancel.addEventListener('click', () => closePw(false));
      pwBg.addEventListener('click', (e) => {
        if (e.target === pwBg) closePw(false);
      });
      pwEmail.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') pwOk.click();
        if (e.key === 'Escape') closePw(false);
      });
      pwInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') pwOk.click();
        if (e.key === 'Escape') closePw(false);
      });

      const hapusMenu = async (menu) => {
        const ok = await askDelPassword(
          'Hapus menu ' + up(menu.name) + '?\nSemua barang di menu ini ikut terhapus.'
        );
        if (!ok) return;
        const { error } = await supabase.from('so_menus').delete().eq('id', menu.id);
        if (error) {
          console.error('Hapus menu gagal:', error.message);
          menuFotoHint.hidden = false;
          menuFotoHint.textContent = 'Hapus menu gagal: ' + error.message;
          return;
        }
        if (menuAktif === menu.id) {
          menuAktif = null;
          localStorage.removeItem(MENU_KEY);
          stopEdit(true);
        }
        loadMenus();
      };

      const buatKode = (namaMenu, kodeTerpakai) => {
        const prefix = (up(namaMenu).match(/[A-Z]/g) || ['PRD']).slice(0, 3).join('') || 'PRD';
        let no = 1;
        let kode = prefix + '-' + String(no).padStart(3, '0');
        while (kodeTerpakai.has(kode)) {
          no++;
          kode = prefix + '-' + String(no).padStart(3, '0');
        }
        return kode;
      };

      const simpanSel = (row, kolom, judul, nilai) =>
        supabase
          .from('stock_products')
          .update({ [kolom]: nilai })
          .eq('id', row.id);

      const tandaiOke = (td, tr) => {
        td.classList.add('ok');
        setTimeout(() => td.classList.remove('ok'), 1200);
        if (!tr) return;
        tr.classList.add('ok');
        setTimeout(() => tr.classList.remove('ok'), 1200);
      };

      const inputAngka = (row, kolom, judul, sesudah) => {
        const td = document.createElement('td');
        td.className = kolom === 'hpp' ? 'c-hpp' : 'c-num';
        const input = document.createElement('input');
        input.type = 'number';
        input.size = 1;
        input.min = '0';
        input.step = kolom === 'hpp' ? 'any' : '1';
        input.inputMode = kolom === 'hpp' ? 'decimal' : 'numeric';
        input.className = 'cell-input';
        input.value = String(num(row[kolom]));
        input.title = judul + ' ' + (row.kode || row.name);
        input.setAttribute('aria-label', input.title);

        const simpan = async () => {
          const mentah = num(input.value);
          const nilai = kolom === 'hpp' ? mentah : Math.round(mentah);
          if (nilai === num(row[kolom])) return;
          const { error } = await simpanSel(row, kolom, judul, nilai);
          if (error) {
            console.error('Gagal update ' + judul + ':', error.message);
            input.value = String(num(row[kolom]));
            return;
          }
          row[kolom] = nilai;
          input.value = String(nilai);
          tandaiOke(td, tr);
          if (sesudah) sesudah(nilai);
        };

        input.addEventListener('change', simpan);
        input.addEventListener('blur', simpan);
        input.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          input.blur();
        });

        td.appendChild(input);
        return td;
      };

      const sinkronTimer = new Map();
      const sinkronTertunda = new Map();

      const tulisFisik = async (row, nilai, tr) => {
        const { error } = await supabase
          .from('stock_products')
          .update({ stok_fisik: Math.round(num(nilai)) })
          .eq('id', row.id);
        if (error) {
          console.error('Gagal sinkron stok fisik:', error.message);
          return false;
        }
        sinkronTertunda.delete(row.id);
        row.stok_fisik = Math.round(num(nilai));
        if (tr) {
          tr.classList.add('sinkron');
          setTimeout(() => tr.classList.remove('sinkron'), 900);
        }
        return true;
      };

      const sinkronFisik = (row, nilai, tr, langsung) => {
        if (!row.id) return;
        clearTimeout(sinkronTimer.get(row.id));
        sinkronTimer.delete(row.id);
        sinkronTertunda.set(row.id, nilai);
        if (langsung) {
          tulisFisik(row, nilai, tr);
          return;
        }
        sinkronTimer.set(
          row.id,
          setTimeout(() => {
            sinkronTimer.delete(row.id);
            tulisFisik(row, nilai, tr);
          }, 350)
        );
      };

      const flushFisik = () => {
        if (!sinkronTertunda.size) return;
        sinkronTertunda.forEach((nilai, id) => {
          fetch(SUPABASE_URL + '/rest/v1/stock_products?id=eq.' + id, {
            method: 'PATCH',
            keepalive: true,
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: 'Bearer ' + SUPABASE_KEY,
              'Content-Type': 'application/json',
              Prefer: 'return=minimal',
            },
            body: JSON.stringify({ stok_fisik: Math.round(num(nilai)) }),
          }).catch(() => {});
        });
        sinkronTertunda.clear();
      };

      window.addEventListener('pagehide', flushFisik);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flushFisik();
      });

      const keteranganOf = (selisih) => {
        if (selisih === 0) return { text: 'Sesuai', cls: '' };
        if (selisih < 0) return { text: 'Hilang', cls: 'minus' };
        return { text: 'Beda Input', cls: 'plus' };
      };

      const hitungSelisih = (tr) => {
        const td = tr.querySelector('.selisih');
        if (!td) return;
        const inFisik = tr.querySelector('.in-fisik');
        const fisik = inFisik ? num(inFisik.value) : 0;
        const sistem = num(tr.dataset.onhand);
        const selisih = fisik - sistem;
        td.textContent = selisih > 0 ? '+' + selisih : String(selisih);
        td.className = 'c-num selisih ' + (selisih === 0 ? '' : selisih < 0 ? 'minus' : 'plus');
        const tdKet = tr.querySelector('.ket');
        if (tdKet) {
          const ket = keteranganOf(selisih);
          tdKet.textContent = ket.text;
          tdKet.className = 'c-ket ket ' + ket.cls;
        }
      };

      const inputFisik = (row, tr) => {
        const td = document.createElement('td');
        td.className = 'c-num';
        const input = document.createElement('input');
        input.type = 'number';
        input.size = 1;
        // min TIDAK dikunci 0: selisih minus dipakai untuk mencatat
        // barang hilang / rusak, jadi nilai negatif harus bisa tampil &diedit.
        input.step = '1';
        input.inputMode = 'numeric';
        input.className = 'cell-input in-fisik';
        input.value = String(num(row.stok_fisik));
        input.title = 'Stok fisik ' + (row.kode || row.name);
        input.setAttribute('aria-label', input.title);
        input.addEventListener('input', () => {
          hitungSelisih(tr);
          sinkronFisik(row, input.value, tr, false);
        });
        input.addEventListener('change', () => sinkronFisik(row, input.value, tr, true));
        input.addEventListener('blur', () => sinkronFisik(row, input.value, tr, true));
        td.appendChild(input);
        return td;
      };

      const inputTeks = (row, kolom, judul, cls, mono) => {
        const td = document.createElement('td');
        if (cls) td.className = cls;
        const input = document.createElement('input');
        input.type = 'text';
        input.size = 1;
        input.className = 'cell-input teks' + (mono ? ' mono' : '');
        input.value = up(row[kolom] || '');
        input.title = judul + ' ' + (row.kode || row.name);
        input.setAttribute('aria-label', input.title);

        const simpan = async () => {
          const nilai = up(input.value.trim());
          if (!nilai) {
            input.value = up(row[kolom] || '');
            return;
          }
          if (nilai === up(row[kolom] || '')) return;
          const { error } = await simpanSel(row, kolom, judul, nilai);
          if (error) {
            console.error('Gagal update ' + judul + ':', error.message);
            input.value = up(row[kolom] || '');
            return;
          }
          row[kolom] = nilai;
          input.value = nilai;
          tandaiOke(td, td.closest('tr'));
        };

        input.addEventListener('change', simpan);
        input.addEventListener('blur', simpan);
        input.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          input.blur();
        });

        td.appendChild(input);
        return td;
      };

      const kodeTeks = (row) => {
        const td = document.createElement('td');
        td.className = 'c-kode';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'kode-btn';
        btn.textContent = row.kode || '-';
        btn.title = 'Lihat QR ' + (row.kode || '');
        btn.setAttribute('aria-label', btn.title);
        btn.addEventListener('click', () => lihatQr(row.kode));
        td.appendChild(btn);
        return td;
      };

      const kodeEdit = (row) => {
        const td = document.createElement('td');
        td.className = 'c-kode kode-seri';
        td.appendChild(inputTeks(row, 'kode', 'PLU', 'dalem', true).firstChild);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'qr-btn';
        btn.textContent = '▦';
        btn.title = 'Lihat QR ' + (row.kode || '');
        btn.setAttribute('aria-label', btn.title);
        btn.addEventListener('click', () => lihatQr(row.kode));
        td.appendChild(btn);
        return td;
      };

      const cocokCari = (row, q) => {
        if (!q) return true;
        return (
          String(row.kode || '').toLowerCase().includes(q) ||
          String(row.name || '').toLowerCase().includes(q)
        );
      };

      const renderBarang = (barang) => {
        fotoData = barang;
        const q = cariBarang.value.trim().toLowerCase();
        const tampil = barang.filter((row) => cocokCari(row, q));
        barangBody.innerHTML = '';
        tampil.forEach((row, i) => {
          const tr = document.createElement('tr');
          const modeEdit = editBarangId === row.id;
          tr.dataset.id = row.id;
          tr.dataset.onhand = String(num(row.stok_sistem));
          // HPP disimpan di dataset supaya total nominal selisih bisa dihitung
          tr.dataset.hpp = String(num(row.hpp));

          tr.append(cell(String(i + 1), 'c-no'));

          if (modeEdit) {
            tr.append(
              kodeEdit(row),
              inputTeks(row, 'name', 'Nama barang', 'c-nama'),
              inputTeks(row, 'satuan', 'Satuan', 'c-satuan'),
              inputAngka(row, 'stok_sistem', 'Onhand', (nilai) => {
                tr.dataset.onhand = String(nilai);
                hitungSelisih(tr);
              }),
              inputFisik(row, tr),
              inputAngka(row, 'hpp', 'HPP')
            );
          } else {
            tr.append(
              kodeTeks(row),
              cellPotong(up(row.name), 'c-nama'),
              cell(row.satuan || 'PCS', 'c-satuan'),
              cell(String(num(row.stok_sistem)), 'c-num'),
              inputFisik(row, tr),
              cell(rupiah(row.hpp), 'c-hpp')
            );
          }

          const tdSelisih = document.createElement('td');
          tdSelisih.className = 'c-num selisih';
          const tdKet = document.createElement('td');
          tdKet.className = 'c-ket ket';
          tr.append(tdSelisih, tdKet);
          hitungSelisih(tr);

          const edit = document.createElement('button');
          edit.type = 'button';
          edit.className = 'ico';
          edit.textContent = modeEdit ? '✓' : '✎';
          edit.title = modeEdit ? 'Selesai edit' : 'Edit';
          edit.setAttribute('aria-label', edit.title + ' ' + (row.kode || row.name));
          edit.addEventListener('click', () => {
            const aktif = document.activeElement;
            if (aktif && aktif.classList && aktif.classList.contains('cell-input')) aktif.blur();
            editBarangId = modeEdit ? null : row.id;
            renderBarang(fotoData);
          });

          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'ico';
        del.textContent = '✕';
          del.title = 'Hapus barang';
          del.setAttribute('aria-label', 'Hapus ' + (row.kode || row.name));
          del.addEventListener('click', async () => {
            if (!confirm('Hapus barang ' + (row.kode || row.name) + '?')) return;
            const { error } = await supabase.from('stock_products').delete().eq('id', row.id);
            if (error) {
              console.error('Hapus barang gagal:', error.message);
              return;
            }
            if (editBarangId === row.id) editBarangId = null;
            loadBarang();
          });

          const tdFoto = isiFoto(row);
          const tdAct = document.createElement('td');
          tdAct.className = 'c-aksi';
          const wrap = document.createElement('div');
          wrap.className = 'acts';
          wrap.append(edit, del);
          tdAct.appendChild(wrap);
          tr.append(tdFoto, tdAct);
          barangBody.appendChild(tr);
        });
        renderTotal(tampil);
        barangEmpty.hidden = tampil.length > 0;
        barangEmpty.textContent = q
          ? 'Tidak ada barang yang cocok dengan "' + cariBarang.value.trim() + '".'
          : 'Belum ada barang di menu ini.';
        barangWrap.hidden = barang.length === 0;
      };

      const renderTotal = (tampil) => {
        const total = { onhand: 0, fisik: 0, selisih: 0, jumlah: 0, beda: 0, nominal: 0 };
        const plus = { onhand: 0, fisik: 0, selisih: 0, jumlah: 0, nominal: 0 };
        const minus = { onhand: 0, fisik: 0, selisih: 0, jumlah: 0, nominal: 0 };

        tampil.forEach((row) => {
          const o = num(row.stok_sistem);
          const f = num(row.stok_fisik);
          const d = f - o;
          // Nominal = selisih x HPP (HPP diambil dari baris, supaya ikut
          // nilai yang sedang diedit, bukan data lama).
          const nilai = d * num(barangBody.querySelector('tr[data-id="' + row.id + '"]')?.dataset.hpp);
          total.onhand += o;
          total.fisik += f;
          total.selisih += d;
          total.nominal += nilai;
          total.jumlah += 1;
          if (d !== 0) total.beda += 1;
          const tujuan = d > 0 ? plus : d < 0 ? minus : null;
          if (tujuan) {
            tujuan.onhand += o;
            tujuan.fisik += f;
            tujuan.selisih += d;
            tujuan.nominal += nilai;
            tujuan.jumlah += 1;
          }
        });

        const warna = (v) => (v === 0 ? '' : v < 0 ? 'minus' : 'plus');
        const angka = (v) => (v > 0 ? '+' + v : String(v));

        // Tfoot SATU baris: total barang, lalu nominal rupiah selisih
        // menggantikan kolom Keterangan (rincian plus/minus pindah ke
        // kotak ringkasan di bawah tabel, biar tidak terpotong di HP).
        const baris = (label, a) => {
          const tr = document.createElement('tr');
          const tdLabel = cell(label);
          tdLabel.colSpan = 4;
          tr.append(
            tdLabel,
            cell(String(a.onhand), 'c-num'),
            cell(String(a.fisik), 'c-num'),
            cell('-', 'c-hpp'),
            cell(angka(a.selisih), 'c-num selisih ' + warna(a.selisih)),
            cell(rupiah(a.nominal), 'c-total ' + warna(a.nominal)),
            cell(''),
            cell('')
          );
          return tr;
        };

        barangFoot.innerHTML = '';
        barangFoot.appendChild(baris('TOTAL ' + total.jumlah + ' BARANG', total));

        // Ringkasan untuk HP: kotak kecil di bawah tabel (tidak ikut geser
        // horizontal), jadi jumlah + rupiah selisih semua barang langsung
        // kelihatan tanpa harus menggeser tabel.
        rkSelisih.textContent = angka(total.selisih);
        rkSelisih.className = 'ringkas-nilai ' + warna(total.selisih);
        rkNominal.textContent = rupiah(total.nominal);
        rkNominal.className = 'ringkas-nilai ' + warna(total.nominal);
        rkBeda.textContent = String(total.beda) + '/' + String(total.jumlah);
        rkPlus.textContent = String(plus.jumlah) + ' (' + angka(plus.selisih) + ')';
        rkMinus.textContent = String(minus.jumlah) + ' (' + angka(minus.selisih) + ')';
        ringkasBarang.hidden = total.jumlah === 0;
      };

      cariBarang.addEventListener('input', () => {
        if (fotoData.length) renderBarang(fotoData);
      });

      // Realtime stock_products: tabel barang ikut berubah sendiri begitu
      // stok diubah dari halaman lain (mis. lewat Supabase), jadi tidak
      // perlu refresh manual.
      let rtBarangTimer = null;
      try {
        supabase
          .channel('stock_products_changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'stock_products' }, () => {
            clearTimeout(rtBarangTimer);
            rtBarangTimer = setTimeout(() => {
              if (menuAktif) loadBarang();
            }, 600);
          })
          .subscribe();
      } catch (e) {
        console.warn('Realtime stock_products tidak aktif:', e.message);
      }

      // Foto BARANG tidak bisa diupload dari halaman ini (tombaknya dihapus),
      // hanya foto MENU (tabel Foto Menu SO) yang bisa diupload/ganti.
      const pilihFotoMenu = (id) => {
        fotoMenuTarget = id;
        fotoInput.value = '';
        fotoInput.click();
      };

      let qrLib = null;
      const muatQr = async () => {
        if (!qrLib) {
          qrLib = await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm');
        }
        return qrLib;
      };

      const lihatQr = async (plu) => {
        const teks = String(plu || '').trim();
        if (!teks) return;
        try {
          const QR = await muatQr();
          lightboxImg.hidden = true;
          lightboxImg.removeAttribute('src');
          lightboxQr.hidden = false;
          await QR.toCanvas(lightboxQr, teks, {
            width: 220,
            margin: 1,
            color: { dark: '#111827', light: '#ffffff' },
          });
          lightboxText.textContent = teks;
          lightbox.hidden = false;
        } catch (err) {
          console.error('Gagal membuat QR:', err);
        }
      };

      // Foto menu di-upload ke path yang sama ('menu/<id>.jpg', upsert), jadi
      // URL publiknya tidak pernah berubah. Tanpa param cache-bust, browser
      // (dan CDN Supabase) terus menyajikan foto LAMA setelah foto diganti.
      let fotoVersi = Date.now();
      const fotoBaru = (url) => {
        if (!url) return url;
        return url + (url.includes('?') ? '&' : '?') + 'v=' + fotoVersi;
      };

      const lihatFoto = (row) => {
        if (!row.foto_url) {
          return;
        }
        lightboxQr.hidden = true;
        lightboxImg.hidden = false;
        lightboxImg.src = fotoBaru(row.foto_url);
        lightboxImg.alt = row.name || row.kode || 'foto';
        lightboxText.textContent = row.kode || row.name || '';
        lightbox.hidden = false;
      };

      const tutupFoto = () => {
        lightbox.hidden = true;
        lightboxImg.removeAttribute('src');
        lightboxText.textContent = '';
      };

      document.addEventListener('click', (e) => {
        if (lightbox.hidden) return;
        if (lightbox.contains(e.target)) return;
        tutupFoto();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !lightbox.hidden) tutupFoto();
      });

      const isiFoto = (row) => {
        const td = document.createElement('td');
        td.className = 'c-foto';
        const box = document.createElement('div');
        box.className = 'foto-box';

        if (row.foto_url) {
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = fotoBaru(row.foto_url);
          img.alt = row.name || row.kode || 'foto';
          img.loading = 'lazy';
          img.decoding = 'async';
          img.title = 'Lihat foto ' + (row.kode || row.name || '');
          img.addEventListener('click', () => lihatFoto(row));
          box.appendChild(img);
        } else {
          const kosong = document.createElement('span');
          kosong.className = 'kosong';
          kosong.textContent = '-';
          box.appendChild(kosong);
        }

        // Tombol upload (↑) dihapus dari sel foto barang; thumbnail + klik untuk
        // lihat tetap ada.
        td.appendChild(box);
        return td;
      };

      // Upload foto MENU saja. Jalur foto barang dihapus (tombaknya tidak ada).
      fotoInput.addEventListener('change', async () => {
        const file = fotoInput.files && fotoInput.files[0];
        const idMenu = fotoMenuTarget;
        fotoMenuTarget = null;
        if (!file || !idMenu) return;

        const menu = menuFotoData.find((m) => m.id === idMenu);
        if (!menu) return;
        const kecil = await kompresFoto(file);
        const path = 'menu/' + menu.id + '.jpg';
        const { error: errUp } = await supabase.storage.from(BUCKET).upload(path, kecil, {
          upsert: true,
          contentType: 'image/jpeg',
        });
        if (errUp) {
          console.error('Upload foto menu gagal:', errUp.message);
          menuFotoHint.hidden = false;
          menuFotoHint.textContent = 'Upload foto menu gagal: ' + errUp.message;
          return;
        }
        const { data: publik } = supabase.storage.from(BUCKET).getPublicUrl(path);
        const url = publik.publicUrl;
        menu.foto_url = url;
        // URL-nya sama tiap upload (path tetap), naikkan versi cache
        // supaya foto baru langsung tampil, bukan foto lama dari cache.
        fotoVersi = Date.now();

        if (menu.id === AKUN_TILE) {
          menuFotoHint.hidden = true;
        } else {
          const { error: errSimpan } = await supabase
            .from('so_menus')
            .update({ foto_url: url })
            .eq('id', idMenu);
          if (errSimpan) {
            console.error('Simpan foto menu gagal:', errSimpan.message);
            menuFotoHint.hidden = false;
            menuFotoHint.textContent =
              'Foto tersimpan di storage, tapi belum tercatat di DB: ' + errSimpan.message +
              ' — jalankan: alter table so_menus add column if not exists foto_url text;';
          } else {
            menuFotoHint.hidden = true;
          }
        }
        renderFotoMenu(menuFotoData);
      });

      const kompresFoto = async (file, maxSisi = 1200, kualitas = 0.82) => {
        if (!file || !/^image\//.test(file.type || '')) return file;
        let gambar = null;
        try {
          gambar = await createImageBitmap(file);
        } catch {
          return file;
        }
        if (!gambar) return file;
        const sisi = Math.max(gambar.width, gambar.height);
        const skala = Math.min(1, maxSisi / sisi);
        if (skala === 1 && file.size < 400 * 1024) {
          if (gambar.close) gambar.close();
          return file;
        }
        const w = Math.max(1, Math.round(gambar.width * skala));
        const h = Math.max(1, Math.round(gambar.height * skala));
        const kanvas = document.createElement('canvas');
        kanvas.width = w;
        kanvas.height = h;
        const ctx = kanvas.getContext('2d');
        ctx.drawImage(gambar, 0, 0, w, h);
        if (gambar.close) gambar.close();
        const blob = await new Promise((res) => kanvas.toBlob(res, 'image/jpeg', kualitas));
        if (!blob) return file;
        const nama = (file.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg';
        return new File([blob], nama, { type: 'image/jpeg', lastModified: Date.now() });
      };

      const AKUN_TILE = 'admin';

      const pilihMenu = async (id) => {
        stopEdit(true);
        editBarangId = null;
        menuAktif = id;
        localStorage.setItem(MENU_KEY, String(id));
        await loadMenus();
      };

      const fotoMenuUrl = (id) =>
        supabase.storage.from(BUCKET).getPublicUrl('menu/' + id + '.jpg').data.publicUrl;

      const adaFotoMenu = async (url) => {
        try {
          const r = await fetch(url, { method: 'HEAD' });
          return r.ok;
        } catch {
          return false;
        }
      };

      const loadFotoMenu = async () => {
        let hasil = await supabase
          .from('so_menus')
          .select('id, name, foto_url')
          .order('name');

        if (hasil.error) {
          hasil = await supabase
            .from('so_menus')
            .select('id, name')
            .order('name');
          if (hasil.error) {
            console.error('Gagal memuat daftar menu:', hasil.error.message);
            menuFotoBody.innerHTML = '';
            menuFotoWrap.hidden = true;
            menuFotoEmpty.hidden = true;
            menuFotoHint.hidden = false;
            menuFotoHint.textContent = 'Gagal memuat menu: ' + hasil.error.message;
            return;
          }
          menuFotoHint.hidden = false;
          menuFotoHint.textContent =
            'Kolom foto_url belum ada di so_menus, jadi foto disimpan di storage tanpa dicatat di DB. ' +
            'Jalankan di Supabase SQL Editor: alter table so_menus add column if not exists foto_url text;';
        } else {
          menuFotoHint.hidden = true;
        }

        const menus = hasil.data || [];
        await Promise.all(
          menus.map(async (m) => {
            if (m.foto_url) return;
            const url = fotoMenuUrl(m.id);
            if (await adaFotoMenu(url)) m.foto_url = url;
          })
        );
        const urlAdmin = fotoMenuUrl(AKUN_TILE);
        const fotoAdmin = (await adaFotoMenu(urlAdmin)) ? urlAdmin : null;
        menuFotoData = [
          { id: AKUN_TILE, name: 'ADMIN STOCK OPNAME', foto_url: fotoAdmin },
        ].concat(menus);
        renderFotoMenu(menuFotoData);
      };

      const renderFotoMenu = (menus) => {
        menuFotoBody.innerHTML = '';
        menus.forEach((menu, i) => {
          const tr = document.createElement('tr');
          tr.dataset.id = menu.id;
          // Daftar menu di atas sudah dihapus: baris tabel ini yang jadi
          // pemilih menu (klik baris = aktifkan menu, tabel barang muncul).
          if (menu.id === menuAktif) tr.className = 'on';
          if (menu.id !== AKUN_TILE) {
            tr.classList.add('pilih');
            tr.title = 'Klik untuk memakai menu ' + up(menu.name);
            tr.addEventListener('click', (e) => {
              if (e.target.closest('button, img')) return;
              pilihMenu(menu.id);
            });
          }

          tr.append(cell(String(i + 1), 'c-no'));
          tr.append(cellPotong(up(menu.name), 'c-nama'));

          const tdFoto = document.createElement('td');
          tdFoto.className = 'c-foto';
          if (menu.foto_url) {
            const img = document.createElement('img');
            img.className = 'thumb';
            img.src = fotoBaru(menu.foto_url);
            img.alt = menu.name || 'foto menu';
            img.loading = 'lazy';
            img.decoding = 'async';
            img.title = 'Lihat foto ' + up(menu.name);
            img.addEventListener('click', () => lihatFoto(menu));
            tdFoto.appendChild(img);
          } else {
            const kosong = document.createElement('span');
            kosong.className = 'kosong';
            kosong.textContent = '-';
            tdFoto.appendChild(kosong);
          }
          tr.appendChild(tdFoto);

          const tdAct = document.createElement('td');
          tdAct.className = 'c-aksi';
          const wrap = document.createElement('div');
          wrap.className = 'acts';

          // Tombol upload (↑) foto menu dikembalikan: foto menu boleh diupload/ganti
          // dari tabel Foto Menu SO. (Foto produk tidak punya tombol upload.)
          const up2 = document.createElement('button');
          up2.type = 'button';
          up2.className = 'ico';
          up2.textContent = '↑';
          up2.title = menu.foto_url ? 'Ganti foto ' + up(menu.name) : 'Upload foto ' + up(menu.name);
          up2.setAttribute('aria-label', up2.title);
          up2.addEventListener('click', () => pilihFotoMenu(menu.id));
          wrap.appendChild(up2);

          // Tombol "lihat/preview" (⊙) tetap dihapus: preview lewat thumbnail.

          // Baris ADMIN bukan record so_menus, jadi tidak bisa diedit/dihapus.
          if (menu.id !== AKUN_TILE) {
            const edit = document.createElement('button');
            edit.type = 'button';
            edit.className = 'ico';
            edit.textContent = '✎';
            edit.title = 'Edit ' + up(menu.name);
            edit.setAttribute('aria-label', edit.title);
            edit.addEventListener('click', () => editMenu(menu));
            wrap.appendChild(edit);

            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'ico ico-danger';
            del.textContent = '✕';
            del.title = 'Hapus ' + up(menu.name);
            del.setAttribute('aria-label', del.title);
            del.addEventListener('click', () => hapusMenu(menu));
            wrap.appendChild(del);
          }

          tdAct.appendChild(wrap);
          tr.appendChild(tdAct);
          menuFotoBody.appendChild(tr);
        });
        menuFotoWrap.hidden = menus.length === 0;
        menuFotoEmpty.hidden = menus.length > 0;
      };

      const loadMenus = async () => {
        const { data, error } = await supabase
          .from('so_menus')
          .select('id, name')
          .order('name');
        if (error) {
          console.error('Gagal memuat menu:', error.message);
          return;
        }
        const menus = data || [];
        if (menuAktif && !menus.some((m) => m.id === menuAktif)) menuAktif = null;
        loadFotoMenu();

        menuTerpilih = menus.find((m) => m.id === menuAktif) || null;
        barangSec.hidden = !menuTerpilih;
        if (!menuTerpilih) {
          localStorage.removeItem(MENU_KEY);
          stopEdit(true);
          return;
        }
        barangSec.dataset.menu = menuTerpilih.name;
        await loadBarang();
      };

      const loadBarang = async () => {
        if (!menuAktif) return;
        const { data, error } = await supabase
          .from('stock_products')
          .select('id, menu_id, kode, name, satuan, stok_sistem, stok_fisik, hpp, foto_url')
          .eq('menu_id', menuAktif)
          .order('kode');
        if (error) {
          const ulang = await supabase
            .from('stock_products')
            .select('id, menu_id, kode, name, satuan, stok_sistem, hpp')
            .eq('menu_id', menuAktif)
            .order('kode');
          if (ulang.error) {
            console.error('Gagal memuat barang:', ulang.error.message);
            barangBody.innerHTML = '';
            barangEmpty.hidden = false;
            barangEmpty.textContent = 'Gagal memuat barang: ' + ulang.error.message;
            return;
          }
          renderBarang(ulang.data || []);
          return;
        }
        renderBarang(data || []);
      };

      const simpanMenu = async () => {
        const name = mName.value.trim().toUpperCase();
        if (!name) return;
        mName.value = name;

        if (editMenuId) {
          const { error } = await supabase.from('so_menus').update({ name }).eq('id', editMenuId);
          if (error) {
            console.error('Gagal update menu:', error.message);
            return;
          }
          stopEdit(true);
          loadMenus();
          return;
        }

        const { data, error } = await supabase
          .from('so_menus')
          .upsert({ name }, { onConflict: 'name' })
          .select('id')
          .single();
        if (error) {
          console.error('Gagal menambah menu:', error.message);
          return;
        }
        stopEdit(true);
        menuAktif = data.id;
        localStorage.setItem(MENU_KEY, String(menuAktif));
        loadMenus();
      };

      mName.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        simpanMenu();
      });
      mAdd.addEventListener('click', simpanMenu);

      const simpanBarang = async () => {
        if (!menuAktif) return;
        const name = bName.value.trim().toUpperCase();
        if (!name) {
          bName.focus();
          return;
        }
        const satuan = bSatuan.value.trim().toUpperCase() || 'PCS';
        const stokSistem = num(bOnhand.value);
        const hpp = num(bHpp.value);

        const { data: dipakai, error: errBaca } = await supabase
          .from('stock_products')
          .select('kode')
          .eq('menu_id', menuAktif);
        if (errBaca) {
          console.error('Gagal membuat PLU:', errBaca.message);
          return;
        }
        const kode = buatKode(menuTerpilih.name, new Set((dipakai || []).map((r) => r.kode)));
        const { error } = await supabase.from('stock_products').insert({
          menu_id: menuAktif,
          kode,
          name,
          satuan,
          stok_sistem: stokSistem,
          hpp,
        });
        if (error) {
          console.error('Gagal menambah barang:', error.message);
          return;
        }
        stopEdit(false);
        loadBarang();
        bName.focus();
      };

      bAdd.addEventListener('click', simpanBarang);
      [bName, bSatuan, bOnhand, bFisik, bHpp].forEach((input) => {
        input.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          simpanBarang();
        });
      });
      const hitungBarisTambah = () => {
        const selisih = Math.round(num(bFisik.value)) - Math.round(num(bOnhand.value));
        bSelisih.textContent = selisih > 0 ? '+' + selisih : String(selisih);
        bSelisih.className = 'c-num selisih ' + (selisih === 0 ? '' : selisih < 0 ? 'minus' : 'plus');
        const ket = keteranganOf(selisih);
        bKet.textContent = ket.text;
        bKet.className = 'c-ket ket ' + ket.cls;
      };
      bOnhand.addEventListener('input', hitungBarisTambah);
      bFisik.addEventListener('input', hitungBarisTambah);

      setMode();
      loadMenus();
    </script>
  </body>
</html>
