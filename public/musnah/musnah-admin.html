<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — MUSNAH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{max-width:100%;overflow-x:hidden}
    html,body{width:100%;background:#fffbf2}
    body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;color:#1a1917;min-height:100vh;overflow-x:hidden}
    ::-webkit-scrollbar{width:0;height:0}
    *{scrollbar-width:none;-ms-overflow-style:none}
    :root{
      --mori-bg:#fffbf2;--mori-surface:#f7f3e9;--mori-text:#1a1917;--mori-text-2:#6e6a64;
      --mori-line:rgba(26,25,23,.14);--mori-accent:#1a1917;--mori-danger:#b91c1c;
      --mori-mono:"JetBrains Mono",ui-monospace,monospace;
    }
    html,body{background:var(--mori-bg) !important}
    body{padding-top:max(12px,env(safe-area-inset-top));-webkit-font-smoothing:antialiased}
    .wrap{width:100%;max-width:800px;min-height:100vh;margin:0 auto;background:var(--mori-bg) !important;padding:12px 18px 40px;min-width:0}
    .back-row{display:flex;justify-content:flex-end;margin-bottom:10px}
    .btn-back{
      font-family:var(--mori-mono);font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
      text-decoration:none;color:var(--mori-text);padding:6px 10px;
      border:1px solid var(--mori-line);background:var(--mori-surface);border-radius:8px;
    }
    .btn-back:active{transform:translate(1px,1px)}

    .judul-row{display:flex;align-items:stretch;gap:8px}
    .judul-row #f_title{flex:1 1 auto;min-width:0}
    .btn-add{
      flex:0 0 44px;width:44px;padding:0;display:flex;align-items:center;justify-content:center;
      font-family:inherit;font-size:22px;font-weight:700;line-height:1;
      color:var(--mori-bg);background:var(--mori-accent);border:1px solid var(--mori-line);border-radius:8px;cursor:pointer;
      transition:transform .2s ease;
    }
    .btn-add:active{transform:translate(2px,2px)}
    #f_title{
      flex:1 1 auto;min-width:0;width:auto;max-width:100%;margin:0;height:44px;padding:0 14px;
      font-family:var(--mori-mono);font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
      color:var(--mori-text) !important;background:var(--mori-surface) !important;
      border:1px solid var(--mori-line) !important;border-radius:8px !important;outline:none;
    }
    #f_title::placeholder{color:var(--mori-text-2) !important;letter-spacing:.4px;text-transform:none}
    #f_title:focus{background:#fffdf7 !important}

    .table-wrap{border:1px solid var(--mori-line);border-radius:8px;background:var(--mori-bg);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;margin-top:12px}
    .menu-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
    .menu-table thead th{
      position:sticky;top:0;z-index:1;background:var(--mori-surface);color:var(--mori-text);
      font-family:var(--mori-mono);font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;text-align:left;
      height:34px;padding:0 6px;border-bottom:1px solid var(--mori-line);white-space:nowrap;
    }
    .menu-table tbody td{height:46px;padding:0 6px;border-bottom:1px solid var(--mori-line);vertical-align:middle}
    .menu-table tbody tr:hover td{background:#faf6ea}
    .menu-table tbody tr:last-child td{border-bottom:0}
    .c-no{width:36px;text-align:center;font-family:var(--mori-mono);color:var(--mori-text-2);font-size:11px}
    .c-nama{min-width:0;overflow:hidden}
    .menu-table .c-nama .nama{font-family:var(--mori-mono);color:var(--mori-text);font-weight:700;font-size:11px;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .c-foto{width:52px}
    .c-aksi{width:116px}
    .c-foto .thumb{width:38px;height:38px;display:block;border:1px solid var(--mori-line);border-radius:8px;background:var(--mori-surface);overflow:hidden}
    .c-foto .thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.4) brightness(1.04);display:block}
    .c-foto .thumb.kosong{background:repeating-linear-gradient(45deg,#f2eee2 0 5px,#ece6d6 5px 10px);border-color:var(--mori-line)}
    .c-foto .thumb.sibuk{background:var(--mori-surface) !important}
    .c-foto .thumb.thumb-admin{display:flex;align-items:center;justify-content:center;background:var(--mori-accent);border-radius:8px}
    .c-foto .thumb.thumb-admin svg{width:18px;height:18px;color:var(--mori-bg)}
    .menu-table tbody tr.is-admin td{background:#faf6ea}
    .menu-table tbody tr.is-admin .c-nama .nama{color:var(--mori-accent)}
    .acts{display:flex;gap:6px;justify-content:flex-end}
    .ico{
      width:32px !important;height:32px !important;flex:0 0 32px !important;min-height:32px !important;max-height:32px !important;
      padding:0 !important;margin:0 !important;display:flex !important;align-items:center !important;justify-content:center !important;
      font-family:inherit;font-size:14px;font-weight:800;line-height:1;color:var(--mori-bg);background:var(--mori-accent);
      border:1px solid var(--mori-line);border-radius:8px;cursor:pointer;flex-shrink:0;outline:none;
      transition:transform .2s ease;
    }
    .ico:active{transform:translate(2px,2px)}
    .ico-danger{background:var(--mori-danger);border-color:var(--mori-danger);color:#fff}

    .search-wrapper{display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 0}
    .search-box {flex:1;display:flex;align-items:center;gap:8px;min-width:0;border: 1px solid var(--mori-line);border-radius:8px !important;background:var(--mori-surface) !important;color:var(--mori-text);padding:10px 14px;font-size:14px}
    .search-box:focus-within{background:#fffdf7 !important}
    .search-box svg{flex-shrink:0;color:var(--mori-text-2) !important;width:18px;height:18px}
    .search-box input{border:none;background:transparent;outline:none;width:100%;font-size:14px;color:var(--mori-text) !important;font-family:inherit;min-width:0;-webkit-appearance:none;appearance:none;border-radius:0}
    .search-box input::placeholder{color:var(--mori-text-2) !important}
    .empty{font-family:var(--mori-mono);font-size:11px;font-weight:700;color:var(--mori-text-2);letter-spacing:1px;text-transform:uppercase}
    .foto-hint{margin-top:8px;font-family:var(--mori-mono);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mori-danger);border-left:3px solid var(--mori-danger);padding:6px 8px;background:#fdf1f1;border-radius:0 8px 8px 0}
    .foto-hint[hidden]{display:none}

    .pw-bg{display:none;position:fixed;left:0;right:0;top:0;bottom:0;z-index:200;background:rgba(26,25,23,.45);align-items:center;justify-content:center;padding:16px}
    .pw-bg.open{display:flex}
    .pw-card{width:100%;max-width:360px;margin:auto;background:var(--mori-bg);border:1px solid var(--mori-line);border-radius:12px;padding:18px}
    .pw-title{font-family:var(--mori-mono);font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mori-text);margin-bottom:8px}
    .pw-msg{font-size:12px;color:var(--mori-text-2);line-height:1.5;margin-bottom:12px}
    .pw-input{width:100%;padding:11px 12px;font-family:var(--mori-mono);font-size:15px;letter-spacing:2px;color:var(--mori-text);background:var(--mori-surface);border:1px solid var(--mori-line);border-radius:8px;outline:none}
    .pw-input:focus{background:#fffdf7}
    .pw-error{margin-top:8px;font-family:var(--mori-mono);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mori-danger)}
    .pw-error[hidden]{display:none}
    .pw-actions{display:flex;gap:8px;margin-top:16px}
    .pw-btn{flex:1;padding:12px;border:1px solid var(--mori-line);border-radius:8px;background:var(--mori-surface);color:var(--mori-text);font-family:var(--mori-mono);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
  </style>
</head>
<body>
<input type="file" id="fotoInput" accept="image/*" hidden />

<div class="pw-bg" id="pwBg">
  <div class="pw-card" role="dialog" aria-modal="true">
    <div class="pw-title">Konfirmasi Hapus</div>
    <div class="pw-msg" id="pwMsg"></div>
    <input class="pw-input" id="pwInput" type="password" autocomplete="current-password" placeholder="Password" />
    <div class="pw-error" id="pwError" hidden>Gagal masuk.</div>
    <div class="pw-actions">
      <button class="pw-btn" id="pwCancel" type="button">Batal</button>
      <button class="pw-btn pw-btn-danger" id="pwOk" type="button" style="background:var(--mori-danger);color:#fff">Hapus</button>
    </div>
  </div>
</div>

<div class="wrap">


  <form id="form" onsubmit="return false">
    <input type="hidden" id="editId" value="" />
    <div class="judul-row">
      <input id="f_title" type="text" placeholder="Nama kategori/menu, cth: BARANG EXPIRED" autocomplete="off" />
      <button class="btn-add" type="button" id="btnAdd" title="Tambah menu">+</button>
    </div>
  </form>

  <div class="table-wrap" id="listWrap">
    <table class="menu-table">
      <thead>
        <tr>
          <th class="c-no">No</th>
          <th>Nama Menu</th>
          <th class="c-foto">Foto</th>
          <th class="c-aksi"></th>
        </tr>
      </thead>
      <tbody id="list">
        <tr><td class="c-no"></td><td class="c-nama"><div class="empty">Memuat...</div></td><td class="c-foto"></td><td class="c-aksi"></td></tr>
      </tbody>
    </table>
  </div>
  <div class="foto-hint" id="fotoHint" hidden></div>

  <div class="search-wrapper">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
      <input id="search" type="text" placeholder="Cari menu..." autocomplete="off" />
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from '../kopi/supabase.js';
  const TABLE = 'musnah_menus';
  const BUCKET = 'note-foto';

  const listEl = document.getElementById('list');
  const searchEl = document.getElementById('search');
  const editId = document.getElementById('editId');
  const f_title = document.getElementById('f_title');
  const btnAdd = document.getElementById('btnAdd');
  const fotoInput = document.getElementById('fotoInput');
  const fotoHint = document.getElementById('fotoHint');

  let all = [];
  let fotoTargetId = null;

  const AKUN_TILE = 'admin';
  const barisAdmin = {
    id: AKUN_TILE,
    title: 'ADMIN (FOTO UTAMA MUSNAH)',
    isAdmin: true,
    foto_url: localStorage.getItem('musnah_admin_foto') || ''
  };

  function fotoBaru(url) {
    if (!url) return '';
    return url.includes('?') ? url + '&t=' + Date.now() : url + '?t=' + Date.now();
  }

  async function load() {
    const { data, error } = await supabase.from(TABLE).select('*').order('created_at', { ascending: true });
    if (error) {
      listEl.innerHTML = '<tr><td class="c-no"></td><td class="c-nama"><div class="empty">' + error.message + '</div></td><td class="c-foto"></td><td class="c-aksi"></td></tr>';
      return;
    }
    all = data || [];
    render();
  }

  function barisKosong(pesan) {
    return '<tr><td class="c-no"></td><td class="c-nama"><div class="empty">' + pesan + '</div></td><td class="c-foto"></td><td class="c-aksi"></td></tr>';
  }

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = all.filter(m => !q || (m.title || '').toLowerCase().includes(q));
    const rows = (q ? [] : [barisAdmin]).concat(filtered);
    if (!rows.length) {
      listEl.innerHTML = barisKosong(all.length ? 'Tidak ada yang cocok' : 'Belum ada menu. Tambah di atas.');
      return;
    }
    listEl.innerHTML = rows.map((m, i) => {
      const url = m.foto_url ? fotoBaru(m.foto_url) : '';
      const isAdmin = !!m.isAdmin;
      let thumb;
      if (isAdmin) {
        thumb = url
          ? '<div class="thumb thumb-admin"><img src="' + url + '" alt="" loading="lazy" decoding="async" /></div>'
          : '<div class="thumb thumb-admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v2" /><path d="M8 9h8" /><rect x="4" y="4" width="16" height="16" rx="1" /></svg></div>';
      } else {
        thumb = url ? '<div class="thumb"><img src="' + url + '" alt="" loading="lazy" decoding="async" /></div>' : '<div class="thumb kosong"></div>';
      }
      const aksi = isAdmin
        ? '<button type="button" class="ico" data-foto="' + m.id + '" title="Ganti foto ADMIN">↑</button>'
        : '<button type="button" class="ico" data-foto="' + m.id + '" title="Upload foto">↑</button>' +
          '<button type="button" class="ico" data-edit="' + m.id + '" title="Edit">✎</button>' +
          '<button type="button" class="ico ico-danger" data-del="' + m.id + '" title="Hapus">✕</button>';
      return '<tr data-id="' + m.id + '"' + (isAdmin ? ' class="is-admin"' : '') + '>' +
        '<td class="c-no">' + (i + 1) + '</td>' +
        '<td class="c-nama"><div class="nama">' + (m.title || '') + '</div></td>' +
        '<td class="c-foto">' + thumb + '</td>' +
        '<td class="c-aksi"><div class="acts">' + aksi + '</div></td></tr>';
    }).join('');

    const idDari = v => (v === AKUN_TILE ? AKUN_TILE : parseInt(v, 10));
    listEl.querySelectorAll('[data-foto]').forEach(b => b.addEventListener('click', () => pilihFoto(idDari(b.dataset.foto))));
    listEl.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => isiForm(parseInt(b.dataset.edit, 10))));
    listEl.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => mintaHapus(parseInt(b.dataset.del, 10))));
  }

  searchEl.addEventListener('input', render);

  async function simpan() {
    const title = (f_title.value || '').trim();
    if (!title) { f_title.focus(); return; }
    const id = editId.value ? parseInt(editId.value, 10) : null;
    btnAdd.disabled = true;

    if (id) {
      const { error } = await supabase.from(TABLE).update({ title }).eq('id', id);
      if (error) { alert('Gagal ubah: ' + error.message); btnAdd.disabled = false; return; }
    } else {
      const { error } = await supabase.from(TABLE).insert([{ title }]);
      if (error) { alert('Gagal tambah: ' + error.message); btnAdd.disabled = false; return; }
    }

    f_title.value = '';
    editId.value = '';
    btnAdd.textContent = '+';
    btnAdd.disabled = false;
    load();
  }

  btnAdd.addEventListener('click', simpan);
  f_title.addEventListener('keydown', e => { if (e.key === 'Enter') simpan(); });

  function isiForm(id) {
    const m = all.find(x => x.id === id);
    if (!m) return;
    editId.value = m.id;
    f_title.value = m.title || '';
    btnAdd.textContent = '✓';
    f_title.focus();
  }

  // Foto upload
  function pilihFoto(id) {
    fotoTargetId = id;
    fotoInput.value = '';
    fotoInput.click();
  }

  async function kompresFoto(file, maxSisi = 1200, kualitas = 0.82) {
    if (!file || !/^image\//.test(file.type || '')) return file;
    let gambar = null; try { gambar = await createImageBitmap(file); } catch { return file; }
    if (!gambar) return file;
    const sisi = Math.max(gambar.width, gambar.height), skala = Math.min(1, maxSisi / sisi);
    if (skala === 1 && file.size < 400 * 1024) { if (gambar.close) gambar.close(); return file; }
    const w = Math.max(1, Math.round(gambar.width * skala)), h = Math.max(1, Math.round(gambar.height * skala));
    const kanvas = document.createElement('canvas'); kanvas.width = w; kanvas.height = h;
    kanvas.getContext('2d').drawImage(gambar, 0, 0, w, h); if (gambar.close) gambar.close();
    const blob = await new Promise(res => kanvas.toBlob(res, 'image/jpeg', kualitas)); if (!blob) return file;
    return new File([blob], (file.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg', lastModified: Date.now() });
  }

  fotoInput.addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    if (!file || fotoTargetId === null) return;
    const fKompres = await kompresFoto(file);
    const isAkun = fotoTargetId === AKUN_TILE;
    const path = isAkun ? 'musnah/admin.jpg' : 'musnah-' + fotoTargetId + '.jpg';

    fotoHint.textContent = 'Mengunggah foto...';
    fotoHint.hidden = false;

    const { error: upErr } = await supabase.storage.from(BUCKET).upload(path, fKompres, { upsert: true, cacheControl: '3600' });
    if (upErr) {
      fotoHint.textContent = 'Gagal upload: ' + upErr.message;
      return;
    }

    const { data: pubData } = supabase.storage.from(BUCKET).getPublicUrl(path);
    const foto_url = pubData ? pubData.publicUrl : '';

    if (isAkun) {
      localStorage.setItem('musnah_admin_foto', foto_url);
      barisAdmin.foto_url = foto_url;
      render();
      fotoHint.hidden = true;
    } else {
      const { error: dbErr } = await supabase.from(TABLE).update({ foto_url }).eq('id', fotoTargetId);
      if (dbErr) {
        fotoHint.textContent = 'Gagal simpan URL: ' + dbErr.message;
      } else {
        fotoHint.hidden = true;
        load();
      }
    }
  });

  // Password / Hapus modal
  const pwBg = document.getElementById('pwBg'), pwMsg = document.getElementById('pwMsg'), pwInput = document.getElementById('pwInput'), pwError = document.getElementById('pwError'), pwOk = document.getElementById('pwOk'), pwCancel = document.getElementById('pwCancel');
  let pwResolve = null, pendingDelId = null;

  async function askDelPassword(msg) {
    if (pwResolve) closePw(false);
    pwMsg.textContent = msg || '';
    pwInput.value = '';
    pwError.hidden = true;
    pwBg.classList.add('open');
    try { pwInput.focus(); } catch (e) {}
    return new Promise(res => { pwResolve = res; });
  }

  function closePw(ok) {
    pwBg.classList.remove('open');
    const fn = pwResolve;
    pwResolve = null;
    if (fn) fn(ok);
  }

  pwOk.addEventListener('click', async () => {
    const pass = pwInput.value || '';
    if (!pass) {
      pwError.textContent = 'Password wajib diisi.';
      pwError.hidden = false;
      return;
    }
    closePw(true);
  });

  pwCancel.addEventListener('click', () => closePw(false));
  pwBg.addEventListener('click', e => { if (e.target === pwBg) closePw(false); });
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') pwOk.click(); if (e.key === 'Escape') closePw(false); });

  async function mintaHapus(id) {
    const m = all.find(x => x.id === id);
    const ok = await askDelPassword('Hapus kategori "' + (m ? m.title : id) + '"?');
    if (!ok) return;

    const { error } = await supabase.from(TABLE).delete().eq('id', id);
    if (error) {
      alert('Gagal hapus: ' + error.message);
      return;
    }
    load();
  }

  load();
</script>
</body>
</html>
