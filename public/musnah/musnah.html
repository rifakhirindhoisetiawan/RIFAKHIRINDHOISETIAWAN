<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>MUSNAH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --mori-bg: #fffbf2;
        --mori-surface: #f7f3e9;
        --mori-text: #1a1917;
        --mori-text-2: #6e6a64;
        --mori-line: rgba(26, 25, 23, 0.14);
        --mori-accent: #1a1917;
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--mori-bg);
        overflow: hidden;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--mori-text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: var(--mori-bg);
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        position: relative;
      }

      @media (min-width: 800px) {
        .phone {
          max-width: 800px;
          margin: 0 auto;
        }
      }

      /* ===== SEARCH ROW ===== */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }
      .pin-row {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px 10px;
        margin: 0 0 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--mori-line);
      }
      @media (min-width: 768px) {
        .pin-row {
          gap: 22px 14px;
        }
      }

      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 46px;
        box-sizing: border-box;
        border: 1px solid var(--mori-line);
        border-radius: 8px;
        padding: 0 14px;
        color: var(--mori-text);
        font-size: 13px;
        background: var(--mori-surface);
        transition: background 0.2s ease;
      }
      .search-box:focus-within {
        background: #fffdf7;
        box-shadow: none;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: var(--mori-text);
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }
      .search-box input::placeholder,
      .search-box svg {
        color: var(--mori-text-2);
      }
      .search-box svg {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
      }

      .header-pin-btn {
        flex: 0 0 auto;
        width: 46px;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--mori-surface);
        border: 1px solid var(--mori-line);
        border-radius: 8px;
        color: var(--mori-text-2);
        cursor: pointer;
        padding: 0;
        transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
      }
      .header-pin-btn:active {
        transform: translate(2px, 2px);
      }
      .header-pin-btn[aria-pressed="true"] {
        background: var(--mori-text);
        color: var(--mori-bg);
        border-color: var(--mori-text);
      }
      .header-pin-btn svg {
        width: 20px;
        height: 20px;
      }
      body.pin-mode .icon-tile-foto {
        border: 1px dashed var(--mori-text-2) !important;
        cursor: pointer;
      }

      /* ===== MENU GRID ===== */
      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 12px 18px 40px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px 10px;
        width: 100%;
        align-content: start;
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        text-decoration: none;
        background: none;
        border: none;
        color: var(--mori-text);
      }
      .item.pinned .icon-tile-foto {
        box-shadow: 0 0 0 2px var(--mori-text);
      }

      .icon-tile-foto {
        position: relative;
        width: 100%;
        max-width: 100px;
        aspect-ratio: 9 / 16;
        border: none;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 10px;
        background: var(--mori-surface);
        box-shadow: none;
        transition: transform 0.2s ease;
      }
      .item:active .icon-tile-foto {
        transform: translate(2px, 2px);
      }
      .icon-tile-foto img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: saturate(0.55) contrast(1.02);
      }

      /* Tile Admin */
      .icon-tile-foto.tile-admin {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--mori-accent);
        box-shadow: none;
      }
      .icon-tile-foto.tile-admin svg {
        width: 36%;
        height: 36%;
        color: var(--mori-bg);
      }

      /* Tile tanpa foto */
      .icon-tile-foto.tanpa-foto {
        background-color: var(--mori-surface);
        background-image: repeating-linear-gradient(
          45deg,
          rgba(26, 25, 23, 0.04) 0,
          rgba(26, 25, 23, 0.04) 6px,
          transparent 6px,
          transparent 12px
        );
      }
      .tanpa-ikon {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--mori-text-2);
      }
      .tanpa-ikon svg {
        width: 32%;
        height: 32%;
        opacity: 0.5;
      }

      .item span {
        font-family: var(--mori-mono);
        font-size: 10px;
        font-weight: 700;
        text-align: center;
        line-height: 1.3;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--mori-text);
        max-width: 100%;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      @media (min-width: 768px) {
        .item span {
          font-size: 12px;
        }
      }

      .empty-msg {
        grid-column: 1 / -1;
        text-align: center;
        font-family: var(--mori-mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--mori-text-2);
        padding: 40px 0;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="Cari menu..."
            autocomplete="off"
          />
        </div>
        <button class="header-pin-btn" id="headerPinBtn" type="button" aria-label="Kelola Sematan Menu" title="Kelola Sematan Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7l2-3.2z"/></svg>
        </button>
      </div>

      <div class="menu-wrap">
        <div class="grid" id="homeGrid"></div>
      </div>
    </div>

    <script type="module">
      import { supabase } from '../kopi/supabase.js';

      const homeGrid = document.getElementById('homeGrid');
      const searchInput = document.getElementById('searchInput');

      let menus = [];

      const adminTile = {
        id: 'admin',
        title: 'ADMIN',
        isAdmin: true,
        href: 'musnah-admin.html'
      };

      const PIN_KEY = 'musnah_pinned_v1';
      const PIN_TABLE = 'musnah_pins';
      const PIN_MIGRASI_KEY = 'musnah_pins_migrated_v1';

      function loadPins() {
        try {
          const raw = JSON.parse(localStorage.getItem(PIN_KEY) || '[]');
          return Array.isArray(raw) ? raw.filter(x => typeof x === 'string') : [];
        } catch {
          return [];
        }
      }
      function savePins(list) {
        try {
          localStorage.setItem(PIN_KEY, JSON.stringify(list));
        } catch {}
      }

      let pinned = loadPins();
      const isPinned = (title) => pinned.includes(title);

      let pinServerReady = false;
      function setServerPins(list) {
        pinned = list;
        pinServerReady = true;
        savePins(list);
        renderGrid();
      }

      async function syncPins() {
        try {
          const { data, error } = await supabase
            .from(PIN_TABLE)
            .select('label')
            .order('dibuat', { ascending: true });
          if (error) return;
          const server = (data || []).map(r => r.label).filter(Boolean);
          try {
            if (localStorage.getItem(PIN_MIGRASI_KEY) !== '1') {
              const lokal = loadPins();
              const kurang = lokal.filter(l => l && !server.includes(l));
              for (const l of kurang) {
                try {
                  await supabase.from(PIN_TABLE).insert({ label: l });
                  server.push(l);
                } catch {}
              }
              localStorage.setItem(PIN_MIGRASI_KEY, '1');
            }
          } catch {}
          setServerPins(server);
        } catch {}
      }

      async function pushPin(label, add) {
        try {
          if (add) {
            await supabase.from(PIN_TABLE).insert({ label });
          } else {
            await supabase.from(PIN_TABLE).delete().eq('label', label);
          }
        } catch {}
      }

      let modeSemat = false;
      const headerPinBtn = document.getElementById('headerPinBtn');

      if (headerPinBtn) {
        headerPinBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          modeSemat = !modeSemat;
          headerPinBtn.setAttribute('aria-pressed', modeSemat ? 'true' : 'false');
          document.body.classList.toggle('pin-mode', modeSemat);
        });
      }

      function renderGrid() {
        const q = searchInput.value.trim().toLowerCase();
        const adminMatch = !q || 'admin'.includes(q);
        const adminItem = adminMatch ? adminTile : null;

        const filteredMenus = menus.filter((m) => (m.title || '').toLowerCase().includes(q));
        const normalFiltered = filteredMenus.filter(m => !m.isAdmin);

        const pinnedItems = pinned.map(title => normalFiltered.find(m => m.title === title)).filter(Boolean);
        const unpinnedItems = normalFiltered.filter(m => !pinned.includes(m.title));

        homeGrid.innerHTML = '';

        const createItemEl = (m, isAdm = false) => {
          if (isAdm) {
            const adminFoto = localStorage.getItem('musnah_admin_foto') || '';
            const tileAdminContent = adminFoto
              ? `<img src="${adminFoto}" alt="" loading="lazy" decoding="async" />`
              : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 15v2" /><path d="M8 9h8" /><rect x="4" y="4" width="16" height="16" rx="1" />
                </svg>`;
            const a = document.createElement('a');
            a.className = 'item';
            a.href = m.href;
            a.innerHTML = `
              <div class="icon-tile-foto tile-admin">
                ${tileAdminContent}
              </div>
              <span>${m.title}</span>
            `;
            return a;
          }

          const href = `musnah-admin.html?id=${m.id}`;
          const tileContent = m.foto_url
            ? `<img src="${m.foto_url}" alt="" loading="lazy" decoding="async" />`
            : `<div class="tanpa-ikon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                  <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
              </div>`;

          const pinnedClass = isPinned(m.title) ? ' pinned' : '';
          const a = document.createElement('a');
          a.className = 'item' + pinnedClass;
          a.href = href;
          a.innerHTML = `
            <div class="icon-tile-foto ${m.foto_url ? '' : 'tanpa-foto'}">
              ${tileContent}
            </div>
            <span>${m.title}</span>
          `;
          a.addEventListener('click', (e) => {
            if (modeSemat) {
              e.preventDefault();
              e.stopPropagation();
              const title = m.title;
              if (!title) return;
              const akanPin = !isPinned(title);
              if (akanPin) {
                pinned.push(title);
              } else {
                pinned = pinned.filter(t => t !== title);
              }
              savePins(pinned);
              renderGrid();
              if (pinServerReady) pushPin(title, akanPin);
            }
          });
          return a;
        };

        if (pinnedItems.length > 0 || adminItem) {
          const pinRowEl = document.createElement('div');
          pinRowEl.className = 'pin-row';
          if (adminItem) {
            pinRowEl.appendChild(createItemEl(adminItem, true));
          }
          pinnedItems.forEach(m => {
            pinRowEl.appendChild(createItemEl(m, false));
          });
          homeGrid.appendChild(pinRowEl);

          unpinnedItems.forEach(m => {
            homeGrid.appendChild(createItemEl(m, false));
          });
        } else {
          if (adminItem) {
            homeGrid.appendChild(createItemEl(adminItem, true));
          }
          unpinnedItems.forEach(m => {
            homeGrid.appendChild(createItemEl(m, false));
          });
        }

        if (homeGrid.children.length === 0) {
          homeGrid.innerHTML = '<div class="empty-msg">Tidak ditemukan</div>';
        }
      }

      async function loadMenus() {
        const { data, error } = await supabase.from('musnah_menus').select('*').order('created_at', { ascending: true });
        if (!error && data) {
          menus = data;
          renderGrid();
        } else {
          menus = [];
          renderGrid();
        }
      }

      searchInput.addEventListener('input', renderGrid);
      loadMenus();
      syncPins();
      try {
        supabase.channel('musnah_pins_changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: PIN_TABLE }, () => {
            syncPins();
          })
          .subscribe();
      } catch {}
    </script>
  </body>
</html>
