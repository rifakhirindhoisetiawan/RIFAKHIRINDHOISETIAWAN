<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin — EXP Supabase</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{max-width:100%;overflow-x:hidden}
    html,body{width:100%;height:100%;background:#ffffff}
    body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:#ffffff;color:#1a1a1a;min-height:100vh;overflow-x:hidden}
    ::-webkit-scrollbar{width:0;height:0}
    *{scrollbar-width:none;-ms-overflow-style:none}
    .wrap{width:100%;max-width:800px;min-height:100vh;margin:0 auto;background:#ffffff;padding:12px 18px 40px;min-width:0}
    .grid{display:grid;grid-template-columns:1fr;gap:20px;max-width:100%}
    .card{background:transparent;border:none;padding:0;max-width:100%;min-width:0}
    .section-label{font-size:11px;font-weight:800;color:#9aa0ab;letter-spacing:0.6px;text-transform:uppercase;margin:4px 0 14px}
    .search-wrapper{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:14px}
    .search-box{flex:1;display:flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:10px;padding:10px 14px;color:#222;font-size:14px;background:#f9f9f9;min-width:0}
    .search-box:focus-within{border-color:#888;background:#fff}
    .search-box svg{flex-shrink:0;color:#c3c8d1;width:18px;height:18px}
    .search-box input{border:none;background:transparent;outline:none;width:100%;font-size:14px;color:#222;font-family:inherit;min-width:0;-webkit-appearance:none;appearance:none;border-radius:0}
    .search-box input::placeholder{color:#c3c8d1}
    .back-btn{flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;border-radius:10px;background:#fff;color:#4f46e5;width:38px;height:38px;cursor:pointer;text-decoration:none}
    .form{display:grid;gap:8px;max-width:100%}
    .form-table{width:100%;border:1px solid #c7d2fe;border-radius:10px;overflow:hidden;background:#fff}
    .form-table .tr{display:flex;align-items:stretch;border-bottom:1px solid #e5e7eb;min-height:34px}
    .form-table .tr:last-child{border-bottom:none}
    .form-table .th{min-width:82px;display:flex;align-items:center;padding:0 8px;font-size:9px;font-weight:800;color:#4f46e5;background:#eef2ff;border-right:1px solid #e5e7eb;text-align:left;letter-spacing:0.4px;text-transform:uppercase}
    .form-table .td{flex:1;display:flex;align-items:center;padding:4px 8px;min-width:0}
    .form-table .td input,.form-table .td textarea{width:100%;margin:0 !important;padding:8px 10px;border:1px solid transparent;border-radius:6px;font-size:12px;font-weight:600;color:#111827;background:transparent;outline:none;font-family:inherit;line-height:1.2}
    .form-table .td input:focus,.form-table .td textarea:focus{border-color:#6366f1;background:#fff;box-shadow:0 0 0 1px #6366f1}
    .form-table .td input::placeholder{color:#9ca3af;font-weight:500}
    .btn-save-icon{width:100%;height:44px;border-radius:10px;border:none;background:#6366f1;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;transition:all .15s ease;font-size:14px;font-weight:700;padding:0 16px;font-family:inherit}
    .btn-save-icon:active{opacity:.85;transform:scale(.93)}
    .btn-save-icon:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .list{display:grid;grid-template-columns:1fr;gap:10px;max-width:100%}
    .item{display:flex;align-items:center;gap:10px;background:#fafbfc;border:1px solid #e3e6ec;border-radius:12px;padding:10px 12px;min-width:0}
    .item-main{flex:1;min-width:0}
    .item-name{font-size:12px;font-weight:800;color:#1f2937;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .item-meta{font-size:10px;font-weight:600;color:#9aa0ab;margin-top:3px;display:flex;flex-wrap:wrap;gap:3px 8px}
    .item-actions{display:flex;gap:6px;flex-shrink:0}
    .btn{padding:10px 16px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
    .btn-ghost{background:#eef2ff;color:#4f46e5;border:1px solid #c7d2fe}
    .btn-danger{background:#fef2f2;color:#ef4444;border:1px solid #fecaca}
    .btn-small{padding:0;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
    .empty{text-align:center;color:#9aa0ab;font-size:13px;font-weight:600;padding:40px 0}
    .hint{font-size:11px;color:#9aa0ab;line-height:1.5}
    .badge{flex-shrink:0;font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap;font-family:"JetBrains Mono",ui-monospace,monospace}
    .badge.expired{background:#fee2e2;color:#b91c1c}
    .badge.soon{background:#fef3c7;color:#b45309}
    .badge.ok{background:#d1fae5;color:#047857}
    .badge.none{background:#f3f4f6;color:#6b7280}
  </style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div class="card" style="order:2">
      <div class="section-label">Daftar Produk — <span id="count">0</span></div>
      <div class="search-wrapper">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
          <input id="search" type="text" placeholder="Cari produk / PLU / batch..." autocomplete="off" />
        </div>
        <a class="back-btn" href="exp.html" title="Kembali" aria-label="Kembali">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </a>
      </div>
      <div id="list" class="list"><div class="empty">Memuat...</div></div>
    </div>

    <div class="card" style="order:1">
      <div class="section-label" id="formLabel">Tambah Produk</div>
      <form id="form" class="form" onsubmit="return false">
        <input type="hidden" id="editId" />
        <div class="form-table">
          <div class="tr">
            <div class="th">Nama</div>
            <div class="td"><input id="f_name" placeholder="cth: Teh Pucuk 350ml" required /></div>
          </div>
          <div class="tr">
            <div class="th">PLU</div>
            <div class="td"><input id="f_plu" placeholder="cth: 443771" inputmode="numeric" /></div>
          </div>
          <div class="tr">
            <div class="th">Batch</div>
            <div class="td"><input id="f_batch" placeholder="cth: B20260101" /></div>
          </div>
          <div class="tr">
            <div class="th">Exp Date</div>
            <div class="td"><input id="f_exp_date" type="date" /></div>
          </div>
          <div class="tr">
            <div class="th">Qty</div>
            <div class="td"><input id="f_qty" type="number" min="0" step="1" inputmode="numeric" placeholder="0" /></div>
          </div>
          <div class="tr">
            <div class="th">Lokasi</div>
            <div class="td"><input id="f_lokasi" placeholder="cth: Rak A / Gudang" /></div>
          </div>
          <div class="tr">
            <div class="th">Catatan</div>
            <div class="td"><input id="f_catatan" placeholder="opsional" /></div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button id="btnReset" type="button" class="btn-save-icon" style="background:#eef2ff;color:#4f46e5;flex:1">Batal</button>
          <button id="btnSave" type="button" class="btn-save-icon" style="flex:2">Simpan</button>
        </div>
        <p class="hint" style="margin-top:8px">Status dihitung otomatis dari <b>Exp Date</b>: lewat / ≤ 30 hari / aman. Baris tanpa tanggal akan berstatus “—”.</p>
      </form>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from '../kopi/supabase.js';

  const TABLE = 'exp_items';
  const SOON_DAYS = 30;

  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const searchEl = document.getElementById('search');
  const form = document.getElementById('form');
  const formLabel = document.getElementById('formLabel');
  const editId = document.getElementById('editId');
  const f_name = document.getElementById('f_name');
  const f_plu = document.getElementById('f_plu');
  const f_batch = document.getElementById('f_batch');
  const f_exp_date = document.getElementById('f_exp_date');
  const f_qty = document.getElementById('f_qty');
  const f_lokasi = document.getElementById('f_lokasi');
  const f_catatan = document.getElementById('f_catatan');
  const btnSave = document.getElementById('btnSave');
  const btnReset = document.getElementById('btnReset');

  let all = [];

  function startOfToday() {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function daysLeft(expDate) {
    if (!expDate) return null;
    const d = new Date(expDate + 'T00:00:00');
    if (isNaN(d.getTime())) return null;
    return Math.round((d - startOfToday()) / 86400000);
  }

  function statusOf(row) {
    const left = daysLeft(row.exp_date);
    if (left === null) return { key: 'none', label: '—' };
    if (left < 0) return { key: 'expired', label: 'Lewat ' + Math.abs(left) + 'h' };
    if (left === 0) return { key: 'soon', label: 'Hari ini' };
    if (left <= SOON_DAYS) return { key: 'soon', label: left + 'h lagi' };
    return { key: 'ok', label: left + 'h' };
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtDate(v) {
    if (!v) return '-';
    const d = new Date(v);
    if (isNaN(d.getTime())) return v;
    return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function itemHtml(r) {
    const st = statusOf(r);
    const meta = ['Exp ' + fmtDate(r.exp_date)];
    if (r.plu) meta.push('PLU ' + r.plu);
    if (r.batch) meta.push('Batch ' + r.batch);
    if (r.lokasi) meta.push(r.lokasi);
    if (r.qty != null) meta.push('Qty ' + r.qty);
    return `
      <div class="item">
        <div class="item-main">
          <div class="item-name">${esc(r.name)}</div>
          <div class="item-meta">${meta.map((m) => `<span>${esc(m)}</span>`).join('')}</div>
        </div>
        <div class="badge ${st.key}">${esc(st.label)}</div>
        <div class="item-actions">
          <button type="button" class="btn btn-ghost btn-small" data-edit="${r.id}" title="Edit" aria-label="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button type="button" class="btn btn-danger btn-small" data-del="${r.id}" title="Hapus" aria-label="Hapus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
        </div>
      </div>`;
  }

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = all.filter((r) => {
      if (!q) return true;
      return [r.name, r.plu, r.batch, r.lokasi, r.catatan]
        .filter(Boolean)
        .join(' ')
        .toLowerCase()
        .includes(q);
    });
    filtered.sort((a, b) => {
      const da = daysLeft(a.exp_date);
      const db = daysLeft(b.exp_date);
      const na = da === null ? Infinity : da;
      const nb = db === null ? Infinity : db;
      if (na !== nb) return na - nb;
      return String(a.name || '').localeCompare(String(b.name || ''));
    });
    countEl.textContent = filtered.length;
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty">Tidak ada data</div>';
      return;
    }
    listEl.innerHTML = filtered.map(itemHtml).join('');
    listEl.querySelectorAll('[data-edit]').forEach((btn) => {
      btn.addEventListener('click', () => editRow(parseInt(btn.dataset.edit)));
    });
    listEl.querySelectorAll('[data-del]').forEach((btn) => {
      btn.addEventListener('click', () => delRow(parseInt(btn.dataset.del)));
    });
  }

  async function load() {
    try {
      const { data, error } = await supabase
        .from(TABLE)
        .select('*')
        .order('exp_date', { ascending: true, nullsFirst: false });
      if (error) throw error;
      all = data || [];
      render();
    } catch (e) {
      listEl.innerHTML = '<div class="empty">Gagal memuat: ' + esc(e.message) + '</div>';
    }
  }

  function resetForm() {
    editId.value = '';
    form.reset();
    formLabel.textContent = 'Tambah Produk';
    btnSave.textContent = 'Simpan';
  }

  function editRow(id) {
    const r = all.find((x) => x.id === id);
    if (!r) return;
    editId.value = r.id;
    f_name.value = r.name || '';
    f_plu.value = r.plu || '';
    f_batch.value = r.batch || '';
    f_exp_date.value = r.exp_date || '';
    f_qty.value = r.qty != null ? r.qty : '';
    f_lokasi.value = r.lokasi || '';
    f_catatan.value = r.catatan || '';
    formLabel.textContent = 'Edit Produk — ' + (r.name || '#' + r.id);
    btnSave.textContent = 'Update';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function delRow(id) {
    if (!confirm('Hapus produk #' + id + '?')) return;
    const { error } = await supabase.from(TABLE).delete().eq('id', id);
    if (error) alert('Gagal hapus: ' + error.message);
    else {
      if (parseInt(editId.value) === id) resetForm();
      await load();
    }
  }

  btnSave.addEventListener('click', async () => {
    const name = f_name.value.trim();
    if (!name) {
      alert('Nama wajib');
      return;
    }
    const qtyRaw = f_qty.value.trim();
    const payload = {
      name,
      plu: f_plu.value.trim() || null,
      batch: f_batch.value.trim() || null,
      exp_date: f_exp_date.value || null,
      qty: qtyRaw === '' ? null : parseInt(qtyRaw, 10),
      lokasi: f_lokasi.value.trim() || null,
      catatan: f_catatan.value.trim() || null,
    };
    btnSave.disabled = true;
    const res = editId.value
      ? await supabase.from(TABLE).update(payload).eq('id', parseInt(editId.value))
      : await supabase.from(TABLE).insert([payload]);
    btnSave.disabled = false;
    if (res.error) {
      if (/PGRST204|Could not find/i.test(res.error.message || '')) {
        alert(
          'Tabel exp_items belum ada di Supabase.\nJalankan SQL di scripts/build/supabase-schema.sql bagian 9.',
        );
      } else {
        alert('Gagal simpan: ' + (res.error.message || 'error'));
      }
      return;
    }
    resetForm();
    await load();
  });

  btnReset.addEventListener('click', resetForm);
  searchEl.addEventListener('input', render);

  let rtTimer = null;
  try {
    supabase
      .channel('admin_exp_items_' + Math.random().toString(36).slice(2))
      .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, () => {
        clearTimeout(rtTimer);
        rtTimer = setTimeout(() => load(), 300);
      })
      .subscribe();
  } catch (e) {}

  load();
</script>
</body>
</html>
