<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>RAK G</title>
<link rel="manifest" href="../../../../manifest.json" />
<meta name="theme-color" content="#fffbf2" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fffbf2;--surface:#f7f3e9;--text:#1a1917;--text-2:#6e6a64;--line:rgba(26,25,23,.14);--accent:#1a1917;--danger:#b91c1c;--mono:"JetBrains Mono",ui-monospace,monospace}
html,body{width:100%;min-height:100%;background:var(--bg)}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);padding-bottom:32px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:800px;margin:0 auto;padding:0 18px}
.topbar{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-decoration:none;border:1px solid var(--accent);padding:7px 10px;background:var(--accent);color:var(--bg);flex-shrink:0;transition:transform .15s ease,box-shadow .15s ease}
.back:hover{box-shadow:3px 3px 0 var(--text-2)}
.back:active{transform:translate(2px,2px);box-shadow:none}
.topbar h1{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .info{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--text-2);flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--surface);padding:10px 14px;margin-bottom:16px}
.search:focus-within{background:#fffdf7;box-shadow:4px 4px 0 var(--accent)}
.search svg{flex-shrink:0;width:16px;height:16px;color:var(--text-2)}
.search input{border:none;background:transparent;outline:none;width:100%;font-size:14px;font-family:inherit;color:var(--text);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#a9a49b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:12px}
.card{border:1px solid var(--accent);background:var(--bg);box-shadow:4px 4px 0 rgba(26,25,23,.12);padding:10px 8px;text-align:center;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.card:hover{box-shadow:4px 4px 0 var(--accent);background:var(--surface)}
.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--accent)}
.card .icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;background:var(--surface);border:1px solid var(--line);flex-shrink:0}
.card .name{font-family:var(--mono);font-size:10px;font-weight:700;line-height:1.35;color:var(--text);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .sku{font-family:var(--mono);font-size:9px;color:var(--text-2);word-break:break-all}
.card .facing{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-2)}
.card.promo{border-style:dashed;background:#fff8e6}
.card.promo .facing{color:var(--danger)}
.shelf{border:1px solid var(--accent);background:var(--surface);box-shadow:4px 4px 0 rgba(26,25,23,.12);padding:12px;margin-bottom:16px}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.shelf-head b{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text)}
.shelf-head span{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--text-2);flex-shrink:0}
.empty{text-align:center;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-2);padding:40px 0}
.shelf-tile .icon{font-size:30px}
/* 5 tile shelving = satu baris, tanpa geser */
.grid.row5{grid-template-columns:repeat(5,1fr);gap:8px}
.grid.row5 .card{padding:8px 4px;gap:4px}
.grid.row5 .card .icon{width:32px;height:32px;font-size:17px}
.grid.row5 .card .name{font-size:8px;letter-spacing:.3px;-webkit-line-clamp:2}
.grid.row5 .shelf-tile .icon{font-size:20px}
/* 10 produk shelving = satu baris, digeser horizontal */
.strip{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .card{flex:0 0 104px;width:104px;scroll-snap-align:start}
.strip .card .name{-webkit-line-clamp:2}
.strip-hint{font-family:var(--mono);font-size:9px;letter-spacing:.6px;color:var(--text-2);text-align:center;margin-top:2px}
@media(max-width:360px){.grid.row5{gap:5px}.grid.row5 .card{padding:6px 2px}}
@media(min-width:768px){.grid{gap:14px}.wrap{padding:0 20px}.strip .card{flex:0 0 124px;width:124px}}</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="../../index.html">&#8592; PLANO</a>
    <h1>Rak G</h1>    <span class="info">±85–100 cm</span>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="q" type="text" placeholder="Cari produk / barcode..." autocomplete="off" />
  </div>  <div class="shelf">
    <div class="shelf-head"><b>Rak G</b><span>±85–100 cm</span></div>
    <div class="grid">
      <div class="card" data-q="Club Soda 1500ml 8996001365017 2 facing">
        <div class="icon">🏞️</div>
        <div class="name">Club Soda 1500ml</div>
        <div class="sku">8996001365017</div>
        <div class="facing">2 facing</div>
      </div>
      <div class="card" data-q="Aqua Galon 19L 8998866610193 1 facing">
        <div class="icon">🛢️</div>
        <div class="name">Aqua Galon 19L</div>
        <div class="sku">8998866610193</div>
        <div class="facing">1 facing</div>
      </div>
      <div class="card promo" data-q="Teh Botol Sosro 350ml 8996001300011 2 facing · Promo">
        <div class="icon">🍵</div>
        <div class="name">Teh Botol Sosro 350ml</div>
        <div class="sku">8996001300011</div>
        <div class="facing">2 facing · Promo</div>
      </div>
      <div class="card" data-q="Teh Pucuk Harum 350ml 8998866200154 2 facing">
        <div class="icon">🍃</div>
        <div class="name">Teh Pucuk Harum 350ml</div>
        <div class="sku">8998866200154</div>
        <div class="facing">2 facing</div>
      </div>
      <div class="card" data-q="Ultramilk Coklat 250ml 8998009010015 3 facing">
        <div class="icon">🥛</div>
        <div class="name">Ultramilk Coklat 250ml</div>
        <div class="sku">8998009010015</div>
        <div class="facing">3 facing</div>
      </div>
    </div>
  </div>
  <div class="empty" id="empty" style="display:none">Tidak ditemukan</div>
</div>
<script>
(function () {
  var q = document.getElementById('q');
  var cards = [].slice.call(document.querySelectorAll('[data-q]'));
  var empty = document.getElementById('empty');
  q.addEventListener('input', function () {
    var v = q.value.trim().toLowerCase();
    var n = 0;
    cards.forEach(function (c) {
      var hit = !v || c.getAttribute('data-q').toLowerCase().indexOf(v) > -1;
      c.style.display = hit ? '' : 'none';
      if (hit) n++;
    });
    if (empty) empty.style.display = n ? 'none' : 'block';
  });
})();
</script>
</body>
</html>
