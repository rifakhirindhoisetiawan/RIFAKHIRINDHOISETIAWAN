<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PLANO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--mori-bg:#fffbf2;--mori-surface:#f7f3e9;--mori-text:#1a1917;--mori-text-2:#6e6a64;--mori-line:rgba(26,25,23,.14);--mori-accent:#1a1917;--mori-mono:"JetBrains Mono",ui-monospace,monospace}
    html,body{width:100%;height:100%;background:var(--mori-bg);overflow:hidden}
    body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--mori-text);min-height:100vh;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:0;-webkit-font-smoothing:antialiased}
    .phone{width:100%;max-width:100%;background:var(--mori-bg);border-radius:0;box-shadow:none;overflow:hidden;display:flex;flex-direction:column;min-height:100vh;position:relative}
    @media(min-width:800px){.phone{max-width:800px;margin:0 auto}}
    .search-row{display:flex;align-items:center;gap:10px;padding:12px 18px 14px;max-width:800px;width:100%;margin:0 auto;flex-shrink:0}
    .search-box{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--mori-accent);border-radius:0;padding:10px 14px;color:var(--mori-text);font-size:14px;background:var(--mori-surface);transition:box-shadow .2s ease}
    .search-box:focus-within{background:#fffdf7;box-shadow:4px 4px 0 var(--mori-accent)}
    .search-box input{border:none;background:transparent;outline:none;width:100%;font-size:14px;color:var(--mori-text);font-family:inherit;-webkit-appearance:none;appearance:none;border-radius:0}
    .search-box input::placeholder,.search-box svg{color:var(--mori-text-2)}
    .search-box svg{flex-shrink:0;width:18px;height:18px}
    .menu-wrap{flex:1;overflow-y:auto;padding:4px 18px 24px 22px;max-width:800px;width:100%;margin:0 auto;-ms-overflow-style:none;scrollbar-width:none}
    .menu-wrap::-webkit-scrollbar{display:none}
    .group-title{font-family:var(--mori-mono);font-size:10px;font-weight:700;color:var(--mori-text);letter-spacing:1.4px;text-transform:uppercase;margin:18px 0 12px}
    .group-title:first-child{margin-top:6px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px}
    @media(min-width:768px){.grid{gap:22px 14px}}
    .item{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;background:none;border:none;text-decoration:none}
    .icon-tile-foto{position:relative;width:100%;max-width:160px;aspect-ratio:9/16;border:1px solid var(--mori-accent);border-radius:0;overflow:hidden;margin-bottom:8px;background:var(--mori-surface);box-shadow:4px 4px 0 rgba(26,25,23,.12);transition:box-shadow .2s ease,transform .2s ease;display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1}
    .icon-tile-foto.tanpa-foto{background-color:var(--mori-surface);background-image:repeating-linear-gradient(45deg,#f2eee2 0 6px,#ece6d6 6px 12px);border-style:dashed;border-color:var(--mori-text-2)}
    .icon-tile-foto.tile-admin{background:var(--mori-accent);box-shadow:4px 4px 0 rgba(26,25,23,.28)}
    .icon-tile-foto.tile-admin svg{width:36%;height:36%;color:var(--mori-bg)}
    @media(max-width:480px){.icon-tile-foto{max-width:120px}}
    @media(max-width:360px){.icon-tile-foto{max-width:104px}}
    .item:hover .icon-tile-foto{box-shadow:4px 4px 0 var(--mori-accent)}
    .item:active .icon-tile-foto{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--mori-accent)}
    .item span{font-family:var(--mori-mono);font-size:11px;font-weight:700;line-height:1.3;color:var(--mori-text);letter-spacing:.8px;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .item span.desc{color:var(--mori-text-2);font-size:10px;letter-spacing:.4px;-webkit-line-clamp:1}
    @media(min-width:768px){.item span{font-size:12px}}
    .empty-msg{text-align:center;font-family:var(--mori-mono);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mori-text-2);padding:40px 0}
  </style>
</head>
<body>
  <div class="phone">
    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
        <input id="searchInput" type="text" placeholder="Cari rak..." autocomplete="off" aria-label="Cari rak" />
      </div>
    </div>
    <div class="menu-wrap" id="menuWrap"></div>
  </div>

  <script>
  /* Menu PLANO sengaja dibuat statis.
     Versi sebelumnya menarik daftar rak dari Supabase lewat <script type="module">.
     src/js/supabase.js mengimpor @supabase/supabase-js dari CDN, jadi begitu
     CDN tidak terjangkau (offline, diblokir, lambat) seluruh modul gagal
     dievaluasi dan halaman ini tampil kosong tanpa pesan apa pun.
     Isi rak di bawah sudah sesuai file yang benar-benar ada di
     shelving/rak/, jadi halaman ini tidak bergantung pada jaringan sama sekali.
     Upload foto / edit produk tetap lewat admin.html (butuh DB). */
  (function () {
    var TINGGI = ["180-200", "160-180", "145-160", "130-145", "115-130", "100-115", "85-100", "70-85"];
    var HURUF = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    var SHELVING = ["ak5", "ak9", "lf1", "lf2", "ya4"];

    var GROUPS = [
      {
        title: "GONDOLA A",
        items: HURUF.map(function (h, i) {
          return {
            name: "Rak " + h,
            desc: "±" + TINGGI[i % TINGGI.length] + " cm",
            icon: "🗄️",
            link: "shelving/rak/rak-" + h.toLowerCase() + ".html"
          };
        })
      },
      {
        title: "SHELVING",
        items: SHELVING.map(function (code) {
          return {
            name: code.toUpperCase(),
            desc: "5 shelving",
            icon: "📦",
            link: "shelving/rak/rak-" + code + ".html"
          };
        })
      }
    ];

    var ADMIN = { name: "ADMIN", link: "admin.html" };

    /* Namarak, deskripsi, dan judul grup bisa berisi karakter HTML. Semua
       disisipkan lewat innerHTML, jadi wajib di-escape lebih dulu. */
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    /* Link ditulis di file ini sendiri, tapi tetap dibatasi ke path relatif
       supaya tidak bisa berubah jadi javascript: atau URL luar. */
    function amanLink(link) {
      var v = String(link || "").trim();
      if (!v) return "#";
      if (/^[a-z][a-z0-9+.-]*:/i.test(v) || v.indexOf("//") === 0 || v.indexOf("\\") === 0) return "#";
      return v;
    }

    function tileHtml(item, isAdmin) {
      var head = isAdmin
        ? '<div class="icon-tile-foto tile-admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15v2"/><path d="M8 9h8"/><rect x="4" y="4" width="16" height="16" rx="1"/></svg></div>'
        : '<div class="icon-tile-foto tanpa-foto">' + item.icon + "</div>";
      return '<a class="item" href="' + esc(amanLink(item.link)) + '">' + head + "<span>" + esc(item.name) + "</span></a>";
    }

    var menuWrap = document.getElementById("menuWrap");
    var searchInput = document.getElementById("searchInput");

    function cocok(it, q, judulGrup) {
      if (!q) return true;
      return String(it.name).toLowerCase().indexOf(q) > -1 ||
             String(it.desc || "").toLowerCase().indexOf(q) > -1 ||
             String(judulGrup || "").toLowerCase().indexOf(q) > -1;
    }

    function render() {
      var q = searchInput.value.trim().toLowerCase();
      var html = "";

      var tiles = [];
      if (!q || "admin".indexOf(q) > -1) tiles.push(tileHtml(ADMIN, true));
      GROUPS[0].items.forEach(function (it) {
        if (cocok(it, q, GROUPS[0].title)) tiles.push(tileHtml(it, false));
      });
      if (tiles.length) html += '<div class="grid">' + tiles.join("") + "</div>";

      for (var g = 1; g < GROUPS.length; g++) {
        var items = GROUPS[g].items.filter(function (it) { return cocok(it, q, GROUPS[g].title); });
        if (!items.length) continue;
        html += '<div class="group-title">' + esc(GROUPS[g].title) + '</div><div class="grid">' +
          items.map(function (it) { return tileHtml(it, false); }).join("") + "</div>";
      }

      menuWrap.innerHTML = html || '<div class="empty-msg">Tidak ditemukan</div>';
    }

    searchInput.addEventListener("input", render);
    render();
  })();
  </script>
</body>
</html>
