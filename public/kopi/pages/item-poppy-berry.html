<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <title>POPPY BERRY</title>
    <meta name="theme-color" content="#fffbf2" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* ============================================================
         TEMA MORI
         Palet dari public/mori/css/variables.css:
         bg #fffbf2 · surface #f7f3e9 · primary #1a1917 · text-secondary #6e6a64
         Gaya: sharp (radius 0), border hitam solid, label mono uppercase.
         ============================================================ */
      :root {
        --mori-bg: #fffbf2;
        --mori-surface: #f7f3e9;
        --mori-text: #1a1917;
        --mori-text-2: #6e6a64;
        --mori-line: rgba(26, 25, 23, 0.14);
        --mori-accent: #1a1917;
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
        --mori-radius: 12px;
      }
      html, body { min-height: 100%; background: var(--mori-bg); }
      /* Scrollbar disembunyikan, scrolling tetap normal (HP) */
      html { scrollbar-width: none; -ms-overflow-style: none; }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
      body {
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--mori-text);
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        overflow-y: auto;
      }
      .wrap {
        background: var(--mori-bg);
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: 14px 18px 32px;
        padding-top: calc(14px + env(safe-area-inset-top));
        padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      }
      h1 {
        font-size: 17px; font-weight: 800; line-height: 1.25; margin: 8px 0 8px;
        letter-spacing: 0.6px; text-transform: uppercase;
      }
      /* Foto dihapus: halaman detail hanya berisi tabel PLU + resep. */
      .top-grid { display: block; }
      .side { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
      .badge {
        align-self: flex-start;
        font-family: var(--mori-mono);
        font-size: 10px; font-weight: 700; padding: 4px 9px; border-radius: var(--mori-radius, 12px);
        background: var(--mori-surface); border: 1px solid var(--mori-accent);
        color: var(--mori-text); letter-spacing: 0.8px; text-transform: uppercase;
      }
      /* ===== TABEL PLU ===== */
      .plu-table {
        border: 1px solid var(--mori-accent); border-radius: var(--mori-radius, 12px);
        overflow: hidden; background: var(--mori-bg);
      }
      .plu-row { display: flex; align-items: stretch; }
      .plu-row + .plu-row { border-top: 1px solid var(--mori-line); }
      .plu-th {
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: 8px; font-family: var(--mori-mono); font-size: 10px; font-weight: 700;
        color: var(--mori-text); background: var(--mori-surface);
        border-right: 1px solid var(--mori-line);
        letter-spacing: 0.6px; width: 38%; flex-shrink: 0;
      }
      .plu-td {
        flex: 1; display: flex; align-items: center; padding: 8px 10px;
        font-family: var(--mori-mono); font-size: 13px; font-weight: 700;
        color: var(--mori-text);
      }
      .plu-td.kosong { color: var(--mori-text-2); font-weight: 600; }
      h2 {
        font-family: var(--mori-mono);
        font-size: 11px; font-weight: 700; color: var(--mori-text); letter-spacing: 1.2px;
        text-transform: uppercase; margin: 18px 0 8px;
      }
      /* ===== TABEL RESEP / BAHAN ===== */
      .resep {
        border: 1px solid var(--mori-accent); border-radius: var(--mori-radius, 12px);
        overflow: hidden; background: var(--mori-bg);
      }
      .resep-row { display: flex; align-items: stretch; }
      .resep-row + .resep-row { border-top: 1px solid var(--mori-line); }
      .resep-no {
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: 9px 4px; font-family: var(--mori-mono); font-size: 10px; font-weight: 700;
        color: var(--mori-text); background: var(--mori-surface);
        border-right: 1px solid var(--mori-line);
        width: 38px; flex-shrink: 0;
      }
      .resep-nama {
        flex: 1; display: flex; align-items: center; padding: 9px 12px;
        font-size: 13px; font-weight: 600; color: var(--mori-text);
      }
      .catatan {
        background: var(--mori-surface); border: 1px solid var(--mori-accent); border-radius: var(--mori-radius, 12px);
        padding: 12px 14px; font-size: 13px; color: var(--mori-text); line-height: 1.5;
      }
      .empty {
        text-align: center; color: var(--mori-text-2);
        font-family: var(--mori-mono); font-size: 11px; font-weight: 600;
        letter-spacing: 0.6px; text-transform: uppercase; padding: 24px 0;
      }
      #status {
        margin: 10px 0 0; padding: 6px 9px; border-radius: var(--mori-radius, 12px);
        background: var(--mori-surface); border: 1px solid var(--mori-line);
        color: var(--mori-text-2); font-family: var(--mori-mono);
        font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      }
      #status[hidden] { display: none; }
      #status[data-tone="err"] {
        background: #fdf1f1; border-color: var(--mori-accent); color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top-grid">
        <div class="side">
          <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
            <h1 id="nama" style="margin:0;">POPPY BERRY</h1>
            <button id="openCommentModal" type="button" title="Komentar / Lapor Kesalahan" aria-label="Komentar" style="width:34px; height:34px; background:var(--mori-accent); color:var(--mori-bg); border:none; border-radius:var(--mori-radius, 12px); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </button>
          </div>
          <div id="badgeWrap"></div>
          <div class="plu-table" id="pluTable"></div>
        </div>
      </div>

      <div id="bahanWrap"></div>

      <!-- Modal Komentar -->
      <div id="commentModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:100; align-items:flex-end; justify-content:center;">
        <div style="background:var(--mori-bg); width:100%; max-width:800px; max-height:85vh; border-radius:20px 20px 0 0; padding:16px 18px 32px; display:flex; flex-direction:column; gap:12px; overflow-y:auto;">
          <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
            <h2 style="margin:0; font-size:13px;">Komentar / Lapor Kesalahan</h2>
            <button id="closeCommentModal" type="button" style="background:none; border:none; font-size:18px; font-weight:700; cursor:pointer; color:var(--mori-text)">✕</button>
          </div>
          <form id="commentForm" style="display:flex; flex-direction:column; gap:8px;">
            <textarea id="commentInput" rows="3" placeholder="Tulis komentar atau jika ada resep yang salah..." required style="padding:10px 12px; font-size:12.5px; font-family:inherit; background:var(--mori-surface); border:1px solid var(--mori-accent); border-radius:var(--mori-radius, 12px); outline:none; resize:none; color:var(--mori-text)"></textarea>
            <button type="submit" style="align-self:flex-end; padding:8px 16px; background:var(--mori-accent); color:var(--mori-bg); border:none; border-radius:var(--mori-radius, 12px); font-family:var(--mori-mono); font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; cursor:pointer">Kirim Komentar</button>
          </form>
          <div id="commentList" style="display:flex; flex-direction:column; gap:8px; max-height:45vh; overflow-y:auto; border-top:1px solid var(--mori-line); padding-top:10px;"></div>
        </div>
      </div>
      <div id="status" role="status" aria-live="polite" hidden></div>
    </div>

    <script type="module">
      import { supabase } from '../../../src/js/supabase.js';

      const MENU_ID = 487;
      const NAMA = "POPPY BERRY";

      const namaEl = document.getElementById('nama');
      const badgeWrap = document.getElementById('badgeWrap');
      const pluTable = document.getElementById('pluTable');
      const bahanWrap = document.getElementById('bahanWrap');
      const statusEl = document.getElementById('status');

      const setStatus = (text, tone) => {
        statusEl.textContent = text || '';
        statusEl.dataset.tone = tone || '';
        statusEl.hidden = !text;
      };

      const grup = (m, prefix) =>
        Array.from({ length: 10 }, (_, i) => m[prefix + (i + 1)]).filter(Boolean);

      function render(m) {
        document.title = m.name || NAMA;
        namaEl.textContent = m.name || NAMA;

        badgeWrap.innerHTML = m.cat ? '<span class="badge">' + m.cat + '</span>' : '';

          // Tabel PLU hanya menampilkan yang sudah diisi (12OZ, 16OZ, HOT).
        // Kalau tidak ada satupun yang terisi, tabelnya disembunyikan.
        const pluRows = [
          ['PLU 12OZ', m.plu_12oz],
          ['PLU 16OZ', m.plu_16oz],
          ['PLU HOT', m.plu_hot],
        ].filter((r) => String(r[1] || '').trim() !== '');
        pluTable.innerHTML = pluRows
          .map((r) => '<div class="plu-row"><div class="plu-th">' + r[0] + '</div>' +
                      '<div class="plu-td">' + r[1] + '</div></div>')
          .join('');
        pluTable.hidden = pluRows.length === 0;

        const bagian = [];
        const push = (judul, list) => { if (list.length) bagian.push([judul, list]); };
        push('HOT', grup(m, 'bahan_hot_'));
        push('HOT 16OZ', grup(m, 'bahan_hot_16oz_'));
        push('P12', grup(m, 'percepatan_12oz_'));
        push('P16', grup(m, 'percepatan_16oz_'));
        push('12OZ', grup(m, 'bahan_12oz_'));
        push('16OZ', grup(m, 'bahan_16oz_'));

        // Resep / bahan jadi TABEL (sama gaya dengan tabel PLU):
        // tiap grup punya header No | Bahan, nomornya berlanjut per grup.
        let html = '';
        bagian.forEach(([judul, list]) => {
          html += '<h2>' + judul + '</h2><div class="resep">' +
            list.map((b, i) =>
              '<div class="resep-row"><div class="resep-no">' + (i + 1) + '</div>' +
              '<div class="resep-nama">' + b + '</div></div>').join('') +
            '</div>';
        });
        if (m.catatan) html += '<h2>Catatan</h2><div class="catatan">' + m.catatan + '</div>';
        if (!bagian.length && !m.catatan) html = '<div class="empty">Belum ada data bahan.</div>';
        bahanWrap.innerHTML = html;
      }

      try {
        const { data, error } = await supabase.from('ja_di_menus').select('*').eq('id', MENU_ID).single();
        if (error) throw error;
        render(data);
      } catch (e) {
        console.warn(e);
        setStatus('Gagal memuat data (' + e.message.slice(0, 50) + ')', 'err');
      }

      /* ===== KOMENTAR DI DALAM MENU ===== */
      const COMMENT_KEY = 'kopi_comments_v1';
      const COMMENT_TABLE = 'kopi_comments';
      const SLUG = "poppy-berry";
      const MENU_NAME = "POPPY BERRY";

      const commentForm = document.getElementById('commentForm');
      const commentInput = document.getElementById('commentInput');
      const commentList = document.getElementById('commentList');

      function getLocalComments() {
        try {
          const raw = JSON.parse(localStorage.getItem(COMMENT_KEY) || '[]');
          return Array.isArray(raw) ? raw.filter(c => c.slug === SLUG) : [];
        } catch { return []; }
      }

      function renderComments(list) {
        if (!list.length) {
          commentList.innerHTML = '<div class="empty" style="padding:12px 0;">Belum ada komentar untuk menu ini.</div>';
          return;
        }
        commentList.innerHTML = list.map(c => {
          const t = new Date(c.created_at || Date.now()).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
          return '<div style="background:var(--mori-surface);border:1px solid var(--mori-line);border-radius:var(--mori-radius, 12px);padding:10px 12px;display:flex;flex-direction:column;gap:4px;">' +
            '<div style="font-size:12.5px;color:var(--mori-text);word-break:break-word;">' + escHtml(c.comment) + '</div>' +
            '<div style="font-size:9.5px;color:var(--mori-text-2);align-self:flex-end;font-family:var(--mori-mono)">' + t + '</div>' +
            '</div>';
        }).join('');
      }

      function escHtml(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      async function loadComments() {
        const lokal = getLocalComments();
        renderComments(lokal);
        try {
          const { data, error } = await supabase
            .from(COMMENT_TABLE)
            .select('*')
            .eq('slug', SLUG)
            .order('created_at', { ascending: false });
          if (!error && data) {
            renderComments(data);
          }
        } catch (e) {}
      }

      commentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = commentInput.value.trim();
        if (!text) return;
        commentInput.value = '';
        try {
          await supabase.from(COMMENT_TABLE).insert({
            slug: SLUG,
            menu_name: MENU_NAME,
            comment: text
          });
          loadComments();

      const openCommentModal = document.getElementById('openCommentModal');
      const closeCommentModal = document.getElementById('closeCommentModal');
      const commentModal = document.getElementById('commentModal');

      if (openCommentModal && commentModal) {
        openCommentModal.addEventListener('click', () => {
          commentModal.style.display = 'flex';
        });
      }
      if (closeCommentModal && commentModal) {
        closeCommentModal.addEventListener('click', () => {
          commentModal.style.display = 'none';
        });
      }
      if (commentModal) {
        commentModal.addEventListener('click', (e) => {
          if (e.target === commentModal) commentModal.style.display = 'none';
        });
      }
        } catch (err) {
          alert('Gagal mengirim komentar: ' + err.message);
        }
      });

      loadComments();

      const openCommentModal = document.getElementById('openCommentModal');
      const closeCommentModal = document.getElementById('closeCommentModal');
      const commentModal = document.getElementById('commentModal');

      if (openCommentModal && commentModal) {
        openCommentModal.addEventListener('click', () => {
          commentModal.style.display = 'flex';
        });
      }
      if (closeCommentModal && commentModal) {
        closeCommentModal.addEventListener('click', () => {
          commentModal.style.display = 'none';
        });
      }
      if (commentModal) {
        commentModal.addEventListener('click', (e) => {
          if (e.target === commentModal) commentModal.style.display = 'none';
        });
      }
    </script>
  </body>
</html>
