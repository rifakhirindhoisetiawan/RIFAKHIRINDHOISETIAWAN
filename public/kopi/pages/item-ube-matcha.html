<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <title>UBE MATCHA</title>
    <meta name="theme-color" content="#fffbf2" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* ============================================================
         TEMA MORI
         Palet dari public/mori/css/variables.css:
         bg #fffbf2 · surface #f7f3e9 · primary #1a1917 · text-secondary #6e6a64
         Gaya: sharp (radius 0), border hitam solid, label mono uppercase.
         ============================================================ */
      :root {
        --mori-bg: #fffbf2;
        --mori-surface: #f7f3e9;
        --mori-text: #1a1917;
        --mori-text-2: #6e6a64;
        --mori-line: rgba(26, 25, 23, 0.14);
        --mori-accent: #1a1917;
        --mori-mono: "JetBrains Mono", ui-monospace, monospace;
        --mori-radius: 12px;
      }
      html, body { min-height: 100%; background: var(--mori-bg); }
      /* Scrollbar disembunyikan, scrolling tetap normal (HP) */
      html { scrollbar-width: none; -ms-overflow-style: none; }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
      body {
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--mori-text);
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        overflow-y: auto;
      }
      .wrap {
        background: var(--mori-bg);
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: 14px 18px 32px;
        padding-top: calc(14px + env(safe-area-inset-top));
        padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      }
      h1 {
        font-size: 17px; font-weight: 800; line-height: 1.25; margin: 8px 0 8px;
        letter-spacing: 0.6px; text-transform: uppercase;
      }
      /* Foto dihapus: halaman detail hanya berisi tabel PLU + resep. */
      .top-grid { display: block; }
      .side { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
      .badge {
        align-self: flex-start;
        font-family: var(--mori-mono);
        font-size: 10px; font-weight: 700; padding: 4px 9px; border-radius: 4px;
        background: var(--mori-surface); border: 1px solid var(--mori-accent);
        color: var(--mori-text); letter-spacing: 0.8px; text-transform: uppercase;
      }
      /* ===== TABEL PLU ===== */
      .plu-table {
        border: 1px solid var(--mori-accent); border-radius: 4px;
        overflow: hidden; background: var(--mori-bg);
      }
      .plu-row { display: flex; align-items: stretch; }
      .plu-row + .plu-row { border-top: 1px solid var(--mori-line); }
      .plu-th {
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: 8px; font-family: var(--mori-mono); font-size: 10px; font-weight: 700;
        color: var(--mori-text); background: var(--mori-surface);
                letter-spacing: 0.6px; width: 38%; flex-shrink: 0;
      }
      .plu-td {
        flex: 1; display: flex; align-items: center; padding: 8px 10px;
        font-family: var(--mori-mono); font-size: 13px; font-weight: 700;
        color: var(--mori-text);
      }
      .plu-td.kosong { color: var(--mori-text-2); font-weight: 600; }
      h2 {
        font-family: var(--mori-mono);
        font-size: 11px; font-weight: 700; color: var(--mori-text); letter-spacing: 1.2px;
        text-transform: uppercase; margin: 18px 0 8px;
      }
      /* ===== TABEL RESEP / BAHAN ===== */
      .resep {
        border: 1px solid var(--mori-accent); border-radius: 4px;
        overflow: hidden; background: var(--mori-bg);
      }
      .resep-row { display: flex; align-items: stretch; }
      .resep-row + .resep-row { border-top: 1px solid var(--mori-line); }
      .resep-no {
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: 9px 4px; font-family: var(--mori-mono); font-size: 10px; font-weight: 700;
        color: var(--mori-text); background: var(--mori-surface);
                width: 38px; flex-shrink: 0;
      }
      .resep-nama {
        flex: 1; display: flex; align-items: center; padding: 9px 12px;
        font-size: 13px; font-weight: 600; color: var(--mori-text);
      }
      .catatan {
        background: var(--mori-surface); border: 1px solid var(--mori-accent); border-radius: 4px;
        padding: 12px 14px; font-size: 13px; color: var(--mori-text); line-height: 1.5;
      }
      .empty {
        text-align: center; color: var(--mori-text-2);
        font-family: var(--mori-mono); font-size: 11px; font-weight: 600;
        letter-spacing: 0.6px; text-transform: uppercase; padding: 24px 0;
      }
      #status {
        margin: 10px 0 0; padding: 6px 9px; border-radius: 4px;
        background: var(--mori-surface); border: 1px solid var(--mori-line);
        color: var(--mori-text-2); font-family: var(--mori-mono);
        font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      }
      #status[hidden] { display: none; }
      #status[data-tone="err"] {
        background: #fdf1f1; border-color: var(--mori-accent); color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top-grid">
        <div class="side">
          <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
            <h1 id="nama" style="margin:0;">UBE MATCHA</h1>
            <button id="openCommentModal" type="button" title="Catat / Komentar" aria-label="Catat" style="width:34px; height:34px; background:var(--mori-accent); color:var(--mori-bg); border:none; border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </button>
          </div>
          <div id="badgeWrap"></div>
          <div class="plu-table" id="pluTable"></div>
        </div>
      </div>

      <div id="bahanWrap"></div>

      <!-- Modal Catatan / Komentar -->
      <div id="commentModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:100; align-items:center; justify-content:center; padding:16px;">
        <div style="background:var(--mori-bg); width:100%; max-width:400px; border-radius:8px; border:1px solid var(--mori-line); padding:14px; display:flex; flex-direction:column; gap:8px; box-shadow:0 8px 24px rgba(0,0,0,0.15);">
          <form id="commentForm" style="display:flex; gap:6px; align-items:center;">
            <input type="text" id="commentInput" placeholder="Tulis catatan..." required style="flex:1; height:46px; padding:0 14px; font-size:14px; font-family:inherit; background:var(--mori-surface); border:1px solid var(--mori-line); border-radius:4px; outline:none; color:var(--mori-text); text-transform:uppercase;" />
            <button type="submit" title="Simpan" aria-label="Simpan" style="height:36px; width:36px; background:#1a1917; color:#fff; border:none; border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
            <button id="closeCommentModal" type="button" style="height:36px; width:36px; background:var(--mori-surface); border:1px solid var(--mori-line); border-radius:4px; font-size:14px; font-weight:700; cursor:pointer; color:var(--mori-text); display:flex; align-items:center; justify-content:center; flex-shrink:0;" title="Tutup">✕</button>
          </form>
          <div id="commentList" style="display:flex; flex-direction:column; gap:6px; max-height:35vh; overflow-y:auto;"></div>
        </div>
      </div>
      <div id="status" role="status" aria-live="polite" hidden></div>
    </div>

    <script type="module">
      import { supabase } from '../../../src/js/supabase.js';

      const MENU_ID = 541;
      const NAMA = "UBE MATCHA";

      const namaEl = document.getElementById('nama');
      const badgeWrap = document.getElementById('badgeWrap');
      const pluTable = document.getElementById('pluTable');
      const bahanWrap = document.getElementById('bahanWrap');
      const statusEl = document.getElementById('status');

      const setStatus = (text, tone) => {
        statusEl.textContent = text || '';
        statusEl.dataset.tone = tone || '';
        statusEl.hidden = !text;
      };

      const grup = (m, prefix) =>
        Array.from({ length: 10 }, (_, i) => m[prefix + (i + 1)]).filter(Boolean);

      function render(m) {
        document.title = m.name || NAMA;
        namaEl.textContent = m.name || NAMA;

        badgeWrap.innerHTML = m.cat ? '<span class="badge">' + m.cat + '</span>' : '';

          // Tabel PLU hanya menampilkan yang sudah diisi (12OZ, 16OZ, HOT).
        // Kalau tidak ada satupun yang terisi, tabelnya disembunyikan.
        const pluRows = [
          ['PLU 12OZ', m.plu_12oz],
          ['PLU 16OZ', m.plu_16oz],
          ['PLU HOT', m.plu_hot],
        ].filter((r) => String(r[1] || '').trim() !== '');
        pluTable.innerHTML = pluRows
          .map((r) => '<div class="plu-row"><div class="plu-th">' + r[0] + '</div>' +
                      '<div class="plu-td">' + r[1] + '</div></div>')
          .join('');
        pluTable.hidden = pluRows.length === 0;

        const bagian = [];
        const push = (judul, list) => { if (list.length) bagian.push([judul, list]); };
        push('HOT', grup(m, 'bahan_hot_'));
        push('HOT 16OZ', grup(m, 'bahan_hot_16oz_'));
        push('P12', grup(m, 'percepatan_12oz_'));
        push('P16', grup(m, 'percepatan_16oz_'));
        push('12OZ', grup(m, 'bahan_12oz_'));
        push('16OZ', grup(m, 'bahan_16oz_'));

        // Resep / bahan jadi TABEL (sama gaya dengan tabel PLU):
        // tiap grup punya header No | Bahan, nomornya berlanjut per grup.
        let html = '';
        bagian.forEach(([judul, list]) => {
          html += '<h2>' + judul + '</h2><div class="resep">' +
            list.map((b, i) =>
              '<div class="resep-row"><div class="resep-no">' + (i + 1) + '</div>' +
              '<div class="resep-nama">' + b + '</div></div>').join('') +
            '</div>';
        });
        if (m.catatan) html += '<h2>Catatan</h2><div class="catatan">' + m.catatan + '</div>';
        if (!bagian.length && !m.catatan) html = '<div class="empty">Belum ada data bahan.</div>';
        bahanWrap.innerHTML = html;
      }

      try {
        const { data, error } = await supabase.from('ja_di_menus').select('*').eq('id', MENU_ID).single();
        if (error) throw error;
        render(data);
      } catch (e) {
        console.warn(e);
        setStatus('Gagal memuat data (' + e.message.slice(0, 50) + ')', 'err');
      }

      /* ===== SINKRONISASI CATATAN KE NOTE (MENU_ID: 64) ===== */
      const NOTE_MENU_ID = 64;
      const COMMENT_KEY = 'kopi_comments_v1_' + MENU_ID;

      const commentForm = document.getElementById('commentForm');
      const commentInput = document.getElementById('commentInput');
      const commentList = document.getElementById('commentList');

      function getLocalComments() {
        try {
          const raw = JSON.parse(localStorage.getItem(COMMENT_KEY) || '[]');
          return Array.isArray(raw) ? raw : [];
        } catch { return []; }
      }

      let editingContent = null;
      let editingSupabaseId = null;

      function renderComments(list) {
        if (!list.length) {
          commentList.innerHTML = '<div class="empty" style="padding:12px 0;font-size:12px;color:var(--mori-text-2);">Belum ada catatan.</div>';
          return;
        }
        const seen = new Set();
        const uniqList = list.filter(c => {
          const key = (c.content || '').trim().toUpperCase();
          if (!key || seen.has(key)) return false;
          seen.add(key);
          return true;
        });
        commentList.innerHTML = uniqList.map((c) => {
          const t = new Date(c.created_at || Date.now()).toLocaleDateString('id-ID', { dateStyle: 'short' });
          return '<div style="background:var(--mori-surface);border-radius:4px;padding:8px 10px;display:flex;align-items:center;gap:8px;">' +
            '<div style="flex:1;font-size:13px;color:var(--mori-text);word-break:break-word;text-transform:uppercase;">' + escHtml(c.content) + '</div>' +
            '<span style="font-size:10px;color:var(--mori-text-2);font-family:var(--mori-mono);flex-shrink:0;">' + t + '</span>' +
            '<div style="display:flex;gap:4px;flex-shrink:0;">' +
            '<button type="button" class="edit-note-btn" data-content="' + escHtml(c.content) + '" data-id="' + (c.id || '') + '" title="Edit" aria-label="Edit" style="width:36px; height:36px; background:#1a1917; color:#fff; border:none; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 3 0 1 1 4 4L7.5 20.5 4 22l1.5-3.5L17 3z"></path></svg></button>' +
            '<button type="button" class="del-note-btn" data-content="' + escHtml(c.content) + '" data-id="' + (c.id || '') + '" title="Hapus" aria-label="Hapus" style="width:36px; height:36px; background:#1a1917; color:#fff; border:none; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 6 6 18"></polyline><polyline points="6 6 18 18"></polyline></svg></button>' +
            '</div>' +
            '</div>';
        }).join('');

        commentList.querySelectorAll('.del-note-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!(await moriConfirm('Hapus catatan ini?'))) return;
            const content = (btn.getAttribute('data-content') || '').trim();
            const id = btn.getAttribute('data-id');
            const lokal = getLocalComments();
            const norm = (s) => (s || '').toUpperCase().replace(/\s+/g,' ').trim();
            const filteredLokal = lokal.filter(l => norm(l.content) !== norm(content));
            localStorage.setItem(COMMENT_KEY, JSON.stringify(filteredLokal));
            // tombstone (local)
            try {
              const tKey = COMMENT_KEY + '_deleted';
              const t = JSON.parse(localStorage.getItem(tKey) || '[]');
              const normT = (s) => (s || '').toUpperCase().replace(/\s+/g,' ').trim();
              if (!t.map(x=>normT(x)).includes(normT(content))) t.push(normT(content));
              localStorage.setItem(tKey, JSON.stringify(t));
              // global tombstone for kopi.html sheet
              const gKey = 'kopi_deleted_comments_global';
              const g = JSON.parse(localStorage.getItem(gKey) || '[]');
              const normT2 = (s) => (s || '').toUpperCase().replace(/\s+/g,' ').trim();
              const fullC = normT2('[' + NAMA + '] ' + content);
              if (!g.map(x=>normT2(x)).includes(fullC)) g.push(fullC);
              localStorage.setItem(gKey, JSON.stringify(g));
            } catch(e){}
            renderComments(filteredLokal);
            try {
              // Collect ids to delete (by id and by case-insensitive content match)
              const idsToDelete = new Set();
              if (id && !String(id).startsWith('local_')) idsToDelete.add(id);
              const fullContentUpper = ('[' + NAMA + '] ' + content).toUpperCase();
              const { data: rows } = await supabase
                .from('note_entries')
                .select('id,content')
                .eq('menu_id', NOTE_MENU_ID);
              if (rows) {
                const norm = (s) => (s || '').toUpperCase().replace(/\s+/g, ' ').trim();
                const targetNorm = norm('[' + NAMA + '] ' + content);
                rows.forEach(r => {
                  if (norm(r.content) === targetNorm) idsToDelete.add(r.id);
                });
              }
              for (const rid of idsToDelete) {
                await supabase.from('note_entries').delete().eq('id', rid);
              }
              // fallback: delete by exact content variants
              await supabase.from('note_entries').delete().eq('content', '[' + NAMA + '] ' + content);
            } catch(e){ console.warn('Gagal hapus di server:', e && e.message); }
            // no loadComments() here: keep UI immediate; tombstone + purge handle future loads
          });
        });

        commentList.querySelectorAll('.edit-note-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const content = btn.getAttribute('data-content');
            const id = btn.getAttribute('data-id');
            editingContent = content;
            editingSupabaseId = id || null;
            commentInput.value = content;
            commentInput.focus();
          });
        });
      }

      function escHtml(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function moriConfirm(message) {
        return new Promise((resolve) => {
          const overlay = document.getElementById('moriConfirmOverlay');
          const msg = document.getElementById('moriConfirmMsg');
          const ok = document.getElementById('moriConfirmOk');
          const cancel = document.getElementById('moriConfirmCancel');
          if (!overlay) { resolve(window.confirm(message)); return; }
          msg.textContent = message;
          overlay.style.display = 'flex';
          const cleanup = () => { overlay.style.display = 'none'; ok.onclick = null; cancel.onclick = null; overlay.onclick = null; };
          ok.onclick = () => { cleanup(); resolve(true); };
          cancel.onclick = () => { cleanup(); resolve(false); };
          overlay.onclick = (e) => { if (e.target === overlay) { cleanup(); resolve(false); } };
        });
      }
      async function loadComments() {
        const lokal = getLocalComments();
        let tomb = [];
        try { tomb = JSON.parse(localStorage.getItem(COMMENT_KEY + '_deleted') || '[]'); } catch(e){}
        const norm = (s) => (s || '').toUpperCase().replace(/\s+/g,' ').trim();
        const isTomb = (c) => tomb.map(x=>norm(x)).includes(norm(c.content));
        // purge stale local entries not present in supabase (older than 2 min)
        // We'll do initial render from local (filtered), then reconcile with supabase.
        const lokalClean = lokal.filter(c => !isTomb(c)).map(c => ({...c, content: (c.content||'').toUpperCase()}));
        renderComments(lokalClean);
        try {
          const { data, error } = await supabase
            .from('note_entries')
            .select('*')
            .eq('menu_id', NOTE_MENU_ID)
            .order('created_at', { ascending: false });
          if (!error && data) {
            const prefix = '[' + NAMA + ']';
            const filtered = data.filter(d => (d.content || '').startsWith(prefix)).map(d => ({
              id: d.id,
              content: (d.content.replace(prefix, '').trim()).toUpperCase(),
              created_at: d.created_at
            })).filter(c => !isTomb(c));
            // purge stale local entries not present in supabase (older than 2 min)
            try {
              const supaSet = new Set(filtered.map(f => norm(f.content)));
              const now = Date.now();
              const purged = lokal.filter(l => {
                if (isTomb(l)) return false;
                const age = now - new Date(l.created_at || 0).getTime();
                if (age < 120000) return true;
                return supaSet.has(norm(l.content));
              });
              localStorage.setItem(COMMENT_KEY, JSON.stringify(purged));
            } catch(e){}
            const purgedClean = lokal.filter(l => {
              if (isTomb(l)) return false;
              const age = Date.now() - new Date(l.created_at || 0).getTime();
              if (age < 120000) return true;
              const supaSet = new Set(filtered.map(f => norm(f.content)));
              return supaSet.has(norm(l.content));
            }).map(c => ({...c, content: (c.content||'').toUpperCase()}));
            const combined = [...filtered, ...purgedClean.filter(l => !filtered.some(f => f.content === l.content))];
            const seen = new Set();
            const uniq = combined.filter(c => {
              const k = (c.content || '').trim().toUpperCase();
              if (!k || seen.has(k)) return false;
              seen.add(k);
              return true;
            });
            renderComments(uniq);
          }
        } catch (e) {}
      }

      loadComments();

      commentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const rawText = commentInput.value.trim();
        if (!rawText) return;
        const text = rawText.toUpperCase();
        commentInput.value = '';
        const fullContent = '[' + NAMA + '] ' + text;

        try {
          const lokal = getLocalComments();
          if (editingContent !== null) {
            // Edit mode: replace existing note
            const idx = lokal.findIndex(l => (l.content || '').trim() === editingContent.trim());
            if (idx !== -1) {
              lokal[idx].content = text;
              lokal[idx].created_at = new Date().toISOString();
            } else {
              lokal.unshift({ content: text, created_at: new Date().toISOString() });
            }
            localStorage.setItem(COMMENT_KEY, JSON.stringify(lokal));
            renderComments(lokal);

            if (editingSupabaseId) {
              try {
                await supabase.from('note_entries').update({ content: fullContent }).eq('id', editingSupabaseId);
              } catch(e){}
            } else {
              try {
                await supabase.from('note_entries').insert({ menu_id: NOTE_MENU_ID, content: fullContent });
              } catch(e){}
            }
          } else {
            // New note
            const newC = { content: text, created_at: new Date().toISOString() };
            lokal.unshift(newC);
            localStorage.setItem(COMMENT_KEY, JSON.stringify(lokal));
            renderComments(lokal);

            await supabase.from('note_entries').insert({
              menu_id: NOTE_MENU_ID,
              content: fullContent
            });
          }
          editingContent = null;
          editingSupabaseId = null;
          loadComments();
        } catch (err) {
          alert('Gagal menyimpan catatan: ' + err.message);
        }
      });

      const openCommentModal = document.getElementById('openCommentModal');
      const closeCommentModal = document.getElementById('closeCommentModal');
      const commentModal = document.getElementById('commentModal');

      if (openCommentModal && commentModal) {
        openCommentModal.addEventListener('click', () => {
          commentModal.style.display = 'flex';
        });
      }
      if (closeCommentModal && commentModal) {
        closeCommentModal.addEventListener('click', () => {
          commentModal.style.display = 'none';
          editingContent = null;
          editingSupabaseId = null;
          if (commentInput) commentInput.value = '';
        });
      }
      if (commentModal) {
        commentModal.addEventListener('click', (e) => {
          if (e.target === commentModal) {
            commentModal.style.display = 'none';
            editingContent = null;
            editingSupabaseId = null;
            if (commentInput) commentInput.value = '';
          }
        });
      }
    </script>
  <div id="moriConfirmOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:var(--mori-bg,#fffbf2); border-radius:8px; padding:20px 22px; max-width:320px; width:90%; box-shadow:0 10px 30px rgba(0,0,0,0.25); border:1px solid var(--mori-line,rgba(26,25,23,0.14));">
    <div id="moriConfirmMsg" style="font-size:14px; font-weight:600; color:var(--mori-text,#1a1917); margin-bottom:16px; line-height:1.4;"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button id="moriConfirmCancel" type="button" style="padding:8px 16px; background:var(--mori-surface,#f7f3e9); color:var(--mori-text,#1a1917); border:1px solid var(--mori-line,rgba(26,25,23,0.14)); border-radius:4px; cursor:pointer; font-weight:600; font-size:13px;">Batal</button>
      <button id="moriConfirmOk" type="button" style="padding:8px 16px; background:var(--mori-accent,#1a1917); color:var(--mori-bg,#fffbf2); border:none; border-radius:4px; cursor:pointer; font-weight:600; font-size:13px;">Hapus</button>
    </div>
  </div>
</div>
