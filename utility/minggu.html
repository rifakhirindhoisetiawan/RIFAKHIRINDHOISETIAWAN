<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYLOVE</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
        overflow: hidden;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px 14px;
        color: #222;
        font-size: 14px;
        background: #f9f9f9;
      }
      .search-box:focus-within {
        border-color: #888;
        background: #fff;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: #222;
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }
      .search-box input::placeholder {
        color: #c3c8d1;
      }
      .search-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
        width: 18px;
        height: 18px;
      }

      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 4px 18px 20px 22px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .menu-wrap::-webkit-scrollbar {
        display: none;
      }

      .todo-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px 10px;
      }

      @media (min-width: 768px) {
        .todo-list {
          gap: 22px 14px;
        }
      }

      .todo-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        user-select: none;
        text-decoration: none;
      }

      .todo-card {
        width: 100%;
        max-width: 110px;
        aspect-ratio: 9 / 16;
        border-radius: 16px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        position: relative;
        opacity: 1;
        box-shadow: none;
        transition:
          transform 0.2s ease,
          opacity 0.3s ease,
          filter 0.3s ease;
      }

      .todo-emoji {
        font-size: 34px;
        line-height: 1;
      }

      @media (max-width: 360px) {
        .todo-card {
          max-width: 95px;
          border-radius: 14px;
        }
      }

      .todo-item.done .todo-card {
        opacity: 0.4;
        filter: grayscale(0.35);
        transform: translateY(6px) scale(0.94);
        box-shadow: none;
      }

      .todo-text {
        font-size: 11px;
        font-weight: 700;
        color: #1f2937;
        line-height: 1.3;
        transition: all 0.3s ease;
      }

      @media (min-width: 768px) {
        .todo-text {
          font-size: 12px;
        }
      }

      .todo-item.done .todo-text {
        opacity: 0.45;
        text-decoration: line-through;
        color: #b6bac2;
        font-weight: 700;
      }

      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #9aa0ab;
      }
      .empty-state p {
        font-size: 13px;
        font-weight: 600;
        margin-top: 8px;
      }

      .g-a { background: linear-gradient(135deg, #a5b4fc, #818cf8); }
      .g-b { background: linear-gradient(135deg, #c4b5fd, #a78bfa); }
      .g-c { background: linear-gradient(135deg, #93c5fd, #60a5fa); }
      .g-d { background: linear-gradient(135deg, #67e8f9, #22d3ee); }
      .g-e { background: linear-gradient(135deg, #6ee7b7, #34d399); }
      .g-f { background: linear-gradient(135deg, #fcd34d, #fbbf24); }
      .g-g { background: linear-gradient(135deg, #fca5a5, #f87171); }
      .g-h { background: linear-gradient(135deg, #f0abfc, #e879f9); }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="text"
            id="taskInput"
            placeholder="Tambah kegiatan baru..."
          />
        </div>
      </div>

      <div class="menu-wrap">
        <div class="todo-list" id="todoList"></div>
        <div class="empty-state" id="emptyState" style="display: none">
          <div style="font-size: 32px">📋</div>
          <p>Belum ada kegiatan.<br />Tambahkan yang pertama yuk!</p>
        </div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = "todo-minggu";
      const PHOTO_FOLDER = "../images/daily-task-photos/minggu/";
      const photoExts = [".jpg", ".jpeg", ".png", ".svg", ".webp"];

      const GRADIENTS = ["g-a", "g-b", "g-c", "g-d", "g-e", "g-f", "g-g", "g-h"];
      function gradientFor(id) { return GRADIENTS[Math.abs(id) % GRADIENTS.length]; }

      const EMOJIS = ["☀️", "📅", "🌙", "⭐", "🌸", "🔥", "💡", "🎯", "📌", "✨", "🍀", "🌈", "💫", "🌟", "🍎", "🐱"];
      function emojiFor(id) { return EMOJIS[Math.abs(id) % EMOJIS.length]; }

      function slugify(s) {
        return s.toString().trim().toLowerCase().replace(/[^a-z0-9\u00C0-\uFFFF]+/g, "-").replace(/^-+|-+$/g, "");
      }

      const FALLBACK_PHOTO = "../images/daily-task-photos/" + PHOTO_FOLDER.split("/")[3] + "/1.jpg";

      function loadTilePhoto(tile, task, emojiEl) {
        const slug = slugify(task.text);
        tile.style.opacity = "0";
        let extIdx = 0;
        function tryExt() {
          if (extIdx >= photoExts.length) {
            const fb = new Image();
            fb.onload = () => {
              tile.style.backgroundImage = "url(" + FALLBACK_PHOTO + ")";
              tile.style.backgroundSize = "cover";
              tile.style.backgroundPosition = "center";
              tile.style.opacity = "1";
              if (emojiEl) emojiEl.style.display = "none";
            };
            fb.onerror = () => { tile.style.opacity = "1"; };
            fb.src = FALLBACK_PHOTO;
            return;
          }
          const url = encodeURI(PHOTO_FOLDER + slug + "/" + "1" + photoExts[extIdx]);
          const img = new Image();
          img.onload = () => {
            tile.style.backgroundImage = "url(" + url + ")";
            tile.style.backgroundSize = "cover";
            tile.style.backgroundPosition = "center";
            tile.style.opacity = "1";
            if (emojiEl) emojiEl.style.display = "none";
          };
          img.onerror = () => { extIdx++; tryExt(); };
          img.src = url;
        }
        tryExt();
      }

      function loadTasks() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved);
        } catch (e) { console.error("Gagal memuat data:", e); }
        return [
          { id: 1, text: "Kiwi", done: false },

          { id: 88, text: "One Punch Man: Pria Terkuat - CHT", done: false },
        ];
      }

      function saveTasks() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
        catch (e) { console.error("Gagal menyimpan data:", e); }
      }

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      let tasks = loadTasks();

      const todoList = document.getElementById("todoList");
      const emptyState = document.getElementById("emptyState");
      const taskInput = document.getElementById("taskInput");

      function render() {
        saveTasks();
        todoList.innerHTML = "";
        if (tasks.length === 0) {
          emptyState.style.display = "block";
          return;
        }
        emptyState.style.display = "none";

        tasks.forEach((task) => {
          const item = document.createElement("div");
          item.className = "todo-item" + (task.done ? " done" : "");

          const tile = document.createElement("div");
          tile.className = "todo-card " + gradientFor(task.id);

          const emoji = document.createElement("span");
          emoji.className = "todo-emoji";
          emoji.textContent = emojiFor(task.id);
          tile.appendChild(emoji);

          loadTilePhoto(tile, task, emoji);

          const text = document.createElement("div");
          text.className = "todo-text";
          text.textContent = task.text;

          item.appendChild(tile);
          item.appendChild(text);

          item.addEventListener("click", () => {
            if (!task.done) {
              task.done = true;
              tasks = tasks.filter((t) => t.id !== task.id);
              tasks.push(task);
            } else {
              task.done = false;
              tasks = tasks.filter((t) => t.id !== task.id);
              const firstDoneIndex = tasks.findIndex((t) => t.done);
              if (firstDoneIndex === -1) {
                tasks.push(task);
              } else {
                tasks.splice(firstDoneIndex, 0, task);
              }
            }
            render();
          });

          todoList.appendChild(item);
        });
      }

      function addTask() {
        const text = taskInput.value.trim();
        if (!text) return;
        const firstDoneIndex = tasks.findIndex((t) => t.done);
        const newTask = { id: Date.now(), text, done: false };
        if (firstDoneIndex === -1) {
          tasks.push(newTask);
        } else {
          tasks.splice(firstDoneIndex, 0, newTask);
        }
        taskInput.value = "";
        render();
      }

      taskInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTask();
      });

      render();
    </script>
  </body>
</html>
