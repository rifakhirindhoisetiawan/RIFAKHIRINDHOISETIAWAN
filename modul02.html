<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List Grid Gradient</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        min-height: 100vh;
        background: #ffffff;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .container {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        position: relative;
        padding-bottom: 70px;
      }

      /* ===== TODO CONTAINER (GRID SYSTEM) ===== */
      .todo-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 24px 18px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px 12px;
        align-content: start;
      }

      @media (max-width: 480px) {
        .todo-wrap {
          grid-template-columns: repeat(4, 1fr);
          gap: 18px 8px;
        }
      }

      .todo-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      .todo-item:hover {
        transform: translateY(-2px);
      }

      .todo-item input[type="checkbox"] {
        display: none;
      }

      /* ===== KOTAK ICON GRADIENT ===== */
      .checkbox-box {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 8px;
        position: relative;
        transition: all 0.3s ease;
      }

      .todo-text {
        font-size: 11px;
        font-weight: 700;
        color: #1f2937;
        line-height: 1.3;
        transition: 0.2s;
      }

      /* Palet Warna Gradient Sesuai Referensi */
      .g-blue {
        background: linear-gradient(135deg, #60a5fa, #6366f1);
        box-shadow: 0 6px 14px rgba(99, 102, 241, 0.35);
      }
      .g-pink {
        background: linear-gradient(135deg, #f472b6, #ec4899);
        box-shadow: 0 6px 14px rgba(236, 72, 153, 0.35);
      }
      .g-green {
        background: linear-gradient(135deg, #34d399, #10b981);
        box-shadow: 0 6px 14px rgba(16, 185, 129, 0.35);
      }
      .g-orange {
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        box-shadow: 0 6px 14px rgba(245, 158, 11, 0.35);
      }
      .g-purple {
        background: linear-gradient(135deg, #a78bfa, #8b5cf6);
        box-shadow: 0 6px 14px rgba(139, 92, 246, 0.35);
      }
      .g-teal {
        background: linear-gradient(135deg, #2dd4bf, #14b8a6);
        box-shadow: 0 6px 14px rgba(20, 184, 166, 0.35);
      }
      .g-cyan {
        background: linear-gradient(135deg, #22d3ee, #06b6d4);
        box-shadow: 0 6px 14px rgba(6, 182, 212, 0.35);
      }
      .g-red {
        background: linear-gradient(135deg, #f87171, #ef4444);
        box-shadow: 0 6px 14px rgba(239, 68, 68, 0.35);
      }

      /* ===== OTOMATIS KE BELAKANG SAAT DIKLIK ===== */
      .todo-item:has(input[type="checkbox"]:checked) {
        order: 999;
      }

      .todo-item input[type="checkbox"]:checked + .checkbox-box {
        background: #94a3b8 !important;
        box-shadow: none !important;
        color: #ffffff;
      }

      .todo-item:has(input[type="checkbox"]:checked) .todo-text {
        color: #94a3b8;
      }

      /* ===== TOMBOL RESET DI BAWAH (TANPA GARIS) ===== */
      .reset-container {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 12px 18px;
        background: #ffffff;
        border-top: none;
      }

      .btn-reset {
        width: 100%;
        padding: 12px;
        background: #f1f5f9;
        color: #64748b;
        border: none;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
      }

      .btn-reset:hover {
        background: #e2e8f0;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="todo-wrap" id="todoWrap">
        <label class="todo-item">
          <input type="checkbox" class="todo-checkbox" />
          <div class="checkbox-box g-blue">
            <span class="icon-symbol">1</span>
          </div>
          <span class="todo-text">Stok Opname</span>
        </label>

        <label class="todo-item">
          <input type="checkbox" class="todo-checkbox" />
          <div class="checkbox-box g-pink">
            <span class="icon-symbol">2</span>
          </div>
          <span class="todo-text">Lapor Bug</span>
        </label>

        <label class="todo-item">
          <input type="checkbox" class="todo-checkbox" />
          <div class="checkbox-box g-orange">
            <span class="icon-symbol">3</span>
          </div>
          <span class="todo-text">Arah Driver</span>
        </label>

        <label class="todo-item">
          <input type="checkbox" class="todo-checkbox" />
          <div class="checkbox-box g-cyan">
            <span class="icon-symbol">4</span>
          </div>
          <span class="todo-text">E-mail</span>
        </label>

        <label class="todo-item">
          <input type="checkbox" class="todo-checkbox" />
          <div class="checkbox-box g-purple">
            <span class="icon-symbol">5</span>
          </div>
          <span class="todo-text">Input Cacat</span>
        </label>

        <label class="todo-item">
          <input type="checkbox" class="todo-checkbox" />
          <div class="checkbox-box g-orange">
            <span class="icon-symbol">6</span>
          </div>
          <span class="todo-text">Foto Bukti</span>
        </label>

        <label class="todo-item">
          <input type="checkbox" class="todo-checkbox" />
          <div class="checkbox-box g-blue">
            <span class="icon-symbol">7</span>
          </div>
          <span class="todo-text">Ambil Diskon</span>
        </label>

        <label class="todo-item">
          <input type="checkbox" class="todo-checkbox" />
          <div class="checkbox-box g-green">
            <span class="icon-symbol">8</span>
          </div>
          <span class="todo-text">Terima Barang</span>
        </label>
      </div>

      <div class="reset-container">
        <button class="btn-reset" id="resetBtn">Reset</button>
      </div>
    </div>

    <script>
      const resetBtn = document.getElementById("resetBtn");
      const checkboxes = document.querySelectorAll(".todo-checkbox");

      resetBtn.addEventListener("click", () => {
        checkboxes.forEach((cb) => {
          cb.checked = false;
        });
      });
    </script>
  </body>
</html>
