<!doctype html>

<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Modul 02 - To-Do List Grid Gradient</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
      }

      /* ===== CONTAINER (mirip .phone di style guide) ===== */
      .container {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        position: relative;
        margin: 0 auto;
      }

      @media (min-width: 800px) {
        .container {
          max-width: 800px;
        }
      }

      .hidden {
        display: none !important;
      }

      /* ===== MENU VIEW ===== */
      .menu-view {
        flex: 1;
        overflow-y: auto;
        padding: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      /* ===== SECTION TITLE (mirip .section-label) ===== */
      .section-title {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
        padding: 0 18px 0 22px;
        max-width: 800px;
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        box-sizing: border-box;
      }

      /* ===== MENU GRID (mirip .grid) ===== */
      .menu-grid,
      .todo-wrap {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px 12px;
        align-content: start;
        padding: 4px 18px 24px 22px;
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
      }

      @media (min-width: 768px) {
        .menu-grid,
        .todo-wrap {
          gap: 28px 20px;
        }
      }

      /* ===== MENU / TODO ITEM (mirip .item) ===== */
      .menu-item,
      .todo-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
        text-decoration: none;
      }

      .menu-item:hover .menu-box,
      .menu-item:hover .menu-logo,
      .todo-item:hover .checkbox-box {
        transform: translateY(-3px);
      }

      /* ===== ICON TILE (mirip .icon-tile) ===== */
      .menu-box,
      .checkbox-box {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 8px;
        position: relative;
        overflow: hidden;
        transition: transform 0.2s ease;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      }

      @media (min-width: 768px) {
        .menu-box,
        .checkbox-box {
          width: 72px;
          height: 72px;
          border-radius: 18px;
          font-size: 24px;
        }
      }

      /* ===== LOGO IMAGE (kotak rounded, sama seperti menu-box) ===== */
      .menu-logo {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        object-fit: cover;
        margin-bottom: 8px;
        display: block;
        box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
        transition: transform 0.2s ease;
      }

      @media (min-width: 768px) {
        .menu-logo {
          width: 72px;
          height: 72px;
          border-radius: 18px;
        }
      }

      /* Coming soon item (mirip .item tanpa active-modul) */
      .menu-item[style*="opacity"] .menu-box {
        opacity: 0.55;
        box-shadow: none;
      }

      .menu-text,
      .todo-text {
        font-size: 11px;
        font-weight: 700;
        color: #1f2937;
        letter-spacing: 0.5px;
        line-height: 1.3;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (min-width: 768px) {
        .menu-text,
        .todo-text {
          font-size: 12px;
        }
      }

      /* ===== SOON BADGE (mirip .soon-tag) ===== */
      .soon-badge {
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        border: 1px solid #eceff3;
        border-radius: 999px;
        font-size: 7.5px;
        font-weight: 800;
        color: #9aa0ab;
        padding: 1px 6px;
        white-space: nowrap;
        text-transform: uppercase;
      }

      @media (min-width: 768px) {
        .soon-badge {
          font-size: 9px;
          padding: 2px 8px;
        }
      }

      /* ===== GRADIENT PALETTE (diselaraskan dengan style guide g-a s/d g-h) ===== */
      .g-1 {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa); /* g-b */
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      }
      .g-2 {
        background: linear-gradient(135deg, #f472b6, #ec4899);
        box-shadow: 0 8px 20px rgba(236, 72, 153, 0.35);
      }
      .g-3 {
        background: linear-gradient(135deg, #6ee7b7, #34d399); /* g-e */
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      }
      .g-4 {
        background: linear-gradient(135deg, #fcd34d, #fbbf24); /* g-f */
        box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
      }
      .g-5 {
        background: linear-gradient(135deg, #a5b4fc, #818cf8); /* g-a */
        box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
      }
      .g-6 {
        background: linear-gradient(135deg, #67e8f9, #22d3ee); /* g-d */
        box-shadow: 0 8px 20px rgba(20, 184, 166, 0.35);
      }
      .g-7 {
        background: linear-gradient(135deg, #93c5fd, #60a5fa); /* g-c */
        box-shadow: 0 8px 20px rgba(6, 182, 212, 0.35);
      }
      .g-8 {
        background: linear-gradient(135deg, #fca5a5, #f87171); /* g-g */
        box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
      }
    </style>
  </head>
