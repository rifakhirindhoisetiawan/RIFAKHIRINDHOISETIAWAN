<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>MYLOVE</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        position: relative;
      }

      @media (min-width: 800px) {
        .phone {
          max-width: 800px;
          margin: 0 auto;
        }
      }

      /* ===== SEARCH ROW ===== */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }
      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px 14px;
        color: #222;
        font-size: 14px;
        background: #f9f9f9;
      }
      .search-box:focus-within {
        border-color: #888;
        background: #fff;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: #222;
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }
      .search-box input::placeholder {
        color: #c3c8d1;
      }
      .search-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
        width: 18px;
        height: 18px;
      }

      /* ===== MENU GRID ===== */
      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 4px 18px 24px 22px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px 10px;
      }

      @media (min-width: 768px) {
        .grid {
          gap: 22px 14px;
        }
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: default;
        background: none;
        border: none;
      }

      .icon-tile {
        width: 100%;
        max-width: 110px;
        aspect-ratio: 9 / 16;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        margin-bottom: 8px;
        color: #fff;
        position: relative;
        opacity: 0.55;
        background-size: cover;
        background-position: center;
      }
      .icon-tile .tile-icon {
        display: block;
        z-index: 1;
        pointer-events: none;
      }
      .icon-tile.has-photo {
        opacity: 1;
      }
      .icon-tile.has-photo .tile-icon {
        display: none;
      }

      @media (max-width: 360px) {
        .icon-tile {
          max-width: 95px;
          border-radius: 14px;
        }
      }

      .item.active-modul {
        cursor: pointer;
        text-decoration: none;
      }
      .item.active-modul .icon-tile {
        opacity: 1;
      }
      .item.active-modul span {
        color: #1f2937;
        font-weight: 800;
      }

      .item span {
        font-size: 11px;
        font-weight: 700;
        color: #b6bac2;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      @media (min-width: 768px) {
        .item span {
          font-size: 12px;
        }
      }

      /* ===== PALET GRADIENT ===== */
      .g-a {
        background: linear-gradient(135deg, #a5b4fc, #818cf8);
      }
      .g-b {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      }
      .g-c {
        background: linear-gradient(135deg, #93c5fd, #60a5fa);
      }
      .g-d {
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
      }
      .g-e {
        background: linear-gradient(135deg, #6ee7b7, #34d399);
      }
      .g-f {
        background: linear-gradient(135deg, #fcd34d, #fbbf24);
      }
      .g-g {
        background: linear-gradient(135deg, #fca5a5, #f87171);
      }
      .g-h {
        background: linear-gradient(135deg, #f0abfc, #e879f9);
      }

      .empty-msg {
        grid-column: 1 / -1;
        text-align: center;
        color: #9aa0ab;
        font-size: 13px;
        padding: 40px 0;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="Cari periode..."
            oninput="renderGrid()"
          />
        </div>
      </div>

      <div class="menu-wrap">
        <div class="grid" id="homeGrid"></div>
      </div>
    </div>

    <script>
      const periods = [
        { name: "HARI", icon: "☀️", cls: "g-a", href: "utility/hari.html", slug: "hari" },
        { name: "MINGGU", icon: "📅", cls: "g-b", href: "utility/minggu.html", slug: "minggu" },
        { name: "BULAN", icon: "🌙", cls: "g-c", href: "utility/bulan.html", slug: "bulan" },
      ];

      const homeGrid = document.getElementById("homeGrid");
      const searchInput = document.getElementById("searchInput");

      function renderGrid() {
        const q = searchInput.value.trim().toLowerCase();
        const filtered = periods.filter((p) => p.name.toLowerCase().includes(q));

        if (filtered.length === 0) {
          homeGrid.innerHTML =
            '<div class="empty-msg">Tidak ditemukan</div>';
          return;
        }

        homeGrid.innerHTML = filtered
          .map(
            (p) => `
              <a class="item active-modul" href="${p.href}">
                <div class="icon-tile ${p.cls}" data-slug="${p.slug}"><span class="tile-icon">${p.icon}</span></div>
                <span>${p.name}</span>
              </a>
            `,
          )
          .join("");

        loadPeriodPhotos();
      }

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          loadPeriodPhotos();
        }
      });

      function loadPeriodPhotos() {
        const dayNames = ['minggu', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu'];
        const monthNames = ['januari', 'februari', 'maret', 'april', 'mei', 'juni', 'juli', 'agustus', 'september', 'oktober', 'november', 'desember'];

        const now = new Date();
        const dayName = dayNames[now.getDay()];
        const monthName = monthNames[now.getMonth()];

        document.querySelectorAll('.icon-tile[data-slug]').forEach((tile) => {
          const slug = tile.dataset.slug;
          let baseFolder = '';

          if (slug === 'hari') {
            baseFolder = `images/modul02-photos/hari/`;
          } else if (slug === 'minggu') {
            baseFolder = `images/modul02-photos/minggu/`;
          } else if (slug === 'bulan') {
            baseFolder = `images/modul02-photos/bulan/`;
          }

          const folders = [baseFolder];
          let folderIndex = 0;
          let itemFolders = [];
          let itemIndex = 0;
          const exts = ['.jpg', '.jpeg', '.png', '.svg', '.webp'];
          let extIndex = 0;

          function tryFolder() {
            if (folderIndex >= folders.length) {
              tile.style.backgroundImage = '';
              tile.classList.remove('has-photo');
              tile.style.opacity = '0.55';
              return;
            }

            const folder = folders[folderIndex];
            const num = Math.floor(Math.random() * 20) + 1;

            const img = new Image();
            img.onload = () => {
              tile.style.backgroundImage = `url(${folder}${num}.jpg)`;
              tile.style.backgroundSize = 'cover';
              tile.style.backgroundPosition = 'center';
              tile.classList.add('has-photo');
              tile.style.opacity = '1';
            };
            img.onerror = () => {
              folderIndex++;
              tryFolder();
            };
            img.src = `${folder}${num}.jpg`;
          }

          // Try to get item folders list first
          const xhr = new XMLHttpRequest();
          xhr.open('GET', baseFolder, true);
          xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
              if (xhr.status === 200 || xhr.status === 0) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(xhr.responseText, 'text/html');
                const links = doc.querySelectorAll('a');
                itemFolders = Array.from(links)
                  .map(a => a.getAttribute('href'))
                  .filter(href => href && href !== '../' && !href.includes('.'));
                
                if (itemFolders.length > 0) {
                  const randomItem = itemFolders[Math.floor(Math.random() * itemFolders.length)];
                  folders[0] = baseFolder + randomItem + '/';
                }
              }
              tryFolder();
            }
          };
          xhr.send();
        });
      }

      renderGrid();
    </script>
  </body>
</html>
