<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modul 02 - To-Do List Grid Gradient</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        width: 100vw;
        height: 100vh;
        max-width: 800px;
        max-height: 100vh;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        border: none;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        margin: 0 auto;
      }

      .hidden {
        display: none !important;
      }

      /* ===== MENU VIEW ===== */
      .menu-view {
        flex: 1;
        overflow-y: auto;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
        width: 100%;
      }

      /* ===== SEARCH BOX ===== */
      .search-box-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px 14px;
        margin: 0 auto;
        width: 100%;
        max-width: 800px;
        background: transparent;
        border: none;
        border-radius: 0;
      }

      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e3e6ec;
        border-radius: 14px;
        padding: 12px 14px;
        color: #1f2937;
        font-size: 13px;
        background: #fafbfc;
      }

      .search-input {
        width: 100%;
        padding: 0;
        border: none;
        border-radius: 0;
        font-size: 13px;
        font-weight: 400;
        font-family: inherit;
        color: #1f2937;
        outline: none;
        background: transparent;
      }

      .search-input::placeholder {
        color: #c3c8d1;
        opacity: 1;
      }

      .search-icon {
        width: 18px;
        height: 18px;
        color: #c3c8d1;
        flex-shrink: 0;
        display: block;
      }

      /* ===== SECTION TITLE ===== */
      .section-title {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
        padding: 0 18px 0 22px;
        width: 100%;
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
        box-sizing: border-box;
      }

      /* ===== MENU GRID & TODO WRAP ===== */
      .menu-grid,
      .todo-wrap {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px 12px;
        align-content: start;
        padding: 4px 18px 24px 22px;
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
      }

      @media (min-width: 768px) {
        .menu-grid,
        .todo-wrap {
          gap: 28px 20px;
        }
      }

      .menu-item,
      .todo-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        transition: transform 0.2s ease;
        border: none;
        background: none;
        padding: 0;
      }

      .menu-item:hover,
      .todo-item:hover {
        transform: translateY(-3px);
      }

      .menu-box,
      .checkbox-box {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 8px;
        position: relative;
        overflow: hidden;
      }

      @media (min-width: 768px) {
        .menu-box,
        .checkbox-box {
          width: 72px;
          height: 72px;
          border-radius: 18px;
          font-size: 24px;
        }
      }

      .menu-text,
      .todo-text {
        font-size: 11px;
        font-weight: 700;
        color: #1f2937;
        letter-spacing: 0.5px;
        line-height: 1.3;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (min-width: 768px) {
        .menu-text,
        .todo-text {
          font-size: 12px;
        }
      }

      .soon-badge {
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        border: 1px solid #eceff3;
        border-radius: 999px;
        font-size: 7.5px;
        font-weight: 800;
        color: #9aa0ab;
        padding: 1px 6px;
        white-space: nowrap;
        text-transform: uppercase;
      }

      @media (min-width: 768px) {
        .soon-badge {
          font-size: 9px;
          padding: 2px 8px;
        }
      }

      /* ===== CONTENT VIEW HEADER ===== */
      .content-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .content-header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 22px 18px 10px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .back-btn {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #e3e6ec;
        background: #fafbfc;
        border-radius: 14px;
        cursor: pointer;
        padding: 0;
        color: #1f2937;
        flex-shrink: 0;
        transition: background 0.2s;
      }

      .back-btn:hover {
        background: #f1f5f9;
      }

      .back-btn svg {
        width: 18px;
        height: 18px;
        color: #c3c8d1;
        display: block;
      }

      .content-title {
        font-size: 15px;
        font-weight: 800;
        color: #1f2937;
        flex: 1;
      }

      .todo-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 4px 18px 90px 22px;
      }

      .todo-item input[type="checkbox"] {
        display: none;
      }

      .todo-item:has(input[type="checkbox"]:checked) {
        order: 999;
      }

      /* ===== GRADIENT PALETTE ===== */
      .g-1 {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa);
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      }
      .g-2 {
        background: linear-gradient(135deg, #f472b6, #ec4899);
        box-shadow: 0 8px 20px rgba(236, 72, 153, 0.35);
      }
      .g-3 {
        background: linear-gradient(135deg, #6ee7b7, #34d399);
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      }
      .g-4 {
        background: linear-gradient(135deg, #fcd34d, #fbbf24);
        box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
      }
      .g-5 {
        background: linear-gradient(135deg, #a5b4fc, #818cf8);
        box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
      }
      .g-6 {
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
        box-shadow: 0 8px 20px rgba(20, 184, 166, 0.35);
      }
      .g-7 {
        background: linear-gradient(135deg, #93c5fd, #60a5fa);
        box-shadow: 0 8px 20px rgba(6, 182, 212, 0.35);
      }
      .g-8 {
        background: linear-gradient(135deg, #fca5a5, #f87171);
        box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
      }

      .todo-item input[type="checkbox"]:checked + .checkbox-box {
        background: #b6bac2 !important;
        box-shadow: none !important;
        opacity: 0.55;
      }

      .todo-item input[type="checkbox"]:checked ~ .todo-text {
        color: #b6bac2 !important;
      }

      /* ===== MODAL & ACTION BUTTONS ===== */
      .reset-container {
        position: absolute;
        bottom: 20px;
        left: 18px;
        right: 18px;
        display: flex;
        gap: 12px;
        max-width: 800px;
        margin: 0 auto;
        width: calc(100% - 36px);
      }

      .btn-reset,
      .btn-add {
        flex: 1;
        padding: 14px 18px;
        border: none;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .btn-reset {
        background: #fafbfc;
        border: 1px solid #e3e6ec;
        color: #9aa0ab;
      }

      .btn-reset:hover {
        background: #f1f5f9;
        color: #1f2937;
      }

      .btn-add {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa);
        color: #fff;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      }

      .btn-add:hover {
        transform: translateY(-2px);
      }

      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        justify-content: center;
        align-items: center;
        z-index: 999;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal-box {
        background: #fff;
        border-radius: 18px;
        padding: 24px;
        width: 90%;
        max-width: 340px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      }

      .modal-title {
        font-size: 15px;
        font-weight: 800;
        color: #1f2937;
        margin-bottom: 16px;
      }

      .modal-input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #e3e6ec;
        border-radius: 14px;
        font-size: 13px;
        outline: none;
        margin-bottom: 16px;
        color: #1f2937;
        background: #fafbfc;
      }

      .modal-input:focus {
        border-color: #a78bfa;
      }

      .modal-buttons {
        display: flex;
        gap: 8px;
      }

      .modal-btn {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .modal-btn-cancel {
        background: #fafbfc;
        border: 1px solid #e3e6ec;
        color: #9aa0ab;
      }
      .modal-btn-submit {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- MENU VIEW -->
      <div class="menu-view" id="menuView">
        <div class="search-box-wrap">
          <div class="search-box">
            <svg
              class="search-icon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
            <input
              type="text"
              class="search-input"
              id="searchAppInput"
              placeholder="Cari judul aplikasi..."
              autocomplete="off"
            />
          </div>
        </div>
        <div class="section-title">Modul Tersedia</div>
        <div class="menu-grid" id="menuGrid">
          <button class="menu-item" id="goToModul1" data-name="Modul 1">
            <div class="menu-box g-1">1</div>
            <span class="menu-text">Modul 1</span>
          </button>
          <button class="menu-item" id="goToModul2" data-name="Modul 2">
            <div class="menu-box g-2">2</div>
            <span class="menu-text">Modul 2</span>
          </button>
          <button class="menu-item" id="goToModul3" data-name="Modul 3">
            <div class="menu-box g-3">3</div>
            <span class="menu-text">Modul 3</span>
          </button>
          <button
            class="menu-item"
            data-name="Modul 4"
            style="opacity: 0.55; cursor: default"
          >
            <div class="menu-box g-4">
              +
              <span class="soon-badge">soon</span>
            </div>
            <span class="menu-text" style="color: #b6bac2">Modul 4</span>
          </button>
        </div>
      </div>

      <!-- CONTENT VIEW -->
      <div id="contentView" class="content-view hidden">
        <div class="content-header">
          <button class="back-btn" id="backBtn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>
          <div class="content-title" id="contentTitle">Modul 02</div>
        </div>
        <div class="todo-wrap" id="todoWrap"></div>
        <div class="reset-container">
          <button class="btn-reset" id="resetBtn">Reset</button>
          <button class="btn-add" id="addBtn">+</button>
        </div>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <div class="modal-title">Tambah Item Baru</div>
        <input
          type="text"
          class="modal-input"
          id="itemInput"
          placeholder="Nama item..."
          autocomplete="off"
        />
        <div class="modal-buttons">
          <button class="modal-btn modal-btn-cancel" id="cancelBtn">
            Batal
          </button>
          <button class="modal-btn modal-btn-submit" id="submitBtn">
            Simpan
          </button>
        </div>
      </div>
    </div>

    <script>
      const defaultModul1 = [
        "Wa",
        "Notion",
        "Al-Quran",
        "Digimon",
        "Email",
        "Chrome",
        "Play Store",
        "YouTube",
        "Kontak",
        "Mihon",
        "Drive",
        "One Punch Man Cina",
        "Files",
        "Galeri",
        "Akulaku",
        "Bibit",
        "Kredivo",
        "Dana",
        "Shopee Pay",
        "One Punch Man Obt",
        "Sea Bank",
        "Chorome",
        "Rider Chek",
        "Gmail",
        "Pinterest",
        "Wa Business",
        "Rapikan Catatan",
        "Google Foto",
        "Rapikan Aplikasi",
        "Instagram",
        "Tiktok",
        "Aladin",
      ];
      const defaultModul2 = [
        "Tugas 1",
        "Tugas 2",
        "Laporan",
        "Evaluasi",
        "Belajar",
        "Coding",
      ];
      const defaultModul3 = ["Item A", "Item B", "Item C", "Item D"];

      let currentModule = null;
      let todoData = [];

      const menuView = document.getElementById("menuView");
      const contentView = document.getElementById("contentView");
      const goToModul1 = document.getElementById("goToModul1");
      const goToModul2 = document.getElementById("goToModul2");
      const goToModul3 = document.getElementById("goToModul3");
      const searchAppInput = document.getElementById("searchAppInput");
      const todoWrap = document.getElementById("todoWrap");
      const resetBtn = document.getElementById("resetBtn");
      const addBtn = document.getElementById("addBtn");
      const backBtn = document.getElementById("backBtn");
      const modalOverlay = document.getElementById("modalOverlay");
      const cancelBtn = document.getElementById("cancelBtn");
      const submitBtn = document.getElementById("submitBtn");
      const itemInput = document.getElementById("itemInput");

      searchAppInput.addEventListener("input", (e) => {
        const keyword = e.target.value.toLowerCase().trim();
        const menuItems = document.querySelectorAll(".menu-grid .menu-item");
        menuItems.forEach((item) => {
          const text = item.getAttribute("data-name").toLowerCase();
          item.classList.toggle("hidden", !text.includes(keyword));
        });
      });

      function getStoredData(modulKey) {
        const storageKey = `todo_app_data_${modulKey}`;
        let defaultData = defaultModul2;
        if (modulKey === "modul1") defaultData = defaultModul1;
        else if (modulKey === "modul3") defaultData = defaultModul3;

        const data = localStorage.getItem(storageKey);
        return data
          ? JSON.parse(data)
          : defaultData.map((text) => ({ text, checked: false }));
      }

      function saveData() {
        if (!currentModule) return;
        localStorage.setItem(
          `todo_app_data_${currentModule}`,
          JSON.stringify(todoData),
        );
      }

      function renderTodos() {
        todoWrap.innerHTML = "";
        todoData.forEach((item, index) => {
          const count = index + 1;
          const colorIndex = ((count - 1) % 8) + 1;
          const label = document.createElement("label");
          label.className = "todo-item";
          label.innerHTML = `<input type="checkbox" class="todo-checkbox" data-index="${index}" ${item.checked ? "checked" : ""} /><div class="checkbox-box g-${colorIndex}">${count}</div><span class="todo-text">${item.text}</span>`;
          const checkbox = label.querySelector(".todo-checkbox");
          checkbox.addEventListener("change", (e) => {
            todoData[index].checked = e.target.checked;
            saveData();
            renderTodos();
          });
          todoWrap.appendChild(label);
        });
      }

      function openModule(modulName, updateHistory = true) {
        currentModule = modulName;
        todoData = getStoredData(modulName);
        document.getElementById("contentTitle").textContent =
          modulName === "modul1"
            ? "Modul 1"
            : modulName === "modul2"
              ? "Modul 02"
              : "Modul 3";
        menuView.classList.add("hidden");
        contentView.classList.remove("hidden");
        renderTodos();
        if (updateHistory)
          history.pushState({ module: modulName }, "", `#${modulName}`);
      }

      goToModul1.addEventListener("click", () => openModule("modul1"));
      goToModul2.addEventListener("click", () => openModule("modul2"));
      goToModul3.addEventListener("click", () => openModule("modul3"));

      backBtn.addEventListener("click", () => {
        contentView.classList.add("hidden");
        menuView.classList.remove("hidden");
        currentModule = null;
        history.pushState(null, "", "#");
      });

      window.addEventListener("popstate", (e) => {
        if (e.state && e.state.module) {
          openModule(e.state.module, false);
        } else {
          contentView.classList.add("hidden");
          menuView.classList.remove("hidden");
          currentModule = null;
        }
      });

      window.addEventListener("DOMContentLoaded", () => {
        const hash = window.location.hash.replace("#", "");
        if (hash === "modul1" || hash === "modul2" || hash === "modul3")
          openModule(hash, false);
      });

      resetBtn.addEventListener("click", () => {
        todoData.forEach((item) => (item.checked = false));
        saveData();
        renderTodos();
      });

      addBtn.addEventListener("click", () => {
        modalOverlay.classList.add("active");
        itemInput.value = "";
        itemInput.focus();
      });

      cancelBtn.addEventListener("click", () =>
        modalOverlay.classList.remove("active"),
      );
      modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) modalOverlay.classList.remove("active");
      });

      function addNewItem() {
        const text = itemInput.value.trim();
        if (!text) return;
        todoData.push({ text, checked: false });
        saveData();
        renderTodos();
        modalOverlay.classList.remove("active");
        todoWrap.scrollTop = todoWrap.scrollHeight;
      }

      submitBtn.addEventListener("click", addNewItem);
      itemInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") addNewItem();
      });
    </script>
  </body>
</html>
