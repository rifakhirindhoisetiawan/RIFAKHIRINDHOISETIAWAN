<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modul 02 - To-Do List Grid Gradient</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
      }

      /* ===== CONTAINER (mirip .phone di style guide) ===== */
      .container {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        position: relative;
        margin: 0 auto;
      }

      @media (min-width: 800px) {
        .container {
          max-width: 800px;
        }
      }

      .hidden {
        display: none !important;
      }

      /* ===== MENU VIEW ===== */
      .menu-view {
        flex: 1;
        overflow-y: auto;
        padding: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      /* ===== SEARCH ROW (mirip .search-row) ===== */
      .search-box-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e3e6ec;
        border-radius: 14px;
        padding: 12px 14px;
        color: #1f2937;
        font-size: 13px;
        background: #fafbfc;
      }

      .search-input {
        width: 100%;
        border: none;
        background: transparent;
        outline: none;
        font-size: 13px;
        font-family: inherit;
        color: #1f2937;
      }

      .search-input::placeholder {
        color: #c3c8d1;
        opacity: 1;
      }

      .search-icon {
        width: 18px;
        height: 18px;
        color: #c3c8d1;
        flex-shrink: 0;
        display: block;
      }

      /* ===== SECTION TITLE (mirip .section-label) ===== */
      .section-title {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
        padding: 0 18px 0 22px;
        max-width: 800px;
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        box-sizing: border-box;
      }

      /* ===== MENU GRID (mirip .grid) ===== */
      .menu-grid,
      .todo-wrap {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px 12px;
        align-content: start;
        padding: 4px 18px 24px 22px;
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
      }

      @media (min-width: 768px) {
        .menu-grid,
        .todo-wrap {
          gap: 28px 20px;
        }
      }

      /* ===== MENU / TODO ITEM (mirip .item) ===== */
      .menu-item,
      .todo-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        border: none;
        background: none;
        padding: 0;
        text-decoration: none;
      }

      .menu-item:hover .menu-box,
      .todo-item:hover .checkbox-box {
        transform: translateY(-3px);
      }

      /* ===== ICON TILE (mirip .icon-tile) ===== */
      .menu-box,
      .checkbox-box {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 8px;
        position: relative;
        overflow: hidden;
        transition: transform 0.2s ease;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      }

      @media (min-width: 768px) {
        .menu-box,
        .checkbox-box {
          width: 72px;
          height: 72px;
          border-radius: 18px;
          font-size: 24px;
        }
      }

      /* Coming soon item (mirip .item tanpa active-modul) */
      .menu-item[style*="opacity"] .menu-box {
        opacity: 0.55;
        box-shadow: none;
      }

      .menu-text,
      .todo-text {
        font-size: 11px;
        font-weight: 700;
        color: #1f2937;
        letter-spacing: 0.5px;
        line-height: 1.3;
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (min-width: 768px) {
        .menu-text,
        .todo-text {
          font-size: 12px;
        }
      }

      /* ===== SOON BADGE (mirip .soon-tag) ===== */
      .soon-badge {
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        border: 1px solid #eceff3;
        border-radius: 999px;
        font-size: 7.5px;
        font-weight: 800;
        color: #9aa0ab;
        padding: 1px 6px;
        white-space: nowrap;
        text-transform: uppercase;
      }

      @media (min-width: 768px) {
        .soon-badge {
          font-size: 9px;
          padding: 2px 8px;
        }
      }

      /* ===== GRADIENT PALETTE (diselaraskan dengan style guide g-a s/d g-h) ===== */
      .g-1 {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa); /* g-b */
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      }
      .g-2 {
        background: linear-gradient(135deg, #f472b6, #ec4899);
        box-shadow: 0 8px 20px rgba(236, 72, 153, 0.35);
      }
      .g-3 {
        background: linear-gradient(135deg, #6ee7b7, #34d399); /* g-e */
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      }
      .g-4 {
        background: linear-gradient(135deg, #fcd34d, #fbbf24); /* g-f */
        box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
      }
      .g-5 {
        background: linear-gradient(135deg, #a5b4fc, #818cf8); /* g-a */
        box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
      }
      .g-6 {
        background: linear-gradient(135deg, #67e8f9, #22d3ee); /* g-d */
        box-shadow: 0 8px 20px rgba(20, 184, 166, 0.35);
      }
      .g-7 {
        background: linear-gradient(135deg, #93c5fd, #60a5fa); /* g-c */
        box-shadow: 0 8px 20px rgba(6, 182, 212, 0.35);
      }
      .g-8 {
        background: linear-gradient(135deg, #fca5a5, #f87171); /* g-g */
        box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- MENU VIEW -->
      <div class="menu-view" id="menuView">
        <div class="search-box-wrap">
          <div class="search-box">
            <svg
              class="search-icon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
            <input
              type="text"
              class="search-input"
              id="searchAppInput"
              placeholder="Cari judul aplikasi..."
              autocomplete="off"
            />
          </div>
        </div>
        <div class="section-title">Modul Tersedia</div>
        <div class="menu-grid" id="menuGrid">
          <a
            class="menu-item"
            id="goToModul1"
            data-name="Minggu"
            href="minggu.html"
          >
            <div class="menu-box g-1">1</div>
            <span class="menu-text">Minggu</span>
          </a>
          <a
            class="menu-item"
            id="goToModul2"
            data-name="Hari"
            href="hari.html"
          >
            <div class="menu-box g-2">2</div>
            <span class="menu-text">Hari</span>
          </a>
          <a
            class="menu-item"
            id="goToModul3"
            data-name="Bulan"
            href="bulan.html"
          >
            <div class="menu-box g-3">3</div>
            <span class="menu-text">Bulan</span>
          </a>
          <button
            class="menu-item"
            data-name="Modul 4"
            style="opacity: 0.55; cursor: default"
          >
            <div class="menu-box g-4">
              +
              <span class="soon-badge">soon</span>
            </div>
            <span class="menu-text" style="color: #b6bac2">Modul 4</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      const searchAppInput = document.getElementById("searchAppInput");

      searchAppInput.addEventListener("input", (e) => {
        const keyword = e.target.value.toLowerCase().trim();
        const menuItems = document.querySelectorAll(".menu-grid .menu-item");
        menuItems.forEach((item) => {
          const text = item.getAttribute("data-name").toLowerCase();
          item.classList.toggle("hidden", !text.includes(keyword));
        });
      });
    </script>
  </body>
</html>
