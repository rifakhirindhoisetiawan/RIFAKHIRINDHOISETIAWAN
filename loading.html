<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>MYLOVE</title>
    <meta content="#ffffff" name="theme-color" />
    <meta content="yes" name="mobile-web-app-capable" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta
      content="black-translucent"
      name="apple-mobile-web-app-status-bar-style"
    />
    <!-- Fallback kalau JS mati -->
    <meta http-equiv="refresh" content="2;url=index.html" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        height: 100dvh;
        width: 100%;
        background: #ffffff;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }

      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        background: #ffffff;
        padding: 0 24px;
        padding-top: env(safe-area-inset-top);
        padding-bottom: max(48px, env(safe-area-inset-bottom));
      }

      .load-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
        max-width: 320px;
      }

      /* Icon foto di samping loading */
      .icon-photo {
        flex-shrink: 0;
        width: 50px;
        height: 50px;
        border-radius: 14px;
        overflow: hidden;
        background: linear-gradient(135deg, #a5b4fc, #6366f1);
        box-shadow: 0 10px 24px rgba(99, 102, 241, 0.3);
      }

      .icon-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .load-col {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .brand {
        font-family:
          "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial,
          sans-serif;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #1f2937;
      }

      .caption {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: #9aa0ab;
      }

    </style>
  </head>
  <body>
    <script>
      window.location.replace("./index.html");
    </script>
  </body>
</html>
