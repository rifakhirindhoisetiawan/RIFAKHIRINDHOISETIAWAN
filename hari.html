<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYLOVE</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
        overflow: hidden;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* ===== SEARCH ROW ===== */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px 14px;
        color: #222;
        font-size: 14px;
        background: #f9f9f9;
      }
      .search-box:focus-within {
        border-color: #888;
        background: #fff;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: #222;
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }
      .search-box input::placeholder {
        color: #c3c8d1;
      }
      .search-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
        width: 18px;
        height: 18px;
      }

      /* ===== MENU GRID ===== */
      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 4px 18px 20px 22px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .menu-wrap::-webkit-scrollbar {
        display: none;
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .todo-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px 10px;
      }

      @media (min-width: 768px) {
        .todo-list {
          grid-template-columns: repeat(3, 1fr);
          gap: 22px 14px;
        }
      }

      .todo-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        user-select: none;
        text-decoration: none;
      }

      .todo-card {
        width: 100%;
        max-width: 110px;
        aspect-ratio: 9 / 16;
        border-radius: 16px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        position: relative;
        opacity: 1;
        box-shadow: none;
        transition:
          transform 0.2s ease,
          opacity 0.3s ease,
          filter 0.3s ease;
      }

      .todo-emoji {
        font-size: 34px;
        line-height: 1;
      }

      @media (max-width: 360px) {
        .todo-card {
          max-width: 95px;
          border-radius: 14px;
        }
      }

      .todo-item:hover .todo-card {
        box-shadow: none;
      }
/* Saat diklik: warna pudar + turun */
      .todo-item.done .todo-card {
        opacity: 0.4;
        filter: grayscale(0.35);
        transform: translateY(6px) scale(0.94);
        box-shadow: none;
      }

      .todo-item.done:hover .todo-card {
        transform: translateY(6px) scale(0.94);
      }

      .todo-text {
        font-size: 11px;
        font-weight: 700;
        color: #1f2937;
        line-height: 1.3;
        transition: all 0.3s ease;
      }

      @media (min-width: 768px) {
        .todo-text {
          font-size: 12px;
        }
      }

      .todo-item.done .todo-text {
        opacity: 0.45;
        text-decoration: line-through;
        color: #b6bac2;
        font-weight: 700;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #9aa0ab;
      }
      .empty-state p {
        font-size: 13px;
        font-weight: 600;
        margin-top: 8px;
      }

      /* ===== PALET GRADIENT (sama seperti modul02) ===== */
      .g-a {
        background: linear-gradient(135deg, #a5b4fc, #818cf8);
      }
      .g-b {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      }
      .g-c {
        background: linear-gradient(135deg, #93c5fd, #60a5fa);
      }
      .g-d {
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
      }
      .g-e {
        background: linear-gradient(135deg, #6ee7b7, #34d399);
      }
      .g-f {
        background: linear-gradient(135deg, #fcd34d, #fbbf24);
      }
      .g-g {
        background: linear-gradient(135deg, #fca5a5, #f87171);
      }
      .g-h {
        background: linear-gradient(135deg, #f0abfc, #e879f9);
      }
    </style>

        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));

          const iconImg = item.querySelector(".todo-card");
          const tile = document.createElement("div");
          tile.className = "todo-card " + gradientFor(task.id);
          const emoji = document.createElement("span");
          emoji.className = "todo-emoji";
          emoji.textContent = emojiFor(task.id);
          iconImg.replaceWith(tile);
          tile.appendChild(emoji);

          // Klik → pudar + pindah ke paling bawah
          item.addEventListener("click", () => {
            if (!task.done) {
              task.done = true;
              tasks = tasks.filter((t) => t.id !== task.id);
              tasks.push(task);
            } else {
              task.done = false;
              tasks = tasks.filter((t) => t.id !== task.id);
              const firstDoneIndex = tasks.findIndex((t) => t.done);
              if (firstDoneIndex === -1) {
                tasks.push(task);
              } else {
                tasks.splice(firstDoneIndex, 0, task);
              }
            }
            render();
          });

          todoList.appendChild(item);
        });
      }

      function addTask() {
        const text = taskInput.value.trim();
        if (!text) return;
        const firstDoneIndex = tasks.findIndex((t) => t.done);
        const newTask = {
          id: Date.now(),
          text,
          done: false,
        };
        if (firstDoneIndex === -1) {
          tasks.push(newTask);
        } else {
          tasks.splice(firstDoneIndex, 0, newTask);
        }
        taskInput.value = "";
        render();
      }

      taskInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTask();
      });

      render();
