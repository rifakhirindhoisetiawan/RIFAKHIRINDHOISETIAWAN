<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <title>Photo Grid Maker</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        position: fixed;
        inset: 0;
        width: 100%;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        display: block;
        padding: 0;
        margin: 0;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        /* Ruang untuk bar bawah fixed (~64px + safe area) */
        --bottom-bar-h: 72px;
      }

      .app {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        /* Sisakan ruang untuk tombol fixed di bawah */
        padding-bottom: calc(
          var(--bottom-bar-h) + env(safe-area-inset-bottom, 0px)
        );
        box-sizing: border-box;
      }

      /* Layar sangat pendek (mobile landscape / browser UI tinggi) */
      @media (max-height: 520px) {
        body {
          --bottom-bar-h: 60px;
        }
        .stepper-row {
          padding: 4px 10px 2px;
        }
        .stepper {
          padding: 4px 8px;
        }
        .layout-picker {
          padding: 0 10px 2px;
        }
        .layout-btn {
          height: 24px;
          font-size: 9px;
        }
        .canvas-wrap {
          padding: 0 8px 4px;
        }
        .actions {
          padding: 6px 10px;
          padding-bottom: max(
            6px,
            calc(env(safe-area-inset-bottom, 0px) + 4px)
          );
        }
        .add-photo-btn,
        .trash-btn {
          width: 40px;
          height: 40px;
        }
        .btn-download {
          padding: 10px;
          font-size: 13px;
        }
      }

      @media (min-width: 768px) {
        html,
        body {
          height: auto;
          min-height: 100%;
          overflow: auto;
          position: static;
          inset: auto;
          width: auto;
        }
        body {
          display: flex;
          flex-direction: column;
          --bottom-bar-h: 0px;
        }
        .app {
          max-width: 800px;
          margin: 0 auto;
          height: auto;
          min-height: auto;
          position: relative;
          top: auto;
          left: auto;
          right: auto;
          bottom: auto;
          padding: 24px 0;
          padding-bottom: 24px;
        }
        .stepper-row {
          padding: 22px 20px 18px;
        }
        .stepper {
          padding: 10px 14px;
          border-radius: 16px;
        }
        .layout-picker {
          padding: 0 20px 12px;
        }
        .canvas-wrap {
          padding: 0 20px 16px;
        }
        .actions {
          position: relative;
          left: auto;
          right: auto;
          bottom: auto;
          max-width: 800px;
          margin: 0 auto;
          padding: 4px 20px 24px;
          box-shadow: none;
          z-index: 10;
        }
        .add-photo-btn,
        .trash-btn {
          width: 48px;
          height: 48px;
          border-radius: 16px;
        }
        .btn-download {
          padding: 14px;
          border-radius: 16px;
        }
      }

      /* ===== CONTROLS ROW ===== */
      .stepper-row {
        padding: 8px 12px 6px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        flex: 0 0 auto;
        flex-shrink: 0;
      }
      .stepper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1.5px solid #e3e6ec;
        border-radius: 14px;
        padding: 8px 10px;
        background: #fafbfc;
        gap: 6px;
      }
      .left-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
      }
      .left-controls::-webkit-scrollbar {
        display: none;
      }
      .stepper .value {
        font-size: 15px;
        font-weight: 800;
        color: #1f2937;
        min-width: 26px;
        text-align: center;
      }
      .stepper .btns {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
      }
      .step-btn {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, #60a5fa, #6366f1);
        color: #fff;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
      }
      .step-btn:disabled {
        background: #d9dde3;
        box-shadow: none;
        cursor: not-allowed;
      }

      .trash-btn {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, #f87171, #ef4444);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 14px rgba(239, 68, 68, 0.35);
        flex-shrink: 0;
      }
      .trash-btn:active {
        opacity: 0.85;
      }

      .add-photo-btn {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, #60a5fa, #6366f1);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 14px rgba(99, 102, 241, 0.35);
        flex-shrink: 0;
      }
      .add-photo-btn:active {
        opacity: 0.85;
      }

      .aspect-btn {
        height: 32px;
        padding: 0 10px;
        border-radius: 10px;
        border: 1.5px solid #e3e6ec;
        background: #ffffff;
        color: #6b7280;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        outline: none;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        transition: all 0.2s ease;
        flex-shrink: 0;
      }
      .aspect-btn:hover {
        border-color: #6366f1;
        color: #1f2937;
      }
      .aspect-btn.active {
        background: linear-gradient(135deg, #60a5fa, #6366f1);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
      }

      /* Panel Layout Khusus 3 Foto */
      .layout-picker {
        padding: 0 12px 4px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        display: none;
        gap: 6px;
        flex: 0 0 auto;
        flex-shrink: 0;
      }
      .layout-picker.show {
        display: flex;
      }
      .layout-btn {
        flex: 1;
        height: 28px;
        border-radius: 8px;
        border: 1.5px solid #e3e6ec;
        background: #ffffff;
        color: #6b7280;
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      .layout-btn.active {
        background: #6366f1;
        color: #fff;
        border-color: transparent;
      }

      /* ===== CANVAS AREA ===== */
      .canvas-wrap {
        padding: 0 12px 4px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .grid-frame {
        width: 100%;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 1 / 1;
        height: auto;
        border-radius: 0px;
        overflow: hidden;
        background: #f9fafb;
        display: grid;
        gap: 2px;
        padding: 0px;
        border: none;
        transition: aspect-ratio 0.2s ease;
        position: relative;
        min-width: 0;
        min-height: 0;
        box-sizing: border-box;
      }
      .slot {
        position: relative;
        background: #f3f4f6;
        border-radius: 0px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          border 0.1s ease;
        /* Pastikan slot punya ukuran minimal di mobile */
        min-width: 0;
        min-height: 0;
        width: 100%;
        height: 100%;
      }
      .slot img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        cursor: grab;
        -webkit-user-select: none;
        user-select: none;
        -webkit-user-drag: element;
        -webkit-touch-callout: none;
        touch-action: none;
        /* Cegah gambar “hilang” karena sizing aneh di beberapa browser mobile */
        max-width: none;
        max-height: none;
        pointer-events: auto;
      }
      .slot img:active {
        cursor: grabbing;
      }
      .slot.dragging {
        opacity: 0.4;
      }
      .slot.drag-over {
        border: 2px dashed #6366f1;
        background: #eef2ff;
      }
      #dragGhost {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1.05);
        display: none;
      }
      #dragGhost img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .slot .placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: #b0b5bf;
        font-size: 11px;
        font-weight: 700;
        z-index: 2;
        pointer-events: none;
      }
      .slot .placeholder svg {
        color: #6366f1;
      }

      /* ===== ACTION BUTTONS — FIXED di bawah layar (selalu kelihatan di HP) ===== */
      .actions {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 100;
        padding: 10px 12px;
        padding-bottom: max(10px, calc(env(safe-area-inset-bottom, 0px) + 8px));
        max-width: 100%;
        width: 100%;
        margin: 0;
        background: #ffffff;
        display: flex;
        gap: 10px;
        align-items: center;
        box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.1);
        box-sizing: border-box;
      }

      .btn-download {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #60a5fa, #6366f1);
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 6px 14px rgba(99, 102, 241, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-download:disabled {
        background: #d9dde3;
        box-shadow: none;
        cursor: not-allowed;
      }

      input[type="file"] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="stepper-row">
        <div class="stepper">
          <div class="left-controls">
            <button class="aspect-btn active" data-aspect="1/1">1:1</button>
            <button class="aspect-btn" data-aspect="4/5">4:5</button>
            <button class="aspect-btn" data-aspect="3/4">3:4</button>
            <button class="aspect-btn" data-aspect="16/9">16:9</button>
          </div>
          <div class="btns">
            <button class="step-btn" id="minusBtn">−</button>
            <span class="value" id="countValue">3</span>
            <button class="step-btn" id="plusBtn">+</button>
          </div>
        </div>
      </div>

      <div class="layout-picker" id="layoutPicker">
        <button class="layout-btn active" data-layout="left-big">
          Kiri Besar
        </button>
        <button class="layout-btn" data-layout="right-big">Kanan Besar</button>
        <button class="layout-btn" data-layout="top-big">Atas Besar</button>
        <button class="layout-btn" data-layout="bottom-big">Bawah Besar</button>
      </div>

      <div class="canvas-wrap">
        <div class="grid-frame" id="gridFrame"></div>
      </div>

      <div class="actions">
        <button
          class="add-photo-btn"
          id="addPhotoBtn"
          title="Tambah Banyak Foto"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button class="btn-download" id="downloadBtn" disabled>Download</button>
        <button class="trash-btn" id="trashBtn" title="Hapus Semua Foto">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="3 6 5 6 21 6"></polyline>
            <path
              d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
            ></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
      </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" />
    <input type="file" id="multiFileInput" accept="image/*" multiple />
    <canvas id="hiddenCanvas" style="display: none"></canvas>
    <div id="dragGhost"></div>

    <script>
      const MIN_COUNT = 1;
      const MAX_COUNT = 25;

      let count = 3;
      let images = {};
      let activeSlot = null;
      let currentAspect = "1/1";
      let currentLayout3 = "left-big";
      let draggedIdx = null;

      // State untuk touch drag di mobile
      let touchDragging = false;
      let touchStartX = 0;
      let touchStartY = 0;
      let touchMoved = false;
      let dragGhost = null;
      let suppressClick = false;

      const gridFrame = document.getElementById("gridFrame");
      const fileInput = document.getElementById("fileInput");
      const multiFileInput = document.getElementById("multiFileInput");
      const downloadBtn = document.getElementById("downloadBtn");
      const countValue = document.getElementById("countValue");
      const minusBtn = document.getElementById("minusBtn");
      const plusBtn = document.getElementById("plusBtn");
      const trashBtn = document.getElementById("trashBtn");
      const addPhotoBtn = document.getElementById("addPhotoBtn");
      const aspectButtons = document.querySelectorAll(".aspect-btn");
      const layoutPicker = document.getElementById("layoutPicker");
      const layoutButtons = document.querySelectorAll(".layout-btn");
      dragGhost = document.getElementById("dragGhost");

      const DRAG_THRESHOLD = 10; // px sebelum dianggap drag (bukan tap)

      function clearDragHighlights() {
        document
          .querySelectorAll(".slot.drag-over, .slot.dragging")
          .forEach((s) => {
            s.classList.remove("drag-over", "dragging");
          });
      }

      function hideGhost() {
        if (dragGhost) {
          dragGhost.style.display = "none";
          dragGhost.innerHTML = "";
        }
      }

      function showGhost(src, size, x, y) {
        if (!dragGhost) return;
        dragGhost.innerHTML = "";
        const gImg = document.createElement("img");
        gImg.src = src;
        dragGhost.appendChild(gImg);
        dragGhost.style.width = size + "px";
        dragGhost.style.height = size + "px";
        dragGhost.style.left = x + "px";
        dragGhost.style.top = y + "px";
        dragGhost.style.display = "block";
      }

      function swapSlots(fromIdx, toIdx) {
        if (fromIdx === null || fromIdx === toIdx) return;
        const temp = images[fromIdx];
        images[fromIdx] = images[toIdx];
        images[toIdx] = temp;
        if (!images[fromIdx]) delete images[fromIdx];
        if (!images[toIdx]) delete images[toIdx];
        renderGrid();
        checkReady();
      }

      // Global touch handlers untuk drag di mobile
      document.addEventListener(
        "touchmove",
        (e) => {
          if (draggedIdx === null || !images[draggedIdx]) return;
          if (e.touches.length !== 1) return;

          const t = e.touches[0];
          const dx = t.clientX - touchStartX;
          const dy = t.clientY - touchStartY;

          if (!touchDragging) {
            if (
              Math.abs(dx) < DRAG_THRESHOLD &&
              Math.abs(dy) < DRAG_THRESHOLD
            ) {
              return;
            }
            // Mulai drag
            touchDragging = true;
            touchMoved = true;
            suppressClick = true;

            const srcSlot = document.querySelector(
              `.slot[data-slot="${draggedIdx}"]`,
            );
            if (srcSlot) {
              srcSlot.classList.add("dragging");
              const rect = srcSlot.getBoundingClientRect();
              const size = Math.min(rect.width, rect.height) * 0.55;
              showGhost(images[draggedIdx], size, t.clientX, t.clientY);
            }
          }

          e.preventDefault(); // cegah scroll saat drag

          // Update posisi ghost
          if (dragGhost && dragGhost.style.display === "block") {
            dragGhost.style.left = t.clientX + "px";
            dragGhost.style.top = t.clientY + "px";
          }

          // Highlight slot target
          clearDragHighlights();
          const srcSlot = document.querySelector(
            `.slot[data-slot="${draggedIdx}"]`,
          );
          if (srcSlot) srcSlot.classList.add("dragging");

          // Sembunyikan ghost sementara supaya elementFromPoint akurat
          const prevDisplay = dragGhost ? dragGhost.style.display : "none";
          if (dragGhost) dragGhost.style.display = "none";
          const el = document.elementFromPoint(t.clientX, t.clientY);
          if (dragGhost) dragGhost.style.display = prevDisplay;

          const targetSlot = el ? el.closest(".slot") : null;
          if (targetSlot) {
            const tIdx = parseInt(targetSlot.dataset.slot, 10);
            if (tIdx !== draggedIdx) {
              targetSlot.classList.add("drag-over");
            }
          }
        },
        { passive: false },
      );

      document.addEventListener(
        "touchend",
        (e) => {
          if (draggedIdx === null) return;

          if (touchDragging) {
            const t = e.changedTouches[0];

            // Cari slot tujuan
            if (dragGhost) dragGhost.style.display = "none";
            const el = document.elementFromPoint(t.clientX, t.clientY);
            const targetSlot = el ? el.closest(".slot") : null;

            if (targetSlot) {
              const targetIdx = parseInt(targetSlot.dataset.slot, 10);
              if (!isNaN(targetIdx) && targetIdx !== draggedIdx) {
                swapSlots(draggedIdx, targetIdx);
              }
            }

            suppressClick = true;
            // Reset suppress setelah event click selesai
            setTimeout(() => {
              suppressClick = false;
            }, 300);
          }

          hideGhost();
          clearDragHighlights();
          draggedIdx = null;
          touchDragging = false;
          touchMoved = false;
        },
        { passive: true },
      );

      document.addEventListener(
        "touchcancel",
        () => {
          hideGhost();
          clearDragHighlights();
          draggedIdx = null;
          touchDragging = false;
          touchMoved = false;
        },
        { passive: true },
      );

      // Cegah context menu / save image saat long-press di foto
      document.addEventListener(
        "contextmenu",
        (e) => {
          if (e.target.closest && e.target.closest(".slot img")) {
            e.preventDefault();
          }
        },
        { passive: false },
      );

      function renderGrid() {
        gridFrame.style.aspectRatio = currentAspect;
        gridFrame.innerHTML = "";

        if (count === 3) {
          layoutPicker.classList.add("show");
        } else {
          layoutPicker.classList.remove("show");
        }

        let cols = 2,
          rows = 2;
        if (count === 3) {
          cols = 2;
          rows = 2;
          gridFrame.style.gridTemplateColumns = "repeat(2, 1fr)";
          gridFrame.style.gridTemplateRows = "repeat(2, 1fr)";
        } else {
          cols = Math.ceil(Math.sqrt(count));
          rows = Math.ceil(count / cols);
          gridFrame.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
          gridFrame.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        }

        for (let idx = 0; idx < count; idx++) {
          const slot = document.createElement("div");
          slot.className = "slot";
          slot.dataset.slot = idx;

          if (count === 3) {
            if (currentLayout3 === "left-big") {
              if (idx === 0) slot.style.gridArea = "1 / 1 / 3 / 2";
              else if (idx === 1) slot.style.gridArea = "1 / 2 / 2 / 3";
              else if (idx === 2) slot.style.gridArea = "2 / 2 / 3 / 3";
            } else if (currentLayout3 === "right-big") {
              if (idx === 0) slot.style.gridArea = "1 / 1 / 2 / 2";
              else if (idx === 1) slot.style.gridArea = "2 / 1 / 3 / 2";
              else if (idx === 2) slot.style.gridArea = "1 / 2 / 3 / 3";
            } else if (currentLayout3 === "top-big") {
              if (idx === 0) slot.style.gridArea = "1 / 1 / 2 / 3";
              else if (idx === 1) slot.style.gridArea = "2 / 1 / 3 / 2";
              else if (idx === 2) slot.style.gridArea = "2 / 2 / 3 / 3";
            } else if (currentLayout3 === "bottom-big") {
              if (idx === 0) slot.style.gridArea = "1 / 1 / 2 / 2";
              else if (idx === 1) slot.style.gridArea = "1 / 2 / 2 / 3";
              else if (idx === 2) slot.style.gridArea = "2 / 1 / 3 / 3";
            }
          }

          if (images[idx]) {
            const img = document.createElement("img");
            img.src = images[idx];
            img.draggable = true;
            img.setAttribute("draggable", "true");

            // Desktop drag & drop
            img.addEventListener("dragstart", (e) => {
              draggedIdx = idx;
              e.dataTransfer.setData("text/plain", String(idx));
              e.dataTransfer.effectAllowed = "move";
              slot.classList.add("dragging");
            });
            img.addEventListener("dragend", () => {
              slot.classList.remove("dragging");
              document
                .querySelectorAll(".slot.drag-over")
                .forEach((s) => s.classList.remove("drag-over"));
              draggedIdx = null;
            });

            // Mobile: mulai potensi drag
            img.addEventListener(
              "touchstart",
              (e) => {
                if (e.touches.length !== 1) return;
                const t = e.touches[0];
                draggedIdx = idx;
                touchStartX = t.clientX;
                touchStartY = t.clientY;
                touchMoved = false;
                touchDragging = false;
                suppressClick = false;
              },
              { passive: true },
            );

            slot.appendChild(img);
          } else {
            const ph = document.createElement("div");
            ph.className = "placeholder";
            ph.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
            slot.appendChild(ph);
          }

          // Desktop drop target (semua slot)
          slot.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            slot.classList.add("drag-over");
          });
          slot.addEventListener("dragleave", () => {
            slot.classList.remove("drag-over");
          });
          slot.addEventListener("drop", (e) => {
            e.preventDefault();
            slot.classList.remove("drag-over");
            const targetIdx = idx;
            if (draggedIdx !== null && draggedIdx !== targetIdx) {
              const temp = images[draggedIdx];
              images[draggedIdx] = images[targetIdx];
              images[targetIdx] = temp;
              if (!temp) delete images[draggedIdx];
              renderGrid();
              checkReady();
            }
            draggedIdx = null;
          });

          // Klik untuk ganti foto (di-suppress kalau baru selesai drag)
          slot.addEventListener("click", (e) => {
            if (suppressClick) {
              suppressClick = false;
              e.preventDefault();
              e.stopPropagation();
              return;
            }
            activeSlot = idx;
            fileInput.click();
          });

          gridFrame.appendChild(slot);
        }
        countValue.textContent = count;
      }

      function checkReady() {
        const filled = Object.keys(images).filter((k) => k < count).length;
        downloadBtn.disabled = filled === 0;
      }

      function updateCount(delta) {
        const next = count + delta;
        if (next < MIN_COUNT || next > MAX_COUNT) return;
        count = next;
        minusBtn.disabled = count <= MIN_COUNT;
        plusBtn.disabled = count >= MAX_COUNT;
        Object.keys(images).forEach((k) => {
          if (parseInt(k) >= count) delete images[k];
        });
        renderGrid();
        checkReady();
      }

      minusBtn.addEventListener("click", () => updateCount(-1));
      plusBtn.addEventListener("click", () => updateCount(1));

      trashBtn.addEventListener("click", () => {
        images = {};
        renderGrid();
        checkReady();
      });

      addPhotoBtn.addEventListener("click", () => {
        multiFileInput.click();
      });

      aspectButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          aspectButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentAspect = btn.dataset.aspect;
          renderGrid();
        });
      });

      layoutButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          layoutButtons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentLayout3 = btn.dataset.layout;
          renderGrid();
        });
      });

      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file || activeSlot === null) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          images[activeSlot] = ev.target.result;
          renderGrid();
          checkReady();
        };
        reader.readAsDataURL(file);
        fileInput.value = "";
      });

      multiFileInput.addEventListener("change", (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        let filledCount = Object.keys(images).length;
        let targetCount = Math.max(count, filledCount + files.length);
        if (targetCount > MAX_COUNT) targetCount = MAX_COUNT;

        if (targetCount !== count) {
          count = targetCount;
          minusBtn.disabled = count <= MIN_COUNT;
          plusBtn.disabled = count >= MAX_COUNT;
        }

        let fileIdx = 0;
        for (let i = 0; i < count && fileIdx < files.length; i++) {
          if (!images[i]) {
            const slotIdx = i; // capture index agar aman di callback async
            const file = files[fileIdx++];
            const reader = new FileReader();
            reader.onload = (ev) => {
              images[slotIdx] = ev.target.result;
              renderGrid();
              checkReady();
            };
            reader.readAsDataURL(file);
          }
        }
        multiFileInput.value = "";
      });

      downloadBtn.addEventListener("click", async () => {
        let baseSize = 1200;
        let canvasW = baseSize;
        let canvasH = baseSize;

        if (currentAspect === "4/5") {
          canvasW = 1200;
          canvasH = 1500;
        } else if (currentAspect === "3/4") {
          canvasW = 1200;
          canvasH = 1600;
        } else if (currentAspect === "16/9") {
          canvasW = 1920;
          canvasH = 1080;
        }

        const canvas = document.getElementById("hiddenCanvas");
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvasW, canvasH);

        async function loadImg(src) {
          return new Promise((res) => {
            const img = new Image();
            img.onload = () => res(img);
            img.src = src;
          });
        }

        if (count === 3) {
          let halfW = canvasW / 2;
          let halfH = canvasH / 2;
          let coords = [];

          if (currentLayout3 === "left-big") {
            coords = [
              { x: 0, y: 0, w: halfW, h: canvasH },
              { x: halfW, y: 0, w: halfW, h: halfH },
              { x: halfW, y: halfH, w: halfW, h: halfH },
            ];
          } else if (currentLayout3 === "right-big") {
            coords = [
              { x: 0, y: 0, w: halfW, h: halfH },
              { x: 0, y: halfH, w: halfW, h: halfH },
              { x: halfW, y: 0, w: halfW, h: canvasH },
            ];
          } else if (currentLayout3 === "top-big") {
            coords = [
              { x: 0, y: 0, w: canvasW, h: halfH },
              { x: 0, y: halfH, w: halfW, h: halfH },
              { x: halfW, y: halfH, w: halfW, h: halfH },
            ];
          } else if (currentLayout3 === "bottom-big") {
            coords = [
              { x: 0, y: 0, w: halfW, h: halfH },
              { x: halfW, y: 0, w: halfW, h: halfH },
              { x: 0, y: halfH, w: canvasW, h: halfH },
            ];
          }

          for (let idx = 0; idx < 3; idx++) {
            if (images[idx]) {
              let c = coords[idx];
              const imgObj = await loadImg(images[idx]);
              drawCover(ctx, imgObj, c.x, c.y, c.w, c.h);
            }
          }
        } else {
          let cols = Math.ceil(Math.sqrt(count));
          let rows = Math.ceil(count / cols);
          let cellW = canvasW / cols;
          let cellH = canvasH / rows;

          for (let idx = 0; idx < count; idx++) {
            if (images[idx]) {
              let c = idx % cols;
              let r = Math.floor(idx / cols);
              const imgObj = await loadImg(images[idx]);
              drawCover(ctx, imgObj, c * cellW, r * cellH, cellW, cellH);
            }
          }
        }

        const link = document.createElement("a");
        link.download = "photo-grid.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });

      function drawCover(ctx, img, x, y, w, h) {
        if (w <= 0 || h <= 0) return;
        const imgRatio = img.width / img.height;
        const cellRatio = w / h;
        let dw, dh, dx, dy;
        if (imgRatio > cellRatio) {
          dh = h;
          dw = h * imgRatio;
          dx = x + (w - dw) / 2;
          dy = y;
        } else {
          dw = w;
          dh = w / imgRatio;
          dx = x;
          dy = y + (h - dh) / 2;
        }
        ctx.drawImage(img, dx, dy, dw, dh);
      }

      count = 3;
      minusBtn.disabled = count <= MIN_COUNT;
      plusBtn.disabled = count >= MAX_COUNT;
      renderGrid();
    </script>
  </body>
</html>
