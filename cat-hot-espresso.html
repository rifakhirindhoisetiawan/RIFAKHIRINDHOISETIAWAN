<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Hot Espresso - Menu & Resep Resmi JA~DI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: #ffffff; min-height: 100vh;
}
.wrap { max-width: 800px; margin: 0 auto; }
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 10px;
  background: #fafbfc; border: 1px solid #e3e6ec; color: #1f2937;
  text-decoration: none; flex-shrink: 0;
}
.back-btn svg { width: 18px; height: 18px; }
.search-row { display: flex; align-items: center; gap: 10px; padding: 14px 18px 4px; }
.search-box {
  flex: 1; display: flex; align-items: center; gap: 8px;
  border: 1px solid #e3e6ec; border-radius: 14px; padding: 12px 14px;
  color: #1f2937; font-size: 13px; background: #fafbfc;
}
.search-box input {
  border: none; background: transparent; outline: none; width: 100%;
  font-size: 16px; color: #1f2937; font-family: inherit;
}
@media (min-width: 768px) {
  .search-box input { font-size: 13px; }
}
.search-box input::placeholder { color: #c3c8d1; }
.search-box svg { flex-shrink: 0; color: #c3c8d1; width: 18px; height: 18px; }
.menu-wrap { padding: 4px 18px 32px 22px; }
.section-label {
  font-size: 11px; font-weight: 800; color: #9aa0ab; letter-spacing: 0.6px;
  text-transform: uppercase; margin: 14px 0 14px;
}
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px 12px; }
@media (min-width: 768px) { .grid { gap: 28px 20px; } }
.item {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  cursor: pointer; background: none; border: none; text-decoration: none;
}
.icon-tile {
  width: 60px; height: 60px; border-radius: 14px; display: flex;
  align-items: center; justify-content: center; font-size: 22px;
  margin-bottom: 8px; color: #fff; position: relative;
  box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
  transition: transform 0.2s ease;
}
@media (min-width: 768px) { .icon-tile { width: 72px; height: 72px; border-radius: 18px; font-size: 24px; } }
.item:hover .icon-tile, .item:active .icon-tile { transform: translateY(-3px); }
.item span { font-size: 11px; font-weight: 800; color: #1f2937; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (min-width: 768px) { .item span { font-size: 12px; } }
.empty-msg { text-align: center; color: #9aa0ab; font-size: 13px; padding: 40px 0; font-weight: 600; grid-column: 1/-1; }
.g-a { background: linear-gradient(135deg, #a5b4fc, #818cf8); }
.g-b { background: linear-gradient(135deg, #c4b5fd, #a78bfa); }
.g-c { background: linear-gradient(135deg, #93c5fd, #60a5fa); }
.g-d { background: linear-gradient(135deg, #67e8f9, #22d3ee); }
.g-e { background: linear-gradient(135deg, #6ee7b7, #34d399); }
.g-f { background: linear-gradient(135deg, #fcd34d, #fbbf24); }
.g-g { background: linear-gradient(135deg, #fca5a5, #f87171); }
.g-h { background: linear-gradient(135deg, #f0abfc, #e879f9); }
</style>
</head>
<body>
<div class="wrap">

    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input id="modSearchInput" type="text" placeholder="Cari resep menu..." oninput="renderGrid()" />
    </div>
  </div>
  <div class="menu-wrap">
    <p class="section-label">DAFTAR RESEP</p>
    <div class="grid" id="modGrid"></div>
  </div>
</div>

<script>
  const items = [{"name": "Espresso Hot", "icon": "☕", "cls": "g-h", "slug": "espresso-hot"}, {"name": "Cappuccino Hot", "icon": "🫧", "cls": "g-a", "slug": "cappuccino-hot"}, {"name": "Caffelatte Hot", "icon": "🥛", "cls": "g-b", "slug": "caffelatte-hot"}];
  const modGrid = document.getElementById("modGrid");
  const modSearchInput = document.getElementById("modSearchInput");

  function renderGrid() {
    const q = modSearchInput.value.trim().toLowerCase();
    const filtered = items.filter((it) => !q || it.name.toLowerCase().includes(q));

    if (filtered.length === 0) {
      modGrid.innerHTML = `<div class="empty-msg">Menu tidak ditemukan</div>`;
      return;
    }

    modGrid.innerHTML = filtered
      .map(
        (it) => `
          <a class="item" href="item-${it.slug}.html">
            <div class="icon-tile ${it.cls}">${it.icon}</div>
            <span>${it.name}</span>
          </a>
        `
      )
      .join("");
  }

  renderGrid();
</script>
</body>
</html>
