<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — JA-DI Supabase</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{max-width:100%;overflow-x:hidden}
    html,body{width:100%;height:100%;background:#ffffff}
    body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:#ffffff;color:#1a1a1a;min-height:100vh;overflow-x:hidden}
    ::-webkit-scrollbar{width:0;height:0}
    *{scrollbar-width:none;-ms-overflow-style:none}
    .wrap{width:100%;max-width:800px;min-height:100vh;margin:0 auto;background:#ffffff;padding:12px 18px 40px;min-width:0}
    .status{display:none}
    .grid{display:grid;grid-template-columns:1fr;gap:20px;max-width:100%}
    .card{background:transparent;border:none;padding:0;max-width:100%;min-width:0}
    .section-label{font-size:11px;font-weight:800;color:#9aa0ab;letter-spacing:0.6px;text-transform:uppercase;margin:4px 0 14px}
    .search-wrapper{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:14px}
    .search-box{flex:1;display:flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:10px;padding:10px 14px;color:#222;font-size:14px;background:#f9f9f9;min-width:0}
    .search-box:focus-within{border-color:#888;background:#fff}
    .search-box svg{flex-shrink:0;color:#c3c8d1;width:18px;height:18px}
    .search-box input{border:none;background:transparent;outline:none;width:100%;font-size:14px;color:#222;font-family:inherit;min-width:0;-webkit-appearance:none;appearance:none;border-radius:0}
    .search-box input::placeholder{color:#c3c8d1}
    .form{display:grid;gap:12px;max-width:100%}
    .form label{font-size:11px;font-weight:700;color:#1f2937;display:block;min-width:0;max-width:100%}
    .form input,.form select{display:block;width:100%;max-width:100%;min-width:0;margin-top:6px;padding:10px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;color:#222;background:#f9f9f9;outline:none;font-family:inherit}
    .form input:focus,.form select:focus{border-color:#888;background:#fff}
    .form input::placeholder{color:#c3c8d1}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:100%}
    .row>*{min-width:0}
    .btn{padding:10px 16px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
    .btn-primary{background:#1a1a1a;color:#fff}
    .btn-ghost{background:#f5f5f5;color:#1a1a1a}
    .btn-danger{background:#fff;color:#ef4444;border:1px solid #fecaca}
    .btn-small{padding:6px 12px;font-size:12px}
    .btn:disabled{opacity:0.5}
    .list{display:grid;gap:4px;max-width:100%}
    .item{display:flex;align-items:center;gap:12px;padding:8px 0;max-width:100%;min-width:0;background:transparent;border:none}
    .thumb{width:52px;aspect-ratio:9/16;border-radius:12px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:22px;color:#fff}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .item-info{flex:1;min-width:0;max-width:100%}
    .item-name{font-size:12px;font-weight:700;color:#1f2937;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .item-meta{font-size:11px;color:#9aa0ab;margin-top:2px;overflow-wrap:anywhere;word-break:break-word;max-width:100%}
    .item-meta a{color:#9aa0ab;text-decoration:none}
    .badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:#f5f5f5;color:#6b7280}
    .group-head{font-size:11px;font-weight:800;color:#9aa0ab;letter-spacing:0.6px;text-transform:uppercase;margin:14px 0 4px}
    .group-head:first-child{margin-top:0}
    .vbadge{font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;background:#1a1a1a;color:#fff;margin-left:6px;vertical-align:1px;white-space:nowrap}
    .item-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
    .empty{text-align:center;color:#9aa0ab;font-size:13px;font-weight:600;padding:40px 0}
    .hint{font-size:11px;color:#9aa0ab}
    .foto-title,.field-title{font-size:11px;font-weight:700;color:#1f2937}
    .select-box{position:relative;margin-top:6px;max-width:100%}
    .select-box select{display:block;width:100%;max-width:100%;min-width:0;margin-top:0;padding:10px 40px 10px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;font-weight:600;color:#222;background:#f9f9f9;outline:none;font-family:inherit;appearance:none;-webkit-appearance:none;cursor:pointer}
    .select-box select:focus{border-color:#888;background:#fff}
    .select-box svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#9aa0ab;pointer-events:none}
    .foto-box{position:relative;margin-top:6px;border:1.5px dashed #ddd;border-radius:16px;background:#f9f9f9;min-height:140px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;max-width:100%}
    .foto-box:active{background:#f1f1f1}
    .foto-empty{display:flex;flex-direction:column;align-items:center;gap:6px;color:#c3c8d1;padding:20px;text-align:center}
    .foto-empty svg{width:32px;height:32px}
    .foto-empty span{font-size:13px;font-weight:700;color:#6b7280}
    .foto-empty small{font-size:11px;color:#c3c8d1}
    #icon_preview{display:none;position:absolute;inset:0;width:100%;height:100%}
    #icon_preview img{width:100%;height:100%;object-fit:cover;display:block}
    .foto-change{display:none;position:absolute;right:10px;bottom:10px;background:rgba(26,26,26,0.75);color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px}
    .foto-box.has-photo #icon_preview{display:block}
    .foto-box.has-photo .foto-empty{display:none}
    .foto-box.has-photo .foto-change{display:block}
    #f_icon_img{display:none !important}
    .g-a{background:linear-gradient(135deg,#a5b4fc,#818cf8)}
    .g-b{background:linear-gradient(135deg,#c4b5fd,#a78bfa)}
    .g-c{background:linear-gradient(135deg,#93c5fd,#60a5fa)}
    .g-d{background:linear-gradient(135deg,#67e8f9,#22d3ee)}
    .g-e{background:linear-gradient(135deg,#6ee7b7,#34d399)}
    .g-f{background:linear-gradient(135deg,#fcd34d,#fbbf24)}
    .g-g{background:linear-gradient(135deg,#fca5a5,#f87171)}
    .g-h{background:linear-gradient(135deg,#f0abfc,#e879f9)}
  </style>
</head>
<body>
<div class="wrap">
  <div id="status" class="status" style="display:none">Menghubungkan ke Supabase...</div>
  <div class="grid">
    <div class="card" style="order:2">
      <div class="section-label">Daftar Menu (<span id="count">0</span>)</div>
      <div class="search-wrapper">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
          <input id="search" type="text" placeholder="Cari menu..." autocomplete="off" />
        </div>
      </div>
      <div id="list" class="list"><div class="empty">Memuat...</div></div>
    </div>
    <div class="card" style="order:1">
      <div class="section-label" id="formTitle">Tambah Menu</div>
      <form id="form" class="form" onsubmit="return false">
        <input type="hidden" id="editId" />
        <label>Nama *<input id="f_name" placeholder="COFFEE LATTE PREMIX" required /></label>
        <div>
          <div class="foto-title">Foto</div>
          <div class="foto-box" id="fotoBox">
            <input id="f_icon_img" type="file" accept="image/*" hidden />
            <div class="foto-empty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="3" /><circle cx="12" cy="13" r="3.5" /><path d="M8 7l1.5-2.5h5L16 7" /></svg>
            </div>
            <div id="icon_preview"></div>
            <div class="foto-change">Ganti</div>
          </div>
        </div>
        <label>Link <input id="f_link" placeholder="pages/item-...html" /></label>
        <div class="row" style="grid-template-columns:1fr 1fr">
          <label>PLU 12OZ <input id="f_plu12" placeholder="443775" /></label>
          <label>PLU 16OZ <input id="f_plu16" placeholder="443776" /></label>
        </div>
        <div>
          <div class="field-title">Bahan 12OZ</div>
          <div class="row" style="margin-top:6px">
            <label>Bahan 1 <input id="f_bahan12_1" placeholder="Bahan 1" /></label>
            <label>Bahan 2 <input id="f_bahan12_2" placeholder="Bahan 2" /></label>
          </div>
          <div class="row" style="margin-top:10px">
            <label>Bahan 3 <input id="f_bahan12_3" placeholder="Bahan 3" /></label>
            <label>Bahan 4 <input id="f_bahan12_4" placeholder="Bahan 4" /></label>
          </div>
          <div class="row" style="margin-top:10px">
            <label>Bahan 5 <input id="f_bahan12_5" placeholder="Bahan 5" /></label>
            <label>Bahan 6 <input id="f_bahan12_6" placeholder="Bahan 6" /></label>
          </div>
        </div>
        <div>
          <div class="field-title">Bahan 16OZ</div>
          <div class="row" style="margin-top:6px">
            <label>Bahan 1 <input id="f_bahan16_1" placeholder="Bahan 1" /></label>
            <label>Bahan 2 <input id="f_bahan16_2" placeholder="Bahan 2" /></label>
          </div>
          <div class="row" style="margin-top:10px">
            <label>Bahan 3 <input id="f_bahan16_3" placeholder="Bahan 3" /></label>
            <label>Bahan 4 <input id="f_bahan16_4" placeholder="Bahan 4" /></label>
          </div>
          <div class="row" style="margin-top:10px">
            <label>Bahan 5 <input id="f_bahan16_5" placeholder="Bahan 5" /></label>
            <label>Bahan 6 <input id="f_bahan16_6" placeholder="Bahan 6" /></label>
          </div>
        </div>
        <div>
          <div class="field-title">Bahan HOT 12OZ</div>
          <div class="row" style="margin-top:6px">
            <label>Bahan 1 <input id="f_bahanHot_1" placeholder="Bahan 1" /></label>
            <label>Bahan 2 <input id="f_bahanHot_2" placeholder="Bahan 2" /></label>
          </div>
          <div class="row" style="margin-top:10px">
            <label>Bahan 3 <input id="f_bahanHot_3" placeholder="Bahan 3" /></label>
            <label>Bahan 4 <input id="f_bahanHot_4" placeholder="Bahan 4" /></label>
          </div>
          <div class="row" style="margin-top:10px">
            <label>Bahan 5 <input id="f_bahanHot_5" placeholder="Bahan 5" /></label>
            <label>Bahan 6 <input id="f_bahanHot_6" placeholder="Bahan 6" /></label>
          </div>
        </div>
        <div>
          <div class="field-title">Bahan HOT 16OZ</div>
          <div class="row" style="margin-top:6px">
            <label>Bahan 1 <input id="f_bahanHot16_1" placeholder="Bahan 1" /></label>
            <label>Bahan 2 <input id="f_bahanHot16_2" placeholder="Bahan 2" /></label>
          </div>
          <div class="row" style="margin-top:10px">
            <label>Bahan 3 <input id="f_bahanHot16_3" placeholder="Bahan 3" /></label>
            <label>Bahan 4 <input id="f_bahanHot16_4" placeholder="Bahan 4" /></label>
          </div>
          <div class="row" style="margin-top:10px">
            <label>Bahan 5 <input id="f_bahanHot16_5" placeholder="Bahan 5" /></label>
            <label>Bahan 6 <input id="f_bahanHot16_6" placeholder="Bahan 6" /></label>
          </div>
        </div>
        <div style="border:1px solid #a5d6a7;border-radius:10px;padding:12px;background:#f0faf0">
          <div class="field-title" style="margin-bottom:8px;color:#2e7d32">Kolom Khusus Percepatan — Supabase <span style="font-weight:400;color:#689f63">baru</span></div>
          <label>Percepatan (umum) <input id="f_percepatan" placeholder="Metode percepatan..." /></label>
          <div class="row" style="margin-top:8px">
            <label>Percepatan 12OZ <input id="f_percepatan12" placeholder="Percepatan 12oz..." /></label>
            <label>Percepatan 16OZ <input id="f_percepatan16" placeholder="Percepatan 16oz..." /></label>
          </div>
          <div class="row" style="margin-top:8px">
            <label>Percepatan HOT <input id="f_percepatanHot" placeholder="Percepatan HOT..." /></label>
            <label style="opacity:0;pointer-events:none">-</label>
          </div>
        </div>
        <label>Catatan <input id="f_catatan" placeholder="Catatan..." /></label>
        <div style="display:flex;gap:8px">
          <button id="btnSave" class="btn btn-primary" style="flex:1">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script type="module">
  import { supabase } from './js/supabase.js';

  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const searchEl = document.getElementById('search');
  const form = document.getElementById('form');
  const editId = document.getElementById('editId');
  const f_name = document.getElementById('f_name');
  let existingIcon = '';
  let existingCls = 'g-a';
  const f_link = document.getElementById('f_link');
  const f_plu12 = document.getElementById('f_plu12');
  const f_plu16 = document.getElementById('f_plu16');
  const f_bahan12 = [1,2,3,4,5,6].map(n => document.getElementById('f_bahan12_' + n));
  const f_bahan16 = [1,2,3,4,5,6].map(n => document.getElementById('f_bahan16_' + n));
  const f_bahanHot = [1,2,3,4,5,6].map(n => document.getElementById('f_bahanHot_' + n));
  const f_bahanHot16 = [1,2,3,4,5,6].map(n => document.getElementById('f_bahanHot16_' + n));
  const f_catatan = document.getElementById('f_catatan');
  const btnSave = document.getElementById('btnSave');
  const formTitle = document.getElementById('formTitle');
  const f_icon_img = document.getElementById('f_icon_img');
  const iconPreview = document.getElementById('icon_preview');
  const fotoBox = document.getElementById('fotoBox');
  let currentTable = 'ja_di_menus';
  let existingCat = 'PREMIX';
  function syncFotoBox() {
    fotoBox.classList.toggle('has-photo', iconPreview.innerHTML.trim() !== '');
  }



  fotoBox.addEventListener('click', () => f_icon_img.click());

  f_icon_img.addEventListener('change', () => {
    const file = f_icon_img.files[0];
    if (!file) { iconPreview.innerHTML = ''; syncFotoBox(); return; }
    const url = URL.createObjectURL(file);
    iconPreview.innerHTML = '<img src="'+url+'" alt=""/>';
    syncFotoBox();
  });

  async function uploadIcon(file) {
    const ext = file.name.split('.').pop();
    const name = Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;
    const { data, error } = await supabase.storage.from('admin-icons').upload(name, file, { cacheControl: '3600', upsert: false });
    if (error) throw error;
    const { data: pub } = supabase.storage.from('admin-icons').getPublicUrl(name);
    return pub.publicUrl;
  }
  function fileToDataURL(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  // auth disabled

  let all = [];

  function setStatus(msg, ok=true) {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + (ok ? 'ok' : 'err');
  }

  async function load() {
    const label = currentTable === 'ja_di_menus' ? 'JA-DI' : 'Dr Coffee';
    setStatus('Memuat ' + currentTable + '...');
    const { data, error } = await supabase.from(currentTable).select('*').order('id');
    if (error) {
      if (error.code === 'PGRST205' || error.message.includes('Could not find the table')) {
        setStatus('❌ Tabel ' + currentTable + ' belum ada. Jalankan scripts/supabase-dr-coffee.sql di SQL Editor', false);
        listEl.innerHTML = '<div class="empty">Tabel belum ada. RUN SQL: <a href="https://supabase.com/dashboard/project/xsacwgxxoptdrgbbzzib/sql/new" target="_blank">SQL Editor</a> lalu paste scripts/supabase-dr-coffee.sql</div>';
        countEl.textContent = '0';
        return;
      }
      setStatus('Error: ' + error.message, false); return;
    }
    all = (data || []).map(m => ({ ...m, plu: [m.plu_12oz, m.plu_16oz].filter(Boolean).join(' / ') || m.plu || '' }));
    setStatus('✅ ' + label + ' — ' + all.length + ' menu dari Supabase');
    render();
  }

  function baseName(n) {
    return (n || '').toUpperCase().replace(/\(.*?\)/g, ' ').replace(/\b(HOT|ICE|MANUAL|PREMIX|12OZ|16OZ|UPSIZE|REGULAR)\b/g, ' ').replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function variantOf(n) {
    const v = [];
    if (/\bPREMIX\b/i.test(n)) v.push('PREMIX');
    else if (/\bMANUAL\b/i.test(n)) v.push('MANUAL');
    if (/\bHOT\b/i.test(n)) v.push('HOT');
    else if (/\bICE\b/i.test(n)) v.push('ICE');
    return v.join(' • ');
  }
  function itemHtml(m) {
    const isImg = !!(m.foto && typeof m.foto === 'string' && /^(https?:|data:|blob:)/i.test(m.foto));
    const thumb = isImg ? '<img src="'+m.foto+'" alt=""/>' : '<span>'+(m.foto||'☕')+'</span>';
    const v = variantOf(m.name);
    return `
      <div class="item">
        <div class="thumb ${m.cls||''}">${thumb}</div>
        <div class="item-info">
          <div class="item-name">${m.name}${v ? '<span class="vbadge">'+v+'</span>' : ''}</div>
          <div class="item-meta"><span class="badge">${m.cat||'-'}</span>${m.plu ? ' ' + m.plu : ''}</div>
          ${m.link ? '<div class="item-meta"><a href="'+m.link+'" target="_blank">'+m.link+'</a></div>' : ''}
        </div>
        <div class="item-actions">
          <button class="btn btn-ghost btn-small" data-edit="${m.id}">Edit</button>
          <button class="btn btn-danger btn-small" data-del="${m.id}">Hapus</button>
        </div>
      </div>`;
  }
  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = all.filter(m => !q || m.name.toLowerCase().includes(q) || (m.cat&&m.cat.toLowerCase().includes(q)) || (m.plu&&m.plu.toLowerCase().includes(q)));
    countEl.textContent = filtered.length;
    const label = currentTable === 'ja_di_menus' ? 'JA-DI' : 'Dr Coffee';
    if (!filtered.length) { listEl.innerHTML = '<div class="empty">Tidak ada data — ' + label + ' konek Supabase OK (0 menu)</div>'; return; }
    const groups = {};
    filtered.forEach(m => {
      const b = baseName(m.name) || m.name;
      (groups[b] = groups[b] || []).push(m);
    });
    const names = Object.keys(groups).sort((a, b) => a.localeCompare(b));
    listEl.innerHTML = names.map(b => {
      const members = groups[b];
      members.sort((x, y) => x.id - y.id);
      const head = members.length > 1 ? '<div class="group-head">' + b + ' (' + members.length + ')</div>' : '';
      return head + members.map(itemHtml).join('');
    }).join('');
    listEl.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => editRow(parseInt(btn.dataset.edit)));
    });
    listEl.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => delRow(parseInt(btn.dataset.del)));
    });
  }

  function editRow(id) {
    const m = all.find(x=>x.id===id);
    if (!m) return;
    editId.value = m.id;
    f_name.value = m.name;
    existingIcon = m.foto||'';
    existingCls = m.cls||'g-a';
    existingCat = m.cat || 'PREMIX';
    f_link.value = m.link||'';
    f_plu12.value = m.plu_12oz||'';
    f_plu16.value = m.plu_16oz||'';
    f_bahan12.forEach((inp, i) => { inp.value = m['bahan_12oz_' + (i+1)] || ''; });
    f_bahan16.forEach((inp, i) => { inp.value = m['bahan_16oz_' + (i+1)] || ''; });
    f_bahanHot.forEach((inp, i) => { inp.value = m['bahan_hot_' + (i+1)] || ''; });
    f_bahanHot16.forEach((inp, i) => { inp.value = m['bahan_hot_16oz_' + (i+1)] || ''; });
    f_catatan.value = m.catatan || '';
    f_icon_img.value = '';
    if (m.foto && typeof m.foto === 'string' && /^(https?:|data:|blob:)/i.test(m.foto)) {
      iconPreview.innerHTML = '<img src="'+m.foto+'" alt=""/>';
    } else {
      iconPreview.innerHTML = '';
    }
    syncFotoBox();
    formTitle.textContent = 'Edit Menu #' + id;
    btnSave.textContent = 'Update';
    window.scrollTo({top:0, behavior:'smooth'});
  };

  async function delRow(id) {
    if (!confirm('Hapus menu #' + id + ' (' + currentTable + ')?')) return;
    const { error } = await supabase.from(currentTable).delete().eq('id', id);
    if (error) alert('Gagal hapus: ' + error.message);
    else { setStatus('🗑️ Dihapus #' + id); await load(); }
  };

  function resetForm() {
    editId.value = '';
    existingIcon = '';
    existingCls = 'g-a';
    form.reset();
    iconPreview.innerHTML = '';
    syncFotoBox();
    formTitle.textContent = 'Tambah Menu';
    btnSave.textContent = 'Simpan';
  }

  btnSave.onclick = async () => {
    if (!f_name.value.trim()) { alert('Nama wajib'); return; }
    btnSave.disabled = true; btnSave.textContent = 'Menyimpan...';
    let iconValue = existingIcon || '☕';
    if (f_icon_img.files[0]) {
      const file = f_icon_img.files[0];
      // validasi ukuran (max 3MB biar base64 tidak kebesaran)
      if (file.size > 3 * 1024 * 1024) { alert('Foto kebesaran, max 3MB. Kompres dulu ya.'); btnSave.disabled=false; btnSave.textContent = editId.value ? 'Update' : 'Simpan'; return; }
      try {
        iconValue = await uploadIcon(file);
      } catch (e) {
        const msg = e.message || '';
        const isRLS = msg.includes('row-level security') || msg.includes('AccessDenied') || msg.includes('403') || msg.includes('violates');
        if (isRLS) {
          // FALLBACK: simpan sebagai base64 dataURL langsung ke kolom foto (tanpa storage)
          // Tetap bisa edit, hanya butuh fix SQL nanti biar pakai storage URL
          if (!confirm('Upload ke Storage gagal (RLS belum di-set).\n\nDetail: ' + msg + '\n\nMau simpan foto sebagai base64 sementara biar tetap kesimpan?\n(Disarankan tetap RUN scripts/fix-storage-rls.sql nanti)')) {
            btnSave.disabled = false; btnSave.textContent = editId.value ? 'Update' : 'Simpan';
            return;
          }
          try {
            iconValue = await fileToDataURL(file);
          } catch (err2) {
            alert('Gagal convert foto: ' + err2.message);
            btnSave.disabled = false; btnSave.textContent = editId.value ? 'Update' : 'Simpan';
            return;
          }
        } else {
          alert('Gagal upload gambar: ' + msg);
          btnSave.disabled = false; btnSave.textContent = editId.value ? 'Update' : 'Simpan';
          return;
        }
      }
    }
    const payload = {
      name: f_name.value.trim(),
      foto: iconValue,
      cls: existingCls,
      cat: existingCat,
      link: f_link.value.trim(),
      plu_12oz: f_plu12.value.trim() || null,
      plu_16oz: f_plu16.value.trim() || null,
      bahan_hot_1: f_bahanHot[0].value.trim() || null,
      bahan_hot_2: f_bahanHot[1].value.trim() || null,
      bahan_hot_3: f_bahanHot[2].value.trim() || null,
      bahan_hot_4: f_bahanHot[3].value.trim() || null,
      bahan_hot_5: f_bahanHot[4].value.trim() || null,
      bahan_hot_6: f_bahanHot[5].value.trim() || null,
      bahan_hot_16oz_1: f_bahanHot16[0].value.trim() || null,
      bahan_hot_16oz_2: f_bahanHot16[1].value.trim() || null,
      bahan_hot_16oz_3: f_bahanHot16[2].value.trim() || null,
      bahan_hot_16oz_4: f_bahanHot16[3].value.trim() || null,
      bahan_hot_16oz_5: f_bahanHot16[4].value.trim() || null,
      bahan_hot_16oz_6: f_bahanHot16[5].value.trim() || null,
      bahan_12oz_1: f_bahan12[0].value.trim() || null,
      bahan_12oz_2: f_bahan12[1].value.trim() || null,
      bahan_12oz_3: f_bahan12[2].value.trim() || null,
      bahan_12oz_4: f_bahan12[3].value.trim() || null,
      bahan_12oz_5: f_bahan12[4].value.trim() || null,
      bahan_12oz_6: f_bahan12[5].value.trim() || null,
      bahan_16oz_1: f_bahan16[0].value.trim() || null,
      bahan_16oz_2: f_bahan16[1].value.trim() || null,
      bahan_16oz_3: f_bahan16[2].value.trim() || null,
      bahan_16oz_4: f_bahan16[3].value.trim() || null,
      bahan_16oz_5: f_bahan16[4].value.trim() || null,
      bahan_16oz_6: f_bahan16[5].value.trim() || null,
      catatan: f_catatan.value.trim() || null
    };
    // tambahkan has_percepatan untuk dr_coffee jika perlu
    if (currentTable === 'dr_coffee_menus') {
      payload.has_percepatan = payload.name && (payload.name.includes('Jadi') || payload.name.includes('Coffee Latte') || payload.name.includes('Latte'));
    }
    let error;
    let res;
    if (editId.value) {
      res = await supabase.from(currentTable).update(payload).eq('id', parseInt(editId.value));
      error = res.error;
      // fallback kalau kolom hot16 belum ada (belum RUN migrate)
      if (error && /bahan_hot_16oz|PGRST204/i.test(error.message)) {
        alert('Kolom HOT16 belum ada di Supabase.\n\nRUN dulu: scripts/add-hot-16oz.sql\nLink: https://supabase.com/dashboard/project/xsacwgxxoptdrgbbzzib/sql/new\n\nMencoba simpan tanpa kolom baru...');
        delete payload.bahan_hot_16oz_1; delete payload.bahan_hot_16oz_2; delete payload.bahan_hot_16oz_3; delete payload.bahan_hot_16oz_4; delete payload.bahan_hot_16oz_5; delete payload.bahan_hot_16oz_6;
        const retry = await supabase.from(currentTable).update(payload).eq('id', parseInt(editId.value));
        error = retry.error; res = retry;
      }
    } else {
      res = await supabase.from(currentTable).insert([payload]);
      error = res.error;
      if (error && /bahan_hot_16oz|PGRST204/i.test(error.message)) {
        alert('Kolom HOT16 belum ada di Supabase.\n\nRUN dulu: scripts/add-hot-16oz.sql\n\nMencoba simpan tanpa kolom baru...');
        delete payload.bahan_hot_16oz_1; delete payload.bahan_hot_16oz_2; delete payload.bahan_hot_16oz_3; delete payload.bahan_hot_16oz_4; delete payload.bahan_hot_16oz_5; delete payload.bahan_hot_16oz_6;
        const retry = await supabase.from(currentTable).insert([payload]);
        error = retry.error; res = retry;
      }
    }
    btnSave.disabled = false; btnSave.textContent = editId.value ? 'Update' : 'Simpan';
    if (error) { alert('Gagal simpan: ' + error.message + '\n\nJika RLS error, cek SQL Editor: policy insert harus allow public.'); setStatus('Gagal: ' + error.message, false); }
    else { setStatus('✅ Tersimpan (' + currentTable + '): ' + payload.name); resetForm(); await load(); }
  };

  searchEl.addEventListener('input', render);

  // realtime JA-DI aja (udah sama kayak Dr Coffee, gak pakai tab atas)
  supabase.channel('admin_ja_di').on('postgres_changes',{event:'*',schema:'public',table:'ja_di_menus'},()=>load()).subscribe();

  load();
</script>
</body>
