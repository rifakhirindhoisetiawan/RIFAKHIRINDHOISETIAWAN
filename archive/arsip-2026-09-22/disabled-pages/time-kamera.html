<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIME KAMERA</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #f2f2f7;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 0;
      color: #1f2937;
    }

    .phone {
      width: 100%;
      max-width: 100%;
      background: #f2f2f7;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
    }

    @media (min-width: 800px) {
      .phone {
        max-width: 800px;
        margin: 0 auto;
      }
    }

    .viewfinder {
      position: relative;
      margin: 4px auto;
      background: #000000;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 9 / 16;
      height: calc(100vh - 100px);
      height: calc(100dvh - 100px);
      max-height: 640px;
      width: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewfinder video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .viewfinder .fallback {
      font-size: 56px;
      opacity: 0.4;
    }

    .flip-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      z-index: 2;
    }

    .flip-btn svg {
      width: 20px;
      height: 20px;
    }

    .flip-btn:active {
      transform: scale(0.92);
    }

    .watermark {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
      font-family: "Consolas", "SF Mono", monospace;
    }

    .wm-time {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .wm-loc {
      font-size: 11px;
      color: #d1d5db;
      margin-top: 2px;
      word-break: break-all;
    }

    .controls {
      padding: 14px 18px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .shutter {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 5px solid #ffffff;
      background: #ffffff;
      box-shadow: 0 0 0 1px #e5e5ea, 0 4px 12px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      position: relative;
      outline: none;
    }

    .shutter::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px #e5e5ea;
    }

    .shutter:active {
      transform: scale(0.92);
    }

    .shot-preview {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      z-index: 10;
    }

    .shot-preview.show {
      display: flex;
    }

    .shot-preview canvas {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 12px;
      background: #000;
    }

    .shot-btns {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 22px;
      border-radius: 12px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }

    .btn-ghost {
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #e5e5ea;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="viewfinder" id="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <div class="fallback" id="fallback">📷</div>
      <button class="flip-btn" id="flipBtn" title="Ganti kamera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 7h3l2-3h6l2 3h3v13H4V7z" />
          <circle cx="12" cy="13" r="3.5" />
        </svg>
      </button>
      <div class="watermark">
        <div class="wm-time" id="wmTime">--:--:--</div>
        <div class="wm-loc" id="wmLoc">lokasi belum tersedia</div>
      </div>
    </div>

    <div class="controls">
      <button class="shutter" id="shutter" title="Ambil foto"></button>
    </div>
  </div>

  <div class="shot-preview" id="shotPreview">
    <canvas id="shotCanvas"></canvas>
    <div class="shot-btns">
      <button class="btn btn-primary" id="saveShot">Simpan</button>
      <button class="btn btn-ghost" id="closeShot">Tutup</button>
    </div>
  </div>

  <script>
    let lat = null;
    let lng = null;
    let place = "lokasi belum tersedia";

    const wmTime = document.getElementById("wmTime");
    const wmLoc = document.getElementById("wmLoc");

    function fmt(n) {
      return String(n).padStart(2, "0");
    }

    function tick() {
      const d = new Date();
      wmTime.textContent = `${fmt(d.getHours())}:${fmt(d.getMinutes())}:${fmt(d.getSeconds())}`;
    }
    tick();
    setInterval(tick, 1000);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          lat = pos.coords.latitude.toFixed(6);
          lng = pos.coords.longitude.toFixed(6);
          place = `${lat}, ${lng}`;
          wmLoc.textContent = place;
        },
        () => {},
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    const video = document.getElementById("video");
    const fallback = document.getElementById("fallback");

    let facingMode = "environment";

    function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        video.style.display = "none";
        fallback.style.display = "flex";
        return;
      }
      if (video.srcObject) {
        video.srcObject.getTracks().forEach((t) => t.stop());
        video.srcObject = null;
      }
      navigator.mediaDevices
        .getUserMedia({ video: { facingMode }, audio: false })
        .then((stream) => {
          video.srcObject = stream;
          fallback.style.display = "none";
        })
        .catch(() => {
          video.style.display = "none";
          fallback.style.display = "flex";
        });
    }

    startCamera();

    document.getElementById("flipBtn").addEventListener("click", () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      startCamera();
    });

    const shotPreview = document.getElementById("shotPreview");
    const shotCanvas = document.getElementById("shotCanvas");
    const W = 720;
    const H = 1280;

    document.getElementById("shutter").addEventListener("click", () => {
      const d = new Date();
      const stamp =
        `${fmt(d.getDate())}/${fmt(d.getMonth() + 1)}/${d.getFullYear()} ` +
        `${fmt(d.getHours())}:${fmt(d.getMinutes())}:${fmt(d.getSeconds())}`;
      const loc = place;

      shotCanvas.width = W;
      shotCanvas.height = H;
      const ctx = shotCanvas.getContext("2d");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);

      if (video.videoWidth) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const scale = Math.max(W / vw, H / vh);
        const sw = vw * scale;
        const sh = vh * scale;
        ctx.drawImage(video, (W - sw) / 2, (H - sh) / 2, sw, sh);
      } else {
        ctx.font = "90px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("📷", W / 2, H / 2 - 40);
      }

      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(0, H - 130, W, 130);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 46px Consolas, monospace";
      ctx.textAlign = "left";
      ctx.fillText(stamp, 24, H - 66);
      ctx.font = "20px Consolas, monospace";
      ctx.fillStyle = "#d1d5db";
      ctx.fillText(loc, 24, H - 30);

      shotPreview.classList.add("show");
    });

    document.getElementById("closeShot").addEventListener("click", () => {
      shotPreview.classList.remove("show");
    });

    document.getElementById("saveShot").addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = shotCanvas.toDataURL("image/jpeg", 0.92);
      a.download = `time-kamera-${Date.now()}.jpg`;
      a.click();
    });
  </script>
</body>
</html>
