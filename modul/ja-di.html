    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }

      @media (min-width: 800px) {
        .phone {
          max-width: 800px;
          margin: 0 auto;
        }
      }

      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0 14px;
      }
      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px 14px;
        color: #222;
        font-size: 14px;
        background: #f9f9f9;
      }
      .search-box:focus-within {
        border-color: #888;
        background: #fff;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: #222;
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }
      .search-box input::placeholder {
        color: #c3c8d1;
      }
      .search-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
        width: 18px;
        height: 18px;
      }

      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 4px 18px 60px 18px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .menu-wrap::-webkit-scrollbar {
        display: none;
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px 10px;
      }

      @media (min-width: 768px) {
        .grid {
          gap: 22px 14px;
        }
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: default;
        background: none;
        border: none;
      }

      .icon-tile {
        width: 100%;
        max-width: 110px;
        aspect-ratio: 9 / 16;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        margin-bottom: 8px;
        color: #fff;
        position: relative;
      }
      .icon-photo {
        padding: 0;
        overflow: hidden;
      }
      .icon-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: inherit;
        display: block;
      }
      .icon-photo.has-photo {
        background-size: cover;
        background-position: center;
      }
      .icon-photo.has-photo img {
        display: none;
      }

      @media (max-width: 360px) {
        .icon-tile {
          max-width: 95px;
          border-radius: 14px;
        }
      }

      .item.active-modul {
        cursor: pointer;
        text-decoration: none;
      }
      .item.active-modul span {
        color: #1f2937;
        font-weight: 800;
      }

      .item span {
        font-size: 11px;
        font-weight: 700;
        color: #b6bac2;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .item span .plu-tag {
        font-weight: 600;
        color: #3b82f6;
        font-size: 10px;
        display: block;
      }

      @media (min-width: 768px) {
        .item span {
          font-size: 12px;
        }
      }

      .g-a {
        background: linear-gradient(135deg, #a5b4fc, #818cf8);
      }
      .g-b {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      }
      .g-c {
        background: linear-gradient(135deg, #93c5fd, #60a5fa);
      }
      .g-d {
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
      }
      .g-e {
        background: linear-gradient(135deg, #6ee7b7, #34d399);
      }
      .g-f {
        background: linear-gradient(135deg, #fcd34d, #fbbf24);
      }
      .g-g {
        background: linear-gradient(135deg, #fca5a5, #f87171);
      }
      .g-h {
        background: linear-gradient(135deg, #f0abfc, #e879f9);
      }

      .empty-msg {
        grid-column: 1 / -1;
        text-align: center;
        color: #9aa0ab;
        font-size: 13px;
        padding: 40px 0;
        font-weight: 600;
      }
    </style>

      let menus = [...fallbackMenus];
      let isSupabase = false;
      const menuGrid = document.getElementById('menuGrid');
      const searchInput = document.getElementById('searchInput');
      const statusEl = document.getElementById('status');
      function slugify(str) {
        return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }
      function normalizeMenu(m) {
        let link = m.link || '';
        let cat = m.cat || '';
        if (!link && cat.endsWith('.html')) { link = cat; cat = ''; }
        if (cat && cat.includes('.html') && !link) { link = cat; cat = ''; }
        return { ...m, link, cat };
      }
      function renderMenu() {
        const q = (searchInput.value || '').trim().toLowerCase();
        const filtered = menus.map(normalizeMenu).filter(m => {
          if (!q) return true;
          return m.name.toLowerCase().includes(q) ||
                 (m.cat && m.cat.toLowerCase().includes(q)) ||
                 (m.plu && m.plu.toLowerCase().includes(q));
        });
        if (filtered.length === 0) {
          menuGrid.innerHTML = '<div class="empty-msg">Tidak ditemukan</div>';
          return;
        }
        menuGrid.innerHTML = filtered.map(m => {
          const slug = slugify(m.name);
          const hasLink = m.link && m.link.length > 0;
          const tag = hasLink ? 'a' : 'div';
          const href = hasLink ? ' href="' + m.link + '"' : '';
          const plu = m.plu ? '<span class="plu-tag">' + m.plu + '</span>' : '';
          return '<' + tag + ' class="item' + (hasLink ? ' active-modul' : '') + '"' + href + '>' +
                   '<div class="icon-tile ' + (m.cls||'g-a') + ' icon-photo" data-slug="' + slug + '"><span style="font-size:32px">' + (m.icon||'☕') + '</span></div>' +
                   '<span>' + m.name + plu + '</span>' +
                 '</' + tag + '>';
        }).join('');
        loadMenuPhotos();
      }
      function loadMenuPhotos() {
        const exts = ['.jpg', '.jpeg', '.png', '.svg', '.webp'];
        document.querySelectorAll('.icon-photo[data-slug]').forEach((tile) => {
          const slug = tile.dataset.slug;
          const folder = '../images/ja-di-photos/' + slug + '/';
          function tryNum(num) {
            if (num > 20) { tile.classList.remove('has-photo'); return; }
            function tryExt(extIdx) {
              if (extIdx >= exts.length) { tryNum(num + 1); return; }
              const url = folder + num + exts[extIdx];
              const img = new Image();
              img.onload = () => {
                tile.style.backgroundImage = 'url(' + url + ')';
                tile.classList.add('has-photo');
                tile.innerHTML = '';
              };
              img.onerror = () => tryExt(extIdx + 1);
              img.src = url;
            }
            tryExt(0);
          }
          tryNum(1);
        });
      }
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) loadMenuPhotos();
      });
      searchInput.addEventListener('input', renderMenu);
      async function loadFromSupabase() {
        statusEl.textContent = 'Memuat dari Supabase...';
        try {
          const { data, error } = await supabase.from('ja_di_menus').select('*').order('id', { ascending: true });
          if (error) throw error;
          if (data && data.length > 0) {
            menus = data;
            isSupabase = true;
            statusEl.textContent = '✅ ' + data.length + ' menu dari Supabase';
            statusEl.style.color = '#10b981';
          } else {
            statusEl.textContent = '⚠️ Supabase kosong, pakai data lokal';
            statusEl.style.color = '#f59e0b';
          }
        } catch (e) {
          console.warn('Supabase error, fallback:', e.message);
          statusEl.textContent = '⚠️ Offline (' + e.message.slice(0,40) + ')';
          statusEl.style.color = '#ef4444';
          menus = [...fallbackMenus];
        }
        renderMenu();
        setTimeout(() => { statusEl.textContent = isSupabase ? '✅ Live dari Supabase' : '📦 Data lokal'; statusEl.style.color = isSupabase ? '#10b981' : '#9aa0ab'; }, 3000);
      }
      try {
        supabase.channel('ja_di_menus_changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'ja_di_menus' }, () => {
            console.log('Realtime change, reload...');
            loadFromSupabase();
          })
          .subscribe();
      } catch(e) { console.log('Realtime not enabled', e.message); }
      loadFromSupabase();
    </script>
