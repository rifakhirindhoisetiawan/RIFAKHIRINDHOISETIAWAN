<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <title>MYLOVE</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        position: fixed;
        inset: 0;
        width: 100%;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        display: block;
        padding: 0;
        margin: 0;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      .app {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
      }

      @media (max-height: 520px) {
        .stepper-row {
          padding: 4px 10px 2px;
        }
        .stepper {
          padding: 4px 8px;
        }
        .layout-cycle {
          width: 28px;
          height: 28px;
          font-size: 9px;
        }
        .canvas-wrap {
          padding: 0 8px 4px;
        }
      }

      @media (min-width: 768px) {
        html,
        body {
          height: auto;
          min-height: 100%;
          overflow: auto;
          position: static;
          inset: auto;
          width: auto;
        }
        body {
          display: flex;
          flex-direction: column;
        }
        .app {
          max-width: 800px;
          margin: 0 auto;
          height: auto;
          min-height: auto;
          position: relative;
          top: auto;
          left: auto;
          right: auto;
          bottom: auto;
          padding: 24px 0;
          padding-bottom: 24px;
        }
        .stepper-row {
          padding: 22px 20px 18px;
        }
        .stepper {
          padding: 10px 14px;
          border-radius: 16px;
        }
        .canvas-wrap {
          padding: 0 20px 16px;
        }
      }

      .stepper-row {
        padding: max(12px, env(safe-area-inset-top)) 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        flex: 0 0 auto;
        flex-shrink: 0;
      }
      .stepper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: none;
        border-radius: 0;
        padding: 5px 0;
        background: transparent;
        gap: 10px;
      }
      .left-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .stepper .value {
        font-size: 15px;
        font-weight: 800;
        color: #1f2937;
        min-width: 26px;
        text-align: center;
      }
      .stepper .btns {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
      }
      .step-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .step-btn:disabled {
        background: #d9dde3;
        box-shadow: none;
        cursor: not-allowed;
      }

      .trash-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .trash-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      .add-photo-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .add-photo-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      .aspect-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        letter-spacing: -0.3px;
      }
      .aspect-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      .layout-cycle {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        line-height: 1;
        overflow: hidden;
      }
      .layout-cycle:active {
        opacity: 0.85;
        transform: scale(0.93);
      }

      .dl-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 8px;
        border: none;
        background: #6366f1;
        color: #fff;
        cursor: pointer;
        outline: none;
        transition: all 0.15s ease;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .dl-btn:active {
        opacity: 0.85;
        transform: scale(0.93);
      }
      .dl-btn:disabled {
        background: #d9dde3;
        box-shadow: none;
        cursor: not-allowed;
        transform: none;
        opacity: 1;
      }

      .canvas-wrap {
        padding: 0 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .grid-frame {
        width: 100%;
        max-width: 100%;
        max-height: 100%;
        height: auto;
        border-radius: 14px;
        overflow: hidden;
        background: #ffffff;
        display: grid;
        gap: 2px;
        padding: 8px;
        border: 2px solid #c7d2fe;
        box-shadow: 0 4px 18px rgba(99, 102, 241, 0.12);
        transition: aspect-ratio 0.2s ease;
        position: relative;
        min-width: 0;
        min-height: 0;
        box-sizing: border-box;
        touch-action: none;
      }
      .slot {
        position: relative;
        background: #f3f4f6;
        border-radius: 0px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: pointer;
        transition:
          transform 0.1s ease,
          border 0.1s ease;
        min-width: 0;
        min-height: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .slot img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        cursor: grab;
        -webkit-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
        -webkit-touch-callout: none;
        touch-action: none;
        max-width: none;
        max-height: none;
        pointer-events: auto;
      }
      .slot img:active {
        cursor: grabbing;
      }
      .slot.dragging {
        opacity: 0.4;
      }
      .slot.drag-over {
        border: 2px dashed #6366f1;
        background: #eef2ff;
      }
      #dragGhost {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1.05);
        display: none;
      }
      #dragGhost img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .slot .placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: #b0b5bf;
        font-size: 11px;
        font-weight: 700;
        z-index: 2;
        pointer-events: none;
      }
      .slot .placeholder svg {
        color: #6366f1;
      }

      input[type="file"] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="stepper-row">
        <div class="stepper">
          <div class="left-controls">
            <button class="aspect-btn active" id="aspectBtn" title="Ukuran">
              <svg
                id="aspectIcon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M8 3H5a2 2 0 0 0-2 2v3" />
                <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
                <path d="M3 16v3a2 2 0 0 0 2 2h3" />
                <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
              </svg>
            </button>
            <button class="layout-cycle" id="layoutCycleBtn" title="Tata letak">
              <svg
                id="layoutIcon"
                width="16"
                height="16"
                viewBox="0 0 24 24"

                stroke="currentColor"

                stroke-linecap="round"

              >
                <polyline points="16 3 21 3 21 8" />
                <line x1="4" y1="20" x2="21" y2="3" />
                <polyline points="21 16 21 21 16 21" />
                <line x1="15" y1="15" x2="21" y2="21" />
                <line x1="4" y1="4" x2="9" y2="9" />
              </svg>
            </button>
            <button class="dl-btn" id="downloadBtn" title="Download" disabled>
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"

              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />

            </button>
            <button
              class="add-photo-btn"
              id="addPhotoBtn"

              <svg

            </button>
            <button class="trash-btn" id="trashBtn" title="Hapus Semua Foto">
              <svg
                width="16"
                height="16"

                stroke-linecap="round"

              >
                <polyline points="3 6 5 6 21 6"></polyline>
                <path
                  d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                ></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </div>
          <div class="btns">
            <button class="step-btn" id="minusBtn" aria-label="Kurang">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"

              >
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>
            <span class="value" id="countValue">3</span>
            <button class="step-btn" id="plusBtn" aria-label="Tambah">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />

      <div class="canvas-wrap">
        <div class="grid-frame" id="gridFrame"></div>
      </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" />
    <input type="file" id="multiFileInput" accept="image/*" multiple />
    <canvas id="hiddenCanvas" style="display: none"></canvas>
    <div id="dragGhost"></div>

    <script>
      const MIN_COUNT = 1;
      const MAX_COUNT = 25;

      let count = 3;
      let images = {};
      let activeSlot = null;
      const ASPECTS = ["1/1", "4/5", "3/4", "16/9"];
      let currentAspectIndex = 0;
      let currentAspect = ASPECTS[0];
      let currentLayout3 = "left-big";
      let currentLayout4 = "left-big";
      let currentLayout5 = "left-big";
      const LAYOUTS = ["left-big", "right-big", "top-big", "bottom-big"];

      let dragGhost = null;
      let suppressClick = false;

      let imgTx = {};
      let gIdx = null;
      let gMode = null;
      let gLastX = 0;
      let gLastY = 0;
      let gPinchDist = 0;

      const gridFrame = document.getElementById("gridFrame");
      const fileInput = document.getElementById("fileInput");
      const multiFileInput = document.getElementById("multiFileInput");
      const downloadBtn = document.getElementById("downloadBtn");
      const countValue = document.getElementById("countValue");
      const minusBtn = document.getElementById("minusBtn");
      const plusBtn = document.getElementById("plusBtn");
      const trashBtn = document.getElementById("trashBtn");
      const addPhotoBtn = document.getElementById("addPhotoBtn");
      const aspectBtn = document.getElementById("aspectBtn");
      const layoutCycleBtn = document.getElementById("layoutCycleBtn");
      dragGhost = document.getElementById("dragGhost");

      const DRAG_THRESHOLD = 10;

      function clearDragHighlights() {
        document
          .querySelectorAll(".slot.drag-over, .slot.dragging")
          .forEach((s) => {
            s.classList.remove("drag-over", "dragging");
          });
      }

      function hideGhost() {
        if (dragGhost) {
          dragGhost.style.display = "none";
          dragGhost.innerHTML = "";
        }
      }

      function showGhost(src, size, x, y) {
        if (!dragGhost) return;
        dragGhost.innerHTML = "";
        const gImg = document.createElement("img");
        gImg.src = src;
        dragGhost.appendChild(gImg);
        dragGhost.style.width = size + "px";
        dragGhost.style.height = size + "px";
        dragGhost.style.left = x + "px";
        dragGhost.style.top = y + "px";
        dragGhost.style.display = "block";
      }

      function swapSlots(fromIdx, toIdx) {
        if (fromIdx === null || fromIdx === toIdx) return;
        const temp = images[fromIdx];
        images[fromIdx] = images[toIdx];
        images[toIdx] = temp;
        if (!images[fromIdx]) delete images[fromIdx];
        if (!images[toIdx]) delete images[toIdx];
        const tTemp = imgTx[fromIdx];
        imgTx[fromIdx] = imgTx[toIdx];
        imgTx[toIdx] = tTemp;
        renderGrid();
        checkReady();
      }

      function getTx(idx) {
        return imgTx[idx] || (imgTx[idx] = { scale: 1, fx: 0, fy: 0 });
      }

      function applyTx(img, idx) {
        const t = getTx(idx);
        const r = img.getBoundingClientRect();
        img.style.transform = `translate(${t.fx * r.width}px, ${t.fy * r.height}px) scale(${t.scale})`;
        img.style.transformOrigin = "center center";
      }

      function clampTx(idx) {
        const t = getTx(idx);
        const m = Math.max(0, (t.scale - 1) / 2);
        if (t.fx > m) t.fx = m;
        if (t.fx < -m) t.fx = -m;
        if (t.fy > m) t.fy = m;
        if (t.fy < -m) t.fy = -m;
        return t;
      }

      function anchorFromPoint(el, x, y) {
        if (!el) return { ax: 0, ay: 0 };
        const r = el.getBoundingClientRect();
        return {
          ax: (x - r.left) / r.width - 0.5,
          ay: (y - r.top) / r.height - 0.5,
        };
      }

      function zoomAt(idx, newScale, ax, ay) {
        const t = getTx(idx);
        const s0 = t.scale || 1;
        const s1 = Math.min(4, Math.max(1, newScale));
        if (s1 === s0) return;
        const ratio = s1 / s0;
        t.fx = ax - (ax - t.fx) * ratio;
        t.fy = ay - (ay - t.fy) * ratio;
        t.scale = s1;
        clampTx(idx);
        const img = document.querySelector(
          `.slot[data-slot="${idx}"] .slot-img`,
        );
        if (img) applyTx(img, idx);
      }

      function elementSlot(x, y) {
        const el = document.elementFromPoint(x, y);
        if (!el) return null;
        const s = el.closest(".slot");
        return s ? parseInt(s.dataset.slot, 10) : null;
      }

      function endGesture() {
        const wasReorder = gMode === "reorder";
        const fromIdx = gIdx;
        gIdx = null;
        gMode = null;
        gPinchDist = 0;
        hideGhost();
        clearDragHighlights();
        return wasReorder ? fromIdx : null;
      }

      document.addEventListener(
        "touchmove",
        (e) => {
          if (gIdx === null) return;

          if (e.touches.length === 2) {
            const t0 = e.touches[0];
            const t1 = e.touches[1];
            const d = Math.hypot(
              t0.clientX - t1.clientX,
              t0.clientY - t1.clientY,
            );
            if (gPinchDist > 0 && d > 0) {
              const img = document.querySelector(
                `.slot[data-slot="${gIdx}"] .slot-img`,
              );
              const mx = (t0.clientX + t1.clientX) / 2;
              const my = (t0.clientY + t1.clientY) / 2;
              const a = anchorFromPoint(img, mx, my);
              zoomAt(gIdx, getTx(gIdx).scale * (d / gPinchDist), a.ax, a.ay);
            }
            gPinchDist = d;
            gMode = "zoom";
            suppressClick = true;
            e.preventDefault();
            return;
          }

          if (e.touches.length !== 1) return;
          const t = e.touches[0];
          const dx = t.clientX - gLastX;
          const dy = t.clientY - gLastY;
          gLastX = t.clientX;
          gLastY = t.clientY;
          gPinchDist = 0;

          if (!gMode || gMode === "zoom") {
            const targetIdx = elementSlot(t.clientX, t.clientY);
            if (gMode === "zoom") {
              gMode = "pan";
              suppressClick = true;
              gLastX = t.clientX;
              gLastY = t.clientY;
            } else if (targetIdx !== null && targetIdx !== gIdx) {
              gMode = "reorder";
              suppressClick = true;
              const srcSlot = document.querySelector(
                `.slot[data-slot="${gIdx}"]`,
              );
              if (srcSlot) {
                srcSlot.classList.add("dragging");
                const rect = srcSlot.getBoundingClientRect();
                showGhost(
                  images[gIdx],
                  Math.min(rect.width, rect.height) * 0.55,
                  t.clientX,
                  t.clientY,
                );
              }
              e.preventDefault();
            } else if (Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD) {
              const tx = getTx(gIdx);
              if (tx && tx.scale > 1) {
                gMode = "pan";
              } else {
                gMode = "reorder";
                const srcSlot = document.querySelector(
                  `.slot[data-slot="${gIdx}"]`,
                );
                if (srcSlot) {
                  srcSlot.classList.add("dragging");
                  const rect = srcSlot.getBoundingClientRect();
                  showGhost(
                    images[gIdx],
                    Math.min(rect.width, rect.height) * 0.55,
                    t.clientX,
                    t.clientY,
                  );
                }
              }
              suppressClick = true;
              e.preventDefault();
            }
          }

          if (gMode === "pan") {
            const tx = getTx(gIdx);
            const img = document.querySelector(
              `.slot[data-slot="${gIdx}"] .slot-img`,
            );
            const r = img ? img.getBoundingClientRect() : { width: 1, height: 1 };
            tx.fx += dx / (r.width || 1);
            tx.fy += dy / (r.height || 1);
            clampTx(gIdx);
            if (img) applyTx(img, gIdx);
            e.preventDefault();
          } else if (gMode === "reorder") {
            e.preventDefault();
            if (dragGhost && dragGhost.style.display === "block") {
              dragGhost.style.left = t.clientX + "px";
              dragGhost.style.top = t.clientY + "px";
            }
            clearDragHighlights();
            const srcSlot = document.querySelector(
              `.slot[data-slot="${gIdx}"]`,
            );
            if (srcSlot) srcSlot.classList.add("dragging");
            const ghostShown =
              dragGhost && dragGhost.style.display === "block";
            if (ghostShown) dragGhost.style.display = "none";
            const targetIdx = elementSlot(t.clientX, t.clientY);
            if (ghostShown) dragGhost.style.display = "block";
            if (targetIdx !== null && targetIdx !== gIdx) {
              const ts = document.querySelector(
                `.slot[data-slot="${targetIdx}"]`,
              );
              if (ts) ts.classList.add("drag-over");
            }
          }
        },
        { passive: false },
      );

      document.addEventListener(
        "touchend",
        (e) => {
          if (gIdx === null) return;
          const wasReorder = gMode === "reorder";
          if (wasReorder) {
            if (dragGhost) dragGhost.style.display = "none";
            const targetIdx = elementSlot(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            if (targetIdx !== null && targetIdx !== gIdx) {
              swapSlots(gIdx, targetIdx);
            }
            suppressClick = true;
            setTimeout(() => {
              suppressClick = false;
            }, 300);
          } else if (gMode) {
            suppressClick = true;
            setTimeout(() => {
              suppressClick = false;
            }, 200);
          }
          endGesture();
        },
        { passive: true },
      );

      document.addEventListener(
        "touchcancel",
        () => {
          endGesture();
        },
        { passive: true },
      );

      document.addEventListener(
        "mousemove",
        (e) => {
          if (gIdx === null || gMode === "zoom") return;
          const dx = e.clientX - gLastX;
          const dy = e.clientY - gLastY;
          gLastX = e.clientX;
          gLastY = e.clientY;

          if (!gMode) {
            const targetIdx = elementSlot(e.clientX, e.clientY);
            if (targetIdx !== null && targetIdx !== gIdx) {
              gMode = "reorder";
              suppressClick = true;
              const srcSlot = document.querySelector(
                `.slot[data-slot="${gIdx}"]`,
              );
              if (srcSlot) {
                srcSlot.classList.add("dragging");
                const rect = srcSlot.getBoundingClientRect();
                showGhost(
                  images[gIdx],
                  Math.min(rect.width, rect.height) * 0.55,
                  e.clientX,
                  e.clientY,
                );
              }
            } else if (Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD) {
              const tx = getTx(gIdx);
              if (tx && tx.scale > 1) {
                gMode = "pan";
              } else {
                gMode = "reorder";
                const srcSlot = document.querySelector(
                  `.slot[data-slot="${gIdx}"]`,
                );
                if (srcSlot) {
                  srcSlot.classList.add("dragging");
                  const rect = srcSlot.getBoundingClientRect();
                  showGhost(
                    images[gIdx],
                    Math.min(rect.width, rect.height) * 0.55,
                    e.clientX,
                    e.clientY,
                  );
                }
              }
              suppressClick = true;
            }
          }

          if (gMode === "pan") {
            const tx = getTx(gIdx);
            const img = document.querySelector(
              `.slot[data-slot="${gIdx}"] .slot-img`,
            );
            const r = img ? img.getBoundingClientRect() : { width: 1, height: 1 };
            tx.fx += dx / (r.width || 1);
            tx.fy += dy / (r.height || 1);
            clampTx(gIdx);
            if (img) applyTx(img, gIdx);
          } else if (gMode === "reorder") {
            if (dragGhost && dragGhost.style.display === "block") {
              dragGhost.style.left = e.clientX + "px";
              dragGhost.style.top = e.clientY + "px";
            }
            clearDragHighlights();
            const srcSlot = document.querySelector(
              `.slot[data-slot="${gIdx}"]`,
            );
            if (srcSlot) srcSlot.classList.add("dragging");
            const ghostShown =
              dragGhost && dragGhost.style.display === "block";
            if (ghostShown) dragGhost.style.display = "none";
            const targetIdx = elementSlot(e.clientX, e.clientY);
            if (ghostShown) dragGhost.style.display = "block";
            if (targetIdx !== null && targetIdx !== gIdx) {
              const ts = document.querySelector(
                `.slot[data-slot="${targetIdx}"]`,
              );
              if (ts) ts.classList.add("drag-over");
            }
          }
        },
      );

      document.addEventListener("mouseup", (e) => {
        if (gIdx === null) return;

        if (wasReorder) {

          const targetIdx = elementSlot(e.clientX, e.clientY);
          if (targetIdx !== null && targetIdx !== gIdx) {

      function checkReady() {

        downloadBtn.disabled = filled === 0;

      function updateCount(delta) {
        const next = count + delta;
        if (next < MIN_COUNT || next > MAX_COUNT) return;
        count = next;
        minusBtn.disabled = count <= MIN_COUNT;
        plusBtn.disabled = count >= MAX_COUNT;
        Object.keys(images).forEach((k) => {
          if (parseInt(k) >= count) {
            delete images[k];
            delete imgTx[k];
          }
        });
        renderGrid();
        checkReady();
      }

        checkReady();

        currentAspect = ASPECTS[currentAspectIndex];
        renderGrid();

        if (count === 4) return currentLayout4;

        else if (count === 5) currentLayout5 = layout;

            for (let idx = 0; idx < 5; idx++) {

              let c = idx % cols;
              let r = Math.floor(idx / cols);

      function drawCover(ctx, img, x, y, w, h, idx) {
        if (w <= 0 || h <= 0) return;
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();

        const imgRatio = img.width / img.height;
        const cellRatio = w / h;
        let dw, dh, dx, dy;
        if (imgRatio > cellRatio) {
          dh = h;
          dw = h * imgRatio;
          dx = x + (w - dw) / 2;
          dy = y;
        } else {
          dw = w;
          dh = w / imgRatio;
          dx = x;
          dy = y + (h - dh) / 2;
        }

        const t = idx != null && imgTx[idx]
          ? imgTx[idx]
          : { scale: 1, fx: 0, fy: 0 };
        const cx = x + w / 2;
        const cy = y + h / 2;
        ctx.translate(cx + t.fx * w, cy + t.fy * h);
        ctx.scale(t.scale, t.scale);
        ctx.drawImage(img, dx - cx, dy - cy, dw, dh);
        ctx.restore();
      }

      minusBtn.disabled = count <= MIN_COUNT;
      plusBtn.disabled = count >= MAX_COUNT;
      renderGrid();
    </script>
  </body>
</html>
