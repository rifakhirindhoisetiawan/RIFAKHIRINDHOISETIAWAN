<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHELVING LF2-4</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 0;
    }

    .phone {
      width: 100%;
      max-width: 100%;
      background: #ffffff;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
    }

    @media (min-width: 800px) {
      .phone {
        max-width: 800px;
        margin: 0 auto;
      }
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px 14px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px 14px;
      color: #222;
      font-size: 14px;
      background: #f9f9f9;
    }
    .search-box:focus-within {
      border-color: #888;
      background: #fff;
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 14px;
      color: #222;
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
    }
    .search-box input::placeholder {
      color: #c3c8d1;
    }
    .search-box svg {
      flex-shrink: 0;
      color: #c3c8d1;
      width: 18px;
      height: 18px;
    }

    .menu-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 4px 18px 24px 22px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .menu-wrap::-webkit-scrollbar {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 10px;
    }

    @media (min-width: 768px) {
      .grid {
        gap: 22px 14px;
      }
    }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: default;
      background: none;
      border: none;
    }

    .icon-tile {
      width: 100%;
      max-width: 110px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 8px;
      color: #fff;
      position: relative;
    }

    @media (max-width: 360px) {
      .icon-tile {
        max-width: 95px;
        border-radius: 14px;
      }
    }

    .item .name {
      font-size: 11px;
      font-weight: 800;
      color: #1f2937;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cap {
      font-size: 9px;
      font-weight: 600;
      color: #9aa0ab;
      line-height: 1.4;
      margin-top: 2px;
    }

    .cap b {
      color: #818cf8;
      font-weight: 700;
    }

    @media (min-width: 768px) {
      .item .name {
        font-size: 12px;
      }
      .cap {
        font-size: 10px;
      }
    }

    .g-a {
      background: linear-gradient(135deg, #a5b4fc, #818cf8);
    }
    .g-b {
      background: linear-gradient(135deg, #c4b5fd, #a78bfa);
    }
    .g-c {
      background: linear-gradient(135deg, #93c5fd, #60a5fa);
    }
    .g-d {
      background: linear-gradient(135deg, #67e8f9, #22d3ee);
    }
    .g-e {
      background: linear-gradient(135deg, #6ee7b7, #34d399);
    }
    .g-f {
      background: linear-gradient(135deg, #fcd34d, #fbbf24);
    }
    .g-g {
      background: linear-gradient(135deg, #fca5a5, #f87171);
    }
    .g-h {
      background: linear-gradient(135deg, #f0abfc, #e879f9);
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input id="searchInput" type="text" placeholder="Cari produk / PLU / barcode..." oninput="renderGrid()" />
      </div>
    </div>

    <div class="menu-wrap">
      <div class="grid" id="productGrid"></div>
    </div>
  </div>

  <script>
    const products = [{ name: "Teh Botol Sosro 350ml", no: 1, plu: "443770", barcode: "8996001300011", icon: "🍵", cls: "g-a" }, { name: "Teh Pucuk Harum 350ml", no: 2, plu: "443771", barcode: "8998866200154", icon: "🍃", cls: "g-b" }, { name: "Ultramilk Coklat 250ml", no: 3, plu: "443772", barcode: "8998009010015", icon: "🥛", cls: "g-c" }, { name: "Pocari Sweat 500ml", no: 4, plu: "443773", barcode: "8998866101017", icon: "💙", cls: "g-d" }, { name: "Mizone Lychee 500ml", no: 5, plu: "443774", barcode: "8996001340109", icon: "💧", cls: "g-e" }, { name: "Aqua 600ml", no: 6, plu: "443775", barcode: "8996001200008", icon: "🚰", cls: "g-f" }, { name: "Indomie Goreng 80g", no: 7, plu: "443776", barcode: "8991002101414", icon: "🍜", cls: "g-g" }, { name: "Coca Cola 390ml", no: 8, plu: "443777", barcode: "8992761934001", icon: "🥤", cls: "g-h" }, { name: "Fanta Strawberry 390ml", no: 9, plu: "443778", barcode: "8992761935007", icon: "🍓", cls: "g-a" }, { name: "Chitato 68g", no: 10, plu: "443779", barcode: "8992727713311", icon: "🍟", cls: "g-b" }];

    const productGrid = document.getElementById("productGrid");
    const searchInput = document.getElementById("searchInput");

    function renderGrid() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = products.filter(
        (p) =>
          !q ||
          p.name.toLowerCase().includes(q) ||
          String(p.plu).includes(q) ||
          p.barcode.includes(q)
      );

      if (filtered.length === 0) {
        productGrid.innerHTML = '<div class="cap" style="grid-column:1/-1;text-align:center;padding:40px 0;font-size:13px;">Tidak ditemukan</div>';
        return;
      }

      productGrid.innerHTML = filtered
        .map(
          (p) => `
            <div class="item">
              <div class="icon-tile ${p.cls}">${p.icon}</div>
              <span class="name">${p.name}</span>
              <span class="cap">No ${p.no}</span>
              <span class="cap">PLU <b>${p.plu}</b></span>
              <span class="cap">${p.barcode}</span>
            </div>
          `,
        )
        .join("");
    }

    renderGrid();
  </script>
</body>
</html>
