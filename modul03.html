";

      const menuGrid = document.getElementById("menuGrid");
      const searchInput = document.getElementById("searchInput");

      let currentCategory = null;

      function renderMenu() {
        const q = searchInput.value.trim().toLowerCase();
        let filtered = menus.filter((m) => {
          const matchSearch = !q || m.name.toLowerCase().includes(q);
          const matchCategory = !currentCategory || m.cat === currentCategory;
          if (!matchSearch) return false;
          if (currentCategory) return matchCategory && !m.isCategory;
          return true;
        });

        if (filtered.length === 0) {
          menuGrid.innerHTML = '<div class="empty-msg">Tidak ditemukan</div>';
          return;
        }

        menuGrid.innerHTML = filtered
          .map(
            (m) => `
              <a class="item active-modul" href="${m.link}">
                <div class="icon-tile ${m.cls} icon-photo"><img src="${LOGO_SRC}" alt="${m.name}" /></div>
                <span>${m.plu ? `<span class="plu-tag">PLU: ${m.plu}</span>` : ""}${m.name}</span>
              </a>
            `,
          )
          .join("");
      }

      function setCategory(cat) {
        if (currentCategory === cat) {
          currentCategory = null;
        } else {
          currentCategory = cat;
        }
        searchInput.value = "";
        renderMenu();
        updateCategoryUI();
      }

      function updateCategoryUI() {
        document.querySelectorAll(".item.active-modul").forEach((el) => {
          const tile = el.querySelector(".icon-tile");
          if (!tile) return;
          const cat = Array.from(tile.classList).find((c) => c.startsWith("g-"));
          if (!cat) return;
          if (cat === currentCategory) {
            el.style.outline = "";
          } else {
            el.style.outline = "";
          }
        });
      }

      searchInput.addEventListener("input", renderMenu);

      menuGrid.addEventListener("click", (e) => {
        const item = e.target.closest(".item");
        if (!item) return;
        const nameEl = item.querySelector("span");
        if (!nameEl) return;
        const name = nameEl.textContent;
        const catItem = menus.find((m) => m.name === name && m.isCategory);
        if (catItem && catItem.cat) {
          e.preventDefault();
          setCategory(catItem.cat);
        }
      });

      renderMenu();
    </script>
