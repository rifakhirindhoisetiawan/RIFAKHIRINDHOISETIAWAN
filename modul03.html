      .phone {

        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding-bottom: env(safe-area-inset-bottom, 20px);

          margin: 0 auto;
        }
      }

      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0 14px;
      }
      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px 14px;
        color: #222;
        font-size: 14px;
        background: #f9f9f9;
      }
      .search-box:focus-within {
        border-color: #888;
        background: #fff;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: #222;
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }
      .search-box input::placeholder {
        color: #c3c8d1;
      }
      .search-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
        width: 18px;
        height: 18px;
      }

      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 4px 18px 60px 18px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .menu-wrap::-webkit-scrollbar {
        display: none;
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px 10px;
      }

      @media (min-width: 768px) {
        .grid {
          gap: 22px 14px;
        }
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: default;
        background: none;
        border: none;
      }

      .icon-tile {
        width: 100%;
        max-width: 110px;
        aspect-ratio: 9 / 16;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        margin-bottom: 8px;
        color: #fff;
        position: relative;
      }
      .icon-photo {
        padding: 0;
        overflow: hidden;
      }
      .icon-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: inherit;
        display: block;
      }

      @media (max-width: 360px) {
        .icon-tile {
          max-width: 95px;
          border-radius: 14px;
        }
      }

      .item.active-modul {
        cursor: pointer;
        text-decoration: none;
      }
      .item.active-modul span {
        color: #1f2937;
        font-weight: 800;
      }

      .item span {
        font-size: 11px;
        font-weight: 700;
        color: #b6bac2;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .item span .plu-tag {
        font-weight: 600;
        color: #3b82f6;
        font-size: 10px;
        display: block;
      }

      @media (min-width: 768px) {
        .item span {
          font-size: 12px;
        }
      }

      .g-c {

      const menuGrid = document.getElementById("menuGrid");
      const searchInput = document.getElementById("searchInput");

      function renderMenu() {
        const q = searchInput.value.trim().toLowerCase();
        const filtered = menus.filter(
          (m) => !q || m.name.toLowerCase().includes(q),
        );

        if (filtered.length === 0) {
          menuGrid.innerHTML = '<div class="empty-msg">Tidak ditemukan</div>';
          return;
        }

        menuGrid.innerHTML = filtered
          .map(
            (m) => `
              <a class="item active-modul" href="${m.link}">
                <div class="icon-tile ${m.cls} icon-photo"><img src="${LOGO_SRC}" alt="${m.name}" /></div>
                <span>${m.plu ? `<span class="plu-tag">PLU: ${m.plu}</span>` : ""}${m.name}</span>
              </a>
            `,
          )
          .join("");
      }

      searchInput.addEventListener("input", renderMenu);

      renderMenu();
