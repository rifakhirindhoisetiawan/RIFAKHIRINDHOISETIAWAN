    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        position: relative;
      }

      /* ===== SCREEN SYSTEM ===== */
      .screen,
      .module-screen {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        position: absolute;
        inset: 0;
        background: #fff;
        z-index: 1;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.2s ease,
          visibility 0.2s;
      }
      .screen.active,
      .module-screen.active {
        opacity: 1;
        visibility: visible;
        z-index: 2;
      }
      #detailScreen.active {
        z-index: 4;
      }
      #moduleScreen.active {
        z-index: 3;
      }

      /* ===== SEARCH ROW ===== */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }
      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e3e6ec;
        border-radius: 14px;
        padding: 12px 14px;
        color: #1f2937;
        font-size: 13px;
        background: #fafbfc;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 13px;
        color: #1f2937;
        font-family: inherit;
      }
      .search-box input::placeholder {
        color: #c3c8d1;
      }
      .search-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
        width: 18px;
        height: 18px;
      }

      /* ===== MENU GRID ===== */
      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 4px 18px 20px 22px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px 12px;
      }

      @media (min-width: 768px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
          gap: 28px 20px;
        }
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: default;
        background: none;
        border: none;
      }

      .icon-tile {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        margin-bottom: 8px;
        color: #fff;
        position: relative;
        opacity: 0.55;
      }

      @media (min-width: 768px) {
        .icon-tile {
          width: 72px;
          height: 72px;
          border-radius: 18px;
          font-size: 24px;
        }
      }

      .item.active-modul {
        cursor: pointer;
        text-decoration: none;
      }
      .item.active-modul .icon-tile {
        opacity: 1;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        transition: transform 0.2s ease;
      }
      .item.active-modul:hover .icon-tile,
      .item.active-modul:active .icon-tile {
        transform: translateY(-3px);
      }
      .item.active-modul span {
        color: #1f2937;
        font-weight: 800;
      }

      .item span {
        font-size: 11px;
        font-weight: 700;
        color: #b6bac2;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      @media (min-width: 768px) {
        .item span {
          font-size: 12px;
        }
      }

      /* PALET GRADIENT */
      .g-a {
        background: linear-gradient(135deg, #a5b4fc, #818cf8);
      }
      .g-b {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      }
      .g-c {
        background: linear-gradient(135deg, #93c5fd, #60a5fa);
      }
      .g-d {
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
      }
      .g-e {
        background: linear-gradient(135deg, #6ee7b7, #34d399);
      }
      .g-f {
        background: linear-gradient(135deg, #fcd34d, #fbbf24);
      }
      .g-g {
        background: linear-gradient(135deg, #fca5a5, #f87171);
      }
      .g-h {
        background: linear-gradient(135deg, #f0abfc, #e879f9);
      }

      /* ===== DETAIL SCREEN ===== */
      .detail-header {
        display: flex;
        align-items: center;
        padding: 16px 18px;
        border-bottom: 1px solid #f1f2f4;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }
      .detail-header-title {
        font-size: 15px;
        font-weight: 800;
        color: #1f2937;
      }

      .detail-content {
        flex: 1;
        overflow-y: auto;
        padding: 22px 18px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }
      .sheet-icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        color: #fff;
        margin-bottom: 14px;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      }
      .detail-content h2 {
        font-size: 18px;
        font-weight: 800;
        color: #1f2937;
        margin-bottom: 6px;
      }
      .detail-content .tag {
        display: inline-block;
        font-size: 11px;
        font-weight: 800;
        color: #818cf8;
        background: #eeefef;
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 16px;
      }
      .detail-content h3 {
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: #9aa0ab;
        margin: 18px 0 10px;
      }
      .comp-list {
        list-style: none;
      }
      .comp-list li {
        font-size: 13px;
        color: #374151;
        padding: 10px 0;
        border-bottom: 1px solid #f1f2f4;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .comp-list li .amt {
        color: #1f2937;
        font-weight: 700;
        text-align: right;
      }
      .cara-text {
        font-size: 13px;
        color: #374151;
        line-height: 1.6;
        background: #fafbfc;
        border: 1px solid #e3e6ec;
        padding: 14px;
        border-radius: 12px;
      }
      .empty-msg {
        text-align: center;
        color: #9aa0ab;
        font-size: 13px;
        padding: 40px 0;
        font-weight: 600;
      }
      .hidden-scroll::-webkit-scrollbar {
        width: 0;
      }
    </style>
  </head>

              placeholder="Cari resep menu..."

          </div>
        </div>

        <div class="menu-wrap hidden-scroll">
          <p class="section-label" id="moduleLabel">DAFTAR RESEP</p>
          <div class="grid" id="modGrid"></div>
        </div>
      </div>

          <div class="tag" id="sheetTag"></div>
          <div id="sheetBody"></div>
        </div>
      </div>
    </div>

      let currentCat = "Premix UHT";

      const homeGrid = document.getElementById("homeGrid");
      const modGrid = document.getElementById("modGrid");
      const searchInput = document.getElementById("searchInput");
      const modSearchInput = document.getElementById("modSearchInput");
      const moduleScreen = document.getElementById("moduleScreen");
      const detailScreen = document.getElementById("detailScreen");
      const moduleLabel = document.getElementById("moduleLabel");

      const sheetIcon = document.getElementById("sheetIcon");
      const sheetName = document.getElementById("sheetName");
      const sheetTag = document.getElementById("sheetTag");
      const sheetBody = document.getElementById("sheetBody");

      function renderHomeGrid() {
        const q = searchInput.value.trim().toLowerCase();
        const filtered = modules.filter(
          (m) =>
            !q ||
            m.id.toLowerCase().includes(q) ||
            m.name.toLowerCase().includes(q),
        );

        if (filtered.length === 0) {
          homeGrid.innerHTML = `<div class="empty-msg" style="grid-column:1/-1">Kategori tidak ditemukan</div>`;
          return;
        }

        homeGrid.innerHTML = filtered
          .map(
            (m) => `
            <button class="item active-modul" onclick="openModule('${m.id}')">
              <div class="icon-tile ${m.cls}">${m.icon}</div>
              <span>${m.name}</span>
            </button>
          `,
          )
          .join("");
      }

      function openModule(catName) {
        currentCat = catName;
        moduleLabel.textContent = catName.toUpperCase();
        modSearchInput.value = "";
        renderModuleMenu();
        moduleScreen.classList.add("active");
        history.pushState({ screen: "module" }, "");
      }

      function renderModuleMenu() {
        const q = modSearchInput.value.trim().toLowerCase();
        const filtered = menuData.filter((item) => {
          const matchCat = item.category === currentCat;
          const matchQuery = !q || item.name.toLowerCase().includes(q);
          return matchCat && matchQuery;
        });

        if (filtered.length === 0) {
          modGrid.innerHTML = `<div class="empty-msg" style="grid-column:1/-1">Menu tidak ditemukan</div>`;
          return;
        }

        modGrid.innerHTML = filtered
          .map((item) => {
            const realIndex = menuData.indexOf(item);
            return `
              <button class="item active-modul" onclick="openSheet(${realIndex})">
                <div class="icon-tile ${item.cls}">${item.icon}</div>
                <span>${item.name}</span>
              </button>
            `;
          })
          .join("");
      }

      function compListHTML(items) {
        return `<ul class="comp-list">${items.map(([n, a]) => `<li><span>${n}</span> <span class="amt">${a}</span></li>`).join("")}</ul>`;
      }

      function openSheet(index) {
        const item = menuData[index];
        sheetIcon.className = `sheet-icon ${item.cls}`;
        sheetIcon.textContent = item.icon;
        sheetName.textContent = item.name;
        sheetTag.textContent = item.category;

        let html = "";
        if (item.comp)
          html += `<h3>Komposisi & Takaran</h3>${compListHTML(item.comp)}`;
        if (item.cara)
          html += `<h3>Catatan / Cara Membuat</h3><div class="cara-text">${item.cara}</div>`;

        sheetBody.innerHTML = html;
        detailScreen.classList.add("active");
        history.pushState({ screen: "detail" }, "");
      }

      // INTEGRASI TOMBOL BACK BAWAAN HP
      window.addEventListener("popstate", function () {
        if (detailScreen.classList.contains("active")) {
          detailScreen.classList.remove("active");
        } else if (moduleScreen.classList.contains("active")) {
          moduleScreen.classList.remove("active");
        }
      });

      renderHomeGrid();
    </script>
