<!doctype html>

<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <title>My Love</title>
    <meta content="#fffbf2" name="theme-color" />
    <meta content="yes" name="mobile-web-app-capable" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta
      content="black-translucent"
      name="apple-mobile-web-app-status-bar-style"
    />
    <meta content="MyLove" name="apple-mobile-web-app-title" />
    <link
      href="assets/images/favicon.png"
      rel="icon"
      sizes="192x192"
      type="image/png"
    />
    <link
      href="assets/images/icon-512x512.png"
      rel="icon"
      sizes="512x512"
      type="image/png"
    />
    <link
      href="assets/images/apple-touch-icon-152x152.png"
      rel="apple-touch-icon"
    />
    <link
      href="assets/images/apple-touch-icon-180x180.png"
      rel="apple-touch-icon"
      sizes="180x180"
    />
    <link
      href="assets/images/apple-touch-icon-192x192.png"
      rel="apple-touch-icon"
      sizes="192x192"
    />
    <!-- Font sama dengan Mori (public/mori/index.html:23) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
    <script>
      const ICON192 = "assets/images/icon-192x192.png";
      const ICON512 = "assets/images/icon-512x512.png";
      const manifest = {
        name: "My Love",
        short_name: "MyLove",
        description: "My Love",
        start_url: "./index.html",
        scope: "./",
        display: "standalone",
        orientation: "portrait",
        background_color: "#fffbf2",
        theme_color: "#fffbf2",
        icons: [
          { src: ICON192, sizes: "192x192", type: "image/png", purpose: "any" },
          {
            src: ICON192,
            sizes: "192x192",
            type: "image/png",
            purpose: "maskable",
          },
          { src: ICON512, sizes: "512x512", type: "image/png", purpose: "any" },
          {
            src: ICON512,
            sizes: "512x512",
            type: "image/png",
            purpose: "maskable",
          },
        ],
      };
      const blob = new Blob([JSON.stringify(manifest)], {
        type: "application/json",
      });
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        height: 100%;
        height: 100dvh;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        width: 100%;
        background: var(--mori-bg);
        margin: 0;
        padding: 0;
      }

      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(26, 25, 23, 0.22);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(26, 25, 23, 0.4);
      }

      /* ===== TEMA KREM MORI =====
         Palet diambil dari public/mori/css/variables.css:
         --bg-color #fffbf2 · --surface #f7f3e9 · --primary #1a1917 · --text-secondary #6e6a64
         Radius kecil ala Mori (sharp), bukan pill. */
      :root {
        --mori-bg: #fffbf2;
        --mori-surface: #f7f3e9;
        --mori-text: #1a1917;
        --mori-text-2: #6e6a64;
        --mori-line: rgba(26, 25, 23, 0.12);
        --mori-accent: #1a1917;
      }

      body {
        font-family:
          "Inter",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--mori-bg) !important;
        color: var(--mori-text);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 0;
        margin: 0;
        overflow-x: hidden;
      }

      .container {
        width: 100%;
        max-width: 800px;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--mori-bg);
        border-radius: 0;
        box-shadow: none;
        padding: 12px 18px 40px;
        padding-top: max(12px, env(safe-area-inset-top));
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        margin: 0 auto;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px 10px;
        width: 100%;
        align-content: start;
      }

      .search-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-bottom: 14px;
      }

      /* Tombol notifikasi sementara (masih ide). */
      .notif-btn {
        flex: 0 0 auto;
        width: 46px;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--mori-surface);
        border: 1px solid var(--mori-line);
        border-radius: 8px;
        color: var(--mori-text);
        cursor: pointer;
        padding: 0;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      .notif-btn:active {
        transform: translate(2px, 2px);
      }
      .notif-btn svg {
        width: 20px;
        height: 20px;
      }

      /* Kotak tanggal/jam di paling atas. Garis tepinya sengaja tidak
         hitam: pakai --mori-line (abu 12%) supaya kotaknya tidak
         menjadi lapisan gelap di atas daftar tile. Bayangan juga tidak
         ada. Sebelumnya garisnya --mori-accent (hitam penuh). */
      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--mori-line);
        border-radius: 8px;
        padding: 11px 14px;
        color: var(--mori-text);
        font-size: 13px;
        background: var(--mori-surface);
        transition: background 0.2s ease;
      }

      /* Penanda "sedang mengetik" tetap ada lewat perubahan latar saja,
         tanpa bayangan. Sebelumnya ada bayangan hitam 4px di sini. */
      .search-box:focus-within {
        background: #fffdf7;
      }

      .search-box svg {
        flex-shrink: 0;
        color: var(--mori-text-2);
        width: 18px;
        height: 18px;
      }

      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 14px;
        color: var(--mori-text);
        font-family: inherit;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }

      .search-box input::placeholder {
        color: var(--mori-text-2);
      }

      .menu-list {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px 10px;
        width: 100%;
        align-content: start;
      }

      .menu-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: var(--mori-text);
        cursor: pointer;
      }

      /* Item tile ala Mori: TANPA border dan TANPA bayangan (permintaan).
         Dulu tile punya garis hitam solid + bayangan abu saat diam dan
         bayangan hitam saat hover/active; semuanya dihapus.

         Efek "ditekan" tetap ada lewat transform, tidak lewat garis. */
      .menu-item .icon-box {
        width: 100%;
        max-width: 100px;
        aspect-ratio: 9 / 16;
        background: linear-gradient(90deg, #f2eee2 25%, #e8e2d2 50%, #f2eee2 75%);
        background-size: 200% 100%;
        animation: shimmer 1.2s infinite;
        border: none;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
        overflow: hidden;
        position: relative;
        transition: transform 0.2s ease;
      }

      .menu-item:not(.disabled):active .icon-box {
        transform: translate(2px, 2px);
      }

      .menu-item .icon-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        opacity: 0;
        filter: saturate(0.55) contrast(1.02);
        transition: opacity 0.25s ease;
      }

      .menu-item .icon-box img.loaded {
        opacity: 1;
      }

      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      /* Tipografi ala Mori: uppercase + letter-spacing lebar
         (public/mori/css/base.css pakai letter-spacing 2px + uppercase) */
      .menu-item .label {
        font-size: 9px;
        font-weight: 700;
        text-align: center;
        line-height: 1.3;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--mori-text);
        max-width: 100%;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }

      .hidden-item {
        display: none !important;
      }
      .menu-item.disabled {
        opacity: 0.4;
        pointer-events: none;
        filter: grayscale(1);
      }
      .menu-item.disabled .icon-box {
        background: #ece7da;
        animation: none;
        border-color: var(--mori-line);
      }
      .menu-item.disabled .label {
        color: var(--mori-text-2);
      }

      @media (max-width: 360px) {
        .icon-box {
          max-width: 85px;
        }
        .label {
          font-size: 8px;
          letter-spacing: 0.6px;
        }
      }
    
      .notif-btn, .header-pin-btn {
        flex: 0 0 auto;
        width: 46px;
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--mori-surface);
        border: 1px solid var(--mori-line);
        border-radius: 8px;
        color: var(--mori-text-2);
        cursor: pointer;
        padding: 0;
        font-family: inherit;
        font-size: 20px;
        font-weight: 800;
        line-height: 1;
        transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
      }
      .notif-btn:active, .header-pin-btn:active {
        transform: translate(2px, 2px);
      }
      .header-pin-btn[aria-pressed="true"] {
        background: var(--mori-text);
        color: var(--mori-bg);
        border-color: var(--mori-text);
      }
      .notif-btn svg {
        width: 20px;
        height: 20px;
      }

    
      .menu-item-wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .btn-pin {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--mori-surface);
        border: 1px solid var(--mori-line);
        border-radius: 6px;
        cursor: pointer;
        z-index: 10;
        padding: 0;
        color: var(--mori-text-2);
        transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
      }
      .btn-pin:active {
        transform: scale(0.92);
      }
      .btn-pin[aria-pressed="true"] {
        background: var(--mori-text);
        color: var(--mori-bg);
        border-color: var(--mori-text);
      }
      .btn-pin svg {
        width: 14px;
        height: 14px;
      }

    </style>
  </head>
  <body>
    <div class="container">
      <div class="search-wrapper">
        <div class="search-box" style="flex:1;min-width:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <div id="dateTime" style="flex:1;min-width:0;font-family:'Inter',sans-serif;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between">Memuat...</div>
        </div>
        <button class="notif-btn" type="button" aria-label="Notifikasi" title="Notifikasi (sementara)" onclick="alert('Notifikasi: belum ada (masih ide)')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <button class="notif-btn" id="headerPinBtn" type="button" aria-label="Kelola Sematan Menu" title="Kelola Sematan Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7l2-3.2z"/></svg>
        </button>
      </div>
      <div class="menu-list" id="menuList"></div>
    </div>
    <script type="module">
      import { loadIndexPhoto, createLazyLoader } from './src/js/image-loader.js';

      const menuItems = [
        { label: "GRID", href: "public/grid/grid.html", folder: "grid", ext: "jpg", thumb: "public/grid/image-index.jpg" },
        { label: "KOPI", href: "public/kopi/kopi.html", folder: "ja-di", ext: "png", thumb: "public/kopi/image-index.jpg" },
        { label: "STOK OPNAME", href: "public/stok-opname/stock.html", folder: "time-kamera", ext: "png", thumb: "assets/images/time-kamera/1.jpg" },
        { label: "DAILY TASK", href: "public/daily-task/daily-task.html", folder: "admin", ext: "jpg", thumb: "public/daily-task/image-index.jpg" },
        { label: "NOTE", href: "public/note/note.html", folder: "note", ext: "jpg", thumb: "public/note/image-index.jpg" },
        { label: "PLANO", href: "public/plano/index.html", folder: "plano", ext: "jpg", thumb: "assets/images/plano/1.jpg" },
        { label: "EXP", href: "public/exp/exp.html", folder: "exp", ext: "png", thumb: "assets/images/exp/1.jpg" },
        { label: "MUSNAH", href: "public/musnah/musnah.html", folder: "pagi", ext: "png", thumb: "assets/images/pagi/1.jpg" },
        { label: "OFO", href: "public/ofo/ofo.html", folder: "siang", ext: "png", thumb: "assets/images/siang/1.jpg" },
        { label: "MORI", href: "public/mori/index.html", folder: "mori", ext: "png", thumb: "assets/images/mori/1.jpg" },
        { label: "LINK", href: "public/link/link.html", folder: "link", ext: "png", thumb: "assets/images/link/1.jpg" },
        { label: "LAPORAN", href: "public/laporan/laporan.html", folder: "laporan", ext: "png", thumb: "assets/images/laporan/1.jpg" },
        { label: "TIME KAMERA", href: "public/time-kamera/time-kamera.html", folder: "time-kamera", ext: "png", thumb: "assets/images/time-kamera/1.jpg" },
        { label: "DUAL KAMERA", href: "public/dual-kamera/dual-kamera.html", folder: "dual-kamera", ext: "png", thumb: "assets/images/dual-kamera/1.jpg" },
        { label: "NIK", href: "public/nik/nik.html", folder: "pulang", ext: "png", thumb: "assets/images/pulang/1.jpg" },
        { label: "HARGA", href: "public/harga/harga.html", folder: "mori", ext: "png", thumb: "assets/images/mori/1.jpg" },
        { label: "LAKASIR", href: "public/lakasir/lakasir.html", folder: "lakasir", ext: "png", thumb: "public/lakasir/icon.svg" },
      ];

      const disabledLabels = new Set([]);
      const menuList = document.getElementById("menuList");

      // Lazy load foto menu (harus didefinisikan sebelum renderMenu dipanggil)
      const lazyLoader = createLazyLoader(async (img) => {
        const menu = img.dataset.menu;
        await loadIndexPhoto(menu, img);
        img.classList.add('loaded');
      });

      // --- Sematan (pin) menu, gaya sama dengan KOPI ---
      const PIN_KEY = 'home_pinned_menus_v1';
      let pinned = [];
      try {
        pinned = JSON.parse(localStorage.getItem(PIN_KEY)) || [];
      } catch {
        pinned = [];
      }

      const isPinned = (label) => pinned.includes(label);
      const ICO_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 3.2H7l2-3.2z"/></svg>';

      const renderMenu = () => {
        menuList.innerHTML = '';

        // Menu tersemat naik ke atas (urutan semat), sisanya urutan asli.
        const rank = (item) => {
          const i = pinned.indexOf(item.label);
          return i === -1 ? Number.MAX_SAFE_INTEGER : i;
        };
        const sortedItems = [...menuItems].sort((a, b) => rank(a) - rank(b));

        sortedItems.forEach((item) => {
          const isDisabled = item.href === "#" || disabledLabels.has(item.label);
          const dipin = isPinned(item.label);
          const pinTitle = (dipin ? 'Lepas sematan ' : 'Sematkan ke atas ') + item.label;

          const wrap = document.createElement('div');
          wrap.className = 'menu-item-wrap';

          const a = document.createElement(isDisabled ? "div" : "a");
          a.className = "menu-item" + (isDisabled ? " disabled" : "");
          if (!isDisabled) a.href = item.href;
          if (isDisabled) a.setAttribute("aria-disabled", "true");
          a.innerHTML = `
            <div class="icon-box">
              <img
                alt="${item.label}"
                ${item.thumb ? '' : `data-menu="${item.folder}"`}
                src="${item.thumb || `assets/images/${item.folder}/1.${item.ext}`}"
                loading="lazy"
                decoding="async"
                onload="this.classList.add('loaded')"
              />
            </div>
            <span class="label">${item.label}</span>
          `;

          const btnPin = document.createElement('button');
          btnPin.type = 'button';
          btnPin.className = 'btn-pin';
          btnPin.setAttribute('aria-pressed', dipin ? 'true' : 'false');
          btnPin.title = pinTitle;
          btnPin.setAttribute('aria-label', pinTitle);
          btnPin.innerHTML = ICO_PIN;

          btnPin.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (isPinned(item.label)) {
              pinned = pinned.filter(l => l !== item.label);
            } else {
              pinned.push(item.label);
            }
            try {
              localStorage.setItem(PIN_KEY, JSON.stringify(pinned));
            } catch {}
            renderMenu();
          });

          wrap.append(a, btnPin);
          menuList.appendChild(wrap);
        });

        document.querySelectorAll('img[data-menu]').forEach((img) => {
          lazyLoader.observe(img);
        });
      };

      renderMenu();

      const dateTimeEl = document.getElementById("dateTime");
      function updateDateTime(){
        const now = new Date();
        const tgl = now.toLocaleDateString('id-ID', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
        const jam = now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
        if(dateTimeEl) dateTimeEl.innerHTML = '<span style="font-size:clamp(9px,2.5vw,11px);font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mori-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0">'+tgl+'</span><span style="font-family:\'Space Mono\',\'JetBrains Mono\',monospace;font-size:clamp(11px,3vw,13px);font-weight:700;letter-spacing:0.5px;color:var(--mori-accent);white-space:nowrap;flex-shrink:0">'+jam+'</span>';
      }
      updateDateTime();
      setInterval(updateDateTime, 1000);
    </script>
  </body>
</html>
