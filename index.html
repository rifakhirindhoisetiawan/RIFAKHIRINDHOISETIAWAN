    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ===== TOP PROFILE HEADER ===== */
      .profile-header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 22px 18px 10px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }
      .profile-avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid #e3e6ec;
        flex-shrink: 0;
      }
      .profile-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .profile-info h2 {
        font-size: 15px;
        font-weight: 800;
        color: #1f2937;
        margin-bottom: 2px;
      }
      .profile-info p {
        font-size: 12px;
        color: #9aa0ab;
        font-weight: 600;
      }

      /* ===== SEARCH ROW ===== */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e3e6ec;
        border-radius: 14px;
        padding: 12px 14px;
        color: #1f2937;
        font-size: 13px;
        background: #fafbfc;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 13px;
        color: #1f2937;
        font-family: inherit;
      }
      .search-box input::placeholder {
        color: #c3c8d1;
      }
      .search-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
      }

      /* ===== MENU GRID ===== */
      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 4px 18px 20px 22px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px 12px;
      }

      @media (min-width: 768px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
          gap: 28px 20px;
        }
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;

      }
      .icon-photo img {

        height: 100%;

      .item.active-modul span {

        font-weight: 700;
