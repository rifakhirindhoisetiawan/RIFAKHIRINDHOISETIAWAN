<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing — Coming Soon</title>

    <!-- Konfigurasi Ikon Home Screen Menggunakan Foto WhatsApp Terbaru -->
    <link
      rel="apple-touch-icon"
      href="WhatsApp Image 2026-08-02 at 16.12.39_3.jpeg"
    />
    <link
      rel="icon"
      type="image/jpeg"
      href="WhatsApp Image 2026-08-02 at 16.12.39_3.jpeg"
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- Inline Web App Manifest -->
    <link
      rel="manifest"
      href='data:application/manifest+json,{
      "name": "Landing App",
      "short_name": "App",
      "start_url": "index.html",
      "display": "standalone",
      "background_color": "#ffffff",
      "theme_color": "#ffffff",
      "icons": [{
        "src": "WhatsApp Image 2026-08-02 at 16.12.39_3.jpeg",
        "sizes": "512x512",
        "type": "image/jpeg"
      }]
    }'
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ===== TOP BAR ===== */
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 18px 18px 4px;
      }
      .app-badge {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .app-badge .dot {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(135deg, #60a5fa, #6366f1);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 15px;
        font-weight: 800;
      }
      .app-badge span {
        font-size: 13px;
        font-weight: 800;
        color: #1f2937;
        letter-spacing: 0.3px;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #d9dde3;
      }

      /* ===== HERO ===== */
      .hero {
        padding: 22px 24px 6px;
        text-align: center;
      }
      .hero .badge-coming {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #eef1ff;
        border: 1px solid #dfe3ff;
        color: #6366f1;
        font-size: 11px;
        font-weight: 800;
        padding: 5px 12px;
        border-radius: 999px;
        margin-bottom: 14px;
      }
      .hero h1 {
        font-size: 20px;
        font-weight: 800;
        color: #1f2937;
        margin-bottom: 6px;
      }
      .hero p {
        font-size: 12.5px;
        color: #9aa0ab;
        line-height: 1.5;
        padding: 0 6px;
      }

      /* ===== SEARCH ROW ===== */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e3e6ec;
        border-radius: 14px;
        padding: 12px 14px;
        color: #1f2937;
        font-size: 13px;
        background: #fafbfc;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 13px;
        color: #1f2937;
        font-family: inherit;
      }
      .search-box input::placeholder {
        color: #c3c8d1;
      }
      .search-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
      }

      /* ===== MENU GRID ===== */
      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 4px 18px 20px 22px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px 12px;
      }

      @media (min-width: 768px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
          gap: 28px 20px;
        }
      }

      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: default;
      }

      .icon-tile {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        margin-bottom: 8px;
        color: #fff;
        position: relative;
        opacity: 0.55;
      }

      @media (min-width: 768px) {
        .icon-tile {
          width: 72px;
          height: 72px;
          border-radius: 18px;
          font-size: 24px;
        }
      }

      /* Modul Aktif */
      .item.active-modul {
        cursor: pointer;
        text-decoration: none;
      }
      .item.active-modul .icon-tile {
        opacity: 1;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        transition: transform 0.2s ease;
      }
      .item.active-modul:hover .icon-tile {
        transform: translateY(-3px);
      }
      .item.active-modul span {
        color: #1f2937;
        font-weight: 800;
      }

      .item span {
        font-size: 11px;
        font-weight: 700;
        color: #b6bac2;
        line-height: 1.3;
      }

      @media (min-width: 768px) {
        .item span {
          font-size: 12px;
        }
      }

      .soon-tag {
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        border: 1px solid #eceff3;
        border-radius: 999px;
        font-size: 7.5px;
        font-weight: 800;
        color: #9aa0ab;
        padding: 1px 6px;
        white-space: nowrap;
      }

      @media (min-width: 768px) {
        .soon-tag {
          font-size: 9px;
          padding: 2px 8px;
        }
      }

      /* palet gradient netral */
      .g-a {
        background: linear-gradient(135deg, #a5b4fc, #818cf8);
      }
      .g-b {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      }
      .g-c {
        background: linear-gradient(135deg, #93c5fd, #60a5fa);
      }
      .g-d {
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
      }
      .g-e {
        background: linear-gradient(135deg, #6ee7b7, #34d399);
      }
      .g-f {
        background: linear-gradient(135deg, #fcd34d, #fbbf24);
      }
      .g-g {
        background: linear-gradient(135deg, #fca5a5, #f87171);
      }
      .g-h {
        background: linear-gradient(135deg, #f0abfc, #e879f9);
      }

      /* ===== BOTTOM NAV ===== */
      .bottom-nav {
        display: flex;
        border-top: 1px solid #eef0f3;
        padding: 10px 4px 14px;
        background: #fff;
      }
      .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 10.5px;
        font-weight: 700;
        color: #c3c8d1;
        cursor: default;
      }
      .nav-item.active {
        color: #6366f1;
      }
      .nav-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .nav-item.active .nav-icon {
        background: linear-gradient(135deg, #60a5fa, #6366f1);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="search-row">
        <div class="search-box">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Cari judul aplikasi..."
          />
        </div>
      </div>

      <div class="menu-wrap">
        <div class="section-label">Modul Tersedia</div>
        <div class="grid" id="moduleGrid">
          <!-- Modul 1 -->
          <a href="modul01.html" class="item active-modul" data-name="modul 1">
            <div class="icon-tile g-a">01</div>
            <span>Modul 1</span>
          </a>

          <!-- Modul 2 -->
          <a href="modul02.html" class="item active-modul" data-name="modul 2">
            <div class="icon-tile g-b">02</div>
            <span>Modul 2</span>
          </a>

          <!-- Modul 3 -->
          <div class="item" data-name="modul 3">
            <div class="icon-tile g-c">
              ＋
              <div class="soon-tag">soon</div>
            </div>
            <span>Modul 3</span>
          </div>

          <!-- Modul 4 -->
          <div class="item" data-name="modul 4">
            <div class="icon-tile g-d">
              ＋
              <div class="soon-tag">soon</div>
            </div>
            <span>Modul 4</span>
          </div>

          <!-- Modul 5 -->
          <div class="item" data-name="modul 5">
            <div class="icon-tile g-e">
              ＋
              <div class="soon-tag">soon</div>
            </div>
            <span>Modul 5</span>
          </div>

          <!-- Modul 6 -->
          <div class="item" data-name="modul 6">
            <div class="icon-tile g-f">
              ＋
              <div class="soon-tag">soon</div>
            </div>
            <span>Modul 6</span>
          </div>

          <!-- Modul 7 -->
          <div class="item" data-name="modul 7">
            <div class="icon-tile g-g">
              ＋
              <div class="soon-tag">soon</div>
            </div>
            <span>Modul 7</span>
          </div>

          <!-- Modul 8 -->
          <div class="item" data-name="modul 8">
            <div class="icon-tile g-h">
              ＋
              <div class="soon-tag">soon</div>
            </div>
            <span>Modul 8</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const searchInput = document.getElementById("searchInput");
      const moduleGrid = document.getElementById("moduleGrid");
      const items = moduleGrid.getElementsByClassName("item");

      searchInput.addEventListener("input", function () {
        const filter = searchInput.value.toLowerCase().trim();

        for (let i = 0; i < items.length; i++) {
          const name = items[i].getAttribute("data-name").toLowerCase();
          if (name.includes(filter)) {
            items[i].style.display = "";
          } else {
            items[i].style.display = "none";
          }
        }
      });
    </script>
  </body>
</html>
