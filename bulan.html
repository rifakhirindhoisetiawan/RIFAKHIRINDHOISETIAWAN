<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modul 1 — Todo List Kegiatan</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        padding: 0;
      }

      .phone {
        width: 100%;
        max-width: 100%;
        background: #ffffff;
        border-radius: 0;
        box-shadow: none;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ===== SEARCH ROW ===== */
      .search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px 14px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e3e6ec;
        border-radius: 14px;
        padding: 12px 14px;
        color: #1f2937;
        font-size: 13px;
        background: #fafbfc;
      }
      .search-box input {
        border: none;
        background: transparent;
        outline: none;
        width: 100%;
        font-size: 13px;
        color: #1f2937;
        font-family: inherit;
      }
      .search-box input::placeholder {
        color: #c3c8d1;
      }
      .search-box svg {
        flex-shrink: 0;
        color: #c3c8d1;
      }

      /* ===== MENU GRID ===== */
      .menu-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 4px 18px 20px 22px;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .section-label {
        font-size: 11px;
        font-weight: 800;
        color: #9aa0ab;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        margin: 4px 0 14px;
      }

      .todo-list {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px 12px;
      }

      @media (min-width: 768px) {
        .todo-list {
          grid-template-columns: repeat(4, 1fr);
          gap: 28px 20px;
        }
      }

      .todo-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        cursor: pointer;
        user-select: none;
        text-decoration: none;
      }

      .todo-card {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 800;
        color: #fff;
        margin-bottom: 8px;
        position: relative;
        opacity: 1;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
        transition:
          transform 0.2s ease,
          opacity 0.3s ease,
          filter 0.3s ease;
      }

      @media (min-width: 768px) {
        .todo-card {
          width: 72px;
          height: 72px;
          border-radius: 18px;
          font-size: 24px;
        }
      }

      .todo-item:hover .todo-card {
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      }

      /* Palet gradient (sama seperti style guide) */
      .todo-item:nth-child(8n + 1) .todo-card {
        background: linear-gradient(135deg, #a5b4fc, #818cf8);
      }
      .todo-item:nth-child(8n + 2) .todo-card {
        background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      }
      .todo-item:nth-child(8n + 3) .todo-card {
        background: linear-gradient(135deg, #93c5fd, #60a5fa);
      }
      .todo-item:nth-child(8n + 4) .todo-card {
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
      }
      .todo-item:nth-child(8n + 5) .todo-card {
        background: linear-gradient(135deg, #6ee7b7, #34d399);
      }
      .todo-item:nth-child(8n + 6) .todo-card {
        background: linear-gradient(135deg, #fcd34d, #fbbf24);
      }
      .todo-item:nth-child(8n + 7) .todo-card {
        background: linear-gradient(135deg, #fca5a5, #f87171);
      }
      .todo-item:nth-child(8n + 8) .todo-card {
        background: linear-gradient(135deg, #f0abfc, #e879f9);
      }

      /* Saat diklik: warna pudar + turun */
      .todo-item.done .todo-card {
        opacity: 0.4;
        filter: grayscale(0.35);
        transform: translateY(6px) scale(0.94);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .todo-item.done:hover .todo-card {
        transform: translateY(6px) scale(0.94);
      }

      .todo-text {
        font-size: 11px;
        font-weight: 700;
        color: #1f2937;
        line-height: 1.3;
        transition: all 0.3s ease;
      }

      @media (min-width: 768px) {
        .todo-text {
          font-size: 12px;
        }
      }

      .todo-item.done .todo-text {
        opacity: 0.45;
        text-decoration: line-through;
        color: #b6bac2;
        font-weight: 700;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: #9aa0ab;
      }
      .empty-state p {
        font-size: 13px;
        font-weight: 600;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <!-- Add Task Row -->
      <div class="search-row">
        <div class="search-box">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input
            type="text"
            id="taskInput"
            placeholder="Tambah kegiatan baru..."
          />
          <button id="resetAllBtn" style="background: none; border: none; color: #c3c8d1; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center;" title="Reset Semua">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
              <path d="M3 21v-5h5"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- List -->
      <div class="menu-wrap">
        <p class="section-label">DAFTAR KEGIATAN</p>
        <div class="todo-list" id="todoList">
          <!-- items will be injected here -->
        </div>
        <div class="empty-state" id="emptyState" style="display: none">
          <div style="font-size: 32px">📋</div>
          <p>Belum ada kegiatan.<br />Tambahkan yang pertama yuk!</p>
        </div>
      </div>
    </div>

    <script>

        }

          { id: 4, text: "神奇宝贝图鉴", done: false },

          { id: 85, text: "1-One Employee", done: false },
          { id: 86, text: "Zoom", done: false },
          { id: 87, text: "One Punch Man: The Strongest-SEA", done: false },
          { id: 88, text: "One Punch Man: Pria Terkuat - CHT", done: false },
        ];
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {
          console.error("Gagal menyimpan data:", e);
        }
      }

      let tasks = loadTasks();

      document.getElementById("resetAllBtn").addEventListener("click", () => {
        if (confirm("Yakin ingin reset semua data?")) {
          localStorage.removeItem(STORAGE_KEY);
          tasks = [];
          render();
        }
      });

      const todoList = document.getElementById("todoList");
      const emptyState = document.getElementById("emptyState");
      const taskInput = document.getElementById("taskInput");

      function render() {
        saveTasks();
        todoList.innerHTML = "";
        if (tasks.length === 0) {
          emptyState.style.display = "block";
          return;
        }
        emptyState.style.display = "none";

        tasks.forEach((task, index) => {
          const item = document.createElement("div");
          item.className = "todo-item" + (task.done ? " done" : "");
          item.dataset.id = task.id;

          item.innerHTML = `
            <div class="todo-card"></div>
            <div class="todo-text">${task.text}</div>
          `;

          // Klik → pudar + pindah ke paling bawah
          item.addEventListener("click", () => {
            if (!task.done) {
              task.done = true;
              tasks = tasks.filter((t) => t.id !== task.id);
              tasks.push(task);
            } else {
              task.done = false;
              tasks = tasks.filter((t) => t.id !== task.id);
              const firstDoneIndex = tasks.findIndex((t) => t.done);
              if (firstDoneIndex === -1) {
                tasks.push(task);
              } else {
                tasks.splice(firstDoneIndex, 0, task);
              }
            }
            render();
          });

          todoList.appendChild(item);
        });
      }

      function addTask() {
        const text = taskInput.value.trim();
        if (!text) return;
        const firstDoneIndex = tasks.findIndex((t) => t.done);
        const newTask = {
          id: Date.now(),
          text,
          done: false,
        };
        if (firstDoneIndex === -1) {
          tasks.push(newTask);
        } else {
          tasks.splice(firstDoneIndex, 0, newTask);
        }
        taskInput.value = "";
        render();
      }

      taskInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTask();
      });

      render();
    </script>
  </body>
</html>
