<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ice Dolce Latte (12oz) - Menu & Resep Resmi JA~DI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: #ffffff; min-height: 100vh;
}
.wrap { max-width: 800px; margin: 0 auto; }
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 10px;
  background: #fafbfc; border: 1px solid #e3e6ec; color: #1f2937;
  text-decoration: none; flex-shrink: 0;
}
.back-btn svg { width: 18px; height: 18px; }
.detail-content { padding: 22px 18px; }
.sheet-icon {
  width: 64px; height: 64px; border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; color: #fff; margin-bottom: 14px;
  box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
}
.detail-content h2 { font-size: 18px; font-weight: 800; color: #1f2937; margin-bottom: 6px; }
.detail-content .tag {
  display: inline-block; font-size: 11px; font-weight: 800; color: #818cf8;
  background: #eeefef; padding: 4px 10px; border-radius: 999px; margin-bottom: 16px;
}
.detail-content h3 {
  font-size: 11px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.6px; color: #9aa0ab; margin: 18px 0 10px;
}
.comp-list { list-style: none; }
.comp-list li {
  font-size: 13px; color: #374151; padding: 10px 0;
  border-bottom: 1px solid #f1f2f4; display: flex;
  justify-content: space-between; gap: 10px;
}
.comp-list li .amt { color: #1f2937; font-weight: 700; text-align: right; white-space: nowrap; }
.cara-text {
  font-size: 13px; color: #374151; line-height: 1.6; background: #fafbfc;
  border: 1px solid #e3e6ec; padding: 14px; border-radius: 12px;
}
.g-a { background: linear-gradient(135deg, #a5b4fc, #818cf8); }
.g-b { background: linear-gradient(135deg, #c4b5fd, #a78bfa); }
.g-c { background: linear-gradient(135deg, #93c5fd, #60a5fa); }
.g-d { background: linear-gradient(135deg, #67e8f9, #22d3ee); }
.g-e { background: linear-gradient(135deg, #6ee7b7, #34d399); }
.g-f { background: linear-gradient(135deg, #fcd34d, #fbbf24); }
.g-g { background: linear-gradient(135deg, #fca5a5, #f87171); }
.g-h { background: linear-gradient(135deg, #f0abfc, #e879f9); }

/* --- size grouping (new) --- */
.size-block { margin-bottom: 22px; }
.size-block:last-child { margin-bottom: 0; }
.size-title {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, #818cf8, #6366f1);
  padding: 5px 14px; border-radius: 8px; margin-bottom: 8px;
  letter-spacing: 0.3px;
}
.size-block .comp-list { border: 1px solid #f1f2f4; border-radius: 12px; padding: 0 12px; }
.size-block .comp-list li:last-child { border-bottom: none; }

</style>
</head>
<body>
<div class="wrap">
  <div class="detail-content">
    <div class="sheet-icon g-g">🍬</div>
    <h2>Ice Dolce Latte (12oz)</h2>
    <div class="tag">Specialty &amp; Cloud</div>
    <h3>Komposisi &amp; Takaran</h3>
    <div class="size-block">
      <div class="size-title">12oz</div>
      <ul class="comp-list">
        <li><span>Krimer</span> <span class="amt">20g</span></li>
        <li><span>KKM Carnation</span> <span class="amt">20g</span></li>
        <li><span>Espresso</span> <span class="amt">1x</span></li>
        <li><span>Es Batu</span> <span class="amt">150g</span></li>
        <li><span>Susu UHT</span> <span class="amt">100g</span></li>
      </ul>
    </div>

  </div>
</div>
</body>
</html>
