<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MYLOVE</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" />
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 0;
      color: #1f2937;
    }

    .phone {
      width: 100%;
      max-width: 100%;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 18px 14px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 160px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #e3e6ec;
      border-radius: 14px;
      padding: 12px 14px;
      color: #1f2937;
      font-size: 13px;
      background: #fafbfc;
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 13px;
      color: #1f2937;
      font-family: inherit;
    }
    .search-box input::placeholder {
      color: #c3c8d1;
    }
    .search-box svg {
      flex-shrink: 0;
      color: #c3c8d1;
    }

    .menu-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 4px 18px 24px 18px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .bay-title {
      font-size: 12px;
      font-weight: 800;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .bay {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .shelf {
      background: #fafbfc;
      border: 1px solid #e3e6ec;
      border-radius: 14px;
      padding: 10px 10px 12px;
    }

    .shelf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 2px;
    }
    .shelf-name {
      font-size: 11px;
      font-weight: 800;
      color: #1f2937;
    }
    .shelf-info {
      font-size: 10px;
      font-weight: 600;
      color: #9aa0ab;
    }

    .shelf-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .shelf-row::-webkit-scrollbar {
      height: 4px;
    }
    .shelf-row::-webkit-scrollbar-thumb {
      background: #e3e6ec;
      border-radius: 999px;
    }

    .product {
      flex: 0 0 auto;
      width: 76px;
      background: #ffffff;
      border: 1px solid #e3e6ec;
      border-radius: 14px;
      padding: 8px 6px 10px;
      text-align: center;
      cursor: pointer;
    }

    .product-img {
      width: 56px;
      height: 56px;
      margin: 0 auto 8px;
      border-radius: 10px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      line-height: 1;
      overflow: hidden;
    }
    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-name {
      font-size: 10px;
      font-weight: 800;
      color: #1f2937;
      line-height: 1.3;
      height: 26px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .product-sku {
      font-size: 9px;
      font-weight: 600;
      color: #9aa0ab;
      margin-top: 4px;
    }
    .product-facing {
      font-size: 9px;
      font-weight: 700;
      color: #818cf8;
      margin-top: 3px;
    }

    .product.promo {
      border-color: #fcd34d;
      background: #fffbeb;
    }
    .product.promo .product-facing {
      color: #d97706;
    }

    @media (min-width: 768px) {
      .product {
        width: 88px;
      }
      .product-img {
        width: 64px;
        height: 64px;
        font-size: 30px;
        border-radius: 12px;
      }
      .product-name {
        font-size: 11px;
        height: 28px;
      }
    }

  </style>
</head>
<body>
  <div class="phone">

    <div class="search-row">
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.3-4.3"/>
        </svg>
        <input type="text" placeholder="Cari produk / SKU..." id="searchInput" />
      </div>
    </div>

    <div class="menu-wrap">
      <div class="bay-title">Gondola A — Rak K</div>

      <div class="bay" id="bay">
        <div class="shelf">
          <div class="shelf-header">
            <span class="shelf-name">Rak K</span>
            <span class="shelf-info">±180–200 cm</span>
          </div>
          <div class="shelf-row">
            <div class="product" data-name="you c1000 lemon 140ml">
              <div class="product-img">🍋</div>
              <div class="product-name">You C1000 Lemon 140ml</div>
              <div class="product-sku">8996001370155</div>
              <div class="product-facing">3 facing</div>
            </div>
            <div class="product" data-name="vitazym 100ml">
              <div class="product-img">🧪</div>
              <div class="product-name">Vitazym 100ml</div>
              <div class="product-sku">8997009500123</div>
              <div class="product-facing">2 facing</div>
            </div>
            <div class="product" data-name="bear brand 189ml">
              <div class="product-img">🐻</div>
              <div class="product-name">Bear Brand 189ml</div>
              <div class="product-sku">8996001310018</div>
              <div class="product-facing">4 facing</div>
            </div>
            <div class="product promo" data-name="good day capuccino 250ml">
              <div class="product-img">☕</div>
              <div class="product-name">Good Day Capuccino 250ml</div>
              <div class="product-sku">8996001320156</div>
              <div class="product-facing">2 facing · Promo</div>
            </div>
            <div class="product" data-name="nescafe classic 220ml">
              <div class="product-img">🟤</div>
              <div class="product-name">Nescafe Classic 220ml</div>
              <div class="product-sku">8996001330019</div>
              <div class="product-facing">2 facing</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('searchInput');
    const products = document.querySelectorAll('.product');

    input.addEventListener('input', function () {
      const q = this.value.toLowerCase().trim();
      products.forEach(p => {
        const name = (p.dataset.name || p.querySelector('.product-name')?.textContent || '').toLowerCase();
        const sku = (p.querySelector('.product-sku')?.textContent || '').toLowerCase();
        p.style.display = (name.includes(q) || sku.includes(q)) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
