<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MYLOVE</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { -ms-overflow-style: none; scrollbar-width: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
body {
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: stretch;
  padding: 0;
}
.phone {
  width: 100%;
  max-width: 100%;
  background: #ffffff;
  border-radius: 0;
  box-shadow: none;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ===== SEARCH ROW ===== */
.search-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 18px 14px;
  max-width: 800px;
  width: 100%;
  margin: 0 auto;
}
.search-box {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px 14px;
  color: #222;
  font-size: 14px;
  background: #f9f9f9;
}
.search-box:focus-within {
  border-color: #888;
  background: #fff;
}
.search-box input {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
  font-size: 14px;
  color: #222;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
}
.search-box input::placeholder { color: #c3c8d1; }
.search-box input::-webkit-search-cancel-button { display: none; }
.search-box input::-webkit-search-decoration { display: none; }
.search-box input::-webkit-search-results-button { display: none; }
.search-box input::-webkit-search-results-decoration { display: none; }
/* ===== MENU GRID ===== */

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px 10px;
}
@media (min-width: 768px) {
  .grid { grid-template-columns: repeat(3, 1fr); gap: 22px 14px; }
}
.item { display: flex; flex-direction: column; align-items: center; text-align: center; cursor: default; background: none; border: none; }
.icon-tile {
  width: 100%;
  max-width: 110px;
  aspect-ratio: 9 / 16;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  margin-bottom: 8px;
  color: #fff;
  position: relative;
}
@media (max-width: 360px) {
  .icon-tile {
    max-width: 95px;
    border-radius: 14px;
  }
}
.icon-photo { padding: 0; overflow: hidden; } .icon-photo img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.item.active-modul { cursor: pointer; text-decoration: none; } .item.active-modul span { color: #1f2937; font-weight: 800; } .item span { font-size: 11px; font-weight: 700; color: #b6bac2; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (min-width: 768px) { .item span { font-size: 12px; } }
.empty-msg { grid-column: 1 / -1; text-align: center; color: #9aa0ab; font-size: 13px; padding: 40px 0; font-weight: 600; }.g-a { background: linear-gradient(135deg, #a5b4fc, #818cf8); }
.g-b { background: linear-gradient(135deg, #c4b5fd, #a78bfa); }
.g-c { background: linear-gradient(135deg, #93c5fd, #60a5fa); }
.g-d { background: linear-gradient(135deg, #67e8f9, #22d3ee); }
.g-e { background: linear-gradient(135deg, #6ee7b7, #34d399); }
.g-f { background: linear-gradient(135deg, #fcd34d, #fbbf24); }
.g-g { background: linear-gradient(135deg, #fca5a5, #f87171); }
.g-h { background: linear-gradient(135deg, #f0abfc, #e879f9); }
</style>
</head>
<body>
<div class="phone">

  <div class="search-row">
    <div class="search-box">
      <input id="modSearchInput" type="text" placeholder="Cari resep menu..." oninput="renderGrid()" />
    </div>
  </div>

  <div class="menu-wrap">
    <div class="grid" id="modGrid"></div>
  </div>

</div>

<script>
</script>
  <script type="module" src="../js/item-bahan.js?v=3"></script>
</body>
</html>
